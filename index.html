/**
 * Marque comme lus les messages de l'autre partie sur ce fil. Filtre par
 * exercice côté client : ajouter `exercice_id` à la requête demanderait un
 * index composite à quatre champs que `dataNonLus` n'a pas besoin d'avoir.
 */
async function marquerCommentairesLus(exerciceId, emailCible) {
  const { db, collection, query, where, getDocs, writeBatch } = FB;
  const estCoach = !!(S.moi && S.moi.estCoach);
  const email = estCoach && emailCible ? String(emailCible).toLowerCase() : S.email;
  const autre = estCoach ? 'pratiquant' : 'coach';
  const snap = await getDocs(query(collection(db, 'commentaires'),
    where('email', '==', email), where('auteur', '==', autre), where('lu', '==', false)));

/**
 * Crée ou met à jour un exercice. Sans id, c'est une création : le numéro
 * vient du compteur partagé `compteurs/exercices`, en transaction — remplace
 * le scan du plus grand id existant.
 */
async function sauverExercice(p) {
  const { db, doc, updateDoc, runTransaction } = FB;
  const nom = String(p.nom || '').trim();
  if (!nom) throw new Error('NOM_REQUIS');
  const champs = {
    nom, nom_en: String(p.nom_en || '').trim(), groupe: String(p.groupe || '').trim(),
    equipement: String(p.equipement || '').trim(), consigne: String(p.consigne || '').trim(),
    difficulte: String(p.difficulte || '').trim(), type: String(p.type || '').trim(),
    photo: String(p.photo || '').trim(), video: String(p.video || '').trim()
  };
  if (p.id) {
    await updateDoc(doc(db, 'exercices', p.id), champs);
    return { id: p.id, cree: false };
  }
  const id = await runTransaction(db, async tx => {
    const ref = doc(db, 'compteurs', 'exercices');
    const snap = await tx.get(ref);
    const suivant = ((snap.exists() ? Number(snap.data().dernier) : 0) || 0) + 1;
    const eid = 'EX' + String(suivant).padStart(3, '0');
    tx.set(ref, { dernier: suivant }, { merge: true });
    tx.set(doc(db, 'exercices', eid), champs);
    return eid;
  });
  return { id, cree: true };
}

/**

/**
 * Une routine est un **mini-programme d'une seule séance**, parfois d'un seul
 * exercice : la mobilité, les étirements ou le renforcement que le coach
 * conseille en dehors du programme, souvent après une douleur signalée.
 *
 * Ses exercices vivent **dans le document**, pas dans une sous-collection comme
 * ceux d'un modèle. Une routine ne se dissocie pas — c'est le sens du mot ici,
 * et une seule vidéo la montre souvent en entier ; l'embarquer épargne une
 * sous-collection, ses compteurs dénormalisés et une lecture par routine.
 */
const enRoutine = (id, r) => ({
  id, nom: r.nom, type: r.type || '', description: r.description || '',
  video: r.video || '', source: r.source || '', frequence: r.frequence || '',
  duree_semaines: Number(r.duree_semaines) || 0, statut: r.statut || 'Brouillon',
  exercices: (Array.isArray(r.exercices) ? r.exercices : [])
    .slice().sort((a, b) => (Number(a.ordre) || 0) - (Number(b.ordre) || 0))
});

  const list = [];
  snap.forEach(d => list.push(enRoutine(d.id, d.data())));

}

  };
  // Les exercices ne sont écrits que si l'appelant les fournit : la fiche et le
  // contenu s'enregistrent séparément, et une fiche modifiée ne doit pas effacer

  if (p.exercices) champs.exercices = p.exercices.map((e, i) => ({

  }));
  if (p.id) {
    await updateDoc(doc(db, 'routines', p.id), champs);
    return { id: p.id, cree: false };
  }
  champs.exercices = champs.exercices || [];
  champs.cree_le = serverTimestamp();

/** Les jours de la semaine en cours, du lundi au dimanche, en clés de jour. */
function joursDeLaSemaine() {
  const lundi = new Date();
  lundi.setDate(lundi.getDate() - ((lundi.getDay() + 6) % 7));
  lundi.setHours(0, 0, 0, 0);
  return [0, 1, 2, 3, 4, 5, 6].map(i => cleJour(new Date(lundi.getTime() + i * 86400000)));
}

    dataCatalogue(),
    getDocs(collection(db, 'pratiquants', email, 'maxis')),
    attributionActive(email)
  ]);
  const maxis = {};
  maxisSnap.docs.forEach(d => { maxis[d.id] = d.data(); });
  const auProgramme = new Set((att ? att.lignes : []).map(l => l.exercice_id));

  return exercices.map(e => {
    const m = maxis[e.id];
    return {
      exercice_id: e.id, nom: e.nom, groupe: e.groupe || '',
      rm_kg: m ? Number(m.kg) || 0 : 0, source: m ? m.source || '' : '',
      date: m ? versDate(m.date) : '',
      auProgramme: auProgramme.has(e.id)
    };
  }).sort((a, b) => {
    if (a.auProgramme !== b.auProgramme) return a.auProgramme ? -1 : 1;
    return a.nom.localeCompare(b.nom, 'fr');

}

  // Une session déjà ouverte revient par ce même canal, sans rien à restaurer.
  FB.onAuthStateChanged(FB.auth, async user => {
    if (!user) { ecranConnexion(); return; }
    S.email = (user.email || '').toLowerCase();
    try {
      ouvrirApp(await chargerProfil(S.email));
    } catch (e) {
      // Un document de profil absent est refusé par les règles, pas signalé
      // « introuvable » : les deux cas veulent dire la même chose ici.
      if (/NON_INSCRIT|permission-denied/.test(e.message || e.code || '')) {
        await FB.signOut(FB.auth);
        ecranConnexion('Ce compte n\'est pas encore inscrit. Demandez à votre coach de vous ajouter.');
      } else {
        toast('Chargement impossible : ' + (e.message || e.code));
        ecranConnexion();
      }
    }
  });
};

/** Connexion par le bouton Google. */
async function connexionGoogle() {
  try {
    await FB.signInWithPopup(FB.auth, new FB.GoogleAuthProvider());
    // La suite est prise en charge par onAuthStateChanged.
  } catch (e) {
    if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
    $('#loginErr').textContent = 'Connexion impossible : ' + (e.message || e.code);
    $('#loginErr').classList.remove('hidden');
  }
}

/**
 * Le coach ne suit pas de programme dans l'app : sa navigation est celle d'un
 * poste de travail, pas celle d'un pratiquant. On la construit selon le rôle.
 */
function construireNav(estCoach) {
  const onglets = estCoach
    ? [['athletes','Athlètes'], ['modeles','Modèles'], ['routines','Routines'],
       ['biblio','Bibliothèque'], ['reglages','Réglages']]
    : [['accueil','Accueil'], ['calendrier','Calendrier'], ['progres','Progrès']];
  if (!onglets.some(o => o[0] === S.vue)) S.vue = onglets[0][0];
  $('#nav').innerHTML = onglets.map(([v, t]) =>
    `<button data-vue="${v}" aria-pressed="${v === S.vue}">${t}</button>`).join('');
}

function ouvrirApp(moi) {
  S.moi = moi;
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#nav').classList.remove('hidden');
  construireNav(moi.estCoach);
  S.jour = S.jour || moi.jours[0] || null;
  majBandeau();
  majPastilles();
  rendre();
}

function ecranConnexion(message) {
  S.email = null; S.moi = null;
  $('#logger').classList.add('hidden');
  $('#app').classList.add('hidden'); $('#nav').classList.add('hidden');
  $('#login').classList.remove('hidden');
  $('#gbtn').innerHTML = '<button class="bgoogle" id="gsignin">Se connecter avec Google</button>';
  if (message) {
    $('#loginErr').textContent = message;
    $('#loginErr').classList.remove('hidden');
  }
}

/** Déconnexion : Firebase Auth oublie la session, le SDK purge son propre état. */

  try { await FB.signOut(FB.auth); } catch (e) {}
  Object.assign(S, { email:null, moi:null, jour:null, exos:[], blocs:[],
                     seanceId:null, faits:{}, vue:'seance', cal:null, coach:null, ed:null });

const CLE_THEME = 'muscu.theme';
const THEMES = [
  ['sombre', 'Sombre',              'Le réglage d\'origine.'],
  ['clair',  'Claire',              'Pour une salle en plein jour.'],
  ['auto',   'Comme le téléphone',  'Suit le réglage du système, et change avec lui.']
];

function themeChoisi() {
  try { const v = localStorage.getItem(CLE_THEME); if (v === 'clair' || v === 'auto') return v; }
  catch (e) {}
  return 'sombre';
}

function appliquerTheme(t) {
  const r = document.documentElement;
  r.setAttribute('data-theme', t);
  const clair = t === 'clair' ||
    (t === 'auto' && matchMedia('(prefers-color-scheme: light)').matches);
  r.classList.toggle('sys-clair', t === 'auto' && clair);
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', clair ? '#F7F5F3' : '#151515');
}

// « Comme le téléphone » doit suivre le téléphone, y compris app ouverte.
matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
  if (themeChoisi() === 'auto') appliquerTheme('auto');
});

/** Le choix vit sur l'appareil, pas dans le classeur : le même compte peut vouloir
 *  du clair sur l'ordinateur du bureau et du sombre sur le téléphone en salle. */
function modalTheme() {
  const w = modal('Apparence', `
    <div class="choix">${THEMES.map(([v, nom, quoi]) => `
      <button class="opt" data-t="${v}" aria-pressed="${v === themeChoisi()}">
        <span class="opt-nom">${nom}</span><span class="opt-quoi">${quoi}</span>
      </button>`).join('')}</div>
    <p class="consigne">Ce réglage ne vaut que sur cet appareil.</p>
    <div class="barre"><button class="btn plein" id="tOk" style="flex:1">Fermer</button></div>`);

  w.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    try { localStorage.setItem(CLE_THEME, b.dataset.t); } catch (e) {}

    w.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed', x === b));
  });

}

const CLE_BIP_PREMIER = 'muscu.bipPremier';     // 'on' | 'off', défaut 'on'

function bipPremierSecondes() {
  try { const v = Number(localStorage.getItem(CLE_BIP_PREMIER_S)); return BIP_SECONDES.includes(v) ? v : 10; }

function bipDecompteActif() {

  $('#zone').querySelectorAll('[data-jsem]').forEach(b =>

function carteActivite(x) {
  // Un écart de JOURS, pas d'heures. À 00 h 28, l'activité de la veille n'a que
  // 22 h : l'ancien calcul en millisecondes tombait sur 0 et la disait
  // « aujourd'hui ». On compare deux minuits locaux, comme partout ailleurs.
  const jours = Math.round(
    (dateDeCle(cleJour(new Date())) - dateDeCle(cleJour(new Date(x.date)))) / 86400000);
  const detail = [
    dureeCompacte(x.duree_min),
    x.distance_km ? x.distance_km + ' km' : '',
    x.effort ? 'effort ' + x.effort + '/10' : ''
  ].filter(Boolean).join(' · ');
  // Une date future est saisissable : « il y a -1 j » ne veut rien dire.
  const quandCa = jours === 0 ? "aujourd'hui" : jours === 1 ? 'hier'
    : jours > 1 ? 'il y a ' + jours + ' j'
    : jours === -1 ? 'demain' : 'dans ' + (-jours) + ' j';
  return `<button class="ligne" data-act="${x.id}" style="width:100%;text-align:left">
    <div class="g">
      <div class="nom">${x.sport}</div>
      <div class="meta">${detail || 'sans détail'}</div>
    </div>
    <span class="meta" style="white-space:nowrap">${quandCa}</span>
  </button>`;
}

/**

  const a = x || { id:'', sport:'', date:new Date().toISOString().slice(0,10),

    this.disabled = true;
    try {
      await supprimerActivite(a.id);
      w.fermer(); toast('Activité supprimée'); vueAccueil();
    } catch (err) { toast(err.message); this.disabled = false; }
  };
}

/**
 * Gère le planning récurrent : un engagement extérieur qui revient chaque
 * semaine (club, cours...). Affiché dans le bandeau de la semaine, mais ne
 * devient jamais une séance enregistrée tout seul — « Consigner une
 * activité » reste le geste qui compte pour l'assiduité, le jour où on y va.
 */
/** « 45 min », « 1 h », « 1 h 30 » — la durée dite d'un trait, sans « heure ». */
function dureeCompacte(min) {
  const m = Number(min) || 0;
  if (!m) return '';
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60), reste = m % 60;
  return reste ? `${h} h ${String(reste).padStart(2, '0')}` : `${h} h`;
}

/** « 07 septembre 2026 » — la date en toutes lettres, pour une ligne qui respire. */
function dateLongue(d) {
  if (!d) return '';
  return new Date(d).toLocaleDateString('fr-FR', { day:'2-digit', month:'long', year:'numeric' });
}

/**
 * Une entrée de planning se lit en deux temps : ce que c'est et quand ça
 * revient sur la première ligne, la fenêtre de validité sur la seconde.
 * L'activité vient en tête — c'est elle qu'on cherche des yeux, pas le jour.
 */
function titreRecurrence(r) {
  if (!r.recurrent) {
    return [r.sport, r.date ? 'le ' + dateLongue(r.date) : '', r.heure, dureeCompacte(r.duree_min)]
      .filter(Boolean).join(' · ');
  }
  // « chaque mois » n'est plus proposé ; une entrée d'avant le dit encore, et
  // le dire est justement ce qui explique qu'elle n'apparaisse nulle part.
  const rythme = r.frequence === 'mois'
    ? 'chaque mois (non placé au calendrier)'
    : r.jour ? 'Tous les ' + String(r.jour).toLowerCase() + 's' : '';
  return [r.sport, rythme, r.heure, dureeCompacte(r.duree_min)].filter(Boolean).join(' · ');
}

/** « du 07 septembre 2026 au 28 juin 2027 », ou rien si aucune borne. */
function fenetreRecurrence(r) {
  if (!r.recurrent) return '';
  return [
    r.date_debut ? 'du ' + dateLongue(r.date_debut) : '',
    r.date_fin ? 'au ' + dateLongue(r.date_fin) : ''
  ].filter(Boolean).join(' ');
}

    </div>

    <div class="duo">
      <div class="champ"><label>Heure</label><input class="f" id="rHeure" type="time" value="${x.heure}"></div>
      <div class="champ"><label>Durée (min)</label><input class="f" id="rDuree" type="number" min="0" step="5" value="${x.duree_min || ''}"></div>
    </div>
    <div class="champ"><label>Notes</label><input class="f" id="rNotes" value="${x.notes}" placeholder="Club, adresse…"></div>
    <div class="barre" style="margin-top:14px"><button class="btn" id="rAnn">Annuler</button>
      <button class="btn plein" id="rOk" style="flex:1">Enregistrer</button></div>
    ${r ? '<div class="barre"><button class="btn danger" id="rDel">Supprimer</button></div>' : ''}`);

    w.querySelector('#rBlocRecurrent').classList.toggle('hidden', !recCase.checked);
    w.querySelector('#rBlocPonctuel').classList.toggle('hidden', recCase.checked);
  };
  recCase.onchange = majBlocs;
  majBlocs();

  w.querySelector('#rAnn').onclick = w.fermer;
  w.querySelector('#rOk').onclick = async function () {

      jour: w.querySelector('#rJour').value,
      date_debut: w.querySelector('#rDebut').value, date_fin: w.querySelector('#rFin').value,
      date: w.querySelector('#rDate').value,

      if (!recurrent) { champs.jour = ''; champs.frequence = ''; champs.date_debut = ''; champs.date_fin = ''; }

      else liste.push(Object.assign({ id: res.id }, champs));

    this.disabled = true;
    try {
      await supprimerRecurrence(r.id);
      const i = liste.indexOf(r); if (i !== -1) liste.splice(i, 1);
      w.fermer(); rafraichirParent();
      toast('Retiré du planning');

 */
async function vueMaRoutine() {
  const r = S.maRoutine;
  const app = $('#app');
  app.innerHTML = `<header><h2>${r ? r.nom : 'Routine'}</h2>
    <button class="close" id="retourRoutines">← Mes routines</button></header>
    <div id="zone"><div class="empty">Chargement…</div></div>`;
  $('#retourRoutines').onclick = () => { S.vue = 'routines'; rendre(); };
  if (!r) { $('#zone').innerHTML = `<div class="empty">Aucune routine.</div>`; return; }

  let source, faits, planif;
  try {
    [source, faits, planif] = await Promise.all([
      dataRoutine(r.routine_id),
      dataFaitsRoutine(S.email, r.id),
      dataRecurrences().then(l => l.filter(x => x.routine_id === r.id))
    ]);
  } catch (err) {
    $('#zone').innerHTML = `<div class="empty">${err.message === 'ROUTINE_INTROUVABLE'
      ? 'Cette routine n\'est plus disponible. Parlez-en à votre coach.'
      : 'Impossible de charger.<br>' + err.message}</div>`;

  }

  const semaine = joursDeLaSemaine();
  const aujourdhui = cleJour(new Date());
  const faitAujourdhui = faits.indexOf(aujourdhui) !== -1;
  const cetteSemaine = semaine.filter(c => faits.indexOf(c) !== -1).length;

  $('#zone').innerHTML = `
    <div class="card" style="display:block;margin-bottom:16px">

      ${source.description ? `<p class="consigne" style="margin-top:8px">${source.description}</p>` : ''}
      ${lecteur(source.video)}
    </div>

    <div class="card" style="display:block;margin-bottom:16px">
      <div class="eyebrow">Cette semaine</div>
      <div class="sous" style="margin:10px 0 4px;pointer-events:none">
        ${semaine.map((c, i) => `<button type="button" aria-pressed="${faits.indexOf(c) !== -1}"
          >${SEMAINE[i].slice(0, 3)}</button>`).join('')}
      </div>
      <div class="meta bas">${cetteSemaine
        ? cetteSemaine + ' fois cette semaine' : 'Pas encore faite cette semaine'}${
        faits.length ? ' · ' + faits.length + ' en tout' : ''}</div>
      <div class="barre">
        <button class="btn ${faitAujourdhui ? '' : 'plein'}" id="rtFait" style="flex:1">${
          faitAujourdhui ? '✓ Faite aujourd\'hui' : 'Marquer faite aujourd\'hui'}</button>
      </div>
      <div class="barre">
        <button class="btn" id="rtPlanif" style="flex:1">${planif.length
          ? 'Modifier ma planification · ' + planif.length + ' jour' + (planif.length > 1 ? 's' : '')
          : '＋ Planifier dans ma semaine'}</button>
      </div>
      ${planif.length ? `<div class="meta bas">${planif.map(p =>
        p.jour + (p.heure ? ' ' + p.heure : '')).join(' · ')}</div>` : ''}
    </div>

    ${source.exercices.length ? `<div class="eyebrow" style="margin-bottom:10px">Les exercices</div>` : ''}
    ${source.exercices.map(e => `<div class="ligne">
      <div class="g">
        <div class="nom">${e.nom}</div>
        <div class="meta">${[
          (e.series || 1) + ' × ' + ((e.duree_s ? duree(e.duree_s) : e.reps_cible) || '—'),
          e.repos_s ? 'repos ' + e.repos_s + ' s' : ''].filter(Boolean).join(' · ')}</div>
      </div>
    </div>`).join('') || `<div class="empty">Cette routine n'a pas encore d'exercice.</div>`}`;

  $('#rtFait').onclick = async function () {

/**
 * Poser une routine dans sa semaine. Les jours conseillés sont pré-cochés — le
 * rythme du coach est une proposition, pas une contrainte : c'est le pratiquant
 * qui sait quand il peut. Ce qu'il valide devient des entrées de son **planning
 * récurrent**, celui qui existait déjà pour ses cours hors programme : elles
 * s'affichent donc dans son calendrier et son bandeau de semaine sans une ligne
 * de plus, et le coach les voit comme le reste de son planning.
 */
function modalPlanifierRoutine(r, source, planif) {
  const dejaJours = planif.map(p => p.jour);
  const choisis = new Set(dejaJours.length ? dejaJours : joursFrequence(source.frequence));
  const heure0 = (planif[0] || {}).heure || '';
  const w = modal('Planifier ' + r.nom, `
    <div class="champ"><label>Mes jours</label>
      <div class="sous" data-role="plj" style="margin-bottom:0;flex-wrap:wrap">
        ${SEMAINE.map(j => `<button type="button" data-j="${j}"
          aria-pressed="${choisis.has(j)}">${j.slice(0, 3)}</button>`).join('')}
      </div></div>
    <p class="consigne">${libelleFrequence(source.frequence)
      ? 'Rythme conseillé : ' + libelleFrequence(source.frequence).toLowerCase() + '. À vous d\'ajuster.'
      : 'Aucun rythme conseillé : posez les jours qui vous arrangent.'}</p>
    <div class="champ"><label>Heure</label>
      <input class="f" id="plHeure" type="time" value="${heure0}"></div>
    <div class="barre"><button class="btn" id="plAnn">Annuler</button>
      <button class="btn plein" id="plOk" style="flex:1">Enregistrer</button></div>
    ${planif.length ? '<div class="barre"><button class="btn danger" id="plDel">Retirer de ma semaine</button></div>' : ''}`);

  w.querySelectorAll('[data-role="plj"] button').forEach(b => b.onclick = () => {
    const j = b.dataset.j;
    if (choisis.has(j)) choisis.delete(j); else choisis.add(j);
    b.setAttribute('aria-pressed', choisis.has(j) ? 'true' : 'false');
  });
  w.querySelector('#plAnn').onclick = w.fermer;

  // Réécrire plutôt que rapprocher : on retire les entrées nées de cette routine
  // et on repose celles qui sont cochées. Trois écritures pour un jour changé,
  // mais aucun cas tordu à tenir — et un planning se retouche rarement.
  const remplacer = async (jours) => {
    for (const p of planif) await supprimerRecurrence(p.id);
    const debut = cleJour(new Date());
    const fin = source.duree_semaines ? finPrevueDe(dateDeCle(debut), source.duree_semaines) : '';
    for (const j of jours) {
      await sauverRecurrence({
        sport: r.nom, recurrent: true, jour: j,
        heure: w.querySelector('#plHeure').value, duree_min: 0,
        notes: 'Routine conseillée', routine_id: r.id,
        date_debut: debut, date_fin: fin
      });
    }
  };

  w.querySelector('#plOk').onclick = async function () {
    const jours = SEMAINE.filter(j => choisis.has(j));
    if (!jours.length) return toast('Choisissez au moins un jour');
    this.disabled = true;
    try {
      await remplacer(jours);
      w.fermer(); toast('Planifiée'); vueMaRoutine();
    } catch (err) { toast(err.message); this.disabled = false; }
  };
  const pd = w.querySelector('#plDel');
  if (pd) pd.onclick = async function () {
    this.disabled = true;
    try {
      await remplacer([]);
      w.fermer(); toast('Retirée de la semaine'); vueMaRoutine();
    } catch (err) { toast(err.message); this.disabled = false; }
  };
}

// ── Vue séance ───────────────────────────────────────────────
/** Message lisible pour l'erreur lancée par demarrerSeance quand une autre séance bloque. */
function messageDemarrage(err) {
  const m = /^SEANCE_AUTRE_JOUR_(.+)$/.exec(err.message);
  return m ? `Terminez d'abord la séance du ${m[1]} avant d'en commencer une autre.` : err.message;
}

/**
 * Rien ne s'écrit tant que la séance n'a pas été démarrée d'un geste explicite.
 * Elle démarrait autrefois toute seule au premier geste qui compte — valider
 * une série, clore un exercice. C'était une séance ouverte pour un pouce qui
 * ripe : sur un écran de cartes serrées, le mauvais appui est fréquent, et il
 * lançait un chronomètre que rien n'annonçait. Le bouton « Démarrer la
 * séance » est désormais le seul point d'entrée ; les commandes qui écrivent
 * restent inertes avant lui (voir `carte`, `cablerCarte` et `ouvrirLogger`).
 *
 * Reste un garde-fou plutôt qu'une décision : les boutons sont déjà désactivés
 * quand on arrive ici sans séance, mais une écriture ne doit jamais dépendre
 * du seul état du DOM.
 */
async function assurerSeanceActive() {
  if (S.seanceId) return true;
  toast('Démarrez la séance avant d\'enregistrer quoi que ce soit');
  return false;
}

async function vueSeance() {
  const app = $('#app');
  if (!S.moi.jours.length) {
    app.innerHTML = `<div class="empty">Aucun programme pour l'instant.<br>Votre coach doit vous en assigner un.</div>`;
    return;
  }
  app.innerHTML = `
    <header>
      <h2>Séance</h2>
      <button class="close" id="retourAccueil">← Accueil</button>
    </header>
    <div class="eyebrow" id="avancement">Programme</div>
    <div class="days">${S.moi.jours.map(j =>
      `<button class="day" data-jour="${j}" aria-pressed="${j === S.jour}">${j}</button>`).join('')}</div>
    <div class="chronos" id="chronos"></div>
    <div id="liste"><div class="empty">Chargement…</div></div>`;

  const ra = $('#retourAccueil');
  if (ra) ra.onclick = () => { S.vue = 'accueil'; rendre(); };
  app.querySelectorAll('.day').forEach(b => b.onclick = () => {
    S.jour = b.dataset.jour; vueSeance();
  });

  let blocs;
  try { blocs = await chargerSeance(S.jour); }
  catch (err) { $('#liste').innerHTML = `<div class="empty">Impossible de charger.<br>${err.message}</div>`; return; }
  $('#liste').innerHTML = blocs.map(b => {
    const seul = b.exercices.length < 2;
    const cartes = b.exercices.map((e, k) => carte(e, seul) +
      (k < b.exercices.length - 1 && e.pause_s
        ? `<div class="pause">↓ ${reposTexte(e.pause_s)} de pause</div>` : '')
    ).join('');
    if (seul) return cartes;
    // Superset : on enchaîne les exercices, le repos vient après le tour complet.
    return `<div class="bloc">
      <div class="bloc-tete">
        <span class="eyebrow">Bloc ${b.bloc} · superset</span>
        <span class="bloc-info">${b.series} tours · repos ${reposTexte(b.repos_s)} · ${
          dureeTexte(Math.round(dureeBloc(b) / 60))}</span>
      </div>${cartes}</div>`;
  }).join('') + (S.seanceId
    ? `<div class="barre"><button class="btn plein" id="finSeance" style="flex:1">Terminer la séance</button></div>`
    : S.autreSeanceOuverte
      ? `<div class="empty">Séance en cours : ${S.autreSeanceOuverte.jour}.<br>Terminez-la ou annulez-la avant d'en commencer une nouvelle.</div>
         <div class="barre"><button class="btn plein" id="allerSeanceActive" style="flex:1">Aller à cette séance</button></div>`
      : `<div class="barre"><button class="btn plein" id="debutSeance" style="flex:1">Démarrer la séance</button></div>`);

  peindreChronos(blocs);

  const total = S.exos.length;
  const clos = S.exos.filter(x => S.finis.indexOf(x.ligne_id) !== -1 ||
    faitsDe(x).length >= x.series).length;
  majPendule(clos, total);

  const fs = $('#finSeance');
  if (fs) fs.onclick = modalFinSeance;
  const ds = $('#debutSeance');
  if (ds) ds.onclick = async function () {
    this.disabled = true; this.textContent = 'Démarrage…';
    try {
      const r = await demarrerSeance(S.jour);
      S.seanceId = r.seance_id;
      S.debut = new Date().toISOString();
      vueSeance();
    } catch (err) {
      toast(messageDemarrage(err)); this.disabled = false; this.textContent = 'Démarrer la séance';
    }
  };
  const asa = $('#allerSeanceActive');
  if (asa) asa.onclick = () => { S.jour = S.autreSeanceOuverte.jour; vueSeance(); };
  S.blocs.forEach(b => {
    const seul = b.exercices.length < 2;
    b.exercices.forEach(e => cablerCarte(e, seul));
  });
}

// ── Séance : lecture et écritures ────────────────────────────
// La vague la plus délicate du portage (voir le plan) : c'est ici que vivent
// l'invariant « pas deux séances ouvertes le même jour » et les écritures
// pendant l'entraînement, qui doivent rester utilisables même en salle en
// sous-sol, réseau coupé — c'est `persistentLocalCache` qui l'assure
// désormais, plus la file maison retirée avec ce portage.

/**
 * N'importe quelle séance encore ouverte pour ce pratiquant, quel que soit
 * le jour de programme — l'invariant est global, pas par jour : impossible
 * d'en démarrer une seconde en parallèle, il faut d'abord clore ou annuler
 * celle en cours, même oubliée ouverte depuis un autre jour.
 * `serverTimestamps: 'estimate'` : juste après une création, le serveur n'a
 * pas encore répondu et `date` vaudrait `null` sans cette option — la séance
 * qu'on vient de créer semblerait alors ne pas exister, invariant compris.
 */
async function seanceOuverteQuelconque() {
  const { db, collection, query, where, orderBy, limit, getDocs } = FB;
  const snap = await getDocs(query(collection(db, 'seances'), where('email', '==', S.email),
    orderBy('date', 'desc'), limit(10)));
  const trouve = snap.docs.find(d => {
    const s = d.data({ serverTimestamps: 'estimate' });
    return s.duree_min === '' || s.duree_min == null;
  });
  return trouve ? { id: trouve.id, ...trouve.data({ serverTimestamps: 'estimate' }) } : null;
}

/**
 * Assemble la séance du jour : blocs du programme actif avec charges (maxi,
 * ajustement, pourcentage), séance ouverte le cas échéant avec ses séries
 * déjà saisies, et les dernières séries de chaque exercice pour « dernier »
 * / « record ». Équivalent direct de getSeance_ (apps-script/Code.js).
 */
async function dataSeance(jour) {
  const { db, collection, collectionGroup, query, where, orderBy, limit, getDocs } = FB;
  const email = S.email;

  const att = await attributionActive(email);
  const blocsBase = blocsBruts(att, jour);
  const idsExosJour = [...new Set(blocsBase.flatMap(b => b.exercices.map(l => l.exercice_id)))];

  const [ajustSnap, maxisSnap, exercices, active, historiques] = await Promise.all([
    att ? getDocs(collection(db, 'attributions', att.id, 'ajustements')) : Promise.resolve({ docs: [] }),
    getDocs(collection(db, 'pratiquants', email, 'maxis')),
    catalogueParId(),
    seanceOuverteQuelconque(),
    // Résilient exercice par exercice : « dernier »/« record »/le maxi estimé sont
    // un confort, pas l'essentiel — une requête qui échoue sur un exercice ne doit
    // pas empêcher d'afficher la séance elle-même.
    Promise.all(idsExosJour.map(async id => {
      try {
        const snap = await getDocs(query(collectionGroup(db, 'series'),
          where('email', '==', email), where('exercice_id', '==', id),
          orderBy('horodatage', 'desc'), limit(5)));
        return [id, snap.docs.map(d => d.data())];
      } catch (err) {
        return [id, []];
      }
    })).then(Object.fromEntries)
  ]);

  const ajustes = {};
  ajustSnap.docs.forEach(d => { ajustes[d.id] = Number(d.data().charge) || 0; });

  const maxis = {};
  maxisSnap.docs.forEach(d => {
    const m = d.data();
    if (Number(m.kg) > 0) maxis[d.id] = { kg: Number(m.kg), source: m.source || 'mesuré' };
  });
  // Sans maxi saisi par le coach (écriture réservée au coach, voir firestore.rules),
  // on estime depuis les dernières séries connues — formule d'Epley, sur les cinq
  // dernières plutôt que tout l'historique : l'ancien serveur avait le classeur
  // entier en mémoire, le navigateur ne peut pas se permettre la même lecture.
  idsExosJour.forEach(id => {
    if (maxis[id]) return;
    const est = (historiques[id] || [])
      .filter(s => Number(s.charge) > 0 && Number(s.reps) > 0 && Number(s.reps) <= 15)
      .reduce((m, s) => Math.max(m, Number(s.charge) * (1 + Number(s.reps) / 30)), 0);
    if (est > 0) maxis[id] = { kg: Math.round(est * 10) / 10, source: 'estimé' };
  });

  // La séance active peut porter sur un autre jour que celui affiché — on ne
  // la rattache aux séries/exercices finis que si elle correspond à ce jour ;
  // sinon elle bloque juste le démarrage (voir demarrerSeance) et l'écran le
  // signale via autreSeanceOuverte.
  const ouverte = active && String(active.jour) === String(jour) ? active : null;
  const autreSeanceOuverte = active && String(active.jour) !== String(jour)
    ? { jour: active.jour, id: active.id } : null;

  // Séries et exercices clos sont rangés par LIGNE de programme, jamais par
  // exercice : deux lignes du même exercice dans un bloc gardent chacune leur
  // compteur et se valident séparément. Les séries écrites avant l'ajout de
  // `ligne_id` n'en portent pas : on les répartit sur les lignes de leur
  // exercice, dans l'ordre, chacune jusqu'à son nombre de séries prévu —
  // sinon la première ligne héritait de tout et affichait « 8/4 ».
  let faits = {}, finis = [];
  if (ouverte) {
    const lignesDuJour = blocsBase.flatMap(b => b.exercices.map(l => ({
      ligne_id: l.ligne_id, exercice_id: l.exercice_id, series: Number(b.series) || 3
    })));
    const parLigne = Object.fromEntries(lignesDuJour.map(l => [l.ligne_id, l]));

    finis = (ouverte.exercices_finis || []).flatMap(id => parLigne[id] ? [id]
      : lignesDuJour.filter(l => l.exercice_id === id).map(l => l.ligne_id));

    const seriesSnap = await getDocs(collection(db, 'seances', ouverte.id, 'series'));
    seriesSnap.docs.map(d => d.data())
      .sort((a, b) => Number(a.serie_num) - Number(b.serie_num))
      .forEach(s => {
        let cle = parLigne[s.ligne_id] ? s.ligne_id : null;
        if (!cle) {
          const candidates = lignesDuJour.filter(l => l.exercice_id === s.exercice_id);
          const libre = candidates.find(l => (faits[l.ligne_id] || []).length < l.series);
          cle = (libre || candidates[0] || {}).ligne_id;
        }
        if (!cle) return;
        (faits[cle] = faits[cle] || [])
          .push({ reps: Number(s.reps) || 0, charge: Number(s.charge) || 0, duree_s: Number(s.duree_s) || 0 });
      });
  }

  const blocs = blocsBase.map(b => ({
    bloc: b.bloc, series: b.series, repos_s: b.repos_s,
    exercices: b.exercices.map(l => {
      const ex = exercices[l.exercice_id] || {};
      const pct = Number(String(l.pct_rm).replace('%', '')) || 0;
      const rm = maxis[l.exercice_id];
      let charge = Number(l.charge_cible) || 0;
      if (pct > 0 && rm && rm.kg > 0) charge = Math.round(rm.kg * pct / 100 / 2.5) * 2.5;
      const perso = ajustes[l.exercice_id];
      const ajuste = perso > 0;
      const chargeCoach = charge;
      if (ajuste) charge = perso;
      const passe = historiques[l.exercice_id] || [];
      return {
        exercice_id: l.exercice_id, ligne_id: l.ligne_id,
        nom: ex.nom || l.exercice_id, groupe: ex.groupe || '',
        consigne: ex.consigne || '', photo: ex.photo || '', video: ex.video || '',
        bloc: b.bloc, series: b.series, repos_s: b.repos_s,
        reps_cible: repsTexte(l.reps_cible),
        duree_s: l.duree_s === '' || l.duree_s === undefined ? null : l.duree_s,
        cadence: l.cadence || '', pause_s: Number(l.pause_s) || 0, note: l.note || '',
        pct_rm: pct, rm: rm ? rm.kg : 0, rm_source: rm ? rm.source : '',
        charge_cible: charge, charge_calculee: !!(pct && rm) && !ajuste,
        charge_coach: chargeCoach, charge_ajustee: ajuste,
        dernier: passe.length ? { reps: passe[0].reps, charge: Number(passe[0].charge) } : null,
        record: passe.length ? Math.max(...passe.map(s => Number(s.charge) || 0)) : 0
      };
    })
  }));

  return {
    seance_id: ouverte ? ouverte.id : null,
    debut: ouverte ? versDate(ouverte.date) : null,
    duree_estimee: estimerDuree(blocs),
    faits, finis, blocs, autreSeanceOuverte
  };
}

/** Charge la séance en blocs et remet à plat S.exos, index utilisé par le logger. */
async function chargerSeance(jour) {
  const r = await dataSeance(jour);
  const blocs = r.blocs || [];
  S.seanceId = r.seance_id || null;
  S.debut = r.debut || null;
  S.dureeEstimee = r.duree_estimee || 0;
  S.faits = r.faits || {};
  S.finis = r.finis || [];
  S.autreSeanceOuverte = r.autreSeanceOuverte || null;
  S.exos = []; S.blocs = blocs;
  blocs.forEach((b, bi) => b.exercices.forEach((e, ei) => {
    e._b = bi; e._e = ei; e._i = S.exos.length;   // bloc, rang dans le bloc, index plat
    S.exos.push(e);
  }));
  return blocs;
}

/**
 * Démarre la séance du jour, ou reprend celle déjà ouverte — un rechargement
 * ou une reprise après coupure ne doit pas en créer une seconde. Si une
 * séance reste ouverte sur un AUTRE jour, refuse net : une seule à la fois,
 * il faut la clore ou l'annuler d'abord (voir seanceOuverteQuelconque).
 * Pas de vraie transaction : le SDK client ne lit pas une requête depuis une
 * transaction, seulement des documents un par un — contrairement à ce
 * qu'imaginait le plan initial. Le bouton reste désactivé pendant l'appel
 * (voir les appelants), ce qui ramène le risque de doublon à celui déjà admis
 * pour `attribuer` (Risque 3) : en lecture, on prend toujours la plus
 * récente si l'invariant se casse malgré tout.
 */
async function demarrerSeance(jour) {
  const { db, collection, addDoc, serverTimestamp } = FB;
  const active = await seanceOuverteQuelconque();
  if (active) {
    if (String(active.jour) === String(jour)) return { seance_id: active.id };
    throw new Error('SEANCE_AUTRE_JOUR_' + active.jour);
  }
  const att = await attributionActive(S.email);
  const blocs = blocsBruts(att, jour);
  const ref = await addDoc(collection(db, 'seances'), {
    email: S.email, date: serverTimestamp(), jour,
    duree_min: '', duree_prevue: estimerDuree(blocs) || '',
    ressenti: '', notes: '', exercices_finis: []
  });
  return { seance_id: ref.id };
}

/** Enregistre une série de l'exercice en cours. `exercice_id` reste écrit
 *  pour l'historique (dernier, record, maxi estimé, tous exercices confondus) ;
 *  `ligne_id` dit de quelle ligne du programme elle vient. */
async function enregistrerSerie(seanceId, exerciceId, ligneId, p) {
  const { db, collection, addDoc, serverTimestamp } = FB;
  const reps = Number(p.reps) || 0;
  const duree = Number(p.duree_s) || 0;
  const charge = Number(p.charge);
  if (!(reps > 0) && !(duree > 0)) throw new Error('VALEURS_INVALIDES');
  if (!(charge >= 0)) throw new Error('VALEURS_INVALIDES');
  await addDoc(collection(db, 'seances', seanceId, 'series'), {
    email: S.email, exercice_id: exerciceId, ligne_id: ligneId || '',
    serie_num: Number(p.serie_num) || 1,
    reps: reps || '', duree_s: duree || '', charge, horodatage: serverTimestamp()
  });
}

/** Clôt une ligne de programme sans exiger que toutes les séries soient
 *  faites : le pratiquant décide qu'il en a fini. Les séries déjà saisies
 *  restent. Le champ garde son nom `exercices_finis` mais contient désormais
 *  des `ligne_id` — les anciennes séances y ont des `exercice_id`, relus par
 *  le repli de dataSeance. */
async function finirExercice(seanceId, ligneId) {
  const { db, doc, updateDoc, arrayUnion } = FB;
  await updateDoc(doc(db, 'seances', seanceId), { exercices_finis: arrayUnion(ligneId) });
}

/** Rouvre une ligne close par erreur. */
async function reprendreExercice(seanceId, ligneId) {
  const { db, doc, updateDoc, arrayRemove } = FB;
  await updateDoc(doc(db, 'seances', seanceId), { exercices_finis: arrayRemove(ligneId) });
}

/**
 * Clôt la séance. Rien n'oblige à avoir tout fait : les exercices non
 * commencés restent simplement non commencés, la séance est enregistrée
 * telle quelle. Le compteur `resume.nbSeances` du profil (Risque 2 du plan —
 * pas de Cloud Function pour l'agréger côté serveur) est mis à jour dans le
 * même lot, par le pratiquant lui-même : c'est le seul acteur en mesure de
 * le faire à cet instant.
 */
async function terminerSeance(seanceId, p) {
  const { db, doc, getDoc, writeBatch, serverTimestamp, increment } = FB;
  const ref = doc(db, 'seances', seanceId);
  const snap = await getDoc(ref);
  if (!snap.exists()) throw new Error('SEANCE_INTROUVABLE');
  const s = snap.data({ serverTimestamps: 'estimate' });

  let duree = Number(p.duree_min) || 0;
  if (!duree && s.date) {
    duree = Math.max(1, Math.round((Date.now() - dateDe(s.date).getTime()) / 60000));
    if (duree > 300) duree = 0;   // séance oubliée ouverte : mieux vaut vide qu'absurde
  }

  const b = writeBatch(db);
  b.update(ref, { duree_min: duree || '', ressenti: p.ressenti || '', notes: p.notes || '' });
  b.update(doc(db, 'pratiquants', S.email), {
    'resume.nbSeances': increment(1), 'resume.derniereSeanceLe': serverTimestamp()
  });
  await b.commit();
  return { duree_min: duree };
}

/** Annule une séance encore ouverte : elle et toutes ses séries disparaissent
 *  — pour une séance démarrée par erreur, ou laissée ouverte pour rien. */
async function supprimerSeance(seanceId) {
  const { db, doc, collection, getDocs, writeBatch } = FB;
  const seriesSnap = await getDocs(collection(db, 'seances', seanceId, 'series'));
  const b = writeBatch(db);
  seriesSnap.docs.forEach(d => b.delete(d.ref));
  b.delete(doc(db, 'seances', seanceId));
  await b.commit();
}

/**
 * Charge à afficher. Un pourcentage de 1RM prime sur une charge fixe : c'est lui
 * qui suit la progression. On dit d'où vient le chiffre quand il est calculé.
 */
/**
 * Dit d'où vient la charge affichée, et laisse le pratiquant se l'approprier.
 * Le coach fixe une charge ou un pourcentage du max ; c'est le pratiquant qui est
 * sous la barre, il a le dernier mot, et son choix vaut pour les séances suivantes.
 */
function majOrigine(e, charge) {
  const z = $('#origine');
  if (!z) return;
  const change = Math.abs(charge - (Number(e.charge_cible) || 0)) > 0.01;

  let dit = '';
  if (e.charge_ajustee) dit = `Votre charge · le programme dit ${e.charge_coach || '—'} kg`;
  else if (e.charge_calculee) dit = `${e.pct_rm} % de votre max (${e.rm} kg${e.rm_source === 'estimé' ? ', estimé' : ''})`;
  else if (e.pct_rm) dit = `${e.pct_rm} % du max — votre max n'est pas connu, à vous de juger`;
  else if (e.charge_cible) dit = 'Charge prévue par le coach';

  z.innerHTML = `${dit ? `<span class="dit">${dit}</span>` : ''}
    ${change || e.charge_ajustee
      ? `<button class="perso" id="garder">${change ? 'Garder ' + charge + ' kg comme ma charge' : 'Revenir à la charge du programme'}</button>`
      : ''}`;

  const g = $('#garder');
  if (g) g.onclick = async function () {
    this.disabled = true;
    try {
      await ajusterCharge(e.exercice_id, change ? charge : 0);
      if (change) { e.charge_coach = e.charge_coach || e.charge_cible; e.charge_cible = charge; e.charge_ajustee = true; }
      else { e.charge_cible = e.charge_coach || 0; e.charge_ajustee = false; }
      toast(change ? 'Charge enregistrée' : 'Retour à la charge du programme');
      majOrigine(e, charge);
    } catch (err) { toast(err.message); this.disabled = false; }
  };
}

function chargeTexte(e) {
  if (!e.charge_cible) return '';
  if (e.charge_ajustee) return e.charge_cible + ' kg · votre charge';
  if (!e.pct_rm) return e.charge_cible + ' kg';
  const base = e.charge_calculee
    ? `${e.pct_rm} % de ${e.rm} kg${e.rm_source === 'estimé' ? ' estimés' : ''}`
    : `${e.pct_rm} % — max inconnu`;
  return `${e.charge_cible} kg · ${base}`;
}

/** « 45 s », « max », « 1:30 ». */
function duree(sec) {
  if (sec === 'max' || sec === 'MAX') return 'max';
  const n = Number(sec) || 0;
  return n >= 60 ? `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}` : `${n} s`;
}

/**
 * Estimation locale, pour l'éditeur : le serveur ne connaît pas encore le jour
 * qu'on est en train de composer. Même règle que `estimerDuree_` côté serveur —
 * répétitions à la cadence, pauses, repos entre tours, changement de poste,
 * échauffement une fois.
 */
// Sans cadence prescrite, une répétition compte pour 2 s : le tempo naturel,
// une seconde de montée et une de descente. Rien n'est inscrit dans le champ
// pour autant — l'absence de cadence reste l'absence de cadence.
const TEMPO_DEFAUT = 2, TRANSITION_MIN = 4, ECHAUFFEMENT_MIN = 10;

const repsMoyennes = v => {
  const t = String(v || '').trim().toLowerCase();
  if (!t) return 0;
  if (t === 'max') return 10;
  const n = (t.match(/\d+/g) || []).map(Number);
  return n.length ? (n.length > 1 ? (n[0] + n[n.length - 1]) / 2 : n[0]) : 0;
};

const tempoSecondes = c => {
  const p = normaliserCadence(c).split('-').map(x => Number(x.trim()));
  if (p.length !== 4 || p.some(isNaN)) return TEMPO_DEFAUT;
  const t = p[0] + p[1] + p[2] + p[3];
  return t > 0 ? t : TEMPO_DEFAUT;
};

/** Durée d'un bloc seul, en secondes : ses tours et ses repos, rien d'autour. */
function dureeBloc(b) {
  const tours = Number(b.series) || 1;
  let tour = 0;
  (b.exercices || []).forEach((e, i) => {
    const d = String(e.duree_s || '').toLowerCase();
    tour += d === 'max' ? 45 : Number(e.duree_s) > 0 ? Number(e.duree_s)
                                                     : repsMoyennes(e.reps_cible) * tempoSecondes(e.cadence);
    if (i < b.exercices.length - 1) tour += Number(e.pause_s) || 0;
  });
  return tours * tour + Math.max(0, tours - 1) * (Number(b.repos_s) || 0);
}

/**
 * Une estimation ne mérite pas d'être précise à la minute : « 61 min » se lit
 * comme un calcul, « 1 heure » comme une durée. Arrondi à cinq minutes, ce qui
 * reste assez fin pour distinguer une séance de 40 d'une de 45.
 */
function dureeTexte(min) {
  const m = Math.round((Number(min) || 0) / 5) * 5;
  if (!m) return '';
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60), reste = m % 60;
  if (!reste) return h === 1 ? '1 heure' : h + ' heures';
  return h + ' h ' + String(reste).padStart(2, '0');
}

/** Durée d'un jour entier : les blocs, les changements de poste, l'échauffement. */
function dureeJour(blocs) {
  if (!blocs || !blocs.length) return 0;
  const sec = blocs.reduce((t, b) => t + dureeBloc(b), 0)
    + Math.max(0, blocs.length - 1) * TRANSITION_MIN * 60
    + ECHAUFFEMENT_MIN * 60;
  return Math.round(sec / 60);
}

/**
 * Les chronos du jour, en haut de la séance. Valider une série depuis la
 * pastille n'arme aucun minuteur — c'est le prix du raccourci — et il arrive
 * de vouloir souffler entre deux exercices sans rien valider du tout. Cette
 * rangée met les temps morts à portée de pouce, sans ouvrir un exercice.
 *
 * Les durées ne sont pas inventées : ce sont celles du jour affiché, les
 * `repos_s` des blocs et les `pause_s` des exercices. Un jour sans aucun temps
 * mort déclaré n'affiche rien plutôt que des durées arbitraires — le programme
 * du coach fait foi.
 *
 * Les boutons ne portent que la durée. Dire « pause » ou « repos » ici serait
 * un mot de trop : ces deux-là ne se distinguent que dans l'enchaînement
 * automatique du panneau, où ils expliquent d'où vient le temps mort. Lancé à
 * la main, un chrono de 30 s est un chrono de 30 s. C'est aussi pourquoi la
 * déduplication porte sur la seule durée : un repos et une pause de même
 * longueur ne font qu'un bouton.
 */
function peindreChronos(blocs) {
  const z = $('#chronos');
  if (!z) return;

  const vus = {};
  (blocs || []).forEach(b => {
    if (Number(b.repos_s) > 0) vus[Number(b.repos_s)] = true;
    b.exercices.forEach(e => { if (Number(e.pause_s) > 0) vus[Number(e.pause_s)] = true; });
  });
  const temps = Object.keys(vus).map(Number).sort((a, b) => a - b);

  z.innerHTML = temps.map(sec => `<button class="chrono-btn" data-chrono="${sec}"
    aria-label="Lancer un chrono de ${reposTexte(sec)}">${reposTexte(sec)}</button>`).join('');

  z.querySelectorAll('[data-chrono]').forEach(btn => {
    const sec = Number(btn.dataset.chrono);
    btn.onclick = () => lancerMinuteur(sec, 'Chrono');
  });
}

/**
 * Bandeau d'avancement : le temps écoulé face au temps prévu, et les exercices
 * bouclés. Le pendule bat chaque minute tant que la séance est ouverte —
 * chaque seconde n'apprendrait rien et réveillerait l'écran pour rien.
 */
function majPendule(clos, total) {
  const z = $('#avancement');
  if (!z) return;
  clearInterval(S.pendule);

  const peindre = () => {
    const a = $('#avancement');
    if (!a) { clearInterval(S.pendule); return; }
    if (!S.seanceId) {
      a.textContent = S.dureeEstimee ? `Programme · ${dureeTexte(S.dureeEstimee)}` : 'Programme';
      return;
    }
    // Écoulé et prévu se lisent dans la même unité, séparés d'une barre : « 135 min »
    // à côté de « 1 heure prévue » disait deux fois la même chose, dans deux formats.
    const min = S.debut ? Math.max(0, Math.round((Date.now() - new Date(S.debut)) / 60000)) : 0;
    a.textContent = `Séance · ${dureeTexte(min) || '0 min'}${
      S.dureeEstimee ? ' / ' + dureeTexte(S.dureeEstimee) : ''} · ${clos}/${total} exercices`;
  };
  peindre();
  if (S.seanceId) S.pendule = setInterval(peindre, 60000);
}

/** « 45 s », « 2 min », « 2 min 30 ». Un repos de 150 s ne se lit pas. */
function reposTexte(sec) {
  const n = Number(sec) || 0;
  if (!n) return '';
  if (n < 60) return n + ' s';
  const m = Math.floor(n / 60), r = n % 60;
  return r ? `${m} min ${r}` : `${m} min`;
}

/** Séries déjà validées sur CETTE ligne de programme. */
const faitsDe = e => S.faits[e.ligne_id] || [];

/** Commentaires non lus sur un exercice, pour celui qui regarde. */
const enAttente = id => ((S.nonLus || {}).exercices || {})[id] || 0;

/** Carte d'un exercice. series et repos_s sont hérités de son bloc. */
/**
 * Carte compacte de l'écran séance. La pastille de séries est un bouton :
 * appui court = une série de plus (valeurs par défaut, comme au premier tour
 * du panneau de saisie), appui long = les séries restantes d'un coup —
 * câblé juste après dans vueSeance via appuiLong. Le reste de la carte
 * ouvre toujours le panneau complet (ouvrirLogger) pour ajuster reps/charge
 * ou lancer un chrono.
 * Toujours une <div>, jamais <button> : un bouton dans un bouton est
 * invalide, et la pastille doit rester cliquable indépendamment.
 */
function carte(e, seul) {
  const n = faitsDe(e).length;
  const complet = n >= e.series;
  const fige = !S.seanceId;
  const fini = S.finis.indexOf(e.ligne_id) !== -1;
  const cible = e.duree_s ? duree(e.duree_s) : e.reps_cible;
  return `<div class="card ${fini ? 'clos' : ''}">
    <div class="body" data-i="${e._i}">
      <div class="nom">${e.nom}</div>
      <div class="meta">${e.series} × ${cible}${chargeTexte(e) ? ' · ' + chargeTexte(e) : ''}${
        fini && n < e.series ? ' · arrêté à ' + n : ''}${
        !fini && e.dernier && e.charge_cible ? ' · dernière fois ' + e.dernier.charge + ' kg' : ''}</div>
      ${seul ? `<div class="meta">${[
        e.repos_s ? 'repos ' + reposTexte(e.repos_s) : '',
        dureeTexte(Math.round(dureeBloc({ series:e.series, repos_s:e.repos_s, exercices:[e] }) / 60))
      ].filter(Boolean).join(' · ')}</div>` : ''}
      ${enAttente(e.exercice_id) ? `<span class="pastille-cm">${enAttente(e.exercice_id)} mot${
        enAttente(e.exercice_id) > 1 ? 's' : ''} de ${S.moi.coach || 'votre coach'}</span>` : ''}
      ${e.note ? `<div class="note-coach">${e.note}</div>` : ''}
      ${e.cadence ? `<div class="cadbloc"><span class="cadence">${e.cadence}</span>${courbeCadence(e.cadence, false)}</div>` : ''}
      ${e.charge_cible ? disques(e.charge_cible) : ''}
    </div>
    ${fini
      ? `<button class="done full reprendre" data-rep="${e.ligne_id}"
           title="Reprendre cet exercice" aria-label="Reprendre ${e.nom}">↺</button>`
      : `<button class="done ${complet ? 'full' : ''}" data-valider="${e._i}"${complet || fige ? ' disabled' : ''}
           aria-label="${complet ? `${e.series} séries faites, rien de plus à valider`
             : fige ? `${n} sur ${e.series} séries — démarrez la séance pour en valider`
             : `${n} sur ${e.series} séries — appui court : une série de plus, appui long : au maximum`}">${n}/${e.series}</button>`}
  </div>`;
}

/**
 * Appui court déclenche `court`, appui long (550 ms) déclenche `long` à sa
 * place — jamais les deux.
 */
function appuiLong(el, court, long, delai) {
  if (!el) return;
  let t = null, longFait = false;
  el.onpointerdown = () => { longFait = false; t = setTimeout(() => { longFait = true; long(); }, delai || 550); };
  el.onpointerup = () => { clearTimeout(t); if (!longFait) court(); };
  el.onpointercancel = () => clearTimeout(t);
  el.onpointerleave = () => clearTimeout(t);
}

/**
 * Remplace juste la carte d'un exercice après une écriture rapide (pastille),
 * sans recharger tout l'écran : un aller-retour Firestore complet pour
 * changer un badge se voyait — un « Chargement… » plein écran pour ça — et
 * perdait la position du défilement. Une carte suffit toujours : la séance est
 * forcément déjà démarrée quand on écrit, la barre du bas ne change plus.
 */
function rafraichirCarte(e) {
  const corps = document.querySelector(`.body[data-i="${e._i}"]`);
  const carteEl = corps && corps.closest('.card');
  if (!carteEl) return;
  const seul = S.blocs[e._b].exercices.length < 2;
  const tmp = document.createElement('div');
  tmp.innerHTML = carte(e, seul);
  carteEl.replaceWith(tmp.firstElementChild);
  cablerCarte(e, seul);

  const total = S.exos.length;
  const clos = S.exos.filter(x => S.finis.indexOf(x.ligne_id) !== -1 ||
    faitsDe(x).length >= x.series).length;
  majPendule(clos, total);
}

/** Câble une carte déjà dans le DOM : ouvrir le panneau, reprendre, pastille. */
function cablerCarte(e, seul) {
  const corps = document.querySelector(`.body[data-i="${e._i}"]`);
  if (corps) corps.onclick = () => ouvrirLogger(e._i);
  const rep = document.querySelector(`[data-rep="${e.ligne_id}"]`);
  if (rep) rep.onclick = async function () {
    this.disabled = true;
    try {
      if (S.seanceId) await reprendreExercice(S.seanceId, e.ligne_id);
      S.finis = S.finis.filter(x => x !== e.ligne_id);
      rafraichirCarte(e);
    } catch (err) { toast(err.message); this.disabled = false; }
  };
  const val = document.querySelector(`[data-valider="${e._i}"]`);
  if (val && !val.disabled) appuiLong(val, () => validerSerieRapide(e), () => remplirSerieAuMax(e));
}

/**
 * Le compteur ne dépasse jamais la consigne du coach : une fois les séries
 * prévues validées, plus rien ne s'ajoute — ni par la pastille, ni par le
 * panneau. Sans ce plafond, chaque appui de trop écrivait une série de plus
 * en base et la pastille affichait « 8/4 ». Dit une fois plutôt que d'être
 * répété sur les trois chemins d'écriture.
 */
function auComplet(e) {
  if (faitsDe(e).length < e.series) return false;
  toast(`Les ${e.series} séries sont faites`);
  return true;
}

/**
 * Une écriture à la fois par ligne. La pastille répond plus vite que
 * Firestore : deux appuis rapprochés lisaient tous les deux le même compteur
 * avant que le premier n'ait poussé sa série, et le plafond sautait.
 */
const enEcriture = {};

/**
 * Une série de plus depuis la pastille, sans ouvrir le panneau — reps/charge
 * par défaut, les mêmes qu'ouvrirLogger propose au départ. Ouvrir le panneau
 * reste le seul moyen d'ajuster reps/charge/durée avant de valider.
 */
async function validerSerieRapide(e) {
  if (enEcriture[e.ligne_id] || auComplet(e)) return;
  enEcriture[e.ligne_id] = true;
  try {
    if (!(await assurerSeanceActive())) return;
    const auTemps = !!e.duree_s;
    const cible = auTemps && String(e.duree_s).toLowerCase() !== 'max' ? Number(e.duree_s) : 0;
    if (auTemps && !cible) { toast("Ouvrez l'exercice pour chronométrer une série"); return; }
    const reps = Number(String(e.reps_cible).split('-')[0]) || 10;
    const charge = e.dernier ? e.dernier.charge : (e.charge_cible || (auTemps ? 0 : 20));
    const p = { serie_num: faitsDe(e).length + 1, charge };
    if (auTemps) p.duree_s = cible; else p.reps = reps;
    await enregistrerSerie(S.seanceId, e.exercice_id, e.ligne_id, p);
    (S.faits[e.ligne_id] = S.faits[e.ligne_id] || [])
      .push(auTemps ? { duree_s:cible, charge } : { reps, charge });
    rafraichirCarte(e);
  } catch (err) { toast('Non enregistré : ' + err.message); }
  finally { delete enEcriture[e.ligne_id]; }
}

/** Toutes les séries restantes d'un coup, aux mêmes valeurs par défaut. */
async function remplirSerieAuMax(e) {
  if (enEcriture[e.ligne_id] || auComplet(e)) return;
  enEcriture[e.ligne_id] = true;
  try {
    if (!(await assurerSeanceActive())) return;
    let deja = faitsDe(e).length;
    const manquant = e.series - deja;
    if (manquant <= 0) return;   // auComplet a déjà prévenu
    const auTemps = !!e.duree_s;
    const cible = auTemps && String(e.duree_s).toLowerCase() !== 'max' ? Number(e.duree_s) : 0;
    if (auTemps && !cible) { toast("Ouvrez l'exercice pour chronométrer une série"); return; }
    const reps = Number(String(e.reps_cible).split('-')[0]) || 10;
    const charge = e.dernier ? e.dernier.charge : (e.charge_cible || (auTemps ? 0 : 20));
    for (let i = 0; i < manquant; i++) {
      deja++;
      const p = { serie_num: deja, charge };
      if (auTemps) p.duree_s = cible; else p.reps = reps;
      await enregistrerSerie(S.seanceId, e.exercice_id, e.ligne_id, p);
      (S.faits[e.ligne_id] = S.faits[e.ligne_id] || [])
        .push(auTemps ? { duree_s:cible, charge } : { reps, charge });
    }
    rafraichirCarte(e);
  } catch (err) { toast('Non enregistré : ' + err.message); }
  finally { delete enEcriture[e.ligne_id]; }
}

const arrondi = n => Math.round(n * 10) / 10;

/**
 * Une valeur par séance : la charge la plus lourde du jour, du plus ancien au plus
 * récent. L'historique arrive du serveur en ordre décroissant.
 */
function seriesParSeance(h) {
  const parJour = {};
  h.forEach(x => {
    const k = cleJour(new Date(x.date));
    parJour[k] = Math.max(parJour[k] || 0, Number(x.charge) || 0);
  });
  return Object.keys(parJour).sort().map(k => ({ jour: k, kg: parJour[k] }));
}

/**
 * Courbe de progression : une séance en abscisse, la charge en ordonnée.
 * L'échelle part de 90 % du minimum pour que la pente reste lisible même quand
 * les charges varient peu — un aplatissement à zéro ne dirait rien.
 */
function courbeProgression(pts) {
  if (pts.length < 2) return '';
  const W = 300, H = 64, m = 6;
  const kg = pts.map(p => p.kg);
  const bas = Math.min(...kg) * 0.9;
  const haut = Math.max(...kg);
  const ec = haut - bas || 1;
  const x = i => m + (W - 2 * m) * (i / (pts.length - 1));
  const y = v => H - m - (H - 2 * m) * ((v - bas) / ec);

  const ligne = pts.map((p, i) => `${arrondi(x(i))},${arrondi(y(p.kg))}`).join(' ');
  const aire = `${m},${H - m} ${ligne} ${W - m},${H - m}`;
  const dernier = pts[pts.length - 1];

  return `<svg class="prog" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
      aria-label="Progression sur ${pts.length} séances, de ${kg[0]} à ${dernier.kg} kg">
    <polygon points="${aire}" fill="var(--brand)" opacity=".14"/>
    <polyline points="${ligne}" fill="none" stroke="var(--brand-ink)" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${arrondi(x(pts.length - 1))}" cy="${arrondi(y(dernier.kg))}" r="3.5" fill="var(--brand-ink)"/>
  </svg>`;
}

/** Décompose une charge en disques olympiques colorés (barre de 20 kg). */
/**
 * La barre entière, vue de profil : bague, disques, fût, disques, bague.
 * Les disques sont chargés comme on les charge vraiment — le plus lourd contre
 * le fût, les plus petits vers l'extérieur — et le dessin est symétrique,
 * puisqu'une barre l'est.
 */
function disques(kg) {
  const parCote = (Number(kg) - (S.moi.barKg || 20)) / 2;
  if (!(parCote > 0)) return '';
  const dispo = [[25,'var(--p25)',20],[20,'var(--p20)',18],[15,'var(--p15)',16],
                 [10,'var(--p10)',13],[5,'var(--p5)',10],[2.5,'var(--p2)',8],[1.25,'var(--p2)',6]];

  // Du plus lourd au plus léger : l'ordre dans lequel on enfile les disques.
  let reste = parCote;
  const pose = [];
  dispo.forEach(([p, c, h]) => {
    while (reste >= p - 0.01) {
      pose.push(`<i class="d" style="background:${c};height:${h}px"></i>`);
      reste -= p;
    }
  });

  const gauche = pose.slice().reverse().join('');   // de l'extérieur vers le centre
  const droite = pose.join('');
  const detail = parCote + ' kg par côté sur une barre de ' + (S.moi.barKg || 20) + ' kg';

  return `<span class="bar" role="img" aria-label="${detail}" title="${detail}"
    ><i class="bague"></i>${gauche}<i class="fut"></i>${droite}<i class="bague"></i></span>`;
}

// ── Saisie des séries ────────────────────────────────────────
async function ouvrirLogger(i) {
  const e = S.exos[i];
  const b = S.blocs[e._b];
  // Ouvrir le détail d'un exercice ne démarre rien : c'est une consultation,
  // pas un engagement. La séance démarre au premier geste qui compte
  // vraiment — valider une série — voir plus bas.

  // Exercice au temps : duree_s renseigné. Un nombre = durée à tenir (décompte),
  // 'max' = jusqu'à l'échec (le chrono monte).
  const auTemps = !!e.duree_s;
  const cible = auTemps && String(e.duree_s).toLowerCase() !== 'max' ? Number(e.duree_s) : 0;
  const N = b.exercices.length;

  let reps = Number(String(e.reps_cible).split('-')[0]) || 10;
  let charge = e.dernier ? e.dernier.charge : (e.charge_cible || (auTemps ? 0 : 20));
  let ecoule = 0, chrono = null, tourne = false;

  const L = $('#logger');
  L.classList.remove('hidden');
  L.innerHTML = `
    <div class="logger-col">
    <div class="top"><button class="close">← Retour</button>
      <span class="eyebrow">${e.groupe}</span></div>
    <h3>${e.nom}</h3>
    ${e.nom_en ? `<p class="vo">${e.nom_en}</p>` : ''}
    ${N > 1 ? `<span class="eyebrow">Bloc ${b.bloc} · exercice ${e._e + 1} sur ${N}</span>` : ''}
    ${e.video ? lecteur(e.video) : e.photo ? `<img class="illu" src="${e.photo}" alt="" loading="lazy">` : ''}
    ${e.note ? `<div class="note-coach grande"><span class="eyebrow">Note de ${S.moi.coach || 'votre coach'}</span>${e.note}</div>` : ''}
    <p class="consigne">${e.consigne || ''}</p>
    <div class="barre" style="margin-top:10px"><button class="btn ${enAttente(e.exercice_id) ? 'plein' : ''}" id="commenter" style="flex:1">Commentaires${
      enAttente(e.exercice_id) ? ' · ' + enAttente(e.exercice_id) + ' à lire' : ''}</button></div>
    ${e.cadence ? `<div class="tempo"><strong>Cadence ${e.cadence}</strong><br>${tempo(e.cadence)}
      ${courbeCadence(e.cadence, true)}</div>` : ''}
    <div class="sets" id="sets"></div>
    <div class="steppers">
      ${auTemps ? `
      <div class="stepper chrono"><div class="eyebrow">${cible ? 'À tenir' : 'Durée'}</div>
        <div class="val num" id="vChrono">${duree(cible || 0)}</div>
        <div class="row"><button id="go">Démarrer</button></div></div>` : `
      <div class="stepper"><div class="eyebrow">Répétitions</div>
        <div class="val num" id="vReps">${reps}</div>
        <div class="row"><button data-r="-1">−</button><button data-r="1">+</button></div></div>`}
      <div class="stepper"><div class="eyebrow">Charge (kg)</div>
        <div class="val num" id="vCharge">${charge}</div>
        <div class="row"><button data-c="-2.5">−</button><button data-c="2.5">+</button></div></div>
    </div>
    <div id="origine" class="origine"></div>
    <button class="valider">Valider la série ${faitsDe(e).length + 1}</button>
    <div class="barre"><button class="btn" id="finir" style="flex:1">Terminer cet exercice</button></div>
    </div>`;

  const maj = () => {
    // Le logger a pu être fermé ou remplacé pendant que le chrono tournait :
    // on arrête plutôt que d'écrire dans un DOM qui n'existe plus.
    const champ = auTemps ? $('#vChrono') : $('#vReps');
    if (!champ || L.classList.contains('hidden')) { clearInterval(chrono); chrono = null; return; }
    if (auTemps) {
      const reste = cible ? Math.max(0, cible - ecoule) : ecoule;
      champ.textContent = duree(reste);
      champ.classList.toggle('court', cible > 0 && tourne && reste <= 5);
    } else {
      champ.textContent = reps;
    }
    $('#vCharge').textContent = charge;
    majOrigine(e, charge);
    const btn = L.querySelector('.valider');
    const dejaFaites = faitsDe(e).length;
    const complet = dejaFaites >= e.series;
    const fige = !S.seanceId;
    btn.textContent = fige ? 'Démarrez la séance pour enregistrer'
      : complet ? `Les ${e.series} séries sont faites`
      : `Valider la série ${dejaFaites + 1}`;
    btn.disabled = fige || complet || (auTemps && ecoule === 0);
    const fin = L.querySelector('#finir');
    if (fin) fin.disabled = fige;
    $('#sets').innerHTML = faitsDe(e).map((x, n) =>
      `<span class="set">${n + 1} · ${x.duree_s ? duree(x.duree_s) : x.reps + ' × ' + x.charge + ' kg'}</span>`).join('');
  };
  maj();

  if (auTemps) {
    const go = L.querySelector('#go');
    const stop = (libelle) => { clearInterval(chrono); chrono = null; tourne = false; go.textContent = libelle; maj(); };
    go.onclick = () => {
      if (tourne) return stop('Reprendre');
      tourne = true; go.textContent = 'Arrêter'; maj();
      chrono = setInterval(() => {
        ecoule++;
        if (cible && ecoule >= cible) { ecoule = cible; bip(); stop('Terminé'); return; }
        maj();
      }, 1000);
    };
  } else {
    L.querySelectorAll('[data-r]').forEach(x => x.onclick = () => { reps = Math.max(1, reps + Number(x.dataset.r)); maj(); });
  }
  L.querySelectorAll('[data-c]').forEach(x => x.onclick = () => { charge = Math.max(0, charge + Number(x.dataset.c)); maj(); });
  L.querySelector('.close').onclick = () => { clearInterval(chrono); L.classList.add('hidden'); vueSeance(); };
  L.querySelector('#commenter').onclick = () => modalCommentaires(e.exercice_id, e.nom, null);

  const ouvert = x => S.finis.indexOf(x.ligne_id) === -1;

  /**
   * Après une série validée, deux minuteurs distincts :
   *  - il reste des exercices ouverts dans le bloc → PAUSE (pause_s), on enchaîne ;
   *  - le tour est bouclé → REPOS (repos_s), puis retour au premier encore ouvert.
   * `clos` force la sortie de l'exercice courant : le pratiquant l'a terminé de
   * lui-même, sans forcément avoir fait toutes ses séries.
   */
  const suite = (clos) => {
    const faits = faitsDe(e).length;
    const apres = b.exercices.slice(e._e + 1).filter(ouvert);

    if (N > 1 && apres.length) {
      return lancerMinuteur(e.pause_s, 'Pause', () => ouvrirLogger(apres[0]._i));
    }
    // Tour bouclé. Reste-t-il des tours à faire, sur des exercices encore ouverts ?
    const restants = b.exercices.filter(ouvert);
    if (!clos && faits < b.series && restants.length) {
      return lancerMinuteur(b.repos_s, 'Repos', () => {
        if (N > 1) ouvrirLogger(restants[0]._i);
      });
    }
    clearInterval(chrono);
    L.classList.add('hidden');
    vueSeance();
  };

  L.querySelector('#finir').onclick = async function () {
    this.disabled = true;
    clearInterval(chrono); chrono = null; tourne = false;
    if (!(await assurerSeanceActive())) { this.disabled = false; return; }
    try {
      await finirExercice(S.seanceId, e.ligne_id);
      if (ouvert(e)) S.finis.push(e.ligne_id);
      suite(true);
    } catch (err) { toast(err.message); this.disabled = false; }
  };

  L.querySelector('.valider').onclick = async function () {
    this.disabled = true;
    clearInterval(chrono); chrono = null; tourne = false;
    if (!(await assurerSeanceActive())) { this.disabled = false; return; }
    try {
      const num = faitsDe(e).length + 1;
      const p = { serie_num:num, charge };
      if (auTemps) p.duree_s = ecoule; else p.reps = reps;
      await enregistrerSerie(S.seanceId, e.exercice_id, e.ligne_id, p);
      (S.faits[e.ligne_id] = S.faits[e.ligne_id] || [])
        .push(auTemps ? { duree_s:ecoule, charge } : { reps, charge });
      if (auTemps) { ecoule = 0; const g = L.querySelector('#go'); if (g) g.textContent = 'Démarrer'; }
      maj();
      suite();
    } catch (err) {
      toast('Non enregistré : ' + err.message);
      this.disabled = false;
    }
  };
}

const PHASES = ['montée', 'position haute', 'descente', 'position basse'];

/** « 1-0-3-1 » → « 1 s montée · 0 s position haute · 3 s descente · 1 s position basse ». */
function tempo(c) {
  const p = cadence4(c);
  return p ? PHASES.map((l, i) => `${p[i]} s ${l}`).join(' · ') : '';
}

/**
 * Normalise une cadence saisie. Quatre chiffres collés suffisent — « 1320 »
 * devient « 1-3-2-0 » — parce que les tirets sont évidents et pénibles à taper
 * sur un clavier de téléphone. Un temps à deux chiffres, comme un maintien de
 * 10 secondes, demande les tirets : « 1-10-1-0 ».
 */
function normaliserCadence(v) {
  const t = String(v || '').trim();
  return /^\d{4}$/.test(t) ? t.split('').join('-') : t;
}

function cadence4(c) {
  const p = normaliserCadence(c).split('-').map(x => Number(x.trim()));
  return p.length === 4 && p.every(n => !isNaN(n) && n >= 0) ? p : null;
}

/**
 * Courbe du tempo : le temps en abscisse, la position de la charge en ordonnée.
 * Quatre phases dans l'ordre montée · position haute · descente · position basse.
 * La pente dit la vitesse, le plat dit l'arrêt.
 */
function courbeCadence(c, grand) {
  const p = cadence4(c);
  if (!p) return '';
  const total = p[0] + p[1] + p[2] + p[3];
  if (!total) return '';

  const W = grand ? 300 : 108, H = grand ? 62 : 28, m = grand ? 6 : 3;
  const x = t => m + (W - 2 * m) * (t / total);
  const haut = m, bas = H - m;

  let t = 0;
  const pts = [[x(0), bas]];
  t += p[0]; pts.push([x(t), haut]);   // montée
  t += p[1]; pts.push([x(t), haut]);   // maintien en haut
  t += p[2]; pts.push([x(t), bas]);    // descente
  t += p[3]; pts.push([x(t), bas]);    // maintien en bas

  return `<svg class="cad${grand ? ' grand' : ''}" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
      aria-label="Cadence ${c} : ${tempo(c)}">
    <line x1="${m}" y1="${haut}" x2="${W - m}" y2="${haut}" stroke="var(--edge)" stroke-width="1"/>
    <line x1="${m}" y1="${bas}" x2="${W - m}" y2="${bas}" stroke="var(--edge)" stroke-width="1"/>
    <polyline points="${pts.map(q => q.join(',')).join(' ')}" fill="none" stroke="var(--brand-ink)"
      stroke-width="${grand ? 2.5 : 2}" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

// ── Minuteurs : pause dans le bloc, repos de fin de tour ──────
// Anneau en SVG : le rayon fixe (22) donne une circonférence constante,
// dashoffset recalculé à chaque seconde pour vider l'anneau au fil du temps.
const REPOS_C = 2 * Math.PI * 22;

function lancerMinuteur(secondes, libelle, apres) {
  clearInterval(S.timer);
  const box = $('#repos');
  const total = Number(secondes) || 0;
  let t = total;
  const fin = () => { clearInterval(S.timer); box.classList.add('hidden'); if (apres) apres(); };
  if (t <= 0) return fin();   // pas de temps mort : on enchaîne directement

  box.classList.remove('hidden');
  const peindre = () => {
    const offset = REPOS_C * (1 - Math.max(0, t / total));
    box.innerHTML = `
      <span class="anneau"><svg width="52" height="52" viewBox="0 0 52 52">
        <circle cx="26" cy="26" r="22" fill="none" stroke="var(--sunk)" stroke-width="5"/>
        <circle cx="26" cy="26" r="22" fill="none" stroke="var(--brand-ink)" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="${REPOS_C}" stroke-dashoffset="${offset}"/>
      </svg></span>
      <span class="mid"><span class="eyebrow" style="color:var(--brand-ink)">${libelle}</span><br>
       <span class="t">${String(Math.floor(t / 60))}:${String(t % 60).padStart(2, '0')}</span></span>
      <button id="skip" aria-label="Passer">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="var(--chalk)"><path d="M4 5v14l10-7z"/><rect x="16" y="5" width="3" height="14"/></svg>
      </button>`;
    box.querySelector('#skip').onclick = fin;
  };
  peindre();
  S.timer = setInterval(() => {
    t--; peindre();
    // Le bip d'alerte prime s'il tombe sur les 3 dernières secondes : un seul
    // bip par tic, jamais les deux superposés.
    if (t === bipPremierSecondes() && bipPremierActif()) bip(660);
    else if (t > 0 && t <= 3 && bipDecompteActif()) bip();
    // Le dernier bip ne dit pas « encore une seconde » mais « c'est parti » :
    // plus aigu et deux fois plus long, il ne se confond pas avec le décompte.
    if (t <= 0) { bip(1175, .8); fin(); }
  }, 1000);
}

function bip(frequence, duree) {
  try {
    const d = duree || .4;
    const c = new (window.AudioContext || window.webkitAudioContext)();
    const o = c.createOscillator(), g = c.createGain();
    o.frequency.value = frequence || 880; o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(.25, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, c.currentTime + d);
    o.start(); o.stop(c.currentTime + d);
    // La vibration suit le son : 200 ms pour un bip court, le double pour le départ.
    if (navigator.vibrate) navigator.vibrate(Math.round(d * 500));
  } catch (e) {}
}

/**
 * Assiduité et régularité, rendues côté client.
 * Assiduité : combien. Régularité : à quel rythme. Quelqu'un qui fait huit
 * séances en dix jours puis rien pendant trois semaines est assidu et
 * irrégulier — et c'est la régularité qui prédit la progression.
 */
function blocStats(st) {
  if (!st || !st.total) return `<div class="empty">Pas encore assez de séances pour dire quoi que ce soit.</div>`;

  const max = Math.max(1, ...st.parSemaine.map(x => x.seances + x.activites));
  const barres = st.parSemaine.map((x, i) => `
    <div class="sem" title="semaine ${i + 1} : ${x.seances} séance(s), ${x.activites} activité(s)">
      <i class="s" style="height:${x.seances / max * 100}%"></i>
      <i class="a" style="height:${x.activites / max * 100}%"></i>
    </div>`).join('');

  const jugement = st.regularite === null ? ''
    : st.regularite >= 70 ? 'rythme tenu'
    : st.regularite >= 40 ? 'rythme irrégulier'
    : 'très irrégulier';

  return `
    <div class="card" style="display:block">
      <div class="eyebrow">Sur ${st.semaines} semaines</div>
      <div class="histo">${barres}</div>
      <div class="legende">
        <span><i class="pt-s"></i> séances du programme</span>
        <span><i class="pt-a"></i> activités libres</span>
      </div>
      <div class="stat" style="margin-top:14px">
        <div><b class="num">${st.parSemaineMoyen}</b><span>par semaine</span></div>
        <div><b class="num">${st.ecartMoyen || '—'}</b><span>jours d'écart</span></div>
        ${st.regularite !== null
          ? `<div><b class="num">${st.regularite}</b><span>régularité</span></div>` : ''}
      </div>
      ${st.regularite !== null ? `<div class="meta bas" style="margin-top:8px">${jugement}${
        st.ecartMax > st.ecartMoyen * 2 ? ` · plus longue coupure : ${st.ecartMax} jours` : ''}</div>` : ''}
    </div>

    ${st.nbComparees ? `<div class="card" style="display:block">
      <div class="eyebrow">Temps passé</div>
      <div class="stat" style="margin-top:10px">
        <div><b class="num">${st.dureeReelle}</b><span>min en vrai</span></div>
        <div><b class="num">${st.dureePrevue}</b><span>min prévues</span></div>
        <div><b class="num ${st.ecartDuree > 0 ? 'vif' : ''}">${st.ecartDuree > 0 ? '+' : ''}${st.ecartDuree} %</b><span>écart</span></div>
      </div>
      <div class="meta bas" style="margin-top:8px">${
        Math.abs(st.ecartDuree) <= 15 ? 'Les séances tiennent dans le temps prévu.'
        : st.ecartDuree > 0 ? 'Les séances débordent : repos trop courts sur le papier, ou temps perdu entre les exercices.'
        : 'Les séances vont plus vite que prévu : repos écourtés, ou séries non faites.'
      } Sur ${st.nbComparees} séance${st.nbComparees > 1 ? 's' : ''} close${st.nbComparees > 1 ? 's' : ''}.</div>
    </div>` : ''}`;
}

// ── Vue calendrier ───────────────────────────────────────────
const MOIS = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin',
              'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
const JOURSC = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];

const cleJour = d => d.getFullYear() + '-' +
  String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

/** Rang lundi=0 d'un libellé qui contient un jour — « Mercredi — Séance 2 » → 2. */
function rangJour(j) {
  const t = String(j).toLowerCase();
  for (let i = 0; i < SEMAINE.length; i++) if (t.indexOf(SEMAINE[i].toLowerCase()) !== -1) return i;
  return -1;
}

/**
 * « Mercredi — Séance 2 » → « Séance 2 ». Dans une case de calendrier large de
 * quelques dizaines de pixels, le jour est déjà donné par la colonne : le
 * répéter mangerait la seule place utile. Un libellé sans tiret est rendu tel
 * quel — c'est le coach qui nomme ses jours, on ne lui invente pas de nom.
 */
function nomCourt(libelle) {
  const t = String(libelle || '').trim();
  const i = t.search(/[—–-]/);
  const court = i !== -1 ? t.slice(i + 1).trim() : t;
  return court || t;
}

/**
 * Les planifications qui tombent une date donnée. Le récurrent mensuel en est
 * absent volontairement : son seul champ de jour est un jour de la SEMAINE, il
 * ne dit pas quelle semaine du mois — le placer sur une date serait inventer
 * une information que le pratiquant n'a jamais donnée. Il reste visible dans
 * la liste de gestion, comme dans le bandeau.
 */
function planifsDuJour(planifs, date) {
  return (planifs || []).filter(r => {
    if (r.recurrent) {
      if (r.frequence !== 'semaine') return false;
      if (rangJour(r.jour) !== (date.getDay() + 6) % 7) return false;
      if (r.date_debut && cleJour(date) < cleJour(new Date(r.date_debut))) return false;
      if (r.date_fin && cleJour(date) > cleJour(new Date(r.date_fin))) return false;
      return true;
    }
    return r.date && cleJour(new Date(r.date)) === cleJour(date);
  });
}

/**
 * Les séances du programme qui tombent une date, exceptions appliquées. Deux
 * apports distincts : celles **venues d'ailleurs** — déplacées sur cette date —
 * et celle du rythme natif, si le rang du jour correspond et que la date est
 * dans la fenêtre du programme.
 *
 * Une séance déplacée quitte son jour d'origine : elle n'y laisse rien, sinon
 * elle compterait deux fois.
 */
function previsionsDuJour(prev, date) {
  if (!prev || !prev.jours.length) return [];
  const cle = cleJour(date);
  const items = [];

  Object.values(prev.planning).forEach(x => {
    if (x.etat === 'deplacee' && x.date_cible === cle) {
      items.push({ nom: nomCourt(x.jour), coach: true, fait: false, heure: '',
                   prevu: { cle: x.cle, jour: x.jour, deplacee: true } });
    }
  });

  const dansLaFenetre = (!prev.debut || cle >= prev.debut) && (!prev.fin || cle <= prev.fin);
  if (dansLaFenetre) {
    const rang = (date.getDay() + 6) % 7;
    const jour = prev.jours.find(j => rangJour(j) === rang);
    if (jour) {
      const ex = prev.planning[cle];
      const parti = ex && (ex.etat === 'deplacee' || ex.etat === 'supprimee');
      if (!parti) {
        items.push({ nom: nomCourt(jour), coach: true, fait: false, heure: '',
                     annulee: !!(ex && ex.etat === 'annulee'),
                     prevu: { cle, jour, deplacee: false } });
      }
    }
  }
  return items;
}

/**
 * Ce qui tombe un jour donné, dans l'ordre où ça se lit : la séance du coach
 * d'abord — c'est elle qui structure la journée — puis le reste à l'heure de
 * début. Ce qui n'a pas d'heure passe en dernier plutôt que d'être placé au
 * hasard à minuit.
 */
function agendaDuJour(items) {
  return items.slice().sort((a, b) => {
    if (a.coach !== b.coach) return a.coach ? -1 : 1;
    const ha = a.heure || '', hb = b.heure || '';
    if (!ha !== !hb) return ha ? -1 : 1;
    return ha.localeCompare(hb);
  });
}

/** Les étiquettes d'une case, au plus trois puis un « +N » qui compte le reste. */
function etiquettes(items, max) {
  const tri = agendaDuJour(items);
  const n = max || 3;
  const vus = tri.slice(0, n).map(x => `<span class="eti${x.coach ? ' coach' : ''}${
    x.fait ? '' : ' prevu'}${x.annulee ? ' annulee' : ''}" title="${
    x.nom}${x.annulee ? ' — annulée' : ''}">${x.nom}</span>`).join('');
  return vus + (tri.length > n ? `<span class="eti plus">+${tri.length - n}</span>` : '');
}

async function peindreCalendrier() {
