// ── Minuteurs : pause dans le bloc, repos de fin de tour ──────
function lancerMinuteur(secondes, libelle, apres) {
  clearInterval(S.timer);
  const box = $('#repos');
  let t = Number(secondes) || 0;
  const fin = () => { clearInterval(S.timer); box.classList.add('hidden'); if (apres) apres(); };
  if (t <= 0) return fin();   // pas de temps mort : on enchaîne directement

  box.classList.remove('hidden');
  const peindre = () => {
    box.innerHTML =
      `<span><span class="eyebrow" style="color:rgba(255,255,255,.72)">${libelle}</span><br>
       <span class="t">${String(Math.floor(t / 60))}:${String(t % 60).padStart(2, '0')}</span></span>
       <button id="skip">Passer</button>`;
    box.querySelector('#skip').onclick = fin;
  };
  peindre();
  S.timer = setInterval(() => {
    t--; peindre();
    if (t <= 0) { bip(); fin(); }
  }, 1000);
}

function bip() {
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)();
    const o = c.createOscillator(), g = c.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(.25, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .4);
    o.start(); o.stop(c.currentTime + .4);
    if (navigator.vibrate) navigator.vibrate(200);
  } catch (e) {}
}

/**
 * Assiduité et régularité, rendues côté client.
 * Assiduité : combien. Régularité : à quel rythme. Quelqu'un qui fait huit
 * séances en dix jours puis rien pendant trois semaines est assidu et
 * irrégulier — et c'est la régularité qui prédit la progression.
 */
function blocStats(st) {
  if (!st || !st.total) return `<div class="empty">Pas encore assez de séances pour dire quoi que ce soit.</div>`;

  const max = Math.max(1, ...st.parSemaine.map(x => x.seances + x.activites));
  const barres = st.parSemaine.map((x, i) => `
    <div class="sem" title="semaine ${i + 1} : ${x.seances} séance(s), ${x.activites} activité(s)">
      <i class="s" style="height:${x.seances / max * 100}%"></i>
      <i class="a" style="height:${x.activites / max * 100}%"></i>
    </div>`).join('');

  const jugement = st.regularite === null ? ''
    : st.regularite >= 70 ? 'rythme tenu'
    : st.regularite >= 40 ? 'rythme irrégulier'
    : 'très irrégulier';

  return `
    <div class="card" style="display:block">
      <div class="eyebrow">Sur ${st.semaines} semaines</div>
      <div class="histo">${barres}</div>
      <div class="legende">
        <span><i class="pt-s"></i> séances du programme</span>
        <span><i class="pt-a"></i> activités libres</span>
      </div>
      <div class="stat" style="margin-top:14px">
        <div><b class="num">${st.parSemaineMoyen}</b><span>par semaine</span></div>
        <div><b class="num">${st.ecartMoyen || '—'}</b><span>jours d'écart</span></div>
        ${st.regularite !== null
          ? `<div><b class="num">${st.regularite}</b><span>régularité</span></div>` : ''}
      </div>
      ${st.regularite !== null ? `<div class="meta bas" style="margin-top:8px">${jugement}${
        st.ecartMax > st.ecartMoyen * 2 ? ` · plus longue coupure : ${st.ecartMax} jours` : ''}</div>` : ''}
    </div>

    ${st.nbComparees ? `<div class="card" style="display:block">
      <div class="eyebrow">Temps passé</div>
      <div class="stat" style="margin-top:10px">
        <div><b class="num">${st.dureeReelle}</b><span>min en vrai</span></div>
        <div><b class="num">${st.dureePrevue}</b><span>min prévues</span></div>
        <div><b class="num ${st.ecartDuree > 0 ? 'vif' : ''}">${st.ecartDuree > 0 ? '+' : ''}${st.ecartDuree} %</b><span>écart</span></div>
      </div>
      <div class="meta bas" style="margin-top:8px">${
        Math.abs(st.ecartDuree) <= 15 ? 'Les séances tiennent dans le temps prévu.'
        : st.ecartDuree > 0 ? 'Les séances débordent : repos trop courts sur le papier, ou temps perdu entre les exercices.'
        : 'Les séances vont plus vite que prévu : repos écourtés, ou séries non faites.'
      } Sur ${st.nbComparees} séance${st.nbComparees > 1 ? 's' : ''} close${st.nbComparees > 1 ? 's' : ''}.</div>
    </div>` : ''}`;
}

// ── Vue progrès ──────────────────────────────────────────────
async function vueProgres() {
  const app = $('#app');
  app.innerHTML = `<header><h2>Progrès</h2>
    <button class="quitter" id="quitter" >Se déconnecter</button></header>
    <div id="stats"></div><div id="liste"><div class="empty">Chargement…</div></div>`;

  lireVite('stats', {}, 'stats', d => { const z = $('#stats'); if (z) z.innerHTML = blocStats(d); })
    .then(d => { const z = $('#stats'); if (z) z.innerHTML = blocStats(d); })
    .catch(() => {});
  if (!S.exos.length && S.jour) await chargerSeance(S.jour);
  if (!S.exos.length) { $('#liste').innerHTML = `<div class="empty">Enregistrez une première séance pour voir vos courbes.</div>`; return; }

  // Un appel par exercice faisait six invocations pour six exercices.
  let histoires;
  try {
    histoires = await apiLot(S.exos.map(e => ({ action:'historique', payload:{ exercice_id:e.exercice_id } })));
  } catch (err) {
    $('#liste').innerHTML = `<div class="empty">${err.message}</div>`; return;
  }

  const blocs = S.exos.map((e, n) => {
    const h = histoires[n] || [];
    if (!h.length) return '';

    const max = Math.max(...h.map(x => x.charge));
    const pts = seriesParSeance(h);
    const evol = pts.length > 1 ? pts[pts.length - 1].kg - pts[0].kg : 0;

    return `<div class="card" style="display:block">
      <div class="nom">${e.nom}</div>
      <div class="meta">Record ${max} kg · ${h.length} série${h.length > 1 ? 's' : ''} enregistrée${h.length > 1 ? 's' : ''}${
        evol ? ` · <span style="color:var(--brand-ink)">${evol > 0 ? '+' : ''}${arrondi(evol)} kg</span> depuis le début` : ''}</div>
      ${courbeProgression(pts)}
      ${disques(max)}
      <div class="sets">${h.slice(0, 6).map(x =>
        `<span class="set">${x.duree_s ? duree(x.duree_s) : x.reps + ' × ' + x.charge + ' kg'}</span>`).join('')}</div>
    </div>`;
  });
  $('#liste').innerHTML = blocs.join('') || `<div class="empty">Rien à afficher pour l'instant.</div>`;
}

// ── Vue calendrier ───────────────────────────────────────────
const MOIS = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin',
              'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
const JOURSC = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];

const cleJour = d => d.getFullYear() + '-' +
  String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

async function vueCalendrier(email) {
  const cible = email || null;
  if (!S.cal || S.cal.email !== cible) {
    const d = new Date();
    S.cal = { email: cible, annee: d.getFullYear(), mois: d.getMonth(), seances: null, sel: null };
  }
  $('#app').innerHTML = `<header><h2>Calendrier</h2>
    <button class="quitter" id="quitter" >Se déconnecter</button></header><div id="calzone"></div>`;
  await peindreCalendrier();
}

/** Rend le calendrier dans #calzone. Les séances sont chargées une fois, sur un an. */
async function peindreCalendrier() {
  const z = $('#calzone');
  const c = S.cal;
  if (!c.seances) {
    z.innerHTML = `<div class="empty">Chargement…</div>`;
    const p = { depuis: new Date(Date.now() - 365 * 86400000).toISOString() };
    if (c.email) p.email = c.email;
    c.seances = await api('calendrier', p);
  }

  const parJour = {};
  c.seances.forEach(s => {
    const k = cleJour(new Date(s.date));
    (parJour[k] = parJour[k] || []).push(s);
  });

  const premier = new Date(c.annee, c.mois, 1);
  const decal = (premier.getDay() + 6) % 7;            // semaine commençant lundi
  const nb = new Date(c.annee, c.mois + 1, 0).getDate();
  const ajd = new Date().toDateString();

  let cases = JOURSC.map(j => `<div class="jc">${j}</div>`).join('');
  for (let i = 0; i < decal; i++) cases += `<div class="c vide"></div>`;
  for (let d = 1; d <= nb; d++) {
    const date = new Date(c.annee, c.mois, d);
    const k = cleJour(date);
    const duJour = parJour[k] || [];
    const seance = duJour.some(x => x.type !== 'activite');
    const libre = duJour.some(x => x.type === 'activite');
    // Séance du programme en aplat, activité libre en contour : le coach doit
    // distinguer d'un regard ce qu'il a prescrit de ce que le pratiquant a ajouté.
    const classe = seance ? 'faite' : libre ? 'libre' : '';
    cases += `<button class="c ${classe} ${date.toDateString() === ajd ? 'today' : ''}"
      data-j="${k}" aria-pressed="${c.sel === k}">${d}${
      duJour.length ? `<span class="pts">${seance ? '<i class="pt"></i>' : ''}${
        libre ? '<i class="pt libre"></i>' : ''}</span>` : ''}</button>`;
  }

  // Bilan du mois affiché
  const duMois = c.seances.filter(s => {
    const d = new Date(s.date);
    return d.getFullYear() === c.annee && d.getMonth() === c.mois;
  });
  const seancesMois = duMois.filter(s => s.type !== 'activite');
  const libresMois = duMois.filter(s => s.type === 'activite');
  const volume = duMois.reduce((t, s) => t + s.volume, 0);
  const minutes = duMois.reduce((t, s) => t + s.duree_min, 0);

  z.innerHTML = `
    <div class="mois">
      <button id="prec" aria-label="Mois précédent">‹</button>
      <h3>${MOIS[c.mois]} ${c.annee}</h3>
      <button id="suiv" aria-label="Mois suivant">›</button>
    </div>
    <div class="cal">${cases}</div>
    <div class="stat">
      <div><b class="num">${seancesMois.length}</b><span>séance${seancesMois.length > 1 ? 's' : ''}</span></div>
      ${libresMois.length ? `<div><b class="num">${libresMois.length}</b><span>activité${libresMois.length > 1 ? 's' : ''}</span></div>` : ''}
      <div><b class="num">${volume >= 1000 ? (volume / 1000).toFixed(1) + ' t' : volume + ' kg'}</b><span>volume</span></div>
      <div><b class="num">${minutes}</b><span>minutes</span></div>
    </div>
    <div id="detail"></div>`;

  $('#prec').onclick = () => { if (--c.mois < 0) { c.mois = 11; c.annee--; } c.sel = null; peindreCalendrier(); };
  $('#suiv').onclick = () => { if (++c.mois > 11) { c.mois = 0; c.annee++; } c.sel = null; peindreCalendrier(); };

  z.querySelectorAll('.c[data-j]').forEach(b => b.onclick = () => {
    c.sel = c.sel === b.dataset.j ? null : b.dataset.j;
    peindreCalendrier();
  });

  if (c.sel) {
    const ss = parJour[c.sel] || [];
    $('#detail').innerHTML = ss.length
      ? ss.map(s => s.type === 'activite'
        ? `<div class="card libre" style="display:block;margin-top:14px">
            <div class="entete" style="margin-bottom:4px">
              <span class="chip libre">Activité</span>
              <span class="meta" style="flex:1;text-align:right">${
                new Date(s.date).toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' })}</span>
            </div>
            <div class="nom">${s.sport}</div>
            <div class="sets">
              ${s.duree_min ? `<span class="set">${s.duree_min} min</span>` : ''}
              ${s.distance_km ? `<span class="set">${s.distance_km} km</span>` : ''}
              ${s.effort ? `<span class="set">effort ${s.effort}/10</span>` : ''}
            </div>
            ${s.notes ? `<p class="consigne" style="margin-top:10px">${s.notes}</p>` : ''}
          </div>`
        : `<div class="card" style="display:block;margin-top:14px">
            <div class="nom">${s.jour || 'Séance'}</div>
            <div class="meta">${new Date(s.date).toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' })}</div>
            <div class="sets">
              <span class="set">${s.nbSeries} série${s.nbSeries > 1 ? 's' : ''}</span>
              ${s.volume ? `<span class="set">${s.volume} kg soulevés</span>` : ''}
              ${s.duree_min ? `<span class="set">${s.duree_min} min</span>` : ''}
              ${s.ressenti ? `<span class="set">${s.ressenti}</span>` : ''}
            </div>
            ${s.notes ? `<p class="consigne" style="margin-top:10px">${s.notes}</p>` : ''}
          </div>`).join('')
      : `<div class="empty" style="padding:24px 0">Rien ce jour-là.</div>`;
  }
}

// ── Vue coach ────────────────────────────────────────────────
async function vueCoach() {
  S.coach = S.coach || { onglet:'athletes', email:null, nom:'', sous:'fiche', modele:null, categorie:null };
  const c = S.coach;
  const app = $('#app');

  if (c.modele) {
    app.innerHTML = `
      <header><h2>Modèle</h2><button class="close" id="retour">← ${c.categorie || 'Modèles'}</button></header>
      <div id="zone"><div class="empty">Chargement…</div></div>`;
    $('#retour').onclick = () => { c.modele = null; S.ed = null; vueCoach(); };
    return vueModele();
  }

  if (!c.email) {
    const titres = { athletes:'Athlètes', modeles:'Modèles', biblio:'Bibliothèque', reglages:'Réglages' };
    app.innerHTML = `
      <header>
        <div class="titre-bloc">
          <h2>${titres[c.onglet] || 'Coach'}</h2>
          ${S.moi.coach ? `<span class="signe">${S.moi.coach}</span>` : ''}
        </div>
        <button class="quitter" id="quitter" >Se déconnecter</button></header>
      <div id="zone"><div class="empty">Chargement…</div></div>`;
    if (c.onglet === 'biblio') return vueBibliotheque();
    if (c.onglet === 'modeles') return vueModeles();
    if (c.onglet === 'reglages') return vueReglages();
    return listeAthletes();
  }

  app.innerHTML = `
    <header><h2>${c.nom}</h2><button class="close" id="retour">← Athlètes</button></header>
    <div class="sous">
      <button data-s="fiche" aria-pressed="${c.sous === 'fiche'}">Fiche</button>
      <button data-s="programme" aria-pressed="${c.sous === 'programme'}">Programme</button>
      <button data-s="maxis" aria-pressed="${c.sous === 'maxis'}">Maxis</button>
      <button data-s="calendrier" aria-pressed="${c.sous === 'calendrier'}">Calendrier</button>
      <button data-s="historique" aria-pressed="${c.sous === 'historique'}">Historique</button>
    </div>
    <div id="zone"><div class="empty">Chargement…</div></div>`;

  $('#retour').onclick = () => { c.email = null; S.cal = null; S.attSel = null; S.ed = null; vueCoach(); };
  app.querySelectorAll('.sous button').forEach(b => b.onclick = () => {
    c.sous = b.dataset.s; vueCoach();
  });

  if (c.sous === 'fiche') return vueFiche();
  if (c.sous === 'programme') return vueProgramme();
  if (c.sous === 'maxis') return vueMaxis();
  if (c.sous === 'calendrier') {
    $('#zone').innerHTML = `<div id="calzone"></div>`;
    if (!S.cal || S.cal.email !== c.email) {
      const d = new Date();
      S.cal = { email: c.email, annee: d.getFullYear(), mois: d.getMonth(), seances: null, sel: null };
    }
    return peindreCalendrier();
  }
  return vueHistoriqueAthlete();
}

// ── Accueil du coach : ses athlètes ──────────────────────────
const ETATS = ['Nouveau', 'Actif', 'Inactif', 'Archivé'];

/** Téléphone en format international, seuls les chiffres et le +. */
function tel(n) {
  const t = String(n || '').replace(/[^\d+]/g, '');
  if (!t) return '';
  if (t.indexOf('+') === 0) return t;
  if (t.indexOf('0') === 0) return '+33' + t.slice(1);   // numéro français saisi en 0…
  return '+' + t;
}

async function listeAthletes() {
  let list;
  try { list = await lireVite('coachAthletes', {}, 'athletes',
    () => { if (S.vue === 'athletes' && S.coach && !S.coach.email) listeAthletes(); }); }
  catch (err) { $('#zone').innerHTML = `<div class="empty">${err.message}</div>`; return; }
  S.athletes = list;

  const nouveaux = list.filter(a => a.statut === 'Nouveau').length;

  $('#zone').innerHTML = `
    ${nouveaux ? `<div class="alerte">${nouveaux} pratiquant${nouveaux > 1 ? 's' : ''} sans programme${nouveaux > 1 ? '' : ''}</div>` : ''}
    <div class="barre" style="margin-top:0">
      <button class="btn plein" id="inscrire" style="flex:1">＋ Inscrire un pratiquant</button></div>
    <div style="margin-top:16px">${list.map(carteAthlete).join('') ||
      `<div class="empty">Aucun pratiquant inscrit.</div>`}</div>`;

  $('#inscrire').onclick = modalInscrire;

  // Les photos arrivent après : la liste s'affiche sans attendre quelques
  // centaines de kilo-octets d'images.
  if (S.photos) remplirPhotos();
  else api('photos').then(ph => { S.photos = ph; remplirPhotos(); }).catch(() => {});
  $('#zone').querySelectorAll('[data-email]').forEach(b => b.onclick = () => {
    S.coach.email = b.dataset.email;
    S.coach.nom = b.dataset.nom;
    S.coach.sous = 'fiche';
    S.cal = null; S.attSel = null; S.ed = null;
    vueCoach();
  });
}

/** Photo du pratiquant, ou ses initiales à défaut. */
function avatar(a, taille) {
  const c = taille === 'grand' ? 'avatar grand' : 'avatar';
  if (a.photo) return `<img class="${c}" src="${a.photo}" alt="">`;
  const ini = (a.nom || a.email || '?').split(/[\s.@_-]+/).filter(Boolean)
    .slice(0, 2).map(m => m[0].toUpperCase()).join('');
  return `<span class="${c} vide">${ini || '?'}</span>`;
}

/** Glisse les photos déjà chargées dans les pastilles de la liste. */
function remplirPhotos() {
  document.querySelectorAll('.athlete[data-email]').forEach(b => {
    const url = (S.photos || {})[b.dataset.email.toLowerCase()];
    const av = b.querySelector('.avatar');
    if (url && av && av.tagName !== 'IMG') {
      const img = document.createElement('img');
      img.className = 'avatar'; img.src = url; img.alt = '';
      av.replaceWith(img);
    }
  });
}

function carteAthlete(a) {
  const p = a.progression;
  const part = p ? Math.round(p.part * 100) : 0;
  const vu = a.joursDepuis === null ? 'jamais venu'
    : a.joursDepuis === 0 ? "vu aujourd'hui" : `vu il y a ${a.joursDepuis} j`;

  return `<button class="athlete" data-email="${a.email}" data-nom="${a.nom}">
    <div class="ath-tete">
      ${avatar(a)}
      <strong>${a.nom}</strong>
      ${a.commentaires ? `<span class="pastille-cm">${a.commentaires}</span>` : ''}
      <span class="chip ${a.statut.toLowerCase().replace('é','e')}">${a.statut}</span>
    </div>
    ${a.programme
      ? `<div class="meta">${a.programme.nom}${p && p.duree_semaines
            ? ` · semaine ${Math.min(p.semaine, p.duree_semaines)} sur ${p.duree_semaines}` : ''}</div>
         <div class="jauge" role="img" aria-label="${part} % du programme réalisé">
           <i style="width:${part}%"></i></div>
         <div class="meta bas">${p ? `${p.faites} séance${p.faites > 1 ? 's' : ''} sur ${p.attendues} attendue${p.attendues > 1 ? 's' : ''}` : ''} · ${vu}${
           a.programme.paye ? '' : ' · <span class="impaye">à encaisser</span>'}</div>`
      : `<div class="meta">Aucun programme attribué · ${vu}</div>`}
  </button>`;
}

/**
 * Prévenir un pratiquant qu'un programme lui est assigné.
 * Le texte est composé côté serveur puis modifiable ici. Trois canaux passent par
 * le téléphone — WhatsApp, SMS, client mail — et n'engagent aucun service tiers.
 * Le quatrième part directement du compte Google du coach.
 */
async function modalNotifier(attributionId, email) {
  let m;
  try {
    m = await api('messageType', { email: email, attribution_id: attributionId });
  } catch (err) {
    return toast(err.message === 'AUCUN_PROGRAMME' ? 'Aucun programme à annoncer' : err.message);
  }

  const t = tel(m.telephone);
  const w = modal('Prévenir ' + (m.nom || '').split(' ')[0], `
    <div class="champ"><label>Objet — pour l'e-mail</label>
      <input class="f" id="nObj" value="${m.objet}"></div>
    <div class="champ"><label>Message</label>
      <textarea class="f" id="nMsg" rows="10">${m.message}</textarea></div>
    <div class="eyebrow" style="margin:4px 0 8px">Ouvrir sur le téléphone</div>
    <div class="contacts">
      <a class="btn contact ${t ? '' : 'inerte'}" id="nWa" target="_blank" rel="noopener">WhatsApp</a>
      <a class="btn contact ${t ? '' : 'inerte'}" id="nSms">SMS</a>
      <a class="btn contact" id="nMail">Client mail</a>
    </div>
    ${t ? '' : `<p class="meta" style="margin-top:8px">Sans téléphone renseigné, seul l'e-mail est possible.</p>`}
    <div class="eyebrow" style="margin:18px 0 8px">Ou envoyer maintenant</div>
    <div class="barre" style="margin-top:0">
      <button class="btn plein" id="nEnvoi" style="flex:1">Envoyer l'e-mail depuis mon compte</button></div>
    <p class="consigne">Part de ${S.moi.email}, avec votre nom en expéditeur.
      Rien n'est envoyé tant que vous n'avez pas appuyé.</p>
    <div class="barre"><button class="btn" id="nAnn" style="flex:1">Fermer</button></div>`);

  // Les liens sont reconstruits à chaque frappe : le texte modifié doit suivre.
  const maj = () => {
    const txt = w.querySelector('#nMsg').value;
    const obj = w.querySelector('#nObj').value;
    if (t) {
      w.querySelector('#nWa').href = `https://wa.me/${t.replace('+','')}?text=${encodeURIComponent(txt)}`;
      // « ?& » : Android attend ?body=, iOS attend &body=. Cette forme convient aux deux.
      w.querySelector('#nSms').href = `sms:${t}?&body=${encodeURIComponent(txt)}`;
    }
    w.querySelector('#nMail').href =
      `mailto:${m.email}?subject=${encodeURIComponent(obj)}&body=${encodeURIComponent(txt)}`;
  };
  w.querySelector('#nMsg').oninput = maj;
  w.querySelector('#nObj').oninput = maj;
  maj();

  w.querySelector('#nAnn').onclick = w.fermer;
  w.querySelector('#nEnvoi').onclick = async function () {
    this.disabled = true; this.textContent = 'Envoi…';
    try {
      const r = await api('notifierMail', {
        email: m.email, objet: w.querySelector('#nObj').value, message: w.querySelector('#nMsg').value
      });
      w.fermer();

/**
 * Réduit la photo dans le navigateur avant de l'envoyer : carré de 256 px,
 * recadré au centre, en JPEG. Une cellule de Sheet ne prend que 50 000
 * caractères, et on ne veut pas alourdir la liste des athlètes.
 * La qualité baisse par paliers jusqu'à tenir dans le budget.
 */
function reduireImage(fichier, cote, budget) {
  return new Promise((ok, ko) => {
    const img = new Image();
    img.onload = () => {
      const c = Math.min(img.width, img.height);
      const cv = document.createElement('canvas');
      cv.width = cv.height = cote;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img, (img.width - c) / 2, (img.height - c) / 2, c, c, 0, 0, cote, cote);
      let q = 0.75, url = cv.toDataURL('image/jpeg', q);
      while (url.length > budget && q > 0.32) { q -= 0.1; url = cv.toDataURL('image/jpeg', q); }
      URL.revokeObjectURL(img.src);
      url.length > budget ? ko(new Error('IMAGE_TROP_LOURDE')) : ok(url);
    };
    img.onerror = () => ko(new Error('IMAGE_ILLISIBLE'));
    img.src = URL.createObjectURL(fichier);
  });
}

/**
 * Rend des lignes cliquables dans leur entier. On clique la ligne, pas une petite
 * icône : c'est plus sûr avec un pouce, et le crayon devient inutile.
 * Les boutons imbriqués — supprimer, monter, prévenir — gardent leur propre rôle.
 */
function lignesCliquables(zone, selecteur, action) {
  zone.querySelectorAll(selecteur).forEach(l => {
    l.classList.add('cliquable');
    l.onclick = ev => {
      if (ev.target.closest('button, a, input, label, select, textarea, [data-poignee]')) return;
      action(l);
    };
  });
}

/**
 * Glisser-déposer d'une liste verticale, au doigt comme à la souris.
 * Le glisser-déposer HTML5 n'existe pas au tactile : on passe par les événements
 * pointeur, qui couvrent les deux. La prise se fait sur une poignée dédiée —
 * attraper la ligne entière entrerait en conflit avec le défilement.
 *
 * L'élément est déplacé dans le DOM en direct ; `onFin` relit l'ordre obtenu.
 */
function triable(conteneur, selecteurItem, nomPoignee, onFin) {
  // La poignée porte le nom de ce qu'elle déplace. Sans ça, « .bloc [data-poignee] »
  // attrapait aussi les poignées des exercices qu'il contient, et le second appel
  // écrasait le premier : on croyait déplacer un exercice, on déplaçait son bloc.
  conteneur.querySelectorAll(`[data-poignee="${nomPoignee}"]`).forEach(poignee => {
    const item = poignee.closest(selecteurItem);
    if (!item) return;

    poignee.onpointerdown = ev => {
      ev.preventDefault();
      ev.stopPropagation();
      item.classList.add('deplace');
      if (navigator.vibrate) navigator.vibrate(12);

      // On écoute sur le document plutôt que de compter sur la capture de
      // pointeur : le doigt quitte vite la poignée, et setPointerCapture n'est
      // pas fiable partout. Le document, lui, voit tout.
      const bouger = e => {
        // L'élément suit le DOM, pas le doigt : il reste sous le pointeur et
        // masquerait ses voisins. On l'efface le temps de regarder dessous.
        item.style.pointerEvents = 'none';
        const sous = document.elementFromPoint(e.clientX, e.clientY);
        item.style.pointerEvents = '';
        const cible = sous && sous.closest(selecteurItem);
        if (!cible || cible === item || !conteneur.contains(cible)) return;
        const r = cible.getBoundingClientRect();
        const apres = e.clientY > r.top + r.height / 2;
        cible.parentNode.insertBefore(item, apres ? cible.nextSibling : cible);
      };

      const finir = () => {
        document.removeEventListener('pointermove', bouger);
        document.removeEventListener('pointerup', finir);
        document.removeEventListener('pointercancel', finir);
        item.classList.remove('deplace');
        item.style.pointerEvents = '';
        onFin();
      };

      document.addEventListener('pointermove', bouger);
      document.addEventListener('pointerup', finir);
      document.addEventListener('pointercancel', finir);
    };
  });
}

function modal(titre, corps) {
  const d = document.createElement('div');
  d.className = 'modal';
  d.innerHTML = `<div class="feuille"><h3>${titre}</h3>${corps}</div>`;
  document.body.appendChild(d);
  d.onclick = ev => { if (ev.target === d) d.remove(); };
  d.fermer = () => d.remove();
  return d;
}

/**
 * Relit l'ordre depuis le DOM après un déplacement, et le réinjecte dans S.ed.
 * On repart des identités : un bloc vidé disparaît, un bloc reste à sa place.
 */
function relireOrdre() {
  const z = $('#edit');
  const parUid = {};
  S.ed.blocs.forEach(b => {
    parUid[b._uid] = b;
    b.exercices.forEach(e => { parUid[e._uid] = e; });
  });

  S.ed.blocs = [...z.querySelectorAll('.bloc[data-buid]')].map(bd => {
    const b = parUid[bd.dataset.buid];
    b.exercices = [...bd.querySelectorAll('.ligne[data-uid]')]
      .map(l => parUid[l.dataset.uid]).filter(Boolean);
    return b;
  }).filter(Boolean);

  peindreEditeur();
}

  const z = $('#edit');
  if (!S.ed) { z.innerHTML = `<div class="empty">Aucun jour. Créez-en un pour composer le programme.</div>`; return; }
  const ed = S.ed;

  z.innerHTML = `
    <div class="eyebrow" style="margin:4px 0 12px">${ed.jour}${ed.neuf ? ' · nouveau' : ''}${
      dureeJour(ed.blocs) ? ' · environ ' + dureeJour(ed.blocs) + ' min' : ''}</div>
    ${ed.blocs.map((b, i) => `
      <div class="bloc" data-buid="${b._uid}">
        <div class="entete">
          <span class="poignee prise" data-poignee="bloc" title="Déplacer le bloc" aria-label="Déplacer le bloc ${i + 1}">⠿</span>
          <span class="eyebrow">Bloc ${i + 1}</span>
          <input class="f" style="width:58px;text-align:center;padding:8px 4px;min-height:38px"

          <input class="f" style="width:66px;text-align:center;padding:8px 4px;min-height:38px"
            type="number" min="0" step="5" data-b="${i}" data-k="repos_s" value="${b.repos_s}">
          <span style="font-size:12px;color:var(--dust)">s</span>
          <button class="poignee" data-delbloc="${i}" aria-label="Supprimer le bloc">✕</button>
        </div>
        ${b.exercices.map((e, j) => `
          <div class="ligne" data-ed="${i}.${j}" data-uid="${e._uid}">
            <span class="poignee prise" data-poignee="exercice" title="Déplacer" aria-label="Déplacer ${e.nom}">⠿</span>
            <div class="g">
              <div class="nom">${e.nom}</div>
              <div class="meta">${(e.duree_s ? duree(e.duree_s) : e.reps_cible) || '—'}${
                e.pct_rm ? ' · ' + e.pct_rm + ' % du max' : (e.charge_cible ? ' · ' + e.charge_cible + ' kg' : '')}${
                e.cadence ? ' · ' + e.cadence : ''}${
                j < b.exercices.length - 1 && e.pause_s ? ' · pause ' + e.pause_s + ' s' : ''}</div>
              ${e.note ? `<div class="note-coach">${e.note}</div>` : ''}
            </div>
            <button class="poignee" data-delexo="${i}.${j}" aria-label="Retirer ${e.nom}">✕</button>
          </div>`).join('') || `<div class="empty" style="padding:14px 0;font-size:14px">Bloc vide</div>`}
        <button class="btn" data-addexo="${i}" style="width:100%">＋ exercice</button>
      </div>`).join('')}
    <div class="barre">
      <button class="btn" id="addBloc">＋ bloc</button>
      <button class="btn plein" id="save" style="flex:1">Enregistrer</button>
    </div>
    ${ed.neuf ? '' : '<div class="barre"><button class="btn danger" id="delJour">Supprimer ce jour</button></div>'}`;

  z.querySelectorAll('input[data-b]').forEach(inp => inp.onchange = () => {
    ed.blocs[Number(inp.dataset.b)][inp.dataset.k] = Number(inp.value) || 0;
  });
  z.querySelectorAll('[data-delbloc]').forEach(b => b.onclick = () => {
    ed.blocs.splice(Number(b.dataset.delbloc), 1); peindreEditeur();
  });
  z.querySelectorAll('[data-delexo]').forEach(b => b.onclick = () => {
    const [i, j] = b.dataset.delexo.split('.').map(Number);
    ed.blocs[i].exercices.splice(j, 1); peindreEditeur();

  // Un exercice peut passer d'un bloc à l'autre : le conteneur est tout l'éditeur.

  triable(z, '.bloc[data-buid]', 'bloc', relireOrdre);

    const [i, j] = l.dataset.ed.split('.').map(Number);
    modalLigne(i, j);

  z.querySelectorAll('[data-addexo]').forEach(b => b.onclick = () => choisirExercice(Number(b.dataset.addexo)));

// ── Modèles génériques ───────────────────────────────────────
const DIFFICULTES = ['Débutant', 'Intermédiaire', 'Avancé', 'Challengeant'];
const SANS_CAT = 'Sans catégorie';
const SANS_DIF = 'Sans difficulté';

/** Ordre d'affichage des difficultés : celles qu'on connaît, puis les autres. */
function ordreDifficulte(d) {
  const i = DIFFICULTES.indexOf(d);
  return i === -1 ? (d === SANS_DIF ? 99 : 50) : i;
}

async function vueModeles() {
  S.modeles = await lireVite('modeles', {}, 'modeles',
    () => { if (S.vue === 'modeles' && S.coach && !S.coach.modele) vueModeles(); });
  return S.coach.categorie ? peindreCategorie() : peindreCategories();
}

/** Premier niveau : les catégories, en boutons. */
function peindreCategories() {
  const cats = {};
  S.modeles.forEach(m => {
    const c = (m.categorie || '').trim() || SANS_CAT;
    (cats[c] = cats[c] || []).push(m);
  });
  const noms = Object.keys(cats).sort((a, b) =>
    a === SANS_CAT ? 1 : b === SANS_CAT ? -1 : a.localeCompare(b, 'fr'));

  $('#zone').innerHTML = `
    <div class="barre" style="margin-top:0">
      <button class="btn plein" id="nm" style="flex:1">＋ Nouveau modèle</button></div>
    <p class="consigne" style="margin-top:12px">Un modèle est un programme générique, sans pratiquant.
      On le compose une fois, puis on le donne à qui l'on veut, autant de fois qu'on veut.</p>
    <div class="cats">${noms.map(c => `
      <button class="cat" data-cat="${c}">
        <span class="nom">${c}</span>
        <span class="compte num">${cats[c].length}</span>
      </button>`).join('') || `<div class="empty">Aucun modèle pour l'instant.</div>`}</div>`;

  $('#nm').onclick = () => modalModele(null);
  $('#zone').querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
    S.coach.categorie = b.dataset.cat;
    vueCoach();
  });
}

/** Second niveau : une catégorie, ses modèles pliés par difficulté, triés par nom. */
function peindreCategorie() {
  const cat = S.coach.categorie;
  const dedans = S.modeles.filter(m =>
    ((m.categorie || '').trim() || SANS_CAT) === cat);

  const parDif = {};
  dedans.forEach(m => {
    const d = (m.difficulte || '').trim() || SANS_DIF;
    (parDif[d] = parDif[d] || []).push(m);
  });
  const difs = Object.keys(parDif).sort((a, b) => ordreDifficulte(a) - ordreDifficulte(b));
  // Une seule section : la plier n'aurait aucun intérêt.
  const seule = difs.length === 1;

  $('#zone').innerHTML = `
    <div class="barre" style="margin-top:0">
      <button class="btn" id="retourCats">← Catégories</button>
      <button class="btn plein" id="nm" style="flex:1">＋ Nouveau modèle</button></div>
    <div style="margin-top:18px">${difs.map(d => `
      <details class="pli" ${seule ? 'open' : ''}>
        <summary>
          <span class="eyebrow">${d}</span>
          <span class="compte num">${parDif[d].length}</span>
        </summary>
        ${parDif[d].sort((a, b) => a.nom.localeCompare(b.nom, 'fr')).map(m => `
          <div class="ligne" data-md="${m.id}">
            <div class="g">
              <div class="nom">${m.nom}</div>
              <div class="meta">${[
                m.duree_semaines ? m.duree_semaines + ' semaines' : '',
                m.nbJours + ' jour' + (m.nbJours > 1 ? 's' : ''),
                m.nbExercices + ' exercices'].filter(Boolean).join(' · ')}</div>
            </div>
            ${m.video ? '<span class="poignee lien" title="Vidéo">▶</span>' : ''}
            ${m.source ? '<span class="poignee lien" title="Source documentée">↗</span>' : ''}
            <span class="tag ${m.statut === 'Brouillon' ? 'warn' : ''}">${m.statut}</span>
          </div>`).join('')}
      </details>`).join('') || `<div class="empty">Aucun modèle dans cette catégorie.</div>`}</div>`;

  $('#retourCats').onclick = () => { S.coach.categorie = null; vueCoach(); };
  $('#nm').onclick = () => modalModele(null);
  $('#zone').querySelectorAll('[data-md]').forEach(l =>
    l.onclick = () => { S.coach.modele = l.dataset.md; S.ed = null; vueCoach(); });
}

/**
 * Encart vidéo. YouTube et Vimeo sont intégrés dans un lecteur ; toute autre
 * adresse devient un simple lien — intégrer n'importe quelle URL dans une iframe
 * exposerait l'app à ce que sert la page.
 */
function lecteur(url) {
  if (!url) return '';
  const yt = /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/.exec(url);
  const vi = /vimeo\.com\/(?:video\/)?(\d+)/.exec(url);
  const src = yt ? `https://www.youtube-nocookie.com/embed/${yt[1]}`
            : vi ? `https://player.vimeo.com/video/${vi[1]}` : null;
  if (!src) return `<div class="barre"><a class="btn contact" href="${url}" target="_blank" rel="noopener">Voir la vidéo ↗</a></div>`;
  return `<div class="video"><iframe src="${src}" title="Vidéo du programme"
    loading="lazy" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
}

/** Écran d'un modèle : sa fiche, puis le même éditeur de jours que pour un pratiquant. */
async function vueModele() {
  const demandes = [{ action:'modele', payload:{ id:S.coach.modele } }];
  if (!S.cat) demandes.push({ action:'catalogue' });   // le sélecteur d'exercices s'en sert
  const [m, cat] = await apiLot(demandes);
  S.modele = m;
  if (cat) S.cat = cat;
  const jours = m.jours.map(j => j.jour);

  if (!S.ed || S.ed.cible !== 'modele' || S.ed.modele_id !== m.id ||
      (!S.ed.neuf && jours.indexOf(S.ed.jour) === -1)) {
    S.ed = null;
    if (jours.length) chargerJour(jours[0]);
  }

  $('#zone').innerHTML = `
    <div class="card" style="display:block;margin-bottom:16px">
      <div class="nom">${m.nom}</div>
      <div class="meta">${[m.categorie, m.difficulte,
        m.duree_semaines ? m.duree_semaines + ' semaines' : '', m.statut].filter(Boolean).join(' · ')}</div>
      ${m.description ? `<p class="consigne" style="margin-top:8px">${m.description}</p>` : ''}
      ${lecteur(m.video)}
      <div class="barre">
        <button class="btn" id="editMeta">Modifier la fiche</button>
        ${m.source ? `<a class="btn contact" href="${m.source}" target="_blank" rel="noopener">Source ↗</a>` : ''}
      </div>
    </div>
    <div class="days" id="jours">
      ${jours.map(j => `<button class="day" data-j="${j}" aria-pressed="${S.ed && S.ed.jour === j}">${j}</button>`).join('')}
      <button class="day" id="addJour">＋ jour</button>
    </div>
    <div id="edit"></div>`;

  $('#editMeta').onclick = () => modalModele(m);
  $('#zone').querySelectorAll('.day[data-j]').forEach(b =>
    b.onclick = () => { chargerJour(b.dataset.j); vueModele(); });
  $('#addJour').onclick = modalNouveauJour;
  peindreEditeur();
}

// ── Programme d'un pratiquant ────────────────────────────────
async function vueProgramme() {
  // Un seul aller-retour : la liste des attributions, le catalogue si on ne
  // l'a pas encore, et le contenu de l'attribution en cours.
  const demandes = [{ action:'attributions', payload:{ email:S.coach.email } }];
  if (!S.cat) demandes.push({ action:'catalogue' });
  demandes.push({ action:'programme', payload:{ email:S.coach.email, attribution_id:S.attSel || undefined } });

  let reponses;
  try { reponses = await apiLot(demandes); }
  catch (err) { $('#zone').innerHTML = `<div class="empty">${err.message}</div>`; return; }

  const atts = reponses[0];
  if (!S.cat) S.cat = reponses[1];
  let prog = reponses[reponses.length - 1];

  S.atts = atts;
  if (!S.attSel || !atts.some(a => a.id === S.attSel)) {
    const active = atts.find(a => a.statut === 'En cours');
    S.attSel = (active || atts[0] || {}).id || null;
    // L'attribution visée a changé en cours de route : on va rechercher la bonne.
    if (S.attSel && (!prog.attribution || prog.attribution.id !== S.attSel)) {
      prog = await api('programme', { email:S.coach.email, attribution_id:S.attSel });
    }
  }

  if (!S.attSel) {
    $('#zone').innerHTML = `
      <div class="empty">Aucun programme attribué.<br>Donnez-lui un modèle, ou partez d'une page blanche.</div>
      <div class="barre"><button class="btn plein" id="donner" style="flex:1">Donner un programme</button></div>`;
    $('#donner').onclick = modalAttribuer;
    return;
  }

  S.prog = prog;
  const att = S.atts.find(a => a.id === S.attSel);
  const jours = prog.jours.map(j => j.jour);

  if (!S.ed || S.ed.cible !== 'programme' || S.ed.attribution_id !== S.attSel ||
      (!S.ed.neuf && jours.indexOf(S.ed.jour) === -1)) {
    S.ed = null;
    if (jours.length) chargerJour(jours[0]);
  }

  const debut = att.date_debut ? new Date(att.date_debut).toLocaleDateString('fr-FR') : '';
  $('#zone').innerHTML = `
    <div class="champ">
      <label>Programme attribué</label>
      <select class="f" id="selAtt">${S.atts.map(a => `<option value="${a.id}" ${a.id === S.attSel ? 'selected' : ''}>
        ${a.nom} · ${a.statut}${a.date_debut ? ' · depuis le ' + new Date(a.date_debut).toLocaleDateString('fr-FR') : ''}</option>`).join('')}</select>
    </div>
    <div class="meta" style="color:var(--dust);font-size:12.5px;margin:-2px 0 12px">
      ${att.nbJours} jour${att.nbJours > 1 ? 's' : ''} · ${att.nbExercices} exercices${debut ? ' · démarré le ' + debut : ''}${
      att.modele_id ? ' · issu d\'un modèle' : ' · sur mesure'}</div>
    <div class="barre" style="margin-top:0">
      <button class="btn plein" id="donner">Donner un programme</button>
      <button class="btn" id="prevenir">Prévenir</button>
      ${att.statut === 'En cours' ? '<button class="btn" id="clore">Clore</button>' : ''}
      <button class="btn danger" id="supprAtt">Supprimer</button>
    </div>
    <div class="days" id="jours" style="margin-top:16px">
      ${jours.map(j => `<button class="day" data-j="${j}" aria-pressed="${S.ed && S.ed.jour === j}">${j}</button>`).join('')}
      <button class="day" id="addJour">＋ jour</button>
    </div>
    <div id="edit"></div>`;

  $('#selAtt').onchange = e => { S.attSel = e.target.value; S.ed = null; vueProgramme(); };
  $('#donner').onclick = modalAttribuer;
  $('#prevenir').onclick = () => modalNotifier(S.attSel, S.coach.email);
  $('#addJour').onclick = modalNouveauJour;
  $('#zone').querySelectorAll('.day[data-j]').forEach(b =>
    b.onclick = () => { chargerJour(b.dataset.j); vueProgramme(); });

  const cl = $('#clore');
  if (cl) cl.onclick = async function () {
    this.disabled = true;
    try {
      await api('attributionMaj', { id: S.attSel, statut: 'Terminé', date_fin: new Date().toISOString() });
      toast('Programme clos'); vueProgramme();
    } catch (err) { toast(err.message); this.disabled = false; }
  };
  $('#supprAtt').onclick = async function () {
    this.disabled = true;
    try {
      await api('attributionSuppr', { id: S.attSel });
      toast('Attribution supprimée'); S.attSel = null; S.ed = null; vueProgramme();
    } catch (err) { toast(err.message); this.disabled = false; }
  };

  peindreEditeur();
}

/** Donner un programme : depuis un modèle, ou vierge pour du sur-mesure. */
async function modalAttribuer() {
  const mods = await api('modeles');
  const cats = [...new Set(mods.map(m => (m.categorie || '').trim()).filter(Boolean))].sort();
  const difs = [...new Set(mods.map(m => (m.difficulte || '').trim()).filter(Boolean))]
    .sort((a, b) => ordreDifficulte(a) - ordreDifficulte(b));

  const w = modal('Donner un programme', `
    <div class="duo">
      <div class="champ"><label>Catégorie</label>
        <select class="f" id="fCat"><option value="">Toutes</option>
          ${cats.map(c => `<option>${c}</option>`).join('')}</select></div>
      <div class="champ"><label>Difficulté</label>
        <select class="f" id="fDif"><option value="">Toutes</option>
          ${difs.map(d => `<option>${d}</option>`).join('')}</select></div>
    </div>
    <div class="champ"><label>Modèle de départ · <span id="fCompte">${mods.length}</span></label>
      <select class="f" id="aMod" size="7">
        <option value="">— Sur mesure, page blanche —</option>
      </select></div>
    <div class="champ"><label>Nom donné au pratiquant</label>
      <input class="f" id="aNom" placeholder="Laisser vide pour reprendre le nom du modèle"></div>
    <div class="champ"><label>Date de début</label>
      <input class="f" id="aDeb" type="date" value="${new Date().toISOString().slice(0, 10)}"></div>
    <p class="consigne">Le contenu du modèle est <strong>copié</strong> : le personnaliser ensuite
      ne touche pas le modèle, et le programme en cours est clos automatiquement.</p>
    <div class="barre"><button class="btn" id="aAnn">Annuler</button>
      <button class="btn plein" id="aOk" style="flex:1">Attribuer</button></div>`);

  // Les deux filtres sont facultatifs et se combinent.
  const filtrer = () => {
    const c = w.querySelector('#fCat').value, d = w.querySelector('#fDif').value;
    const vus = mods.filter(m => (!c || (m.categorie || '').trim() === c)
                              && (!d || (m.difficulte || '').trim() === d))
                    .sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
    w.querySelector('#fCompte').textContent = vus.length;
    w.querySelector('#aMod').innerHTML = `<option value="">— Sur mesure, page blanche —</option>` +
      vus.map(m => `<option value="${m.id}">${m.nom}${
        m.duree_semaines ? ' · ' + m.duree_semaines + ' sem.' : ''} · ${m.nbJours} j</option>`).join('');
  };
  w.querySelector('#fCat').onchange = filtrer;
  w.querySelector('#fDif').onchange = filtrer;
  filtrer();

  w.querySelector('#aAnn').onclick = w.fermer;
  w.querySelector('#aOk').onclick = async function () {
    this.disabled = true;
    try {
      const r = await api('attribuer', {
        email: S.coach.email,
        modele_id: w.querySelector('#aMod').value || undefined,
        nom: w.querySelector('#aNom').value,
        date_debut: w.querySelector('#aDeb').value
      });
      w.fermer();
      toast(r.lignes ? `${r.nom} attribué, ${r.lignes} lignes copiées` : `${r.nom} attribué`);
      S.attSel = r.id; S.ed = null;
      await vueProgramme();
      modalNotifier(r.id, S.coach.email);   // enchaîner : un programme donné s'annonce
    } catch (err) { toast(err.message); this.disabled = false; }
  };
}

// ── Éditeur de jour, commun aux modèles et aux programmes ─────
/** Chaque bloc et chaque exercice reçoit une identité, seule façon de relire
 *  l'ordre après un déplacement : la position ne peut pas servir de clé. */
let _uid = 0;
function marquer(blocs) {
  blocs.forEach(b => {
    if (!b._uid) b._uid = 'b' + (++_uid);
    b.exercices.forEach(e => { if (!e._uid) e._uid = 'e' + (++_uid); });
  });
  return blocs;
}

function chargerJour(jour) {
  const modele = !!S.coach.modele;
  const src = modele ? S.modele : S.prog;
  const j = ((src && src.jours) || []).find(x => x.jour === jour);
  S.ed = {
    cible: modele ? 'modele' : 'programme',
    modele_id: modele ? S.coach.modele : null,
    email: modele ? null : S.coach.email,
    attribution_id: modele ? null : S.attSel,
    jour: jour,
    neuf: !j,
    blocs: marquer(j ? JSON.parse(JSON.stringify(j.blocs)) : [])
  };
}

function modalNouveauJour() {
  const w = modal('Nouveau jour', `
    <div class="champ"><label>Intitulé</label>
      <input class="f" id="nj" placeholder="Lundi — Haut du corps" list="lj">
      <datalist id="lj">${SEMAINE.map(j => `<option>${j} — </option>`).join('')}</datalist></div>
    <p class="consigne">Le jour de la semaine doit apparaître dans l'intitulé : c'est lui qui donne l'ordre d'affichage.</p>
    <div class="barre"><button class="btn" id="njAnn">Annuler</button>
      <button class="btn plein" id="njOk" style="flex:1">Créer</button></div>`);
  w.querySelector('#njAnn').onclick = w.fermer;
  w.querySelector('#njOk').onclick = () => {
    const v = w.querySelector('#nj').value.trim();
    if (!v) return toast('Donnez un intitulé');
    chargerJour(v);
    S.ed.neuf = true; S.ed.blocs = [];
    w.fermer();
    document.querySelectorAll('.day[data-j]').forEach(b => b.setAttribute('aria-pressed', 'false'));
    peindreEditeur();
  };
}

async function enregistrerJour() {
  const ed = S.ed;
  const btn = $('#save');
  if (!ed.blocs.length || ed.blocs.every(b => !b.exercices.length))
    return toast('Ajoutez au moins un exercice');
  btn.disabled = true;
  const blocs = ed.blocs.filter(b => b.exercices.length);
  try {
    if (ed.cible === 'modele') {
      await api('modeleJourSave', { modele_id: ed.modele_id, jour: ed.jour, blocs });
      toast('Jour enregistré'); S.ed = null; vueModele();
    } else {
      await api('programmeSave', { email: ed.email, attribution_id: ed.attribution_id, jour: ed.jour, blocs });
      toast('Jour enregistré'); S.ed = null; vueProgramme();
    }
  } catch (err) { toast(err.message); btn.disabled = false; }
}

async function supprimerJour(btn) {
  const ed = S.ed;
  btn.disabled = true;
  try {
    if (ed.cible === 'modele') {
      await api('modeleJour', { modele_id: ed.modele_id, jour: ed.jour });
      toast('Jour supprimé'); S.ed = null; vueModele();
    } else {
      await api('programmeJour', { attribution_id: ed.attribution_id, jour: ed.jour });
      toast('Jour supprimé'); S.ed = null; vueProgramme();
    }
  } catch (err) { toast(err.message); btn.disabled = false; }
}

// ── Service worker (mode hors ligne) ─────────────────────────
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
