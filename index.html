<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151515">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coaching Fitness">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="favicon.ico" sizes="any">
<title>Coaching Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Charte Wellness Sport Club — relevée sur wellness-sportclub.fr */
  --iron:#151515; --plate:#1E1E1E; --edge:#2E2E2E;
  --chalk:#F4F4F4; --dust:#9A9A9A;
  /* --brand : aplats uniquement (blanc dessus = 7,4:1).
     --brand-ink : version éclaircie, seule lisible en texte sur fond sombre (4,8:1).
     Le rouge officiel #A61E1F ne plafonne qu'à 2,4:1 sur le fond : jamais en texte. */
  --brand:#A61E1F; --brand-ink:#E05253; --on-brand:#FFFFFF;
  --p25:#D32F2F; --p20:#1E6FD9; --p15:#F5B700; --p10:#3F9E4D; --p5:#E8EAEE; --p2:#9AA3B0;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--iron); color:var(--chalk);
  font-family:'Jost',system-ui,sans-serif; font-size:16px;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overscroll-behavior-y:contain;
}
h1,h2,h3,.num{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;letter-spacing:.01em;margin:0}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 96px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dust);font-weight:600}
button{font-family:inherit;font-size:16px;border:0;cursor:pointer;color:inherit;background:none}
.hidden{display:none!important}

/* Connexion */
#login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:28px;padding:32px;text-align:center}
#login h1{font-size:clamp(52px,17vw,84px);line-height:.88;text-transform:uppercase}
#marque{width:min(112px,26vw);height:auto}
#login h1 span{display:block;color:var(--brand-ink)}
#login p{color:var(--dust);max-width:32ch;margin:0;line-height:1.5}

/* En-tête */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px;flex-wrap:wrap}
header h2{flex:1}
/* Catégories de modèles : de grandes cibles, une par ligne */
.cats{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.cat{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;
  background:var(--plate);border:1px solid var(--edge);border-radius:var(--r)}
.cat .nom{flex:1;font-size:17px;font-weight:600}
.cat .compte{font-family:'Bebas Neue',Impact,sans-serif;font-size:22px;color:var(--brand-ink)}

/* Sections pliées par difficulté */
.pli{border-bottom:1px solid var(--edge);margin-bottom:2px}
.pli summary{display:flex;align-items:center;gap:10px;padding:14px 2px;cursor:pointer;
  list-style:none}
.pli summary::-webkit-details-marker{display:none}
.pli summary::after{content:'▾';color:var(--dust);font-size:13px;transition:transform .2s}
.pli[open] summary::after{transform:rotate(180deg)}
.pli summary .eyebrow{flex:1}
.pli summary .compte{font-size:13px;color:var(--dust);font-variant-numeric:tabular-nums}
.pli summary:focus-visible{outline:2px solid var(--brand-ink);outline-offset:2px;border-radius:6px}
.pli .ligne{cursor:pointer}
.pli > .ligne:last-child{margin-bottom:14px}

.titre-bloc{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.titre-bloc h2{flex:none}
.signe{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dust);font-weight:600}
header h2{font-size:30px;text-transform:uppercase;line-height:1}
.streak{font-size:13px;color:var(--dust);font-variant-numeric:tabular-nums}
#reseau{position:fixed;left:0;right:0;bottom:calc(53px + env(safe-area-inset-bottom));
  background:#2A2A2A;border-top:1px solid var(--edge);color:var(--chalk);font-size:12.5px;
  padding:10px 16px;display:flex;align-items:center;gap:9px;z-index:15;cursor:pointer}
#reseau .pastille{width:7px;height:7px;border-radius:50%;background:var(--brand-ink);
  flex:0 0 auto;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.quitter{font-size:11.5px;font-weight:600;color:var(--dust);border:1px solid var(--edge);
  border-radius:999px;padding:7px 11px;background:var(--plate);white-space:nowrap;flex:0 0 auto}

/* Calendrier */
.mois{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.mois h3{font-size:24px;text-transform:uppercase}
.mois button{width:40px;height:40px;border-radius:10px;background:var(--plate);
  border:1px solid var(--edge);font-size:18px;color:var(--dust)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .jc{font-size:10px;letter-spacing:.1em;color:var(--dust);text-align:center;padding-bottom:4px;font-weight:600}
.cal .c{aspect-ratio:1;border-radius:9px;background:var(--plate);border:1px solid var(--edge);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:13px;font-variant-numeric:tabular-nums;color:var(--dust);padding:0}
.cal .c.vide{background:none;border-color:transparent}
.cal .c.today{border-color:var(--dust)}
.cal .c.faite{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:700}
.card.clos .nom{color:var(--dust)}
.card.clos{display:flex;align-items:center;gap:12px}
.card.clos .body{opacity:.72;flex:1;min-width:0;cursor:pointer}
.reprendre{font-size:17px;line-height:1;flex:0 0 auto}
.cal .c[aria-pressed="true"]{outline:2px solid var(--brand-ink);outline-offset:1px}
.cal .c .pts{display:flex;gap:3px}
.cal .c .pt{width:4px;height:4px;border-radius:50%;background:var(--on-brand)}
.cal .c .pt.libre{background:var(--brand-ink)}
.cal .c.libre{border-color:var(--brand);color:var(--chalk)}
.cal .c.libre .pt.libre{background:var(--brand-ink)}
.card.libre{border-left:3px solid var(--brand-ink)}
.chip.libre{background:rgba(224,82,83,.15);color:var(--brand-ink)}
.legende{font-size:12px;color:var(--dust);margin:12px 0 4px;display:flex;gap:14px;flex-wrap:wrap}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
/* Un bâton par semaine : séances du programme et activités libres empilées */
.histo{display:flex;align-items:flex-end;gap:3px;height:56px;margin:12px 0 8px}
.sem{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:1px}
.sem i{display:block;width:100%;border-radius:2px 2px 0 0;min-height:0}
.sem .s{background:var(--brand)}
.sem .a{background:var(--brand-ink);opacity:.45;border-radius:0 0 2px 2px}
.histo + .legende{display:flex;gap:16px;font-size:11.5px;flex-wrap:wrap;margin-top:0}
.legende i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.legende .pt-s{background:var(--brand)}
.legende .pt-a{background:var(--brand-ink);opacity:.45}
.num.vif{color:var(--brand-ink)}
.stat b{font-family:'Bebas Neue',Impact,sans-serif;font-size:26px;font-weight:400;display:block;line-height:1}
.stat span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dust)}

/* Sous-navigation coach */
.sous{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;scrollbar-width:none}
.sous button{flex:0 0 auto;padding:9px 15px;border-radius:999px;background:var(--plate);
  border:1px solid var(--edge);font-size:14px;font-weight:600;color:var(--dust)}
.sous button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

/* Formulaires d'édition */
.f{width:100%;background:#2A2A2A;border:1px solid var(--edge);border-radius:9px;color:var(--chalk);
  font-family:inherit;font-size:15px;padding:11px 12px;min-height:44px}
.f:focus{outline:2px solid var(--brand-ink);outline-offset:1px}
.champ{margin-bottom:10px}
.champ label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dust);font-weight:600;margin-bottom:5px}
.duo{display:flex;gap:10px}
.duo>*{flex:1}
.btn{min-height:46px;padding:0 16px;border-radius:10px;background:var(--plate);border:1px solid var(--edge);
  font-weight:600;font-size:15px;color:var(--chalk)}
.btn.plein{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.danger{color:var(--brand-ink)}
.barre{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.ligne{display:flex;align-items:center;gap:10px;background:var(--plate);border:1px solid var(--edge);
  border-radius:10px;padding:11px 12px;margin-bottom:8px}
.ligne .g{flex:1;min-width:0}
.ligne .g .nom{font-size:15px;font-weight:600}
.ligne .g .meta{font-size:12.5px;color:var(--dust);margin-top:2px}
.ligne .poignee{color:var(--dust);font-size:18px;padding:8px 6px}
.ligne.cliquable{cursor:pointer}
/* La prise doit être une cible franche, et ne pas déclencher le défilement */
.prise{touch-action:none;cursor:grab;user-select:none;letter-spacing:-2px;
  font-size:17px;color:var(--dust);flex:0 0 auto;padding:8px 6px;line-height:1}
.prise:active{cursor:grabbing;color:var(--brand-ink)}
.deplace{opacity:.55;outline:2px dashed var(--brand-ink);outline-offset:2px;border-radius:10px}
.bloc.deplace{background:#1F1F1F}
.ligne.cliquable:active{background:#262626}
.entete{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.entete .eyebrow{flex:1}

/* Fenêtre modale */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:flex;
  align-items:flex-end;justify-content:center}
.modal .feuille{background:var(--iron);border-top-left-radius:18px;border-top-right-radius:18px;
  width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;padding:18px 18px 28px;
  border-top:1px solid var(--edge)}
.modal h3{margin-bottom:14px}
.recherche{position:sticky;top:0;background:var(--iron);padding-bottom:10px;z-index:1}

/* Bloc : plusieurs exercices enchaînés, un seul repos à la fin du tour */
.bloc{border-left:3px solid var(--brand);padding-left:12px;margin-bottom:14px}
.bloc-tete{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.bloc-info{font-size:12px;color:var(--dust);font-variant-numeric:tabular-nums;white-space:nowrap}
.bloc .card{margin-bottom:8px}
.bloc .card:last-child{margin-bottom:0}
.pause{font-size:12px;color:var(--dust);padding:1px 0 9px 3px;font-variant-numeric:tabular-nums}
.cadence{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.09em;padding:3px 7px;
  border-radius:5px;background:#2A2A2A;color:var(--dust);font-variant-numeric:tabular-nums}
.cadbloc{display:flex;align-items:center;gap:10px;margin-top:8px}
.cad{display:block;overflow:visible}
.cad.grand{margin-top:10px;max-width:100%;height:auto}
.prog{display:block;width:100%;height:auto;max-width:340px;margin:10px 0 4px}
.vignette{width:52px;height:52px;object-fit:cover;border-radius:9px;background:#2A2A2A;flex:0 0 auto}
.vo{font-size:12.5px;font-weight:400;color:var(--dust)}
/* La note du coach : sa voix, distincte de la consigne générique du catalogue */
.note-coach{border-left:3px solid var(--brand);padding:6px 0 6px 11px;margin-top:9px;
  font-size:13.5px;line-height:1.5;color:var(--chalk);white-space:pre-wrap}
.note-coach.grande{font-size:15px;margin:4px 0 14px;padding:10px 0 10px 13px}
.note-coach .eyebrow{display:block;margin-bottom:4px}
.fil{display:flex;flex-direction:column;gap:10px;margin:6px 0 14px;max-height:46vh;overflow-y:auto}
.bulle{padding:11px 13px;border-radius:12px;font-size:14.5px;line-height:1.5;white-space:pre-wrap}
.bulle.coach{background:var(--brand);color:var(--on-brand);border-bottom-left-radius:4px;align-self:flex-start;max-width:88%}
.bulle.moi{background:#2A2A2A;color:var(--chalk);border-bottom-right-radius:4px;align-self:flex-end;max-width:88%}
.bulle .qui{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.75;display:block;margin-bottom:3px}
.pastille-cm{background:var(--brand);color:var(--on-brand);border-radius:999px;
  font-size:11px;font-weight:700;padding:2px 7px;white-space:nowrap}
.video{position:relative;width:100%;aspect-ratio:16/9;margin:14px 0 4px;
  border-radius:10px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.lien{text-decoration:none;color:var(--brand-ink);display:inline-block}
.lien:focus-visible{outline:2px solid var(--brand-ink);outline-offset:2px;border-radius:5px}
.apercu{width:100%;max-width:280px;border-radius:10px;background:#2A2A2A;margin-bottom:10px}
.illu{width:100%;max-width:300px;border-radius:12px;background:#2A2A2A;margin:2px 0 12px;display:block}
.perso{font-size:13px;color:var(--brand-ink);font-weight:600;background:none;border:0;
  padding:8px 2px;text-align:left;text-decoration:underline;text-underline-offset:3px}
/* Accueil coach : une carte par athlète, statut et avancement lisibles d'un coup */
.ath-tete{display:flex;align-items:center;gap:10px;margin-bottom:5px}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:0 0 auto;
  background:#2A2A2A;display:grid;place-items:center;font-size:13px;font-weight:700;
  color:var(--dust);letter-spacing:.02em}
.avatar.grand{width:64px;height:64px;font-size:20px}
.avatar.vide{border:1px solid var(--edge)}
.ath-tete strong{font-size:17px;flex:1;min-width:0}
.chip{font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 9px;border-radius:999px;
  white-space:nowrap;text-transform:uppercase}
.chip.nouveau{background:rgba(224,169,79,.16);color:#E0A94F}
.chip.actif{background:rgba(111,191,142,.15);color:#6FBF8E}
.chip.inactif{background:#2A2A2A;color:var(--dust)}
.chip.archive{background:none;border:1px dashed var(--edge);color:var(--dust)}
/* Accueil : deux grandes cartes, tout le reste en dessous */
.card.grande{align-items:center}
.nom.gros{font-size:19px}
.fleche-carte{font-size:26px;color:var(--dust);flex:0 0 auto;line-height:1}
.curseur{width:100%;accent-color:var(--brand);height:34px}
.jauge{height:6px;border-radius:3px;background:#2A2A2A;overflow:hidden;margin:9px 0 7px}
.jauge i{display:block;height:100%;background:var(--brand);border-radius:3px;
  transition:width .4s ease-out}
.meta.bas{font-size:12.5px}
.impaye{color:#E0A94F;font-weight:600}
.alerte{background:rgba(224,169,79,.13);color:#E0A94F;border-radius:10px;padding:11px 14px;
  font-size:13.5px;font-weight:600;margin-bottom:14px}
.contacts{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.contact{flex:1;min-width:96px;text-align:center;line-height:44px;padding:0;
  text-decoration:none;color:var(--chalk)}
.contact.inerte{opacity:.4;pointer-events:none}
.paye{display:inline-flex;align-items:center;gap:8px;margin-top:9px;font-size:13.5px;
  color:var(--dust);cursor:pointer}
.paye input{width:20px;height:20px;accent-color:var(--brand)}
.card .quoi{color:var(--dust);font-size:15px;line-height:1.5}

.origine{display:flex;flex-direction:column;gap:2px;margin-top:12px;min-height:24px}
.origine .dit{font-size:12.5px;color:var(--dust)}

/* Sélecteur de jour */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;margin-bottom:6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;padding:11px 18px;border-radius:999px;background:var(--plate);border:1px solid var(--edge);
  font-weight:600;font-size:14px;white-space:nowrap;min-height:44px}
.day[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}

/* Carte exercice */
.card{background:var(--plate);border:1px solid var(--edge);border-radius:var(--r);padding:16px;margin-bottom:12px;
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:76px}
.card:active{transform:scale(.99)}
.card .body{flex:1;min-width:0}
.card .nom{font-size:17px;font-weight:600;line-height:1.25}
.card .meta{font-size:13px;color:var(--dust);margin-top:3px}
.card .done{width:34px;height:34px;border-radius:50%;border:2px solid var(--edge);display:grid;place-items:center;
  font-size:13px;font-weight:700;flex:0 0 auto;font-variant-numeric:tabular-nums}
.card .done.full{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

/* Disques — élément signature */
/* La barre entière : bague, disques, fût, disques, bague. Symétrique, et
   chargée du plus lourd contre le fût vers le plus léger à l'extérieur. */
.bar{display:flex;align-items:center;gap:1.5px;margin-top:8px;height:22px}
.bar .d{display:block;width:7px;border-radius:2px;border:1px solid rgba(0,0,0,.35)}
.bar .fut{width:26px;height:4px;background:var(--p2);border-radius:2px;border:0;margin:0 1.5px}
.bar .bague{width:3.5px;height:12px;background:var(--dust);border-radius:1px;border:0}

/* Panneau de saisie */
#logger{position:fixed;inset:0;background:var(--iron);z-index:20;display:flex;flex-direction:column;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#logger{animation:none}}
#logger .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#logger h3{font-size:26px;text-transform:uppercase;line-height:1.05;margin:10px 0 2px}
.consigne{color:var(--dust);font-size:14px;line-height:1.45}
.steppers{display:flex;gap:14px;margin:auto 0}
.stepper{flex:1;background:var(--plate);border:1px solid var(--edge);border-radius:var(--r);padding:14px 10px;text-align:center}
.stepper .val{font-size:52px;line-height:1;margin:10px 0}
.stepper .row{display:flex;gap:8px}
.stepper .row button{flex:1;height:52px;border-radius:10px;background:#2A2A2A;font-size:20px;font-weight:600}
.stepper .row button:active{background:#383838}
.chrono .val.court{color:var(--brand-ink)}
.chrono .row button{height:46px;font-size:15px}
.tempo{font-size:12.5px;color:var(--dust);line-height:1.5;margin:6px 0 0;font-variant-numeric:tabular-nums}
.valider{width:100%;min-height:60px;border-radius:var(--r);background:var(--brand);color:var(--on-brand);
  font-size:18px;font-weight:700;letter-spacing:.02em;margin-top:16px}
.valider:disabled{opacity:.45}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;min-height:34px}
.set{background:var(--plate);border:1px solid var(--edge);border-radius:8px;padding:7px 11px;font-size:14px;
  font-variant-numeric:tabular-nums}
.close{font-size:15px;color:var(--dust);padding:10px 4px}

/* Minuteur de repos */
#repos{position:fixed;left:0;right:0;bottom:0;background:var(--brand);color:var(--on-brand);padding:14px 18px;
  display:flex;justify-content:space-between;align-items:center;z-index:30;
  padding-bottom:calc(14px + env(safe-area-inset-bottom))}
#repos .t{font-size:30px;font-family:'Bebas Neue';font-variant-numeric:tabular-nums}
#repos button{font-weight:700;font-size:14px;text-decoration:underline}

/* Coach */
.athlete{display:block;text-align:left;width:100%;padding:15px 16px;
  background:var(--plate);border:1px solid var(--edge);border-radius:var(--r);margin-bottom:10px}
.tag{font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;background:#2A2A2A;color:var(--dust);white-space:nowrap}
.tag.warn{background:rgba(211,47,47,.16);color:#FF7A7A}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(20,23,28,.94);backdrop-filter:blur(8px);
  border-top:1px solid var(--edge);display:flex;padding-bottom:env(safe-area-inset-bottom)}

<body>

<section id="login">
  <img id="marque" src="assets/monogramme-w.png" alt="" width="400" height="400">
  <h1>Coaching<span>Fitness</span></h1>
  <p>Connectez-vous avec le compte Google que votre coach a inscrit.</p>
  <div id="gbtn"></div>
  <p id="loginErr" class="hidden" style="color:#FF7A7A"></p>
</section>

<main id="app" class="wrap hidden"></main>

<nav id="nav" class="nav hidden"></nav>

<div id="logger" class="hidden"></div>
<div id="repos" class="hidden"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// ── Configuration ────────────────────────────────────────────
const API = 'https://script.google.com/macros/s/AKfycbw8wC_TmFuLzP8yTrOmX5wH5k3Yoc-AbauN3Hj9oF57Lc1NSA-MrclnkuTnKr8DtBpEiQ/exec';                  // URL /exec du déploiement Apps Script
const CLIENT_ID = '765877661024-r5p4dhadda0i9eb9996ctb8298f7m6h8.apps.googleusercontent.com';

// ── État ─────────────────────────────────────────────────────
const S = { token:null, moi:null, jour:null, exos:[], blocs:[], seanceId:null, debut:null,
            faits:{}, finis:[], vue:'seance', timer:null };
const $ = s => document.querySelector(s);

// ── Appels API ───────────────────────────────────────────────
async function api(action, payload = {}) {
  let j;
  try {
    const r = await fetch(API, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},   // évite le préflight CORS
      body:JSON.stringify({ token:S.token, action, payload })
    });
    j = await r.json();
  } catch (e) {
    // Réseau absent, ou réponse illisible (portail captif) : traité comme une panne,
    // jamais comme une erreur métier — l'appelant peut différer l'action.
    throw new Error('RESEAU');
  }
  if (!j.ok) {
    if (/TOKEN/.test(j.error)) return reconnexion();
    throw new Error(j.error);
  }
  perimer(action);
  return j.data;
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

// ── Hors ligne ───────────────────────────────────────────────
// Une salle en sous-sol coupe le réseau. Deux mécanismes : les lectures sont
// servies depuis un cache local, les écritures sont mises en file et rejouées
// dès le retour du réseau. Rien n'est perdu, rien ne bloque la séance.

// Les clés de stockage gardent leur préfixe historique : les renommer viderait
// la file hors ligne et déconnecterait tout le monde, pour rien de visible.
const CLE_FILE  = 'muscu.file';
const CLE_CACHE = 'muscu.cache';
const CLE_MAP   = 'muscu.map';

/** Actions rejouables sans risque : elles décrivent un fait, pas un état global. */
const DIFFERABLES = ['demarrer', 'serie', 'finirExercice', 'reprendreExercice', 'terminer'];

const lireJSON = (cle, defaut) => {
  try { return JSON.parse(localStorage.getItem(cle)) ?? defaut; } catch (e) { return defaut; }
};
const ecrireJSON = (cle, val) => {
  try { localStorage.setItem(cle, JSON.stringify(val)); } catch (e) {}
};

let file = lireJSON(CLE_FILE, []);
let mapSeances = lireJSON(CLE_MAP, {});   // identifiant local → identifiant serveur
let vidageEnCours = false;

const enLigne = () => navigator.onLine !== false;
const estReseau = err => err && err.message === 'RESEAU';

/** Cache des lectures, une entrée par action et par clé. */
function cache(cle, valeur) {
  const c = lireJSON(CLE_CACHE, {});
  if (valeur === undefined) return c[cle];
  c[cle] = { v: valeur, ts: Date.now() };
  ecrireJSON(CLE_CACHE, c);
}

/**
 * Plusieurs lectures en une seule invocation. Chaque sous-appel a son propre
 * résultat : `[{ok, data}|{ok:false, error}]`. On rend directement les données,
 * en remontant la première erreur — l'appelant n'a pas à démêler le protocole.
 */
async function apiLot(appels) {
  const r = await api('lot', { appels });
  // Un lot peut contenir des écritures : chacune périme ce qu'elle touche.
  appels.forEach(a => perimer(a.action));
  const rate = r.find(x => !x.ok);
  if (rate) throw new Error(rate.error);
  return r.map(x => x.data);
}

/**
 * Lecture avec affichage immédiat : si une copie existe, l'appelant la reçoit
 * tout de suite et `apresCoup` est rappelé quand la version fraîche arrive.
 * C'est ce qui fait la différence entre une app qui répond et une app qui rame :
 * Apps Script met une à deux secondes, le cache répond en zéro.
 */
const FRAICHEUR = 20000;   // en deçà, la copie est réputée bonne

async function lireVite(action, payload, cleCache, apresCoup) {
  const c = cache(cleCache);
  if (!c) return (await lire(action, payload, cleCache)).d;

  // Sans cette fenêtre, le rafraîchissement rappelait la vue, qui relançait un
  // rafraîchissement : deux requêtes par affichage au lieu d'une.
  if (Date.now() - (c.ts || 0) < FRAICHEUR) return c.v;

  lire(action, payload, cleCache)
    .then(r => { if (r.frais && JSON.stringify(r.d) !== JSON.stringify(c.v)) apresCoup(r.d); })
    .catch(() => {});
  return c.v;
}

/**
 * Lecture tolérante : le réseau d'abord, le cache en secours.
 * `frais` à false signale à l'appelant qu'il regarde une copie.
 */
async function lire(action, payload, cleCache) {
  try {
    const d = await api(action, payload);
    cache(cleCache, d);
    // Le drapeau était levé sans que le bandeau soit redessiné : « Hors ligne »
    // restait affiché indéfiniment après la moindre coupure.
    if (S.horsLigne) { S.horsLigne = false; majBandeau(); }
    return { d, frais: true };
  } catch (err) {
    if (!estReseau(err)) throw err;
    const c = cache(cleCache);
    S.horsLigne = true;
    majBandeau();
    if (!c) throw new Error('HORS_LIGNE_SANS_CACHE');
    return { d: c.v, frais: false };
  }
}

/**
 * Copies à jeter quand telle action est écrite : une modification de fiche
 * périme la liste des athlètes autant que la fiche elle-même.
 */
const PERIME = {
  pratiquantSave: ['athletes', 'fiche:'], pratiquantCreer: ['athletes'],
  photoSave: ['athletes', 'fiche:'], photoSuppr: ['athletes', 'fiche:'],
  attribuer: ['athletes', 'fiche:', 'accueil', 'mesProgrammes'],
  attributionMaj: ['athletes', 'fiche:'], attributionSuppr: ['athletes', 'fiche:', 'accueil'],
  programmeSave: ['accueil', 'mesProgrammes'], programmeJour: ['accueil', 'mesProgrammes'],
  exerciceSave: ['catalogue'], exerciceSuppr: ['catalogue'],
  modeleSave: ['modeles'], modeleSuppr: ['modeles'], modeleJourSave: ['modeles'],
  terminer: ['accueil', 'athletes'], serie: ['accueil'],
  activiteSave: ['accueil'], activiteSuppr: ['accueil'],
  maintenance: ['catalogue', 'modeles', 'athletes', 'accueil']
};

/** Jette les copies périmées par une écriture. */
function perimer(action) {
  const cles = PERIME[action];
  if (!cles) return;
  const c = lireJSON(CLE_CACHE, {});
  Object.keys(c).forEach(k => {
    if (cles.some(p => k === p || (p.endsWith(':') && k.indexOf(p) === 0))) delete c[k];
  });
  ecrireJSON(CLE_CACHE, c);
}

/**
 * Écriture tolérante : on tente, et si le réseau manque on met en file.
 * L'appelant reçoit une réponse immédiate et la séance continue.
 */
async function ecrire(action, payload) {
  if (DIFFERABLES.indexOf(action) === -1) return api(action, payload);
  if (!file.length && enLigne()) {
    try {
      const d = await api(action, payload);
      S.horsLigne = false; majBandeau();
      return d;
    } catch (err) {
      if (!estReseau(err)) throw err;
    }
  }
  file.push({ action, payload, ts: Date.now() });
  ecrireJSON(CLE_FILE, file);
  S.horsLigne = true;
  majBandeau();
  return { differe: true };
}

/** Identifiant provisoire quand la séance n'a pas pu être créée côté serveur. */
function seanceLocale() {
  return 'LOC-' + Date.now().toString(36).toUpperCase();
}

/**
 * Rejoue la file dans l'ordre. Une séance créée hors ligne porte un identifiant
 * local : on la crée pour de bon au premier passage, puis on substitue partout.
 */
async function viderFile() {
  if (vidageEnCours || !file.length || !enLigne() || !S.token) return;
  vidageEnCours = true;
  const avant = file.length;

  try {
    while (file.length) {
      const e = file[0];
      const p = Object.assign({}, e.payload);

      if (p.seance_id && mapSeances[p.seance_id]) p.seance_id = mapSeances[p.seance_id];

      if (e.action === 'demarrer') {
        const r = await api('demarrer', { jour: p.jour });
        if (e.local) {
          mapSeances[e.local] = r.seance_id;
          ecrireJSON(CLE_MAP, mapSeances);
          if (S.seanceId === e.local) S.seanceId = r.seance_id;
        }
      } else if (String(p.seance_id || '').indexOf('LOC-') === 0) {
        // La séance n'a jamais été créée : on la crée maintenant.
        const r = await api('demarrer', { jour: p.jour || S.jour });
        mapSeances[p.seance_id] = r.seance_id;
        ecrireJSON(CLE_MAP, mapSeances);
        if (S.seanceId === p.seance_id) S.seanceId = r.seance_id;
        p.seance_id = r.seance_id;
        await api(e.action, p);
      } else {
        await api(e.action, p);
      }

      file.shift();
      ecrireJSON(CLE_FILE, file);
      majBandeau();
    }
    S.horsLigne = false;
    majBandeau();
    if (avant) {
      toast(avant + (avant > 1 ? ' actions enregistrées' : ' action enregistrée'));
      if (S.vue === 'seance') vueSeance();
    }
  } catch (err) {
    // Réseau encore absent ou serveur en erreur : on retentera.
  }
  vidageEnCours = false;
}

/** Bandeau discret : état du réseau et nombre d'actions en attente. */
function majBandeau() {
  let b = $('#reseau');
  if (!b) {
    b = document.createElement('div');
    b.id = 'reseau';
    document.body.appendChild(b);
    b.onclick = viderFile;
  }
  // On n'affiche « Hors ligne » que si le navigateur le confirme : un appel
  // raté peut venir du serveur, pas du réseau, et laisser un bandeau menteur.
  const coupe = S.horsLigne && !enLigne();
  if (!file.length && !coupe) { b.classList.add('hidden'); return; }
  b.classList.remove('hidden');
  b.className = 'attente';
  b.innerHTML = file.length
    ? `<span class="pastille"></span>${file.length} en attente · sera envoyé au retour du réseau`
    : `<span class="pastille"></span>Hors ligne`;
}

window.addEventListener('online', () => { S.horsLigne = false; majBandeau(); viderFile(); });
window.addEventListener('offline', () => { S.horsLigne = true; majBandeau(); });
setInterval(viderFile, 20000);

// ── Connexion Google et session ──────────────────────────────
const CLE_SESSION = 'muscu.session';

/** `exp` du jeton Google, en secondes epoch. 0 si illisible. */
function expiration(jwt) {
  try {
    const c = jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(escape(atob(c)))).exp || 0;
  } catch (e) { return 0; }
}

/**
 * La session tient dans localStorage : le jeton Google et le profil.
 * Le jeton expire de lui-même au bout d'une heure environ ; on ne le garde
 * que tant qu'il est valide, et la clé est effacée à la déconnexion.
 */
function sauverSession() {
  try {
    localStorage.setItem(CLE_SESSION, JSON.stringify({
      token: S.token, exp: S.exp, moi: S.moi
    }));
  } catch (e) {}
}

function lireSession() {
  try {
    const o = JSON.parse(localStorage.getItem(CLE_SESSION) || 'null');
    // 60 s de marge : inutile de restaurer un jeton sur le point d'expirer.
    return o && o.token && o.exp > Date.now() / 1000 + 60 ? o : null;
  } catch (e) { return null; }
}

function oublierSession() {
  try { localStorage.removeItem(CLE_SESSION); } catch (e) {}
}

window.onload = () => {
  const reprise = lireSession();
  google.accounts.id.initialize({ client_id:CLIENT_ID, callback:onGoogle, auto_select:true });

  if (reprise) {
    S.token = reprise.token; S.exp = reprise.exp;
    ouvrirApp(reprise.moi);
    // On rafraîchit le profil en arrière-plan : si le jeton a été révoqué, on retombe
    // proprement sur l'écran de connexion plutôt que d'afficher un état périmé.
    // Un jeton révoqué renvoie à la connexion — reconnexion() s'en charge. Une simple
    // coupure réseau, elle, ne doit pas déconnecter : en salle, le wifi est capricieux.
    api('bootstrap')
      .then(m => { S.moi = m; sauverSession(); rendre(); })
      .catch(e => {
        if (/NON_INSCRIT/.test(e.message || '')) { oublierSession(); ecranConnexion(); }
        else toast('Hors ligne : affichage de la dernière version connue');
      });
    return;
  }

  google.accounts.id.renderButton($('#gbtn'), { theme:'filled_black', size:'large', shape:'pill', text:'signin_with', locale:'fr' });
  google.accounts.id.prompt();
};

async function onGoogle(res) {
  S.token = res.credential;
  S.exp = expiration(res.credential);
  try {
    S.moi = await api('bootstrap');
  } catch (e) {
    $('#loginErr').textContent = e.message === 'NON_INSCRIT'
      ? 'Ce compte n\'est pas encore inscrit. Demandez à votre coach de vous ajouter.'
      : 'Connexion impossible : ' + e.message;
    $('#loginErr').classList.remove('hidden');
    return;
  }
  sauverSession();
  ouvrirApp(S.moi);
}

/**
 * Le coach ne suit pas de programme dans l'app : sa navigation est celle d'un
 * poste de travail, pas celle d'un pratiquant. On la construit selon le rôle.
 */
function construireNav(estCoach) {
  const onglets = estCoach
    ? [['athletes','Athlètes'], ['modeles','Modèles'], ['biblio','Bibliothèque'], ['reglages','Réglages']]
    : [['accueil','Accueil'], ['calendrier','Calendrier'], ['progres','Progrès']];
  if (!onglets.some(o => o[0] === S.vue)) S.vue = onglets[0][0];
  $('#nav').innerHTML = onglets.map(([v, t]) =>
    `<button data-vue="${v}" aria-pressed="${v === S.vue}">${t}</button>`).join('');
}

function ouvrirApp(moi) {
  S.moi = moi;
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#nav').classList.remove('hidden');
  construireNav(moi.estCoach);
  S.jour = S.jour || moi.jours[0] || null;
  majBandeau();
  viderFile();
  majPastilles();
  rendre();
}

function ecranConnexion() {
  S.token = null; S.moi = null; S.exp = 0;
  $('#logger').classList.add('hidden');
  $('#app').classList.add('hidden'); $('#nav').classList.add('hidden');
  $('#login').classList.remove('hidden');
  $('#gbtn').innerHTML = '';
  google.accounts.id.renderButton($('#gbtn'), { theme:'filled_black', size:'large', shape:'pill', text:'signin_with', locale:'fr' });
}

/** Déconnexion : on oublie la session et on coupe la reconnexion automatique. */
function deconnexion() {
  oublierSession();
  try { google.accounts.id.disableAutoSelect(); } catch (e) {}
  Object.assign(S, { token:null, moi:null, exp:0, jour:null, exos:[], blocs:[],
                     seanceId:null, faits:{}, vue:'seance', cal:null, coach:null, ed:null });
  ecranConnexion();
}

function reconnexion() {
  oublierSession();
  ecranConnexion();
  google.accounts.id.prompt();
  throw new Error('SESSION_EXPIREE');
}

// Le bouton Quitter est réécrit à chaque rendu : on délègue plutôt que de le relier.
document.addEventListener('click', e => {
  if (e.target.closest('#quitter')) deconnexion();
});

// ── Navigation ───────────────────────────────────────────────
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.vue = b.dataset.vue;
  document.querySelectorAll('#nav button').forEach(x => x.setAttribute('aria-pressed', x === b));
  rendre();
});

const VUES_COACH = ['athletes', 'modeles', 'biblio', 'reglages'];

async function rendre() {
  clearInterval(S.pendule);
  $('#logger').classList.add('hidden');   // l'overlay ne doit pas survivre à un changement de vue
  if (VUES_COACH.indexOf(S.vue) !== -1) {
    S.coach = S.coach || { onglet:'athletes', email:null, nom:'', sous:'fiche', modele:null, categorie:null };
    // Changer d'onglet principal quitte la fiche ou le modèle en cours.
    if (S.coach.onglet !== S.vue) {
      S.coach.onglet = S.vue; S.coach.email = null; S.coach.modele = null; S.coach.categorie = null;
      S.attSel = null; S.ed = null; S.cal = null;
    }
    return vueCoach();
  }
  if (S.vue === 'accueil') return vueAccueil();
  if (S.vue === 'seance') return vueSeance();
  if (S.vue === 'programmes') return vueMesProgrammes();
  if (S.vue === 'calendrier') return vueCalendrier();
  if (S.vue === 'progres') return vueProgres();
}

// ── Accueil du pratiquant ────────────────────────────────────
const salut = () => {
  const h = new Date().getHours();
  return h < 6 ? 'Bonne nuit' : h < 12 ? 'Bonjour' : h < 18 ? 'Bon après-midi' : 'Bonsoir';
};

const quand = d => d === 0 ? "aujourd'hui" : d === 1 ? 'demain' : `dans ${d} jours`;

async function vueAccueil() {
  const app = $('#app');
  app.innerHTML = `<header>
      <div class="titre-bloc">
        <h2>${salut()} ${(S.moi.nom || '').split(' ')[0]}</h2>
        ${S.moi.coach ? `<span class="signe">coaché par ${S.moi.coach}</span>` : ''}
      </div>
      <button class="quitter" id="quitter" >Se déconnecter</button>
    </header><div id="zone"><div class="empty">Chargement…</div></div>`;

  let a;
  try { a = await lireVite('accueil', {}, 'accueil', () => { if (S.vue === 'accueil') vueAccueil(); }); }
  catch (err) { $('#zone').innerHTML = `<div class="empty">Impossible de charger.<br>${err.message}</div>`; return; }
  S.accueil = a;

  const p = a.progression;
  const part = p ? Math.round(p.part * 100) : 0;

  $('#zone').innerHTML = `
    ${a.prochaine ? `
      <div class="eyebrow">Prochaine séance</div>
      <button class="card grande" id="allerSeance">
        <div class="body">
          <div class="nom gros">${a.prochaine.jour}</div>
          <div class="meta">${quand(a.prochaine.dans)}${
            a.prochaine.duree_estimee ? ' · environ ' + a.prochaine.duree_estimee + ' min' : ''}</div>
        </div>
        <span class="fleche-carte">›</span>
      </button>`
    : `<div class="empty">Aucune séance programmée.<br>${
        S.moi.coach ? S.moi.coach + ' ne vous a pas encore attribué de programme.' : ''}</div>`}

    ${a.programme ? `
      <div class="eyebrow" style="margin-top:26px">Mon programme</div>
      <div class="card" style="display:block">
        <div class="nom gros">${a.programme.nom}</div>
        <div class="meta">${p && p.duree_semaines
          ? `semaine ${Math.min(p.semaine, p.duree_semaines)} sur ${p.duree_semaines}`
          : p ? `semaine ${p.semaine}` : ''}${
          a.programme.date_debut ? ' · depuis le ' + new Date(a.programme.date_debut).toLocaleDateString('fr-FR') : ''}</div>
        ${p ? `<div class="jauge"><i style="width:${part}%"></i></div>
        <div class="meta bas">${p.faites} séance${p.faites > 1 ? 's' : ''} sur ${p.attendues} attendue${p.attendues > 1 ? 's' : ''}</div>` : ''}
        <div class="barre">
          <button class="btn" id="detail" style="flex:1">Voir le détail</button>
          <button class="btn" id="tous">Tous mes programmes</button>
        </div>
      </div>` : ''}

    <div class="barre" style="margin-top:26px">
      <button class="btn plein" id="consigner" style="flex:1">＋ Consigner une activité</button>
    </div>

    ${a.activites.length ? `
      <div class="eyebrow" style="margin:26px 0 10px">Dernières activités</div>
      ${a.activites.map(carteActivite).join('')}` : ''}`;

  const go = () => { S.jour = a.prochaine.jour; S.vue = 'seance'; rendre(); };
  const bs = $('#allerSeance'); if (bs) bs.onclick = go;
  const bd = $('#detail'); if (bd) bd.onclick = go;
  const bt = $('#tous'); if (bt) bt.onclick = () => { S.vue = 'programmes'; rendre(); };
  $('#consigner').onclick = () => modalActivite(null);
  $('#zone').querySelectorAll('[data-act]').forEach(b =>
    b.onclick = () => modalActivite(a.activites.find(x => x.id === b.dataset.act)));
}

function carteActivite(x) {
  const d = new Date(x.date);
  const jours = Math.floor((Date.now() - d) / 86400000);
  const detail = [
    x.duree_min ? x.duree_min + ' min' : '',
    x.distance_km ? x.distance_km + ' km' : '',
    x.effort ? 'effort ' + x.effort + '/10' : ''
  ].filter(Boolean).join(' · ');
  return `<button class="ligne" data-act="${x.id}" style="width:100%;text-align:left">
    <div class="g">
      <div class="nom">${x.sport}</div>
      <div class="meta">${detail || 'sans détail'}</div>
    </div>
    <span class="meta" style="white-space:nowrap">${
      jours === 0 ? "aujourd'hui" : jours === 1 ? 'hier' : 'il y a ' + jours + ' j'}</span>
  </button>`;
}

/**
 * Consigner une activité hors programme. Le sport est choisi dans une liste
 * groupée par famille ; « Séance libre » couvre la séance à nu, sans programme.
 */
function modalActivite(x) {
  const a = x || { id:'', sport:'', date:new Date().toISOString().slice(0,10),
                   duree_min:'', distance_km:'', effort:5, notes:'' };
  const jour = a.date ? new Date(a.date).toISOString().slice(0, 10) : '';

  const w = modal(x ? 'Modifier l\'activité' : 'Consigner une activité', `
    <div class="champ"><label>Activité</label>
      <select class="f" id="aSport">
        <option value="">— Choisir —</option>
        ${(S.moi.sports || []).map(([famille, liste]) => `<optgroup label="${famille}">
          ${liste.map(s => `<option ${s === a.sport ? 'selected' : ''}>${s}</option>`).join('')}
        </optgroup>`).join('')}
      </select></div>
    <div class="duo">
      <div class="champ"><label>Date</label><input class="f" id="aDate" type="date" value="${jour}"></div>
      <div class="champ"><label>Durée (min)</label><input class="f" id="aDuree" type="number" min="0" value="${a.duree_min || ''}"></div>
    </div>
    <div class="champ"><label>Distance (km) — si ça s'y prête</label>
      <input class="f" id="aDist" type="number" min="0" step="0.1" value="${a.distance_km || ''}"></div>
    <div class="champ"><label>Perception de l'effort — <span id="aEffortVal">${a.effort || 5}</span> sur 10</label>
      <input class="curseur" id="aEffort" type="range" min="0" max="10" value="${a.effort || 5}"></div>
    <div class="champ"><label>Notes</label><textarea class="f" id="aNotes" rows="3"
      placeholder="Sensations, météo, partenaires…">${a.notes || ''}</textarea></div>
    <div class="barre"><button class="btn" id="aAnn">Annuler</button>
      <button class="btn plein" id="aOk" style="flex:1">Enregistrer</button></div>
    ${x ? '<div class="barre"><button class="btn danger" id="aDel">Supprimer</button></div>' : ''}`);

  const cur = w.querySelector('#aEffort');
  cur.oninput = () => { w.querySelector('#aEffortVal').textContent = cur.value; };
  w.querySelector('#aAnn').onclick = w.fermer;

  w.querySelector('#aOk').onclick = async function () {
    const sport = w.querySelector('#aSport').value;
    if (!sport) return toast('Choisissez une activité');
    this.disabled = true;
    try {
      await api('activiteSave', {
        id: a.id || undefined, sport: sport,
        date: w.querySelector('#aDate').value,
        duree_min: w.querySelector('#aDuree').value,
        distance_km: w.querySelector('#aDist').value,
        effort: cur.value,
        notes: w.querySelector('#aNotes').value
      });
      w.fermer(); toast('Activité enregistrée');
      cache('accueil', undefined); S.cal = null;
      vueAccueil();
    } catch (err) { toast(err.message); this.disabled = false; }
  };

  if (x) w.querySelector('#aDel').onclick = async function () {
    this.disabled = true;
    try {
      await api('activiteSuppr', { id: a.id });
      w.fermer(); toast('Activité supprimée'); vueAccueil();
    } catch (err) { toast(err.message); this.disabled = false; }
  };
}

// ── Tous mes programmes ──────────────────────────────────────
async function vueMesProgrammes() {
  const app = $('#app');
  app.innerHTML = `<header><h2>Mes programmes</h2>
    <button class="close" id="retourAccueil">← Accueil</button></header>
    <div id="zone"><div class="empty">Chargement…</div></div>`;
  $('#retourAccueil').onclick = () => { S.vue = 'accueil'; rendre(); };

  const list = await lireVite('mesProgrammes', {}, 'mesProgrammes',
    () => { if (S.vue === 'programmes') vueMesProgrammes(); });
  $('#zone').innerHTML = list.map(pr => `
    <details class="pli" ${pr.statut === 'En cours' ? 'open' : ''}>
      <summary>
        <span class="eyebrow">${pr.nom}</span>
        <span class="compte">${pr.statut}</span>
      </summary>
      <div class="meta" style="padding:0 2px 10px">${
        pr.date_debut ? 'du ' + new Date(pr.date_debut).toLocaleDateString('fr-FR') : ''}${
        pr.date_fin ? ' au ' + new Date(pr.date_fin).toLocaleDateString('fr-FR') : ''}</div>
      ${pr.jours.map(j => `<div class="ligne">
        <div class="g">
          <div class="nom">${j.jour}</div>
          <div class="meta">${j.blocs.length} bloc${j.blocs.length > 1 ? 's' : ''} · ${
            j.blocs.reduce((t, b) => t + b.exercices.length, 0)} exercices${
            j.duree_estimee ? ' · environ ' + j.duree_estimee + ' min' : ''}</div>
        </div>
      </div>`).join('') || `<div class="empty" style="padding:14px 0">Aucun jour composé.</div>`}
    </details>`).join('') || `<div class="empty">Aucun programme pour l'instant.</div>`;
}

// ── Vue séance ───────────────────────────────────────────────
async function vueSeance() {
  const app = $('#app');
  if (!S.moi.jours.length) {
    app.innerHTML = `<div class="empty">Aucun programme pour l'instant.<br>Votre coach doit vous en assigner un.</div>`;
    return;
  }
  app.innerHTML = `
    <header>
      <h2>Séance</h2>
      <button class="close" id="retourAccueil">← Accueil</button>
    </header>
    <div class="eyebrow" id="avancement">Programme</div>
    <div class="days">${S.moi.jours.map(j =>
      `<button class="day" data-jour="${j}" aria-pressed="${j === S.jour}">${j}</button>`).join('')}</div>
    <div id="liste"><div class="empty">Chargement…</div></div>`;

  const ra = $('#retourAccueil');
  if (ra) ra.onclick = () => { S.vue = 'accueil'; rendre(); };
  app.querySelectorAll('.day').forEach(b => b.onclick = () => {
    S.jour = b.dataset.jour; vueSeance();
  });

  const blocs = await chargerSeance(S.jour);
  $('#liste').innerHTML = blocs.map(b => {
    const cartes = b.exercices.map((e, k) => carte(e) +
      (k < b.exercices.length - 1 && e.pause_s ? `<div class="pause">↓ ${e.pause_s} s de pause</div>` : '')
    ).join('');
    if (b.exercices.length < 2) return cartes;
    // Superset : on enchaîne les exercices, le repos vient après le tour complet.
    return `<div class="bloc">
      <div class="bloc-tete">
        <span class="eyebrow">Bloc ${b.bloc} · superset</span>
        <span class="bloc-info">${b.series} tours · ${b.repos_s} s</span>
      </div>${cartes}</div>`;
  }).join('') + (S.seanceId
    ? `<div class="barre"><button class="btn plein" id="finSeance" style="flex:1">Terminer la séance</button></div>`
    : `<div class="barre"><button class="btn plein" id="debutSeance" style="flex:1">Démarrer la séance</button></div>`);

  const total = S.exos.length;
  const clos = S.exos.filter(x => S.finis.indexOf(x.exercice_id) !== -1 ||
    (S.faits[x.exercice_id] || []).length >= x.series).length;
  majPendule(clos, total);

  const fs = $('#finSeance');
  if (fs) fs.onclick = modalFinSeance;
  const ds = $('#debutSeance');
  if (ds) ds.onclick = async function () {
    this.disabled = true; this.textContent = 'Démarrage…';
    try {
      const r = await api('demarrer', { jour: S.jour });
      S.seanceId = r.seance_id;
      S.debut = new Date().toISOString();
      cache('accueil', undefined);
      vueSeance();
    } catch (err) {
      if (!estReseau(err)) { toast(err.message); this.disabled = false; this.textContent = 'Démarrer la séance'; return; }
      S.seanceId = seanceLocale(); S.debut = new Date().toISOString();
      file.push({ action:'demarrer', payload:{ jour:S.jour }, local:S.seanceId, ts:Date.now() });
      ecrireJSON(CLE_FILE, file); S.horsLigne = true; majBandeau();
      vueSeance();
    }
  };
  $('#liste').querySelectorAll('[data-i]').forEach(c =>
    c.onclick = () => ouvrirLogger(Number(c.dataset.i)));
  $('#liste').querySelectorAll('[data-rep]').forEach(b => b.onclick = async function (ev) {
    ev.stopPropagation();
    this.disabled = true;
    const id = this.dataset.rep;
    try {
      if (S.seanceId) await ecrire('reprendreExercice', { seance_id:S.seanceId, exercice_id:id, jour:S.jour });
      S.finis = S.finis.filter(x => x !== id);
      vueSeance();
    } catch (err) { toast(err.message); this.disabled = false; }
  });
}

/** Charge la séance en blocs et remet à plat S.exos, index utilisé par le logger. */
async function chargerSeance(jour) {
  const { d: r, frais } = await lire('seance', { jour }, 'seance:' + jour);
  if (!frais) majBandeau();
  // Le serveur renvoie la séance du jour si elle est ouverte, avec les séries déjà
  // saisies : un rechargement de page ne perd plus les compteurs.
  const blocs = r.blocs || [];
  S.seanceId = r.seance_id || null;
  S.debut = r.debut || null;
  S.dureeEstimee = r.duree_estimee || 0;
  S.faits = r.faits || {};
  S.finis = r.finis || [];
  S.exos = []; S.blocs = blocs;
  blocs.forEach((b, bi) => b.exercices.forEach((e, ei) => {
    e._b = bi; e._e = ei; e._i = S.exos.length;   // bloc, rang dans le bloc, index plat
    S.exos.push(e);
  }));
  return blocs;
}

/**
 * Charge à afficher. Un pourcentage de 1RM prime sur une charge fixe : c'est lui
 * qui suit la progression. On dit d'où vient le chiffre quand il est calculé.
 */
/**
 * Dit d'où vient la charge affichée, et laisse le pratiquant se l'approprier.
 * Le coach fixe une charge ou un pourcentage du max ; c'est le pratiquant qui est
 * sous la barre, il a le dernier mot, et son choix vaut pour les séances suivantes.
 */
function majOrigine(e, charge) {
  const z = $('#origine');
  if (!z) return;
  const change = Math.abs(charge - (Number(e.charge_cible) || 0)) > 0.01;

  let dit = '';
  if (e.charge_ajustee) dit = `Votre charge · le programme dit ${e.charge_coach || '—'} kg`;
  else if (e.charge_calculee) dit = `${e.pct_rm} % de votre max (${e.rm} kg${e.rm_source === 'estimé' ? ', estimé' : ''})`;
  else if (e.pct_rm) dit = `${e.pct_rm} % du max — votre max n'est pas connu, à vous de juger`;
  else if (e.charge_cible) dit = 'Charge prévue par le coach';

  z.innerHTML = `${dit ? `<span class="dit">${dit}</span>` : ''}
    ${change || e.charge_ajustee
      ? `<button class="perso" id="garder">${change ? 'Garder ' + charge + ' kg comme ma charge' : 'Revenir à la charge du programme'}</button>`
      : ''}`;

  const g = $('#garder');
  if (g) g.onclick = async function () {
    this.disabled = true;
    try {
      await api('ajuster', { exercice_id:e.exercice_id, charge: change ? charge : 0 });
      if (change) { e.charge_coach = e.charge_coach || e.charge_cible; e.charge_cible = charge; e.charge_ajustee = true; }
      else { e.charge_cible = e.charge_coach || 0; e.charge_ajustee = false; }
      toast(change ? 'Charge enregistrée' : 'Retour à la charge du programme');
      majOrigine(e, charge);
    } catch (err) { toast(err.message); this.disabled = false; }
  };
}

function chargeTexte(e) {
  if (!e.charge_cible) return '';
  if (e.charge_ajustee) return e.charge_cible + ' kg · votre charge';
  if (!e.pct_rm) return e.charge_cible + ' kg';
  const base = e.charge_calculee
    ? `${e.pct_rm} % de ${e.rm} kg${e.rm_source === 'estimé' ? ' estimés' : ''}`
    : `${e.pct_rm} % — max inconnu`;
  return `${e.charge_cible} kg · ${base}`;
}

/** « 45 s », « max », « 1:30 ». */
function duree(sec) {
  if (sec === 'max' || sec === 'MAX') return 'max';
  const n = Number(sec) || 0;
  return n >= 60 ? `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}` : `${n} s`;
}

/**
 * Estimation locale, pour l'éditeur : le serveur ne connaît pas encore le jour
 * qu'on est en train de composer. Même règle que `estimerDuree_` côté serveur —
 * répétitions à la cadence, pauses, repos entre tours, changement de poste,
 * échauffement une fois.
 */
const TEMPO_DEFAUT = 3, TRANSITION_MIN = 4, ECHAUFFEMENT_MIN = 10;

function dureeJour(blocs) {
  if (!blocs || !blocs.length) return 0;
  const reps = v => {
    const t = String(v || '').trim().toLowerCase();
    if (!t) return 0;
    if (t === 'max') return 10;
    const n = (t.match(/\d+/g) || []).map(Number);
    return n.length ? (n.length > 1 ? (n[0] + n[n.length - 1]) / 2 : n[0]) : 0;
  };
  const tempo = c => {
    const p = String(c || '').split('-').map(x => Number(x.trim()));
    if (p.length !== 4 || p.some(isNaN)) return TEMPO_DEFAUT;
    const t = p[0] + p[1] + p[2] + p[3];
    return t > 0 ? t : TEMPO_DEFAUT;
  };

  let sec = 0;
  blocs.forEach(b => {
    const tours = Number(b.series) || 1;
    let tour = 0;
    (b.exercices || []).forEach((e, i) => {
      const d = String(e.duree_s || '').toLowerCase();
      tour += d === 'max' ? 45 : Number(e.duree_s) > 0 ? Number(e.duree_s)
                                                       : reps(e.reps_cible) * tempo(e.cadence);
      if (i < b.exercices.length - 1) tour += Number(e.pause_s) || 0;
    });
    sec += tours * tour + Math.max(0, tours - 1) * (Number(b.repos_s) || 0);
  });
  sec += Math.max(0, blocs.length - 1) * TRANSITION_MIN * 60 + ECHAUFFEMENT_MIN * 60;
  return Math.round(sec / 60);
}

/**
 * Bandeau d'avancement : le temps écoulé face au temps prévu, et les exercices
 * bouclés. Le pendule bat chaque minute tant que la séance est ouverte —
 * chaque seconde n'apprendrait rien et réveillerait l'écran pour rien.
 */
function majPendule(clos, total) {
  const z = $('#avancement');
  if (!z) return;
  clearInterval(S.pendule);

  const peindre = () => {
    const a = $('#avancement');
    if (!a) { clearInterval(S.pendule); return; }
    if (!S.seanceId) {
      a.textContent = S.dureeEstimee ? `Programme · environ ${S.dureeEstimee} min` : 'Programme';
      return;
    }
    const min = S.debut ? Math.max(0, Math.round((Date.now() - new Date(S.debut)) / 60000)) : 0;
    a.textContent = `Séance en cours · ${min} min${
      S.dureeEstimee ? ' sur ' + S.dureeEstimee + ' prévues' : ''} · ${clos}/${total} exercices`;
  };
  peindre();
  if (S.seanceId) S.pendule = setInterval(peindre, 60000);
}

/** Commentaires non lus sur un exercice, pour celui qui regarde. */
const enAttente = id => ((S.nonLus || {}).exercices || {})[id] || 0;

/** Carte d'un exercice. series et repos_s sont hérités de son bloc. */
function carte(e) {
  const n = (S.faits[e.exercice_id] || []).length;
  const fini = S.finis.indexOf(e.exercice_id) !== -1;
  const cible = e.duree_s ? duree(e.duree_s) : e.reps_cible;
  // Un exercice clos garde une carte cliquable, plus un bouton pour le rouvrir.
  // D'où une <div> avec deux zones : imbriquer un bouton dans un bouton est invalide.
  const [ouvre, ferme] = fini ? ['<div class="card clos">', '</div>'] : [`<button class="card" data-i="${e._i}">`, '</button>'];
  return `${ouvre}
    <div class="body" ${fini ? `data-i="${e._i}"` : ''}>
      <div class="nom">${e.nom}</div>
      <div class="meta">${e.series} × ${cible}${chargeTexte(e) ? ' · ' + chargeTexte(e) : ''}${
        fini && n < e.series ? ' · arrêté à ' + n : ''}${
        !fini && e.dernier && e.charge_cible ? ' · dernière fois ' + e.dernier.charge + ' kg' : ''}</div>
      ${enAttente(e.exercice_id) ? `<span class="pastille-cm">${enAttente(e.exercice_id)} mot${
        enAttente(e.exercice_id) > 1 ? 's' : ''} de ${S.moi.coach || 'votre coach'}</span>` : ''}
      ${e.note ? `<div class="note-coach">${e.note}</div>` : ''}
      ${e.cadence ? `<div class="cadbloc"><span class="cadence">${e.cadence}</span>${courbeCadence(e.cadence, false)}</div>` : ''}
      ${e.charge_cible ? disques(e.charge_cible) : ''}
    </div>
    ${fini
      ? `<button class="done full reprendre" data-rep="${e.exercice_id}"
           title="Reprendre cet exercice" aria-label="Reprendre ${e.nom}">↺</button>`
      : `<div class="done ${n >= e.series ? 'full' : ''}">${n}/${e.series}</div>`}
  ${ferme}`;
}

const arrondi = n => Math.round(n * 10) / 10;

/**
 * Une valeur par séance : la charge la plus lourde du jour, du plus ancien au plus
 * récent. L'historique arrive du serveur en ordre décroissant.
 */
function seriesParSeance(h) {
  const parJour = {};
  h.forEach(x => {
    const k = cleJour(new Date(x.date));
    parJour[k] = Math.max(parJour[k] || 0, Number(x.charge) || 0);
  });
  return Object.keys(parJour).sort().map(k => ({ jour: k, kg: parJour[k] }));
}

/**
 * Courbe de progression : une séance en abscisse, la charge en ordonnée.
 * L'échelle part de 90 % du minimum pour que la pente reste lisible même quand
 * les charges varient peu — un aplatissement à zéro ne dirait rien.
 */
function courbeProgression(pts) {
  if (pts.length < 2) return '';
  const W = 300, H = 64, m = 6;
  const kg = pts.map(p => p.kg);
  const bas = Math.min(...kg) * 0.9;
  const haut = Math.max(...kg);
  const ec = haut - bas || 1;
  const x = i => m + (W - 2 * m) * (i / (pts.length - 1));
  const y = v => H - m - (H - 2 * m) * ((v - bas) / ec);

  const ligne = pts.map((p, i) => `${arrondi(x(i))},${arrondi(y(p.kg))}`).join(' ');
  const aire = `${m},${H - m} ${ligne} ${W - m},${H - m}`;
  const dernier = pts[pts.length - 1];

  return `<svg class="prog" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
      aria-label="Progression sur ${pts.length} séances, de ${kg[0]} à ${dernier.kg} kg">
    <polygon points="${aire}" fill="var(--brand)" opacity=".14"/>
    <polyline points="${ligne}" fill="none" stroke="var(--brand-ink)" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${arrondi(x(pts.length - 1))}" cy="${arrondi(y(dernier.kg))}" r="3.5" fill="var(--brand-ink)"/>
  </svg>`;
}

/** Décompose une charge en disques olympiques colorés (barre de 20 kg). */
/**
 * La barre entière, vue de profil : bague, disques, fût, disques, bague.
 * Les disques sont chargés comme on les charge vraiment — le plus lourd contre
 * le fût, les plus petits vers l'extérieur — et le dessin est symétrique,
 * puisqu'une barre l'est.
 */
function disques(kg) {
  const parCote = (Number(kg) - (S.moi.barKg || 20)) / 2;
  if (!(parCote > 0)) return '';
  const dispo = [[25,'var(--p25)',20],[20,'var(--p20)',18],[15,'var(--p15)',16],
                 [10,'var(--p10)',13],[5,'var(--p5)',10],[2.5,'var(--p2)',8],[1.25,'var(--p2)',6]];

  // Du plus lourd au plus léger : l'ordre dans lequel on enfile les disques.
  let reste = parCote;
  const pose = [];
  dispo.forEach(([p, c, h]) => {
    while (reste >= p - 0.01) {
      pose.push(`<i class="d" style="background:${c};height:${h}px"></i>`);
      reste -= p;
    }
  });

  const gauche = pose.slice().reverse().join('');   // de l'extérieur vers le centre
  const droite = pose.join('');
  const detail = parCote + ' kg par côté sur une barre de ' + (S.moi.barKg || 20) + ' kg';

  return `<span class="bar" role="img" aria-label="${detail}" title="${detail}"
    ><i class="bague"></i>${gauche}<i class="fut"></i>${droite}<i class="bague"></i></span>`;
}

// ── Saisie des séries ────────────────────────────────────────
async function ouvrirLogger(i) {
  const e = S.exos[i];
  const b = S.blocs[e._b];
  if (!S.seanceId) {
    try {
      S.seanceId = (await api('demarrer', { jour:S.jour })).seance_id;
    } catch (err) {
      if (!estReseau(err)) throw err;
      // Pas de réseau : identifiant provisoire, la séance sera créée au rejeu.
      S.seanceId = seanceLocale();
      file.push({ action:'demarrer', payload:{ jour:S.jour }, local:S.seanceId, ts:Date.now() });
      ecrireJSON(CLE_FILE, file);
      S.horsLigne = true; majBandeau();
    }
  }

  // Exercice au temps : duree_s renseigné. Un nombre = durée à tenir (décompte),
  // 'max' = jusqu'à l'échec (le chrono monte).
  const auTemps = !!e.duree_s;
  const cible = auTemps && String(e.duree_s).toLowerCase() !== 'max' ? Number(e.duree_s) : 0;
  const N = b.exercices.length;

  let reps = Number(String(e.reps_cible).split('-')[0]) || 10;
  let charge = e.dernier ? e.dernier.charge : (e.charge_cible || (auTemps ? 0 : 20));
  let ecoule = 0, chrono = null, tourne = false;

  const L = $('#logger');
  L.classList.remove('hidden');
  L.innerHTML = `
    <div class="top"><button class="close">← Retour</button>
      <span class="eyebrow">${e.groupe}</span></div>
    <h3>${e.nom}</h3>
    ${e.nom_en ? `<p class="vo">${e.nom_en}</p>` : ''}
    ${N > 1 ? `<span class="eyebrow">Bloc ${b.bloc} · exercice ${e._e + 1} sur ${N}</span>` : ''}
    ${e.photo ? `<img class="illu" src="${e.photo}" alt="" loading="lazy">` : ''}
    ${e.note ? `<div class="note-coach grande"><span class="eyebrow">Note de ${S.moi.coach || 'votre coach'}</span>${e.note}</div>` : ''}
    <p class="consigne">${e.consigne || ''}</p>
    <div class="barre" style="margin-top:10px"><button class="btn ${enAttente(e.exercice_id) ? 'plein' : ''}" id="commenter" style="flex:1">Commentaires${
      enAttente(e.exercice_id) ? ' · ' + enAttente(e.exercice_id) + ' à lire' : ''}</button></div>
    ${e.cadence ? `<div class="tempo"><strong>Cadence ${e.cadence}</strong><br>${tempo(e.cadence)}
      ${courbeCadence(e.cadence, true)}</div>` : ''}
    <div class="sets" id="sets"></div>
    <div class="steppers">
      ${auTemps ? `
      <div class="stepper chrono"><div class="eyebrow">${cible ? 'À tenir' : 'Durée'}</div>
        <div class="val num" id="vChrono">${duree(cible || 0)}</div>
        <div class="row"><button id="go">Démarrer</button></div></div>` : `
      <div class="stepper"><div class="eyebrow">Répétitions</div>
        <div class="val num" id="vReps">${reps}</div>
        <div class="row"><button data-r="-1">−</button><button data-r="1">+</button></div></div>`}
      <div class="stepper"><div class="eyebrow">Charge (kg)</div>
        <div class="val num" id="vCharge">${charge}</div>
        <div class="row"><button data-c="-2.5">−</button><button data-c="2.5">+</button></div></div>
    </div>
    <div id="origine" class="origine"></div>
    <button class="valider">Valider la série ${(S.faits[e.exercice_id] || []).length + 1}</button>
    <div class="barre"><button class="btn" id="finir" style="flex:1">Terminer cet exercice</button></div>`;

  const maj = () => {
    // Le logger a pu être fermé ou remplacé pendant que le chrono tournait :
    // on arrête plutôt que d'écrire dans un DOM qui n'existe plus.
    const champ = auTemps ? $('#vChrono') : $('#vReps');
    if (!champ || L.classList.contains('hidden')) { clearInterval(chrono); chrono = null; return; }
    if (auTemps) {
      const reste = cible ? Math.max(0, cible - ecoule) : ecoule;
      champ.textContent = duree(reste);
      champ.classList.toggle('court', cible > 0 && tourne && reste <= 5);
    } else {
      champ.textContent = reps;
    }
    $('#vCharge').textContent = charge;
    majOrigine(e, charge);
    const btn = L.querySelector('.valider');
    btn.textContent = `Valider la série ${(S.faits[e.exercice_id] || []).length + 1}`;
    btn.disabled = auTemps && ecoule === 0;
    $('#sets').innerHTML = (S.faits[e.exercice_id] || []).map((x, n) =>
      `<span class="set">${n + 1} · ${x.duree_s ? duree(x.duree_s) : x.reps + ' × ' + x.charge + ' kg'}</span>`).join('');
  };
  maj();

  if (auTemps) {
    const go = L.querySelector('#go');
    const stop = (libelle) => { clearInterval(chrono); chrono = null; tourne = false; go.textContent = libelle; maj(); };
    go.onclick = () => {
      if (tourne) return stop('Reprendre');
      tourne = true; go.textContent = 'Arrêter'; maj();
      chrono = setInterval(() => {
        ecoule++;
        if (cible && ecoule >= cible) { ecoule = cible; bip(); stop('Terminé'); return; }
        maj();
      }, 1000);
    };
  } else {
    L.querySelectorAll('[data-r]').forEach(x => x.onclick = () => { reps = Math.max(1, reps + Number(x.dataset.r)); maj(); });
  }
  L.querySelectorAll('[data-c]').forEach(x => x.onclick = () => { charge = Math.max(0, charge + Number(x.dataset.c)); maj(); });
  L.querySelector('.close').onclick = () => { clearInterval(chrono); L.classList.add('hidden'); vueSeance(); };
  L.querySelector('#commenter').onclick = () => modalCommentaires(e.exercice_id, e.nom, null);

  const ouvert = x => S.finis.indexOf(x.exercice_id) === -1;

  /**
   * Après une série validée, deux minuteurs distincts :
   *  - il reste des exercices ouverts dans le bloc → PAUSE (pause_s), on enchaîne ;
   *  - le tour est bouclé → REPOS (repos_s), puis retour au premier encore ouvert.
   * `clos` force la sortie de l'exercice courant : le pratiquant l'a terminé de
   * lui-même, sans forcément avoir fait toutes ses séries.
   */
  const suite = (clos) => {
    const faits = (S.faits[e.exercice_id] || []).length;
    const apres = b.exercices.slice(e._e + 1).filter(ouvert);

    if (N > 1 && apres.length) {
      return lancerMinuteur(e.pause_s, 'Pause', () => ouvrirLogger(apres[0]._i));
    }
    // Tour bouclé. Reste-t-il des tours à faire, sur des exercices encore ouverts ?
    const restants = b.exercices.filter(ouvert);
    if (!clos && faits < b.series && restants.length) {
      return lancerMinuteur(b.repos_s, 'Repos', () => {
        if (N > 1) ouvrirLogger(restants[0]._i);
      });
    }
    clearInterval(chrono);
    L.classList.add('hidden');
    vueSeance();
  };

  L.querySelector('#finir').onclick = async function () {
    this.disabled = true;
    clearInterval(chrono); chrono = null; tourne = false;
    try {
      if (S.seanceId) await ecrire('finirExercice', { seance_id:S.seanceId, exercice_id:e.exercice_id, jour:S.jour });
      if (ouvert(e)) S.finis.push(e.exercice_id);
      suite(true);
    } catch (err) { toast(err.message); this.disabled = false; }
  };

  L.querySelector('.valider').onclick = async function () {
    this.disabled = true;
    clearInterval(chrono); chrono = null; tourne = false;
    try {
      const num = (S.faits[e.exercice_id] || []).length + 1;
      const p = { seance_id:S.seanceId, exercice_id:e.exercice_id, serie_num:num, charge };
      if (auTemps) p.duree_s = ecoule; else p.reps = reps;
      await ecrire('serie', Object.assign({ jour:S.jour }, p));
      (S.faits[e.exercice_id] = S.faits[e.exercice_id] || [])
        .push(auTemps ? { duree_s:ecoule, charge } : { reps, charge });
      if (auTemps) { ecoule = 0; const g = L.querySelector('#go'); if (g) g.textContent = 'Démarrer'; }
      maj();
      suite();
    } catch (err) {
      toast('Non enregistré : ' + err.message);
      this.disabled = false;
    }
  };
}

const PHASES = ['montée', 'position haute', 'descente', 'position basse'];

/** « 1-0-3-1 » → « 1 s montée · 0 s position haute · 3 s descente · 1 s position basse ». */
function tempo(c) {
  const p = cadence4(c);
  return p ? PHASES.map((l, i) => `${p[i]} s ${l}`).join(' · ') : '';
}

function cadence4(c) {
  const p = String(c).split('-').map(x => Number(x.trim()));
  return p.length === 4 && p.every(n => !isNaN(n) && n >= 0) ? p : null;
}

/**
 * Courbe du tempo : le temps en abscisse, la position de la charge en ordonnée.
 * Quatre phases dans l'ordre montée · position haute · descente · position basse.
 * La pente dit la vitesse, le plat dit l'arrêt.
 */
function courbeCadence(c, grand) {
  const p = cadence4(c);
  if (!p) return '';
  const total = p[0] + p[1] + p[2] + p[3];
  if (!total) return '';

  const W = grand ? 300 : 108, H = grand ? 62 : 28, m = grand ? 6 : 3;
  const x = t => m + (W - 2 * m) * (t / total);
  const haut = m, bas = H - m;

  let t = 0;
  const pts = [[x(0), bas]];
  t += p[0]; pts.push([x(t), haut]);   // montée
  t += p[1]; pts.push([x(t), haut]);   // maintien en haut
  t += p[2]; pts.push([x(t), bas]);    // descente
  t += p[3]; pts.push([x(t), bas]);    // maintien en bas

  return `<svg class="cad${grand ? ' grand' : ''}" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
      aria-label="Cadence ${c} : ${tempo(c)}">
    <line x1="${m}" y1="${haut}" x2="${W - m}" y2="${haut}" stroke="var(--edge)" stroke-width="1"/>
    <line x1="${m}" y1="${bas}" x2="${W - m}" y2="${bas}" stroke="var(--edge)" stroke-width="1"/>
    <polyline points="${pts.map(q => q.join(',')).join(' ')}" fill="none" stroke="var(--brand-ink)"
      stroke-width="${grand ? 2.5 : 2}" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

/**
 * Clôt la séance. Rien n'oblige à avoir tout fait : les exercices non commencés
 * restent simplement non commencés, la séance est enregistrée telle quelle.
 */
function modalFinSeance() {
  const total = S.exos.length;

    (S.faits[x.exercice_id] || []).length >= x.series).length;

  const w = modal('Terminer la séance', `
    <p class="consigne">${clos} exercice${clos > 1 ? 's' : ''} sur ${total}${
      clos < total ? ' — les autres resteront non faits, c\'est sans conséquence.' : ' — séance complète.'}</p>
    <div class="duo">
      <div class="champ"><label>Durée (min)</label>
        <input class="f" id="fDur" type="number" min="1" value="${mins}"></div>
      <div class="champ"><label>Ressenti</label>
        <select class="f" id="fRes">${['Facile', 'Correct', 'Dur', 'Très dur'].map(r =>
          `<option ${r === 'Correct' ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
    </div>
    <div class="champ"><label>Notes</label>

  w.querySelector('#fAnn').onclick = w.fermer;
  w.querySelector('#fOk').onclick = async function () {
    this.disabled = true;
    try {
      await ecrire('terminer', {

        jour: S.jour,

      cache('accueil', undefined);   // la prochaine séance a changé
      try { S.moi = await api('bootstrap'); sauverSession(); } catch (err) {}
      vueSeance();
    } catch (err) { toast(err.message); this.disabled = false; }
  };
}

/**

 * `email` n'est renseigné que par le coach ; un pratiquant écrit sur son fil.
 */
async function modalCommentaires(exerciceId, nomExercice, email) {
  const w = modal(nomExercice, `
    <div id="fil" class="fil"><div class="empty" style="padding:14px 0">Chargement…</div></div>
    <div class="champ"><textarea class="f" id="cmTexte" rows="3"
      placeholder="${email ? 'Un mot pour votre pratiquant…' : 'Une question, une sensation, une gêne…'}"></textarea></div>
    <div class="barre" style="margin-top:0">
      <button class="btn" id="cmAnn">Fermer</button>
      <button class="btn plein" id="cmOk" style="flex:1">Envoyer</button></div>`);

  const peindre = async () => {
    let fil;
    try { fil = await api('commentaires', { exercice_id: exerciceId, email }); }
    catch (err) { w.querySelector('#fil').innerHTML = `<div class="empty">${err.message}</div>`; return; }

    const jeSuisCoach = !!S.moi.estCoach;
    w.querySelector('#fil').innerHTML = fil.length
      ? fil.map(c => {
          const demoi = (c.auteur === 'coach') === jeSuisCoach;
          return `<div class="bulle ${demoi ? 'moi' : 'coach'}">
            <span class="qui">${c.auteur === 'coach' ? (S.moi.coach || 'Coach') : 'Pratiquant'} · ${
              new Date(c.date).toLocaleDateString('fr-FR', { day:'numeric', month:'short' })}</span>
            ${c.texte}</div>`;
        }).join('')
      : `<div class="empty" style="padding:14px 0">Rien pour l'instant.<br>${
          email ? 'Écrivez la première remarque.' : 'Posez votre première question.'}</div>`;
    w.querySelector('#fil').scrollTop = 99999;

    // Ouvrir le fil vaut lecture.
    api('commentairesLus', { exercice_id: exerciceId, email }).catch(() => {});
  };
  await peindre();

  w.querySelector('#cmAnn').onclick = () => {
    w.fermer();
    api('nonLus').then(n => {

      if (S.vue === 'seance') vueSeance();

      w.querySelector('#cmTexte').value = '';
      await peindre();

    this.disabled = false;
  };
}
