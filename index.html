// ── Import Excel (gabarit modele-import.xlsx) ────────────────
// Remplace l'aller-retour par l'onglet Import du classeur (retiré avec Sheets) :
// le coach remplit le gabarit — onglets « Fiche » et « Programme » — et
// l'importe directement depuis son téléphone. SheetJS n'est chargé qu'à ce
// moment-là, ce fichier n'en a besoin nulle part ailleurs.
let _xlsxPromise = null;
function chargerXLSX() {
  if (window.XLSX) return Promise.resolve();
  if (!_xlsxPromise) {
    _xlsxPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = resolve; s.onerror = () => reject(new Error('XLSX_INDISPONIBLE'));
      document.head.appendChild(s);
    });
  }
  return _xlsxPromise;
}

/** Un onglet du classeur, en objets indexés par les en-têtes de sa première ligne. */
function feuilleEnObjets(classeur, nomFeuille) {
  const sh = classeur.Sheets[nomFeuille];
  if (!sh) throw new Error('ONGLET_MANQUANT_' + nomFeuille);
  return XLSX.utils.sheet_to_json(sh, { defval: '' });
}

/** L'onglet « Fiche » (colonnes Champ/Valeur) en objet d'en-tête de modèle. */
function ficheEnObjet(rows) {
  const parChamp = {};
  rows.forEach(r => { parChamp[String(r.Champ || '').trim()] = r.Valeur; });
  return {
    nom: String(parChamp['Nom'] || '').trim(),
    categorie: String(parChamp['Catégorie'] || '').trim(),
    difficulte: String(parChamp['Difficulté'] || '').trim(),
    duree_semaines: Number(parChamp['Durée (semaines)']) || 0,
    statut: String(parChamp['Statut'] || '').trim() || 'Brouillon',
    description: String(parChamp['Description'] || '').trim(),
    source: String(parChamp['Page source'] || '').trim(),
    video: String(parChamp['Vidéo'] || '').trim()
  };
}

/**
 * L'onglet « Programme » en lignes prêtes à écrire. Les exercices sont désignés
 * par leur nom, résolu contre le catalogue — comme dans le gabarit, aucun
 * identifiant à manipuler. Rien n'est retenu si un seul nom est introuvable :
 * mieux vaut refuser que produire un programme troué.
 */
function programmeEnLignes(rows, idsParNom) {
  const inconnus = [];
  const lignes = rows
    .filter(r => String(r.Jour || '').trim() && String(r.Exercice || '').trim())
    .map(r => {
      const nom = String(r.Exercice).trim();
      const id = idsParNom[nom.toLowerCase()];
      if (!id) inconnus.push(nom);
      return {
        jour: String(r.Jour).trim(), bloc: Number(r.Bloc) || 1, ordre: Number(r.Ordre) || 1,
        exercice_id: id || '',
        series: Number(r['Séries']) || 3,
        reps_cible: r['Répétitions'] === undefined ? '' : String(r['Répétitions']),
        duree_s: r['Durée (s)'] === undefined || r['Durée (s)'] === '' ? '' : r['Durée (s)'],
        charge_cible: Number(r['Charge (kg)']) || 0,
        pct_rm: Number(String(r['% du max']).replace('%', '')) || 0,
        cadence: String(r.Cadence || ''),
        pause_s: Number(r['Pause (s)']) || 0,
        repos_s: Number(r['Repos (s)']) || 90
      };
    });
  if (inconnus.length) throw new Error('EXERCICES_INCONNUS: ' + [...new Set(inconnus)].join(', '));
  return lignes;
}

/** Identifiants d'exercice indexés par nom (minuscules), pour résoudre un import. */
async function idsExercicesParNom() {
  if (!S.idsParNom) {
    S.idsParNom = {};
    (await dataCatalogue()).forEach(e => { if (e.nom) S.idsParNom[e.nom.trim().toLowerCase()] = e.id; });
  }
  return S.idsParNom;
}

/** Transforme un classeur d'import (gabarit modele-import.xlsx) en modèle. */
async function importerModele(classeur) {
  const { db, doc, collection, addDoc, writeBatch, serverTimestamp } = FB;
  const fiche = ficheEnObjet(feuilleEnObjets(classeur, 'Fiche'));
  if (!fiche.nom) throw new Error('NOM_REQUIS');
  const idsParNom = await idsExercicesParNom();
  const lignes = programmeEnLignes(feuilleEnObjets(classeur, 'Programme'), idsParNom);
  if (!lignes.length) throw new Error('FEUILLE_VIDE');

  const ref = await addDoc(collection(db, 'modeles'), {
    nom: fiche.nom, categorie: fiche.categorie, difficulte: fiche.difficulte,
    duree_semaines: fiche.duree_semaines, statut: fiche.statut,
    description: fiche.description, source: fiche.source, video: fiche.video,
    nb_jours: new Set(lignes.map(l => l.jour)).size, nb_exercices: lignes.length,
    cree_le: serverTimestamp()
  });
  const b = writeBatch(db);
  lignes.forEach(l => b.set(doc(collection(db, 'modeles', ref.id, 'lignes')), l));
  await b.commit();
  return { id: ref.id, nom: fiche.nom, jours: new Set(lignes.map(l => l.jour)).size, lignes: lignes.length };
}

function modalImportFeuille() {
  const w = modal('Importer un programme', `
    <p class="consigne">Le fichier <code>modele-import.xlsx</code> rempli, avec ses onglets
      « Fiche » et « Programme ». Rien n'est créé si un seul nom de l'onglet « Programme »
      est introuvable dans le catalogue.</p>
    <div class="champ"><label>Fichier</label>
      <input class="f" id="ifFile" type="file" accept=".xlsx"></div>
    <div class="barre"><button class="btn" id="ifAnn">Annuler</button>
      <button class="btn plein" id="ifOk" style="flex:1" disabled>Importer</button></div>`);

  w.querySelector('#ifAnn').onclick = w.fermer;
  const champ = w.querySelector('#ifFile');
  const ok = w.querySelector('#ifOk');
  champ.onchange = () => { ok.disabled = !champ.files.length; };

  ok.onclick = async function () {
    this.disabled = true; this.textContent = 'Import…';
    try {
      await chargerXLSX();
      const buf = await champ.files[0].arrayBuffer();
      const classeur = XLSX.read(new Uint8Array(buf), { type: 'array' });
      const r = await importerModele(classeur);
      w.fermer();
      toast(`${r.nom} importé : ${r.jours} jour${r.jours > 1 ? 's' : ''}, ${r.lignes} ligne${r.lignes > 1 ? 's' : ''}`);
    } catch (err) {
      const inconnus = /^EXERCICES_INCONNUS: (.+)$/.exec(err.message);
      const manquant = /^ONGLET_MANQUANT_(.+)$/.exec(err.message);
      toast(inconnus ? 'Noms introuvables : ' + inconnus[1]
          : manquant ? `Onglet « ${manquant[1]} » manquant dans le fichier`
          : err.message === 'FEUILLE_VIDE' ? "L'onglet Programme est vide"
          : err.message === 'NOM_REQUIS' ? "Renseignez le nom dans l'onglet Fiche"
          : err.message);
      this.disabled = false; this.textContent = 'Importer';
    }
  };
}

// ── Modèles génériques ───────────────────────────────────────
const DIFFICULTES = ['Débutant', 'Intermédiaire', 'Avancé', 'Challengeant'];
const SANS_CAT = 'Sans catégorie';
const SANS_DIF = 'Sans difficulté';

/** Ordre d'affichage des difficultés : celles qu'on connaît, puis les autres. */
function ordreDifficulte(d) {
  const i = DIFFICULTES.indexOf(d);
  return i === -1 ? (d === SANS_DIF ? 99 : 50) : i;
}

async function vueModeles() {
  try { S.modeles = await dataModeles(); }
  catch (err) { $('#zone').innerHTML = `<div class="empty">Impossible de charger.<br>${err.message}</div>`; return; }
  return S.coach.categorie ? peindreCategorie() : peindreCategories();
}

/** Premier niveau : les catégories, en boutons. */
function peindreCategories() {
  const cats = {};
  S.modeles.forEach(m => {
    const c = (m.categorie || '').trim() || SANS_CAT;
    (cats[c] = cats[c] || []).push(m);
  });
  const noms = Object.keys(cats).sort((a, b) =>
    a === SANS_CAT ? 1 : b === SANS_CAT ? -1 : a.localeCompare(b, 'fr'));

  $('#zone').innerHTML = `
    <div class="barre" style="margin-top:0">
      <button class="btn plein" id="nm" style="flex:1">＋ Nouveau modèle</button></div>
    <p class="consigne" style="margin-top:12px">Un modèle est un programme générique, sans pratiquant.
      On le compose une fois, puis on le donne à qui l'on veut, autant de fois qu'on veut.</p>
    <div class="cats">${noms.map(c => `
      <button class="cat" data-cat="${c}">
        <span class="nom">${c}</span>
        <span class="compte num">${cats[c].length}</span>
      </button>`).join('') || `<div class="empty">Aucun modèle pour l'instant.</div>`}</div>`;

  $('#nm').onclick = () => modalModele(null);
  $('#zone').querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
    S.coach.categorie = b.dataset.cat;
    vueCoach();
  });
}

/** Second niveau : une catégorie, ses modèles pliés par difficulté, triés par nom. */
function peindreCategorie() {
  const cat = S.coach.categorie;
  const dedans = S.modeles.filter(m =>
    ((m.categorie || '').trim() || SANS_CAT) === cat);

  const parDif = {};
  dedans.forEach(m => {
    const d = (m.difficulte || '').trim() || SANS_DIF;
    (parDif[d] = parDif[d] || []).push(m);
  });
  const difs = Object.keys(parDif).sort((a, b) => ordreDifficulte(a) - ordreDifficulte(b));
  // Une seule section : la plier n'aurait aucun intérêt.
  const seule = difs.length === 1;

  $('#zone').innerHTML = `
    <div class="barre" style="margin-top:0">
      <button class="btn" id="retourCats">← Catégories</button>
      <button class="btn plein" id="nm" style="flex:1">＋ Nouveau modèle</button></div>
    <div style="margin-top:18px">${difs.map(d => `
      <details class="pli" ${seule ? 'open' : ''}>
        <summary>
          <span class="eyebrow">${d}</span>
          <span class="compte num">${parDif[d].length}</span>
        </summary>
        ${parDif[d].sort((a, b) => a.nom.localeCompare(b.nom, 'fr')).map(m => `
          <div class="ligne" data-md="${m.id}">
            <div class="g">
              <div class="nom">${m.nom}</div>
              <div class="meta">${[
                m.duree_semaines ? m.duree_semaines + ' semaines' : '',
                m.nbJours + ' jour' + (m.nbJours > 1 ? 's' : ''),
                m.nbExercices + ' exercices'].filter(Boolean).join(' · ')}</div>
            </div>
            ${m.video ? '<span class="poignee lien" title="Vidéo">▶</span>' : ''}
            ${m.source ? '<span class="poignee lien" title="Source documentée">↗</span>' : ''}
            <span class="tag ${m.statut === 'Brouillon' ? 'warn' : ''}">${m.statut}</span>
          </div>`).join('')}
      </details>`).join('') || `<div class="empty">Aucun modèle dans cette catégorie.</div>`}</div>`;

  $('#retourCats').onclick = () => { S.coach.categorie = null; vueCoach(); };
  $('#nm').onclick = () => modalModele(null);
  $('#zone').querySelectorAll('[data-md]').forEach(l =>
    l.onclick = () => { S.coach.modele = l.dataset.md; S.ed = null; vueCoach(); });
}

/**
 * Encart vidéo. YouTube et Vimeo sont intégrés dans un lecteur ; toute autre
 * adresse devient un simple lien — intégrer n'importe quelle URL dans une iframe
 * exposerait l'app à ce que sert la page.
 */
function lecteur(url) {
  if (!url) return '';
  const yt = /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/.exec(url);
  const vi = /vimeo\.com\/(?:video\/)?(\d+)/.exec(url);
  const src = yt ? `https://www.youtube-nocookie.com/embed/${yt[1]}`
            : vi ? `https://player.vimeo.com/video/${vi[1]}` : null;
  if (!src) return `<div class="barre"><a class="btn contact" href="${url}" target="_blank" rel="noopener">Voir la vidéo ↗</a></div>`;
  return `<div class="video"><iframe src="${src}" title="Vidéo du programme"
    loading="lazy" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
}

  const w = modal(m ? 'Modifier le modèle' : 'Nouveau modèle', `
    <div class="champ"><label>Nom</label><input class="f" id="kNom" value="${x.nom}" placeholder="Force 5×5"></div>
    <div class="duo">
      <div class="champ"><label>Catégorie</label>
        <input class="f" id="kCat" value="${x.categorie}" list="lCat" placeholder="Force, Hypertrophie…">
        <datalist id="lCat">${cats.map(c => `<option>${c}</option>`).join('')}</datalist></div>
      <div class="champ"><label>Difficulté</label>

          (S.modeles || []).map(y => (y.difficulte || '').trim()).filter(Boolean)))].map(d =>
          `<option>${d}</option>`).join('')}</datalist></div>
    </div>
    <div class="duo">
      <div class="champ"><label>Durée (semaines)</label><input class="f" id="kDur" type="number" min="0" value="${x.duree_semaines || ''}"></div>
      <div class="champ"><label>Statut</label>
        <select class="f" id="kSta">${['Brouillon', 'Actif', 'Archivé'].map(d =>
          `<option ${d === x.statut ? 'selected' : ''}>${d}</option>`).join('')}</select></div>
    </div>
    <p class="consigne">Catégorie et difficulté sont libres : tapez ce que vous voulez,
      les valeurs déjà utilisées sont proposées.</p>
    <div class="champ"><label>Description</label><textarea class="f" id="kDes" rows="3">${x.description}</textarea></div>
    <div class="champ"><label>Page source</label>
      <input class="f" id="kSrc" value="${x.source || ''}" placeholder="https://…"></div>
    <div class="champ"><label>Vidéo</label>
      <input class="f" id="kVid" value="${x.video || ''}" placeholder="https://youtu.be/…"></div>
    <div class="barre"><button class="btn" id="kAnn">Annuler</button>
      <button class="btn plein" id="kOk" style="flex:1">Enregistrer</button></div>
    ${m ? '<div class="barre"><button class="btn danger" id="kDel">Supprimer le modèle</button></div>' : ''}`);

  w.querySelector('#kAnn').onclick = w.fermer;
  w.querySelector('#kOk').onclick = async function () {
    this.disabled = true;
    try {
      const r = await sauverModele({
        id: x.id || undefined,
        nom: w.querySelector('#kNom').value,
        categorie: w.querySelector('#kCat').value,
        difficulte: w.querySelector('#kDif').value,
        duree_semaines: w.querySelector('#kDur').value,
        statut: w.querySelector('#kSta').value,
        description: w.querySelector('#kDes').value,
        source: w.querySelector('#kSrc').value,
        video: w.querySelector('#kVid').value
      });
      w.fermer(); toast('Modèle enregistré');
      S.coach.modele = x.id || r.id; S.ed = null; vueCoach();
    } catch (err) { toast(err.message === 'NOM_REQUIS' ? 'Le nom est obligatoire' : err.message); this.disabled = false; }
  };
  if (m) w.querySelector('#kDel').onclick = async function () {
    this.disabled = true;
    try {
      await supprimerModele(x.id);
      w.fermer(); toast('Modèle supprimé');
      S.coach.modele = null; S.ed = null; vueCoach();
    } catch (err) { toast(err.message); this.disabled = false; }
  };
}

/** Écran d'un modèle : sa fiche, puis le même éditeur de jours que pour un pratiquant. */
async function vueModele() {
  // Les deux lectures partent ensemble. Le groupage en un seul aller-retour
  // (`lot`) n'existait que pour amortir la latence d'Apps Script ; Firestore
  // répond en parallèle, souvent depuis son cache local.
  let m, cat;
  try {
    [m, cat] = await Promise.all([
      dataModele(S.coach.modele),
      S.cat ? null : dataCatalogue()      // le sélecteur d'exercices s'en sert
    ]);
  } catch (err) { $('#zone').innerHTML = `<div class="empty">Impossible de charger.<br>${err.message}</div>`; return; }
  S.modele = m;
  if (cat) S.cat = cat;
  const jours = m.jours.map(j => j.jour);

  if (!S.ed || S.ed.cible !== 'modele' || S.ed.modele_id !== m.id ||
      (!S.ed.neuf && jours.indexOf(S.ed.jour) === -1)) {
    S.ed = null;
    if (jours.length) chargerJour(jours[0]);
  }

  $('#zone').innerHTML = `
    <div class="card" style="display:block;margin-bottom:16px">
      <div class="nom">${m.nom}</div>
      <div class="meta">${[m.categorie, m.difficulte,
        m.duree_semaines ? m.duree_semaines + ' semaines' : '', m.statut].filter(Boolean).join(' · ')}</div>
      ${m.description ? `<p class="consigne" style="margin-top:8px">${m.description}</p>` : ''}
      ${lecteur(m.video)}
      <div class="barre">
        <button class="btn" id="editMeta">Modifier la fiche</button>
        ${m.source ? `<a class="btn contact" href="${m.source}" target="_blank" rel="noopener">Source ↗</a>` : ''}
      </div>
    </div>
    <div class="days" id="jours">
      ${jours.map(j => `<button class="day" data-j="${j}" aria-pressed="${S.ed && S.ed.jour === j}">${j}</button>`).join('')}
      <button class="day" id="addJour">＋ jour</button>
    </div>
    <div id="edit"></div>`;

  $('#editMeta').onclick = () => modalModele(m);
  $('#zone').querySelectorAll('.day[data-j]').forEach(b =>
    b.onclick = () => { chargerJour(b.dataset.j); vueModele(); });
  $('#addJour').onclick = modalNouveauJour;
  peindreEditeur();
}

function peindreMaxis(filtre) {
  const q = (filtre || '').toLowerCase();

  $('#zone').innerHTML = `
    <p class="consigne">Le 1RM sert à traduire un pourcentage en kilos. Sans valeur

}

// ── Programme d'un pratiquant ────────────────────────────────
async function vueProgramme() {
  // Les lectures partent ensemble : la liste des attributions, le catalogue
  // si on ne l'a pas encore, et le contenu de l'attribution visée.
  let atts, prog;
  try {
    [atts, , prog] = await Promise.all([
      dataAttributions(S.coach.email),
      S.cat ? null : dataCatalogue().then(c => { S.cat = c; }),
      dataProgramme(S.coach.email, S.attSel || undefined)
    ]);
  } catch (err) { $('#zone').innerHTML = `<div class="empty">${err.message}</div>`; return; }

  S.atts = atts;
  if (!S.attSel || !atts.some(a => a.id === S.attSel)) {
    const active = atts.find(a => a.statut === 'En cours');
    S.attSel = (active || atts[0] || {}).id || null;
    // L'attribution visée a changé en cours de route : on va rechercher la bonne.
    if (S.attSel && (!prog.attribution || prog.attribution.id !== S.attSel)) {
      prog = await dataProgramme(S.coach.email, S.attSel);
    }
  }

  if (!S.attSel) {
    $('#zone').innerHTML = `
      <div class="empty">Aucun programme attribué.<br>Donnez-lui un modèle, ou partez d'une page blanche.</div>
      <div class="barre"><button class="btn plein" id="donner" style="flex:1">Donner un programme</button></div>`;
    $('#donner').onclick = modalAttribuer;
    return;
  }

  S.prog = prog;
  const att = S.atts.find(a => a.id === S.attSel);
  const jours = prog.jours.map(j => j.jour);

  if (!S.ed || S.ed.cible !== 'programme' || S.ed.attribution_id !== S.attSel ||
      (!S.ed.neuf && jours.indexOf(S.ed.jour) === -1)) {
    S.ed = null;
    if (jours.length) chargerJour(jours[0]);
  }

  const debut = att.date_debut ? new Date(att.date_debut).toLocaleDateString('fr-FR') : '';
  $('#zone').innerHTML = `
    <div class="champ">
      <label>Programme attribué</label>
      <select class="f" id="selAtt">${S.atts.map(a => `<option value="${a.id}" ${a.id === S.attSel ? 'selected' : ''}>
        ${a.nom} · ${a.statut}${a.date_debut ? ' · depuis le ' + new Date(a.date_debut).toLocaleDateString('fr-FR') : ''}</option>`).join('')}</select>
    </div>
    <div class="meta" style="color:var(--dust);font-size:12.5px;margin:-2px 0 12px">
      ${att.nbJours} jour${att.nbJours > 1 ? 's' : ''} · ${att.nbExercices} exercices${debut ? ' · démarré le ' + debut : ''}${
      att.modele_id ? ' · issu d\'un modèle' : ' · sur mesure'}</div>
    <div class="barre" style="margin-top:0">
      <button class="btn plein" id="donner">Donner un programme</button>
      <button class="btn" id="prevenir">Prévenir</button>
      ${att.statut === 'En cours' ? '<button class="btn" id="clore">Clore</button>' : ''}
      <button class="btn danger" id="supprAtt">Supprimer</button>
    </div>
    <div class="days" id="jours" style="margin-top:16px">
      ${jours.map(j => `<button class="day" data-j="${j}" aria-pressed="${S.ed && S.ed.jour === j}">${j}</button>`).join('')}
      <button class="day" id="addJour">＋ jour</button>
    </div>
    <div id="edit"></div>`;

  $('#selAtt').onchange = e => { S.attSel = e.target.value; S.ed = null; vueProgramme(); };
  $('#donner').onclick = modalAttribuer;
  $('#prevenir').onclick = () => modalNotifier(S.attSel, S.coach.email);
  $('#addJour').onclick = modalNouveauJour;
  $('#zone').querySelectorAll('.day[data-j]').forEach(b =>
    b.onclick = () => { chargerJour(b.dataset.j); vueProgramme(); });

  const cl = $('#clore');
  if (cl) cl.onclick = async function () {
    this.disabled = true;
    try {
      await majAttribution(S.attSel, { statut: 'Terminé', date_fin: true });
      toast('Programme clos'); vueProgramme();
    } catch (err) { toast(err.message); this.disabled = false; }
  };
  $('#supprAtt').onclick = async function () {
    this.disabled = true;
    try {
      await supprimerAttribution(S.attSel);
      toast('Attribution supprimée'); S.attSel = null; S.ed = null; vueProgramme();
    } catch (err) { toast(err.message); this.disabled = false; }
  };

  peindreEditeur();
}

/** Donner un programme : depuis un modèle, ou vierge pour du sur-mesure. */
async function modalAttribuer() {
  const mods = await dataModeles();
  const cats = [...new Set(mods.map(m => (m.categorie || '').trim()).filter(Boolean))].sort();
  const difs = [...new Set(mods.map(m => (m.difficulte || '').trim()).filter(Boolean))]
    .sort((a, b) => ordreDifficulte(a) - ordreDifficulte(b));

  const w = modal('Donner un programme', `
    <div class="duo">
      <div class="champ"><label>Catégorie</label>
        <select class="f" id="fCat"><option value="">Toutes</option>
          ${cats.map(c => `<option>${c}</option>`).join('')}</select></div>
      <div class="champ"><label>Difficulté</label>
        <select class="f" id="fDif"><option value="">Toutes</option>
          ${difs.map(d => `<option>${d}</option>`).join('')}</select></div>
    </div>
    <div class="champ"><label>Modèle de départ · <span id="fCompte">${mods.length}</span></label>
      <select class="f" id="aMod" size="7">
        <option value="">— Sur mesure, page blanche —</option>
      </select></div>
    <div class="champ"><label>Nom donné au pratiquant</label>
      <input class="f" id="aNom" placeholder="Laisser vide pour reprendre le nom du modèle"></div>
    <div class="champ"><label>Date de début</label>
      <input class="f" id="aDeb" type="date" value="${new Date().toISOString().slice(0, 10)}"></div>
    <p class="consigne">Le contenu du modèle est <strong>copié</strong> : le personnaliser ensuite
      ne touche pas le modèle, et le programme en cours est clos automatiquement.</p>
    <div class="barre"><button class="btn" id="aAnn">Annuler</button>
      <button class="btn plein" id="aOk" style="flex:1">Attribuer</button></div>`);

  // Les deux filtres sont facultatifs et se combinent.
  const filtrer = () => {
    const c = w.querySelector('#fCat').value, d = w.querySelector('#fDif').value;
    const vus = mods.filter(m => (!c || (m.categorie || '').trim() === c)
                              && (!d || (m.difficulte || '').trim() === d))
                    .sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
    w.querySelector('#fCompte').textContent = vus.length;
    w.querySelector('#aMod').innerHTML = `<option value="">— Sur mesure, page blanche —</option>` +
      vus.map(m => `<option value="${m.id}">${m.nom}${
        m.duree_semaines ? ' · ' + m.duree_semaines + ' sem.' : ''} · ${m.nbJours} j</option>`).join('');
  };
  w.querySelector('#fCat').onchange = filtrer;
  w.querySelector('#fDif').onchange = filtrer;
  filtrer();

  w.querySelector('#aAnn').onclick = w.fermer;
  w.querySelector('#aOk').onclick = async function () {
    this.disabled = true;
    try {
      const r = await creerAttribution(S.coach.email, {
        modele_id: w.querySelector('#aMod').value || undefined,
        nom: w.querySelector('#aNom').value,
        date_debut: w.querySelector('#aDeb').value
      });
      w.fermer();
      toast(r.lignes ? `${r.nom} attribué, ${r.lignes} lignes copiées` : `${r.nom} attribué`);
      S.attSel = r.id; S.ed = null;
      await vueProgramme();
      modalNotifier(r.id, S.coach.email);   // enchaîner : un programme donné s'annonce
    } catch (err) { toast(err.message); this.disabled = false; }
  };
}

// ── Éditeur de jour, commun aux modèles et aux programmes ─────
/** Chaque bloc et chaque exercice reçoit une identité, seule façon de relire
 *  l'ordre après un déplacement : la position ne peut pas servir de clé. */
let _uid = 0;
function marquer(blocs) {
  blocs.forEach(b => {
    if (!b._uid) b._uid = 'b' + (++_uid);
    b.exercices.forEach(e => { if (!e._uid) e._uid = 'e' + (++_uid); });
  });
  return blocs;
}

/**
 * Transforme les blocs de l'éditeur en lignes plates, prêtes à écrire —
 * équivalent direct de `aplatirBlocs_`. Lève si un exercice n'existe plus au
 * catalogue ; en pratique injoignable depuis l'éditeur, qui ne propose que
 * des exercices choisis dans le catalogue, mais on ne fait pas confiance à
 * un id qui aurait pu être manipulé.
 */
async function aplatirBlocs(blocs, jour) {
  const connus = await catalogueParId();
  const rangs = [];
  (blocs || []).forEach((b, bi) => {
    (b.exercices || []).forEach((e, ei) => {
      if (!connus[e.exercice_id]) throw new Error('EXERCICE_INCONNU_' + e.exercice_id);
      rangs.push({
        jour, bloc: bi + 1, ordre: ei + 1, exercice_id: e.exercice_id,
        series: Number(b.series) || 3,
        reps_cible: e.reps_cible === undefined ? '' : e.reps_cible,
        duree_s: e.duree_s === undefined ? '' : e.duree_s,
        charge_cible: Number(e.charge_cible) || 0,
        pct_rm: Number(String(e.pct_rm).replace('%', '')) || 0,
        cadence: e.cadence || '',
        pause_s: Number(e.pause_s) || 0,
        repos_s: Number(b.repos_s) || 90,
        note: e.note || ''
      });
    });
  });
  if (!rangs.length) throw new Error('PROGRAMME_VIDE');
  return rangs;
}

/**
 * Réécrit un jour dans une collection de lignes (celles d'un modèle ou d'une
 * attribution — même structure, seule la clé de rattachement change). Les
 * lignes de ce jour sont remplacées, les autres jours ne bougent pas. Les
 * compteurs dénormalisés `nb_jours`/`nb_exercices` du doc parent (lus par les
 * listes de modèles/attributions) sont recalculés au passage.
 */
async function sauverLignesJour(refDoc, refLignes, jour, blocs) {
  const { db, doc, getDocs, writeBatch, updateDoc } = FB;
  const rangs = await aplatirBlocs(blocs, jour);
  const existantes = await getDocs(refLignes);
  const b = writeBatch(db);
  existantes.docs.forEach(d => { if (String(d.data().jour) === jour) b.delete(d.ref); });
  rangs.forEach(r => b.set(doc(refLignes), r));
  await b.commit();
  const toutes = (await getDocs(refLignes)).docs.map(d => d.data());
  await updateDoc(refDoc, { nb_jours: new Set(toutes.map(l => l.jour)).size, nb_exercices: toutes.length });
  return { lignes: rangs.length };
}

/** Supprime un jour d'une collection de lignes, et recalcule les compteurs. */
async function supprimerLignesJour(refDoc, refLignes, jour) {
  const { db, getDocs, writeBatch, updateDoc } = FB;
  const existantes = await getDocs(refLignes);
  const b = writeBatch(db);
  let n = 0;
  existantes.docs.forEach(d => { if (String(d.data().jour) === jour) { b.delete(d.ref); n++; } });
  await b.commit();
  const restantes = (await getDocs(refLignes)).docs.map(d => d.data());
  await updateDoc(refDoc, { nb_jours: new Set(restantes.map(l => l.jour)).size, nb_exercices: restantes.length });
  return { supprimees: n };
}

function chargerJour(jour) {
  const modele = !!S.coach.modele;
  const src = modele ? S.modele : S.prog;
  const j = ((src && src.jours) || []).find(x => x.jour === jour);
  S.ed = {
    cible: modele ? 'modele' : 'programme',
    modele_id: modele ? S.coach.modele : null,
    email: modele ? null : S.coach.email,
    attribution_id: modele ? null : S.attSel,
    jour: jour,
    neuf: !j,
    blocs: marquer(j ? JSON.parse(JSON.stringify(j.blocs)) : [])
  };
}

function modalNouveauJour() {
  const w = modal('Nouveau jour', `
    <div class="champ"><label>Intitulé</label>
      <input class="f" id="nj" placeholder="Lundi — Haut du corps" list="lj">
      <datalist id="lj">${SEMAINE.map(j => `<option>${j} — </option>`).join('')}</datalist></div>
    <p class="consigne">Le jour de la semaine doit apparaître dans l'intitulé : c'est lui qui donne l'ordre d'affichage.</p>
    <div class="barre"><button class="btn" id="njAnn">Annuler</button>
      <button class="btn plein" id="njOk" style="flex:1">Créer</button></div>`);
  w.querySelector('#njAnn').onclick = w.fermer;
  w.querySelector('#njOk').onclick = () => {
    const v = w.querySelector('#nj').value.trim();
    if (!v) return toast('Donnez un intitulé');
    chargerJour(v);
    S.ed.neuf = true; S.ed.blocs = [];
    w.fermer();
    document.querySelectorAll('.day[data-j]').forEach(b => b.setAttribute('aria-pressed', 'false'));
    peindreEditeur();
  };
}

async function enregistrerJour() {
  const ed = S.ed;
  const btn = $('#save');
  if (!ed.blocs.length || ed.blocs.every(b => !b.exercices.length))
    return toast('Ajoutez au moins un exercice');
  btn.disabled = true;
  const blocs = ed.blocs.filter(b => b.exercices.length);
  const { db, doc, collection } = FB;
  try {
    if (ed.cible === 'modele') {
      await sauverLignesJour(doc(db, 'modeles', ed.modele_id),
        collection(db, 'modeles', ed.modele_id, 'lignes'), ed.jour, blocs);
      toast('Jour enregistré'); S.ed = null; vueModele();
    } else {
      await sauverLignesJour(doc(db, 'attributions', ed.attribution_id),
        collection(db, 'attributions', ed.attribution_id, 'programme'), ed.jour, blocs);
      toast('Jour enregistré'); S.ed = null; vueProgramme();
    }
  } catch (err) { toast(err.message); btn.disabled = false; }
}

async function supprimerJour(btn) {
  const ed = S.ed;
  btn.disabled = true;
  const { db, doc, collection } = FB;
  try {
    if (ed.cible === 'modele') {
      await supprimerLignesJour(doc(db, 'modeles', ed.modele_id),
        collection(db, 'modeles', ed.modele_id, 'lignes'), ed.jour);
      toast('Jour supprimé'); S.ed = null; vueModele();
    } else {
      await supprimerLignesJour(doc(db, 'attributions', ed.attribution_id),
        collection(db, 'attributions', ed.attribution_id, 'programme'), ed.jour);
      toast('Jour supprimé'); S.ed = null; vueProgramme();
    }
  } catch (err) { toast(err.message); btn.disabled = false; }
}
