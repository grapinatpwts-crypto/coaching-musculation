/** Écran d'un modèle : sa fiche, puis le même éditeur de jours que pour un pratiquant. */
async function vueModele() {
  // Les deux lectures partent ensemble. Le groupage en un seul aller-retour
  // (`lot`) n'existait que pour amortir la latence d'Apps Script ; Firestore
  // répond en parallèle, souvent depuis son cache local.
  let m, cat;
  try {
    [m, cat] = await Promise.all([
      dataModele(S.coach.modele),
      S.cat ? null : dataCatalogue()      // le sélecteur d'exercices s'en sert
    ]);
  } catch (err) { $('#zone').innerHTML = `<div class="empty">Impossible de charger.<br>${err.message}</div>`; return; }
  S.modele = m;
  if (cat) S.cat = cat;
  const jours = m.jours.map(j => j.jour);

  if (!S.ed || S.ed.cible !== 'modele' || S.ed.modele_id !== m.id ||
      (!S.ed.neuf && jours.indexOf(S.ed.jour) === -1)) {
    S.ed = null;
    if (jours.length) chargerJour(jours[0]);
  }

  $('#zone').innerHTML = `
    <div class="card" style="display:block;margin-bottom:16px">
      <div class="nom">${m.nom}</div>
      <div class="meta">${[m.categorie, m.difficulte,
        m.duree_semaines ? m.duree_semaines + ' semaines' : '', m.statut].filter(Boolean).join(' · ')}</div>
      ${m.description ? `<p class="consigne" style="margin-top:8px">${m.description}</p>` : ''}
      ${lecteur(m.video)}
      <div class="barre">
        <button class="btn" id="editMeta">Modifier la fiche</button>
        ${m.source ? `<a class="btn contact" href="${m.source}" target="_blank" rel="noopener">Source ↗</a>` : ''}
      </div>
    </div>
    <div class="days" id="jours">
      ${jours.map(j => `<button class="day" data-j="${j}" aria-pressed="${S.ed && S.ed.jour === j}"
        title="${j} — appui long pour renommer">${j}</button>`).join('')}
      <button class="day" id="addJour">＋ jour</button>
    </div>
    <div id="edit"></div>`;

  $('#editMeta').onclick = () => modalModele(m);
  cablerJours(vueModele);
  $('#addJour').onclick = modalNouveauJour;
  peindreEditeur();
}

// ── Routines : ce que le coach conseille hors séance ─────────
/**
 * Les rythmes conseillés. Chacun porte les jours qu'il vise, parce que « un jour
 * sur deux » ne se calcule pas sur une semaine de sept : partir du lundi ou du
 * mardi donne deux rythmes différents, et un vrai J+2 glisserait de semaine en
 * semaine. Deux variantes fixes valent mieux qu'un calcul qui dérive.
 * Pour « une » et « deux fois par semaine », les jours ne sont qu'un point de
 * départ : c'est le pratiquant qui posera les siens à la planification.
 */
const FREQUENCES = [
  ['quotidien', 'Tous les jours', ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche']],
  ['lmvd', 'Un jour sur deux · lun, mer, ven, dim', ['Lundi', 'Mercredi', 'Vendredi', 'Dimanche']],
  ['mjs', 'Un jour sur deux · mar, jeu, sam', ['Mardi', 'Jeudi', 'Samedi']],
  ['2x', 'Deux fois par semaine', ['Lundi', 'Jeudi']],
  ['1x', 'Une fois par semaine', ['Lundi']]
];
const SANS_FREQ = 'Sans rythme conseillé';
const libelleFrequence = c => (FREQUENCES.find(f => f[0] === c) || ['', ''])[1];
const joursFrequence = c => (FREQUENCES.find(f => f[0] === c) || ['', '', []])[2];

// Une routine est faite de ces trois natures-là, ou les mêle.
const TYPES_ROUTINE = ['Mobilité', 'Étirement', 'Renforcement', 'Mixte'];

async function vueRoutines() {
  try { S.routines = await dataRoutines(); }
  catch (err) { $('#zone').innerHTML = `<div class="empty">Impossible de charger.<br>${err.message}</div>`; return; }
  peindreRoutines();
}

function peindreRoutines() {
  S.coach.fRoutines = S.coach.fRoutines || etatListe({ type: '', frequence: '', video: '' });
  monterListe(vueListeRoutines());
}

function carteRoutine(r) {
  return `<div class="ligne" data-rt="${r.id}" title="${r.nom} — appui long pour la fiche">
    <div class="g">
      <div class="nom">${r.nom}</div>
      <div class="meta">${[
        r.type, libelleFrequence(r.frequence),
        r.duree_semaines ? r.duree_semaines + ' semaines' : '',
        r.exercices.length + ' exercice' + (r.exercices.length > 1 ? 's' : '')
      ].filter(Boolean).join(' · ')}</div>
    </div>
    ${r.video ? '<span class="poignee lien" title="Vidéo">▶</span>' : ''}
    <span class="tag ${r.statut === 'Brouillon' ? 'warn' : ''}">${r.statut}</span>
  </div>`;
}

function vueListeRoutines() {
  return {
    etat: S.coach.fRoutines,
    entete: `<p class="consigne" style="margin-bottom:14px">Une routine est un mini-programme
      d'une séance — parfois d'un seul exercice — à faire en dehors des séances : mobilité,
      étirements, renforcement. Elle se conseille avec un rythme, pas avec des dates.</p>`,
    creer: { libelle: '＋ Nouvelle routine', action: () => modalRoutine(null) },
    placeholder: 'Rechercher une routine…',
    vide: 'Aucune routine ne correspond.',
    items: () => S.routines || [],
    recherche: r => `${r.nom} ${r.type} ${r.description}`,
    filtres: [
      { champ: 'type', label: 'Type',
        options: [['', 'Tous']].concat(TYPES_ROUTINE.map(t => [t, t])),
        test: (r, v) => (r.type || '') === v },
      { champ: 'frequence', label: 'Rythme',
        options: [['', 'Tous']].concat(FREQUENCES.map(f => [f[0], f[1]])),
        test: (r, v) => (r.frequence || '') === v },
      { champ: 'video', label: 'Vidéo',
        options: [['', 'Toutes'], ['1', 'Avec vidéo'], ['0', 'Sans vidéo']],
        test: (r, v) => v === '1' ? !!r.video : !r.video }
    ],
    regroupements: [
      { cle: 'defaut', libelle: 'Aucun' },
      { cle: 'type', libelle: 'Type',
        cle_de: r => r.type || 'Sans type', ordre: ordreSelon(TYPES_ROUTINE, 'Sans type') },
      { cle: 'frequence', libelle: 'Rythme',
        cle_de: r => libelleFrequence(r.frequence) || SANS_FREQ,
        ordre: ordreSelon(FREQUENCES.map(f => f[1]), SANS_FREQ) }
    ],
    carte: carteRoutine,
    // Même geste que les modèles : appui court pour ouvrir, appui long pour la fiche.
    branche: z => z.querySelectorAll('[data-rt]').forEach(l =>
      appuiLong(l,
        () => { S.coach.routine = l.dataset.rt; S.rt = null; vueCoach(); },
        () => modalRoutine((S.routines || []).find(r => String(r.id) === l.dataset.rt))))
  };
}

/** La fiche d'une routine : ce qu'elle est et à quel rythme, pas son contenu. */
function modalRoutine(r) {
  const x = r || { id:'', nom:'', type:'', description:'', video:'', source:'',
                   frequence:'', duree_semaines:'', statut:'Brouillon' };
  let type = x.type;
  const w = modal(r ? 'Modifier la routine' : 'Nouvelle routine', `
    <div class="champ"><label>Nom</label>
      <input class="f" id="rtNom" value="${x.nom}" placeholder="Mobilité d'épaule du matin"></div>
    <div class="champ"><label>Type</label>
      <div class="sous" data-role="rttyp" style="margin-bottom:0">
        ${TYPES_ROUTINE.map(t => `<button type="button" data-v="${t}" aria-pressed="${type === t}">${t}</button>`).join('')}
      </div></div>
    <div class="champ"><label>Rythme conseillé</label>
      <select class="f" id="rtFrq">
        <option value="">— À préciser —</option>
        ${FREQUENCES.map(f => `<option value="${f[0]}" ${f[0] === x.frequence ? 'selected' : ''}>${f[1]}</option>`).join('')}
      </select></div>
    <div class="duo">
      <div class="champ"><label>Semaines conseillées</label>
        <input class="f" id="rtSem" type="number" min="0" value="${x.duree_semaines || ''}" placeholder="0"></div>
      <div class="champ"><label>Statut</label>
        <select class="f" id="rtSta">${['Brouillon', 'Actif', 'Archivé'].map(s =>
          `<option ${s === x.statut ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
    </div>
    <p class="consigne">Un rythme et des semaines, pas des dates : une routine se conseille,
      c'est le pratiquant qui la posera dans sa semaine.</p>
    <div class="champ"><label>Description</label><textarea class="f" id="rtDes" rows="3">${x.description}</textarea></div>
    <div class="champ"><label>Vidéo de la routine entière</label>
      <input class="f" id="rtVid" value="${x.video || ''}" placeholder="https://vimeo.com/…"></div>
    <div class="champ"><label>Page source</label>
      <input class="f" id="rtSrc" value="${x.source || ''}" placeholder="https://…"></div>
    <div class="barre"><button class="btn" id="rtAnn">Annuler</button>
      <button class="btn plein" id="rtOk" style="flex:1">Enregistrer</button></div>
    ${r ? '<div class="barre"><button class="btn danger" id="rtDel">Supprimer la routine</button></div>' : ''}`);

  pastilleGroupe(w, 'rttyp', v => { type = v; });
  w.querySelector('#rtAnn').onclick = w.fermer;
  w.querySelector('#rtOk').onclick = async function () {
    this.disabled = true;
    try {
      const res = await sauverRoutine({
        id: x.id || undefined,
        nom: w.querySelector('#rtNom').value,
        type,
        frequence: w.querySelector('#rtFrq').value,
        duree_semaines: w.querySelector('#rtSem').value,
        statut: w.querySelector('#rtSta').value,
        description: w.querySelector('#rtDes').value,
        video: w.querySelector('#rtVid').value,
        source: w.querySelector('#rtSrc').value
      });
      w.fermer(); toast('Routine enregistrée');
      S.coach.routine = x.id || res.id; S.rt = null; vueCoach();
    } catch (err) {
      toast(err.message === 'NOM_REQUIS' ? 'Le nom est obligatoire' : err.message);
      this.disabled = false;
    }
  };
  if (r) w.querySelector('#rtDel').onclick = async function () {
    this.disabled = true;
    try {
      await supprimerRoutine(x.id);
      w.fermer(); toast('Routine supprimée');
      S.coach.routine = null; S.rt = null; vueCoach();
    } catch (err) { toast(err.message); this.disabled = false; }
  };
}

/** L'écran d'une routine : sa fiche, puis ses exercices — une seule séance. */
async function vueRoutine() {
  let r, cat;
  try {
    [r, cat] = await Promise.all([
      dataRoutine(S.coach.routine),
      S.cat ? null : dataCatalogue()
    ]);
  } catch (err) {
    $('#zone').innerHTML = `<div class="empty">${err.message === 'ROUTINE_INTROUVABLE'
      ? 'Cette routine n\'existe plus.' : 'Impossible de charger.<br>' + err.message}</div>`;
    return;
  }
  S.routine = r;
  if (cat) S.cat = cat;
  // L'éditeur travaille sur une copie : tant qu'on n'a pas enregistré, la routine
  // en base ne bouge pas, et « Annuler » se résume à quitter l'écran.
  if (!S.rt || S.rt.id !== r.id) {
    S.rt = { id: r.id, exercices: marquerExosRoutine(JSON.parse(JSON.stringify(r.exercices))) };
  }

  $('#zone').innerHTML = `
    <div class="card" style="display:block;margin-bottom:16px">
      <div class="nom">${r.nom}</div>
      <div class="meta">${[r.type, libelleFrequence(r.frequence),
        r.duree_semaines ? r.duree_semaines + ' semaines' : '', r.statut].filter(Boolean).join(' · ')}</div>
      ${r.description ? `<p class="consigne" style="margin-top:8px">${r.description}</p>` : ''}
      ${lecteur(r.video)}
      <div class="barre">
        <button class="btn" id="rtEdit">Modifier la fiche</button>
        ${r.source ? `<a class="btn contact" href="${r.source}" target="_blank" rel="noopener">Source ↗</a>` : ''}
      </div>
    </div>
    <div id="edit"></div>`;

  $('#rtEdit').onclick = () => modalRoutine(r);
  peindreEditeurRoutine();
}

/** Les `_uid` servent au glisser-déposer, comme dans l'éditeur de programme. */
function marquerExosRoutine(exos) {
  exos.forEach(e => { if (!e._uid) e._uid = 'r' + (++_uid); });
  return exos;
}

function peindreEditeurRoutine() {
  const z = $('#edit');
  const exos = S.rt.exercices;
  z.innerHTML = `
    <div class="eyebrow" style="margin:4px 0 12px">Exercices de la routine</div>
    ${exos.map((e, i) => `
      <div class="ligne" data-ruid="${e._uid}">
        <span class="poignee prise" data-poignee="rexo" title="Déplacer" aria-label="Déplacer ${e.nom}">⠿</span>
        <div class="g" data-rex="${i}">
          <div class="nom">${e.nom}</div>
          <div class="meta">${[
            (e.series || 1) + ' × ' + ((e.duree_s ? duree(e.duree_s) : e.reps_cible) || '—'),
            e.repos_s ? 'repos ' + e.repos_s + ' s' : ''].filter(Boolean).join(' · ')}</div>
        </div>
        <button class="poignee" data-delrex="${i}" aria-label="Retirer ${e.nom}">✕</button>
      </div>`).join('') || `<div class="empty" style="padding:14px 0">Aucun exercice.
        Une routine peut n'en porter qu'un.</div>`}
    <button class="btn" id="rtAddExo" style="width:100%;margin-top:10px">＋ exercice</button>
    <div class="barre">
      <button class="btn plein" id="rtSave" style="flex:1">Enregistrer la routine</button>
    </div>`;

  z.querySelectorAll('[data-delrex]').forEach(b => b.onclick = () => {
    exos.splice(Number(b.dataset.delrex), 1); peindreEditeurRoutine();
  });
  lignesCliquables(z, '[data-rex]', l => modalExerciceRoutine(Number(l.dataset.rex)));
  triable(z, '.ligne[data-ruid]', 'rexo', () => {
    const ordre = [...z.querySelectorAll('.ligne[data-ruid]')].map(l => l.dataset.ruid);
    S.rt.exercices = ordre.map(u => exos.find(e => e._uid === u)).filter(Boolean);
    peindreEditeurRoutine();
  });
  $('#rtAddExo').onclick = choisirExerciceRoutine;
  $('#rtSave').onclick = enregistrerRoutine;
}

/**
 * Le choix d'un exercice pour une routine part des types hors musculation — c'est
 * ce dont une routine est faite — mais ne les impose pas : le gainage, lui, vit
 * au catalogue de musculation et a toute sa place dans un renforcement.
 */
function choisirExerciceRoutine() {
  let type = '';
  const m = modal('Ajouter un exercice', `
    <div class="sous" data-role="rxtyp" style="margin-bottom:10px">
      <button type="button" data-v="" aria-pressed="true">Tous</button>
      ${TYPES_EXO.map(t => `<button type="button" data-v="${t}" aria-pressed="false">${t}</button>`).join('')}
    </div>
    <div class="recherche"><input class="f" id="rxq" placeholder="Rechercher"></div>
    <div id="rxlist"></div>`);

  const peindre = () => {
    const f = (m.querySelector('#rxq').value || '').toLowerCase();
    const vus = (S.cat || []).filter(e =>
      (!type || typeExo(e) === type) &&
      (!f || (e.nom + ' ' + e.groupe + ' ' + e.equipement).toLowerCase().includes(f)));
    m.querySelector('#rxlist').innerHTML = vus.map(e => `<div class="ligne" data-pickr="${e.id}">
        <div class="g"><div class="nom">${e.nom}</div>
          <div class="meta">${[typeExo(e), e.groupe, e.equipement].filter(Boolean).join(' · ')}</div></div>
        <span class="poignee">＋</span></div>`).join('') || `<div class="empty">Rien ne correspond.</div>`;
    lignesCliquables(m, '[data-pickr]', l => {
      const e = (S.cat || []).find(x => String(x.id) === l.dataset.pickr);
      S.rt.exercices.push({ exercice_id: e.id, nom: e.nom, series: 1, reps_cible: '10',
                            duree_s: '', repos_s: 0, _uid: 'r' + (++_uid) });
      m.fermer(); peindreEditeurRoutine();
    });
  };
  pastilleGroupe(m, 'rxtyp', v => { type = v; peindre(); });
  peindre();
  m.querySelector('#rxq').oninput = peindre;
}

/** Séries, répétitions ou durée, repos : le mini-programme d'un exercice. */
function modalExerciceRoutine(i) {
  const e = S.rt.exercices[i];
  const w = modal(e.nom, `
    <div class="duo">
      <div class="champ"><label>Séries</label>
        <input class="f" id="rxSer" type="number" min="1" value="${e.series || 1}"></div>
      <div class="champ"><label>Repos (s)</label>
        <input class="f" id="rxRep" type="number" min="0" step="5" value="${e.repos_s || ''}" placeholder="0"></div>
    </div>
    <div class="duo">
      <div class="champ"><label>Répétitions</label>
        <input class="f" id="rxRps" value="${e.reps_cible || ''}" placeholder="10"></div>
      <div class="champ"><label>ou durée (s)</label>
        <input class="f" id="rxDur" value="${e.duree_s || ''}" placeholder="30"></div>
    </div>
    <p class="consigne">Une durée renseignée l'emporte : l'exercice se tient, il ne se compte pas.</p>
    <div class="barre"><button class="btn" id="rxAnn">Annuler</button>
      <button class="btn plein" id="rxOk" style="flex:1">Appliquer</button></div>`);
  w.querySelector('#rxAnn').onclick = w.fermer;
  w.querySelector('#rxOk').onclick = () => {
    e.series = Number(w.querySelector('#rxSer').value) || 1;
    e.repos_s = Number(w.querySelector('#rxRep').value) || 0;
    e.reps_cible = w.querySelector('#rxRps').value.trim();
    e.duree_s = w.querySelector('#rxDur').value.trim();
    w.fermer(); peindreEditeurRoutine();
  };
}

async function enregistrerRoutine() {
  const btn = $('#rtSave');
  btn.disabled = true;
  try {
    await sauverRoutine({ id: S.rt.id, nom: S.routine.nom, type: S.routine.type,
      frequence: S.routine.frequence, duree_semaines: S.routine.duree_semaines,
      statut: S.routine.statut, description: S.routine.description,
      video: S.routine.video, source: S.routine.source,
      exercices: S.rt.exercices });
    toast('Routine enregistrée');
    S.rt = null; vueRoutine();
  } catch (err) { toast(err.message); btn.disabled = false; }
}

// ── Routines conseillées à un athlète (côté coach) ───────────
/** Une routine conseillée, telle qu'elle se lit dans une liste. */
function ligneRoutineConseillee(r) {
  return `<div class="ligne" data-rc="${r.id}">
    <div class="g">
      <div class="nom">${r.nom}</div>
      <div class="meta">${[
        r.type, libelleFrequence(r.frequence),
        r.duree_semaines ? r.duree_semaines + ' semaines' : '',
        r.conseillee_le ? 'le ' + new Date(r.conseillee_le).toLocaleDateString('fr-FR') : ''
      ].filter(Boolean).join(' · ')}</div>
      ${r.note ? `<div class="note-coach">${r.note}</div>` : ''}
    </div>
    ${r.paye ? '<span class="tag">Facturée</span>' : ''}
    <span class="tag ${r.statut === 'Conseillée' ? '' : 'warn'}">${r.statut}</span>
  </div>`;
}

async function vueRoutinesAthlete() {
  const email = S.coach.email;
  let conseillees, catalogue;
  try {
    [conseillees, catalogue] = await Promise.all([dataRoutinesPratiquant(email), dataRoutines()]);
  } catch (err) {
    $('#zone').innerHTML = `<div class="empty">Impossible de charger.<br>${err.message}</div>`; return;
  }
  S.routines = catalogue;
  S.routinesAthlete = conseillees;

  $('#zone').innerHTML = `
    <p class="consigne">Une routine se conseille, elle ne se planifie pas d'ici : c'est
      ${S.coach.nom || 'le pratiquant'} qui décidera de l'inscrire dans sa semaine, et à quelle heure.</p>
    <div class="barre" style="margin-top:0">
      <button class="btn plein" id="rcAjout" style="flex:1">＋ Conseiller une routine</button></div>
    ${conseillees.map(ligneRoutineConseillee).join('')
      || `<div class="empty">Aucune routine conseillée.</div>`}`;

  $('#rcAjout').onclick = modalConseillerRoutine;
  lignesCliquables($('#zone'), '[data-rc]',
    l => modalRoutineConseillee(conseillees.find(r => r.id === l.dataset.rc)));
}

/**
 * Conseiller une routine : on choisit dans le catalogue, on dit pourquoi. Les
 * routines en brouillon ne sont pas proposées — une fiche encore en chantier
 * n'a rien à faire chez un pratiquant.
 */
function modalConseillerRoutine() {
  const dispo = (S.routines || []).filter(r => r.statut !== 'Brouillon');
  let choisie = null;
  const w = modal('Conseiller une routine', `
    <div class="recherche"><input class="f" id="rcq" placeholder="Rechercher une routine"></div>
    <div id="rclist" style="max-height:46vh;overflow:auto"></div>
    <div class="champ" style="margin-top:12px"><label>Pourquoi cette routine</label>
      <textarea class="f" id="rcNote" rows="3"
        placeholder="Ce que vous lui diriez en la lui montrant — la douleur visée, ce à quoi faire attention"></textarea></div>
    <label class="paye"><input type="checkbox" id="rcPaye"><span>Facturée</span></label>
    <div class="barre"><button class="btn" id="rcAnn">Annuler</button>
      <button class="btn plein" id="rcOk" style="flex:1">Conseiller</button></div>`);

  const peindre = () => {
    const f = (w.querySelector('#rcq').value || '').toLowerCase();
    const vus = dispo.filter(r => !f || (r.nom + ' ' + r.type).toLowerCase().includes(f));
    w.querySelector('#rclist').innerHTML = vus.map(r => `<div class="ligne" data-pickrt="${r.id}"
        aria-pressed="${choisie === r.id}" style="${choisie === r.id ? 'border-color:var(--rouge)' : ''}">
        <div class="g"><div class="nom">${r.nom}</div>
          <div class="meta">${[r.type, libelleFrequence(r.frequence),
            r.exercices.length + ' exercice' + (r.exercices.length > 1 ? 's' : '')].filter(Boolean).join(' · ')}</div></div>
      </div>`).join('') || `<div class="empty">${dispo.length
        ? 'Rien ne correspond.' : 'Aucune routine active. Créez-en une dans l\'onglet Routines.'}</div>`;
    lignesCliquables(w.querySelector('#rclist'), '[data-pickrt]', l => { choisie = l.dataset.pickrt; peindre(); });
  };
  peindre();
  w.querySelector('#rcq').oninput = peindre;
  w.querySelector('#rcAnn').onclick = w.fermer;
  w.querySelector('#rcOk').onclick = async function () {
    if (!choisie) return toast('Choisissez une routine');
    this.disabled = true;
    try {
      await conseillerRoutine(S.coach.email, dispo.find(r => r.id === choisie), {
        note: w.querySelector('#rcNote').value,
        paye: w.querySelector('#rcPaye').checked
      });
      w.fermer(); toast('Routine conseillée'); vueRoutinesAthlete();
    } catch (err) { toast(err.message); this.disabled = false; }
  };
}

/** Ce que le coach peut encore changer une fois la routine conseillée. */
function modalRoutineConseillee(r) {
  const w = modal(r.nom, `
    <div class="meta" style="margin:-6px 0 12px">${[r.type, libelleFrequence(r.frequence),
      r.duree_semaines ? r.duree_semaines + ' semaines' : ''].filter(Boolean).join(' · ')}</div>
    <p class="consigne" id="rcnSuivi">Chargement du suivi…</p>
    <div class="champ"><label>Pourquoi cette routine</label>
      <textarea class="f" id="rcnNote" rows="3">${r.note || ''}</textarea></div>
    <div class="champ"><label>Statut</label>
      <select class="f" id="rcnSta">${['Conseillée', 'Terminée', 'Arrêtée'].map(s =>
        `<option ${s === r.statut ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
    <label class="paye"><input type="checkbox" id="rcnPaye" ${r.paye ? 'checked' : ''}><span>Facturée</span></label>
    <div class="barre"><button class="btn" id="rcnAnn">Annuler</button>
      <button class="btn plein" id="rcnOk" style="flex:1">Enregistrer</button></div>
    <div class="barre"><button class="btn danger" id="rcnDel">Retirer</button></div>`);

  // Le suivi arrive après coup : une lecture de plus, faite seulement quand le
  // coach ouvre une routine précise — pas pour peindre la liste entière.
  dataFaitsRoutine(S.coach.email, r.id).then(faits => {
    const cible = w.querySelector('#rcnSuivi');
    if (!cible) return;
    const semaine = joursDeLaSemaine().filter(c => faits.indexOf(c) !== -1).length;
    const dernier = faits.length ? faits[faits.length - 1] : '';
    cible.textContent = faits.length
      ? `${semaine} fois cette semaine · ${faits.length} en tout · dernière le ${
          new Date(dernier).toLocaleDateString('fr-FR')}`
      : 'Jamais cochée comme faite pour l\'instant.';
  }).catch(() => {
    const cible = w.querySelector('#rcnSuivi');
    if (cible) cible.textContent = 'Suivi indisponible.';
  });

  w.querySelector('#rcnAnn').onclick = w.fermer;
  w.querySelector('#rcnOk').onclick = async function () {
    this.disabled = true;
    try {
      await majRoutinePratiquant(S.coach.email, r.id, {
        note: w.querySelector('#rcnNote').value,
        statut: w.querySelector('#rcnSta').value,
        paye: w.querySelector('#rcnPaye').checked
      });
      w.fermer(); toast('Enregistré'); vueRoutinesAthlete();
    } catch (err) { toast(err.message); this.disabled = false; }
  };
  w.querySelector('#rcnDel').onclick = async function () {
    this.disabled = true;
    try {
      await retirerRoutinePratiquant(S.coach.email, r.id);
      w.fermer(); toast('Routine retirée'); vueRoutinesAthlete();
    } catch (err) { toast(err.message); this.disabled = false; }
  };
}

// ── Maxis d'un pratiquant ────────────────────────────────────
async function vueMaxis(filtre) {
  let list;
  try { list = await dataMaxis(S.coach.email); }
  catch (err) { $('#zone').innerHTML = `<div class="empty">Impossible de charger.<br>${err.message}</div>`; return; }
  S.maxis = list;
  peindreMaxis(filtre);
}

function peindreMaxis(filtre) {
  const q = (filtre || '').toLowerCase();
  const vus = S.maxis.filter(m => !q || (m.nom + ' ' + m.groupe).toLowerCase().includes(q));

  $('#zone').innerHTML = `
    <p class="consigne">Le 1RM sert à traduire un pourcentage en kilos. Sans valeur
      saisie, il est estimé depuis les séries réalisées (formule d'Epley) — l'estimation
      suffit souvent, la mesure la remplace dès qu'elle existe.</p>
    <div class="champ" style="margin-top:14px"><input class="f" id="mq" placeholder="Rechercher un exercice" value="${filtre || ''}"></div>
    ${vus.map(m => `<div class="ligne" data-mx="${m.exercice_id}">
      <div class="g">
        <div class="nom">${m.nom}${m.auProgramme ? '' : ''}</div>
        <div class="meta">${m.rm_kg
          ? m.rm_kg + ' kg · ' + m.source
          : 'aucune donnée'}${m.auProgramme ? ' · au programme' : ''}</div>
      </div>
    </div>`).join('') || `<div class="empty">Aucun exercice.</div>`}`;

  const champ = $('#mq');
  champ.oninput = () => { const v = champ.value; peindreMaxis(v); const n = $('#mq'); n.focus(); n.setSelectionRange(v.length, v.length); };
  lignesCliquables($('#zone'), '[data-mx]',
    l => modalMaxi(S.maxis.find(x => String(x.exercice_id) === l.dataset.mx)));
}

function modalMaxi(m) {
  const w = modal(m.nom, `
    <div class="champ"><label>1RM mesuré (kg)</label>
      <input class="f" id="xKg" type="number" min="0" step="2.5" value="${m.source === 'mesuré' ? m.rm_kg : ''}"
        placeholder="${m.rm_kg ? m.rm_kg + ' estimés' : 'aucune donnée'}"></div>
    <p class="consigne">${m.rm_kg
      ? `Valeur actuelle : <strong>${m.rm_kg} kg</strong> (${m.source}).`
      : 'Aucune série enregistrée sur cet exercice, donc aucune estimation possible.'}</p>
    <div class="barre"><button class="btn" id="xAnn">Annuler</button>
      <button class="btn plein" id="xOk" style="flex:1">Enregistrer</button></div>
    ${m.source === 'mesuré' ? '<div class="barre"><button class="btn danger" id="xDel">Revenir à l\'estimation</button></div>' : ''}`);

  w.querySelector('#xAnn').onclick = w.fermer;
  w.querySelector('#xOk').onclick = async function () {
    this.disabled = true;
    try {
      await sauverMaxi(S.coach.email, m.exercice_id, w.querySelector('#xKg').value);
      w.fermer(); toast('Max enregistré'); vueMaxis();
    } catch (err) {
      toast(err.message === 'VALEUR_INVALIDE' ? 'Donnez une valeur en kilos' : err.message);
      this.disabled = false;
    }
  };
  const d = w.querySelector('#xDel');
  if (d) d.onclick = async function () {
    this.disabled = true;
    try {
      await supprimerMaxi(S.coach.email, m.exercice_id);
      w.fermer(); toast('Retour à l\'estimation'); vueMaxis();
    } catch (err) { toast(err.message); this.disabled = false; }
  };
}

// ── Programme d'un pratiquant ────────────────────────────────
async function vueProgramme() {
  // Les lectures partent ensemble : la liste des attributions, le catalogue
  // si on ne l'a pas encore, et le contenu de l'attribution visée.
  let atts, prog;
  try {
    [atts, , prog] = await Promise.all([
      dataAttributions(S.coach.email),
      S.cat ? null : dataCatalogue().then(c => { S.cat = c; }),
      dataProgramme(S.coach.email, S.attSel || undefined)
    ]);
  } catch (err) { $('#zone').innerHTML = `<div class="empty">${err.message}</div>`; return; }

  S.atts = atts;
  if (!S.attSel || !atts.some(a => a.id === S.attSel)) {
    const active = atts.find(a => a.statut === 'En cours');
    S.attSel = (active || atts[0] || {}).id || null;
    // L'attribution visée a changé en cours de route : on va rechercher la bonne.
    if (S.attSel && (!prog.attribution || prog.attribution.id !== S.attSel)) {
      prog = await dataProgramme(S.coach.email, S.attSel);
    }
  }

  if (!S.attSel) {
    $('#zone').innerHTML = `
      <div class="empty">Aucun programme attribué.<br>Donnez-lui un modèle, ou partez d'une page blanche.</div>
      <div class="barre"><button class="btn plein" id="donner" style="flex:1">Donner un programme</button></div>`;
    $('#donner').onclick = modalAttribuer;
    return;
  }

  S.prog = prog;
  const att = S.atts.find(a => a.id === S.attSel);
  const jours = prog.jours.map(j => j.jour);

  if (!S.ed || S.ed.cible !== 'programme' || S.ed.attribution_id !== S.attSel ||
      (!S.ed.neuf && jours.indexOf(S.ed.jour) === -1)) {
    S.ed = null;
    if (jours.length) chargerJour(jours[0]);
  }

  $('#zone').innerHTML = `
    <div class="champ">
      <label>Programme attribué</label>
      <select class="f" id="selAtt">${S.atts.map(a => `<option value="${a.id}" ${a.id === S.attSel ? 'selected' : ''}>
        ${a.nom} · ${a.statut}${a.date_debut ? ' · depuis le ' + new Date(a.date_debut).toLocaleDateString('fr-FR') : ''}</option>`).join('')}</select>
    </div>
    <div class="meta" style="color:var(--dust);font-size:12.5px;margin:-2px 0 12px">
      ${att.nbJours} jour${att.nbJours > 1 ? 's' : ''} · ${att.nbExercices} exercices${
      att.modele_id ? ' · issu d\'un modèle' : ' · sur mesure'}<br>${fenetreAttribution(att)}</div>
    <div class="barre" style="margin-top:0">
      <button class="btn plein" id="donner">Donner un programme</button>
      <button class="btn" id="dates">Nom et dates</button>
      <button class="btn" id="prevenir">Prévenir</button>
      ${att.statut === 'En cours' ? '<button class="btn" id="clore">Clore</button>' : ''}
      <button class="btn danger" id="supprAtt">Supprimer</button>
    </div>
    <div class="days" id="jours" style="margin-top:16px">
      ${jours.map(j => `<button class="day" data-j="${j}" aria-pressed="${S.ed && S.ed.jour === j}"
        title="${j} — appui long pour renommer">${j}</button>`).join('')}
      <button class="day" id="addJour">＋ jour</button>
    </div>
    <div id="edit"></div>`;

  $('#selAtt').onchange = e => { S.attSel = e.target.value; S.ed = null; vueProgramme(); };
  $('#donner').onclick = modalAttribuer;
  $('#dates').onclick = () => modalDatesAttribution(att);
  $('#prevenir').onclick = () => modalNotifier(S.attSel, S.coach.email);
  $('#addJour').onclick = modalNouveauJour;
  cablerJours(vueProgramme);

  const cl = $('#clore');
  if (cl) cl.onclick = async function () {
    this.disabled = true;
    try {
      await majAttribution(S.attSel, { statut: 'Terminé', date_fin: true });
      toast('Programme clos'); vueProgramme();
    } catch (err) { toast(err.message); this.disabled = false; }
  };
  $('#supprAtt').onclick = async function () {
    this.disabled = true;
    try {
      await supprimerAttribution(S.attSel);
      toast('Attribution supprimée'); S.attSel = null; S.ed = null; vueProgramme();
    } catch (err) { toast(err.message); this.disabled = false; }
  };

  peindreEditeur();
}

/**
 * La fenêtre d'un programme en une phrase. `date_fin` est la clôture réelle et
 * prime : une fois le programme clos, dire encore ce qui « était prévu »
 * n'apprendrait rien. Sans durée, on ne l'invente pas — un programme sans fin
 * annoncée est un état légitime, pas une donnée manquante.
 */
function fenetreAttribution(att) {
  const debut = att.date_debut ? dateLongue(att.date_debut) : '';
  if (att.date_fin) return `du ${debut} au ${dateLongue(att.date_fin)} · clos`;
  const fin = att.fin_prevue
    || finPrevueDe(att.date_debut && new Date(att.date_debut), att.duree_semaines);
  if (!fin) return debut ? `à partir du ${debut}` : '';
  return `du ${debut} au ${dateLongue(dateDeCle(fin))}`
    + (att.duree_semaines ? ` · ${att.duree_semaines} semaines` : '');
}

/**
 * Piloter les dates d'un programme. Durée et date de fin disent la même chose
 * de deux façons : saisir l'une recalcule l'autre, sous les yeux, plutôt que
 * de demander au coach de compter les semaines lui-même.
 */
/**
 * Nom et dates d'un programme attribué. Le nom vient du modèle à l'attribution
 * et ne bougeait plus ensuite ; un programme adapté en cours de route (« Force
 * 5×5 — reprise d'épaule ») ne pouvait pas le dire. Pas d'appui long ici,
 * contrairement aux modèles et aux jours : le nom s'affiche dans un `select`, et
 * un appui prolongé dessus ouvre le sélecteur natif du système — le geste ne
 * nous appartient pas. D'où un bouton qui dit ce qu'il ouvre.
 */
function modalDatesAttribution(att) {
  const debut0 = att.date_debut ? cleJour(new Date(att.date_debut)) : cleJour(new Date());
  const fin0 = att.fin_prevue || finPrevueDe(dateDeCle(debut0), att.duree_semaines);
  const w = modal('Nom et dates du programme', `
    <div class="champ"><label>Nom</label>
      <input class="f" id="daNom" value="${att.nom || ''}" placeholder="Force 5×5"></div>
    <p class="consigne">Le nom vient du modèle donné ; le changer ici ne touche pas au
      modèle. Les séances déjà faites ne s'en trouvent pas renommées.</p>
    <div class="champ"><label>Début</label>
      <input class="f" id="daDeb" type="date" value="${debut0}"></div>
    <div class="duo">
      <div class="champ"><label>Durée (semaines)</label>
        <input class="f" id="daSem" type="number" min="0" step="1" value="${att.duree_semaines || ''}"></div>
      <div class="champ"><label>Fin prévue</label>
        <input class="f" id="daFin" type="date" value="${fin0}"></div>
    </div>
    <p class="consigne">Laisser la durée à zéro pour un programme sans fin annoncée.</p>
    <div class="barre" style="margin-top:14px"><button class="btn" id="daAnn">Annuler</button>
      <button class="btn plein" id="daOk" style="flex:1">Enregistrer</button></div>`);

  const deb = w.querySelector('#daDeb'), sem = w.querySelector('#daSem'), fin = w.querySelector('#daFin');
  const depuisDuree = () => { fin.value = finPrevueDe(dateDeCle(deb.value), sem.value); };
  deb.onchange = depuisDuree;
  sem.oninput = depuisDuree;
  fin.onchange = () => { sem.value = semainesEntre(dateDeCle(deb.value), dateDeCle(fin.value)) || ''; };

  w.querySelector('#daAnn').onclick = w.fermer;
  w.querySelector('#daOk').onclick = async function () {
    if (!deb.value) return toast('Il faut une date de début');
    const nom = w.querySelector('#daNom').value.trim();
    if (!nom) return toast('Donnez un nom au programme');
    this.disabled = true;
    try {
      await majAttribution(att.id, {
        nom,
        date_debut: deb.value,
        duree_semaines: Number(sem.value) || 0,
        fin_prevue: Number(sem.value) > 0 ? fin.value : ''
      });
      w.fermer(); toast('Programme enregistré');
      S.atts = null; S.cal = null; vueProgramme();
    } catch (err) { toast(err.message); this.disabled = false; }
  };
}

/** Donner un programme : depuis un modèle, ou vierge pour du sur-mesure. */
async function modalAttribuer() {
  const mods = await dataModeles();
  const cats = [...new Set(mods.map(m => (m.categorie || '').trim()).filter(Boolean))].sort();
  const difs = [...new Set(mods.map(m => (m.difficulte || '').trim()).filter(Boolean))]
    .sort((a, b) => ordreDifficulte(a) - ordreDifficulte(b));

  const w = modal('Donner un programme', `
    <div class="duo">
      <div class="champ"><label>Catégorie</label>
        <select class="f" id="fCat"><option value="">Toutes</option>
          ${cats.map(c => `<option>${c}</option>`).join('')}</select></div>
      <div class="champ"><label>Difficulté</label>
        <select class="f" id="fDif"><option value="">Toutes</option>
          ${difs.map(d => `<option>${d}</option>`).join('')}</select></div>
    </div>
    <div class="champ"><label>Modèle de départ · <span id="fCompte">${mods.length}</span></label>
      <select class="f" id="aMod" size="7">
        <option value="">— Sur mesure, page blanche —</option>
      </select></div>
    <div class="champ"><label>Nom donné au pratiquant</label>
      <input class="f" id="aNom" placeholder="Laisser vide pour reprendre le nom du modèle"></div>
    <div class="duo">
      <div class="champ"><label>Date de début</label>
        <input class="f" id="aDeb" type="date" value="${cleJour(new Date())}"></div>
      <div class="champ"><label>Durée (semaines)</label>
        <input class="f" id="aSem" type="number" min="0" step="1" placeholder="du modèle"></div>
    </div>
    <div class="meta" id="aFin" style="margin:-4px 0 10px;color:var(--dust);font-size:12.5px"></div>
    <p class="consigne">Le contenu du modèle est <strong>copié</strong> : le personnaliser ensuite
      ne touche pas le modèle, et le programme en cours est clos automatiquement.
      La durée du modèle est reprise si le champ reste vide.</p>
    <div class="barre"><button class="btn" id="aAnn">Annuler</button>
      <button class="btn plein" id="aOk" style="flex:1">Attribuer</button></div>`);

  // Les deux filtres sont facultatifs et se combinent.
  const filtrer = () => {
    const c = w.querySelector('#fCat').value, d = w.querySelector('#fDif').value;
    const vus = mods.filter(m => (!c || (m.categorie || '').trim() === c)
                              && (!d || (m.difficulte || '').trim() === d))
                    .sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
    w.querySelector('#fCompte').textContent = vus.length;
    w.querySelector('#aMod').innerHTML = `<option value="">— Sur mesure, page blanche —</option>` +
      vus.map(m => `<option value="${m.id}">${m.nom}${
        m.duree_semaines ? ' · ' + m.duree_semaines + ' sem.' : ''} · ${m.nbJours} j</option>`).join('');
  };
  w.querySelector('#fCat').onchange = filtrer;
  w.querySelector('#fDif').onchange = filtrer;
  filtrer();

  // La fin se calcule sous les yeux : le coach voit ce qu'il engage avant de
  // valider. Champ vide = la durée du modèle, qu'on ne connaît qu'ici.
  const mod = w.querySelector('#aMod'), deb = w.querySelector('#aDeb'), sem = w.querySelector('#aSem');
  const majFin = () => {
    const m = mods.find(x => x.id === mod.value);
    const semaines = Number(sem.value) || (m ? Number(m.duree_semaines) || 0 : 0);
    const f = finPrevueDe(dateDeCle(deb.value), semaines);
    w.querySelector('#aFin').textContent = f
      ? `Fin prévue le ${dateLongue(dateDeCle(f))} · ${semaines} semaines`
      : 'Sans fin annoncée';
  };
  mod.onchange = majFin; deb.onchange = majFin; sem.oninput = majFin;
  majFin();

  w.querySelector('#aAnn').onclick = w.fermer;
  w.querySelector('#aOk').onclick = async function () {
    this.disabled = true;
    try {
      const r = await creerAttribution(S.coach.email, {
        modele_id: w.querySelector('#aMod').value || undefined,
        nom: w.querySelector('#aNom').value,
        date_debut: w.querySelector('#aDeb').value,
        duree_semaines: w.querySelector('#aSem').value
      });
      w.fermer();
      toast(r.lignes ? `${r.nom} attribué, ${r.lignes} lignes copiées` : `${r.nom} attribué`);
      S.attSel = r.id; S.ed = null;
      await vueProgramme();
      modalNotifier(r.id, S.coach.email);   // enchaîner : un programme donné s'annonce
    } catch (err) { toast(err.message); this.disabled = false; }
  };
}

// ── Éditeur de jour, commun aux modèles et aux programmes ─────
/** Chaque bloc et chaque exercice reçoit une identité, seule façon de relire
 *  l'ordre après un déplacement : la position ne peut pas servir de clé. */
let _uid = 0;
function marquer(blocs) {
  blocs.forEach(b => {
    if (!b._uid) b._uid = 'b' + (++_uid);
    b.exercices.forEach(e => { if (!e._uid) e._uid = 'e' + (++_uid); });
  });
  return blocs;
}

/**
 * Transforme les blocs de l'éditeur en lignes plates, prêtes à écrire —
 * équivalent direct de `aplatirBlocs_`. Lève si un exercice n'existe plus au
 * catalogue ; en pratique injoignable depuis l'éditeur, qui ne propose que
 * des exercices choisis dans le catalogue, mais on ne fait pas confiance à
 * un id qui aurait pu être manipulé.
 */
async function aplatirBlocs(blocs, jour) {
  const connus = await catalogueParId();
  const rangs = [];
  (blocs || []).forEach((b, bi) => {
    (b.exercices || []).forEach((e, ei) => {
      if (!connus[e.exercice_id]) throw new Error('EXERCICE_INCONNU_' + e.exercice_id);
      rangs.push({
        jour, bloc: bi + 1, ordre: ei + 1, exercice_id: e.exercice_id,
        series: Number(b.series) || 3,
        reps_cible: e.reps_cible === undefined ? '' : e.reps_cible,
        duree_s: e.duree_s === undefined ? '' : e.duree_s,
        charge_cible: Number(e.charge_cible) || 0,
        pct_rm: Number(String(e.pct_rm).replace('%', '')) || 0,
        cadence: e.cadence || '',
        pause_s: Number(e.pause_s) || 0,
        repos_s: Number(b.repos_s) || 90,
        note: e.note || ''
      });
    });
  });
  if (!rangs.length) throw new Error('PROGRAMME_VIDE');
  return rangs;
}

/**
 * Réécrit un jour dans une collection de lignes (celles d'un modèle ou d'une
 * attribution — même structure, seule la clé de rattachement change). Les
 * lignes de ce jour sont remplacées, les autres jours ne bougent pas. Les
 * compteurs dénormalisés `nb_jours`/`nb_exercices` du doc parent (lus par les
 * listes de modèles/attributions) sont recalculés au passage.
 */
async function sauverLignesJour(refDoc, refLignes, jour, blocs) {
  const { db, doc, getDocs, writeBatch, updateDoc } = FB;
  const rangs = await aplatirBlocs(blocs, jour);
  const existantes = await getDocs(refLignes);
  const b = writeBatch(db);
  existantes.docs.forEach(d => { if (String(d.data().jour) === jour) b.delete(d.ref); });
  rangs.forEach(r => b.set(doc(refLignes), r));
  await b.commit();
  const toutes = (await getDocs(refLignes)).docs.map(d => d.data());
  await updateDoc(refDoc, { nb_jours: new Set(toutes.map(l => l.jour)).size, nb_exercices: toutes.length,
    duree_max_min: dureeMaxSeance(toutes) });
  return { lignes: rangs.length };
}

/** Supprime un jour d'une collection de lignes, et recalcule les compteurs. */
async function supprimerLignesJour(refDoc, refLignes, jour) {
  const { db, getDocs, writeBatch, updateDoc } = FB;
  const existantes = await getDocs(refLignes);
  const b = writeBatch(db);
  let n = 0;
  existantes.docs.forEach(d => { if (String(d.data().jour) === jour) { b.delete(d.ref); n++; } });
  await b.commit();
  const restantes = (await getDocs(refLignes)).docs.map(d => d.data());
  await updateDoc(refDoc, { nb_jours: new Set(restantes.map(l => l.jour)).size, nb_exercices: restantes.length,
    duree_max_min: dureeMaxSeance(restantes) });
  return { supprimees: n };
}

/**
 * Renomme un jour : les lignes gardent leur document, seul le champ `jour`
 * change. Surtout pas un « supprimer puis réécrire » comme `sauverLignesJour` :
 * `ligne_id` **est** l'identifiant du document de ligne, et chaque série déjà
 * enregistrée le porte (§ « Une ligne, un compteur ») — recréer les lignes
 * couperait l'historique de tout ce qui a été fait ce jour-là.
 *
 * Les compteurs du doc parent ne sont pas recalculés : même nombre de jours, de
 * lignes et de durée, seul l'intitulé bouge.
 *
 * Une séance ouverte au même moment retrouve ses exercices par l'intitulé du
 * jour : la renommer sous les pieds du pratiquant lui viderait l'écran jusqu'à
 * ce qu'il reprenne. Risque accepté — le coach retouche ses programmes entre
 * les séances, pas pendant.
 */
async function renommerLignesJour(refLignes, ancien, nouveau) {
  const { db, getDocs, writeBatch } = FB;
  const existantes = await getDocs(refLignes);
  // Deux jours du même nom fusionneraient en silence : refusé plutôt que subi.
  if (existantes.docs.some(d => String(d.data().jour) === nouveau)) throw new Error('JOUR_EXISTE');
  const b = writeBatch(db);
  let n = 0;
  existantes.docs.forEach(d => {
    if (String(d.data().jour) === ancien) { b.update(d.ref, { jour: nouveau }); n++; }
  });
  if (!n) throw new Error('JOUR_INTROUVABLE');
  await b.commit();
  return { renommees: n };
}

/**
 * Renommer un jour, ouvert par un **appui long sur son onglet** — le geste
 * existait déjà sur la pastille de séries, autant garder le même. Un bouton de
 * plus dans la barre de l'éditeur aurait chargé un écran déjà dense pour une
 * action rare, et l'onglet est justement là où se lit l'intitulé qu'on veut
 * changer.
 */
function modalRenommerJour(ancien, refresh) {
  const w = modal('Renommer le jour', `
    <div class="champ"><label>Intitulé</label>
      <input class="f" id="rj" value="${ancien}" list="lrj">
      <datalist id="lrj">${SEMAINE.map(j => `<option>${j} — </option>`).join('')}</datalist></div>
    <p class="consigne">Le jour de la semaine doit apparaître dans l'intitulé : c'est lui
      qui donne l'ordre d'affichage. Les séances déjà faites gardent l'ancien intitulé —
      c'est ce qui s'est passé, ça ne se réécrit pas.</p>
    <div class="barre"><button class="btn" id="rjAnn">Annuler</button>
      <button class="btn plein" id="rjOk" style="flex:1">Renommer</button></div>`);
  w.querySelector('#rjAnn').onclick = w.fermer;
  w.querySelector('#rjOk').onclick = async function () {
    const v = w.querySelector('#rj').value.trim();
    if (!v) return toast('Donnez un intitulé');
    if (v === ancien) return w.fermer();
    this.disabled = true;
    const { db, collection } = FB;
    try {
      await renommerLignesJour(S.coach.modele
        ? collection(db, 'modeles', S.coach.modele, 'lignes')
        : collection(db, 'attributions', S.attSel, 'programme'), ancien, v);
      // L'éditeur ouvert sur ce jour doit suivre, sinon la vue le croit disparu
      // et rebascule sur le premier jour du programme.
      if (S.ed && S.ed.jour === ancien) S.ed.jour = v;
      toast('Jour renommé'); w.fermer(); refresh();
    } catch (err) {
      toast(err.message === 'JOUR_EXISTE' ? 'Un jour porte déjà cet intitulé'
        : err.message === 'JOUR_INTROUVABLE' ? 'Ce jour n\'a plus de ligne à renommer'
        : err.message);
      this.disabled = false;
    }
  };
}

/**
 * Les onglets de jours : appui court pour ouvrir le jour, appui long pour le
 * renommer. Même câblage pour un modèle et pour un programme attribué, seul
 * l'écran à repeindre change.
 */
function cablerJours(refresh) {
  $('#zone').querySelectorAll('.day[data-j]').forEach(b =>
    appuiLong(b,
      () => { chargerJour(b.dataset.j); refresh(); },
      () => modalRenommerJour(b.dataset.j, refresh)));
}

function chargerJour(jour) {
  const modele = !!S.coach.modele;
  const src = modele ? S.modele : S.prog;
  const j = ((src && src.jours) || []).find(x => x.jour === jour);
  S.ed = {
    cible: modele ? 'modele' : 'programme',
    modele_id: modele ? S.coach.modele : null,
    email: modele ? null : S.coach.email,
    attribution_id: modele ? null : S.attSel,
    jour: jour,
    neuf: !j,
    blocs: marquer(j ? JSON.parse(JSON.stringify(j.blocs)) : [])
  };
}

function modalNouveauJour() {
  const w = modal('Nouveau jour', `
    <div class="champ"><label>Intitulé</label>
      <input class="f" id="nj" placeholder="Lundi — Haut du corps" list="lj">
      <datalist id="lj">${SEMAINE.map(j => `<option>${j} — </option>`).join('')}</datalist></div>
    <p class="consigne">Le jour de la semaine doit apparaître dans l'intitulé : c'est lui qui donne l'ordre d'affichage.</p>
    <div class="barre"><button class="btn" id="njAnn">Annuler</button>
      <button class="btn plein" id="njOk" style="flex:1">Créer</button></div>`);
  w.querySelector('#njAnn').onclick = w.fermer;
  w.querySelector('#njOk').onclick = () => {
    const v = w.querySelector('#nj').value.trim();
    if (!v) return toast('Donnez un intitulé');
    chargerJour(v);
    S.ed.neuf = true; S.ed.blocs = [];
    w.fermer();
    document.querySelectorAll('.day[data-j]').forEach(b => b.setAttribute('aria-pressed', 'false'));
    peindreEditeur();
  };
}

async function enregistrerJour() {
  const ed = S.ed;
  const btn = $('#save');
  if (!ed.blocs.length || ed.blocs.every(b => !b.exercices.length))
    return toast('Ajoutez au moins un exercice');
  btn.disabled = true;
  const blocs = ed.blocs.filter(b => b.exercices.length);
  const { db, doc, collection } = FB;
  try {
    if (ed.cible === 'modele') {
      await sauverLignesJour(doc(db, 'modeles', ed.modele_id),
        collection(db, 'modeles', ed.modele_id, 'lignes'), ed.jour, blocs);
      toast('Jour enregistré'); S.ed = null; vueModele();
    } else {
      await sauverLignesJour(doc(db, 'attributions', ed.attribution_id),
        collection(db, 'attributions', ed.attribution_id, 'programme'), ed.jour, blocs);
      toast('Jour enregistré'); S.ed = null; vueProgramme();
    }
  } catch (err) { toast(err.message); btn.disabled = false; }
}

async function supprimerJour(btn) {
  const ed = S.ed;
  btn.disabled = true;
  const { db, doc, collection } = FB;
  try {
    if (ed.cible === 'modele') {
      await supprimerLignesJour(doc(db, 'modeles', ed.modele_id),
        collection(db, 'modeles', ed.modele_id, 'lignes'), ed.jour);
      toast('Jour supprimé'); S.ed = null; vueModele();
    } else {
      await supprimerLignesJour(doc(db, 'attributions', ed.attribution_id),
        collection(db, 'attributions', ed.attribution_id, 'programme'), ed.jour);
      toast('Jour supprimé'); S.ed = null; vueProgramme();
    }
  } catch (err) { toast(err.message); btn.disabled = false; }
}

// ── Service worker (mode hors ligne) ─────────────────────────
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
