<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151515">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coaching Fitness">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="favicon.ico" sizes="any">
<title>Coaching Fitness</title>
<script>
/* Avant tout rendu, sinon l'écran clignote en sombre puis passe en clair.
   Trois valeurs : sombre (défaut), clair, auto — auto suit le téléphone. */
(function () {
  var t = 'sombre';
  try { var v = localStorage.getItem('muscu.theme'); if (v === 'clair' || v === 'auto') t = v; } catch (e) {}
  var r = document.documentElement;
  r.setAttribute('data-theme', t);
  var clair = t === 'clair' ||
    (t === 'auto' && window.matchMedia('(prefers-color-scheme: light)').matches);
  if (t === 'auto' && clair) r.classList.add('sys-clair');
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', clair ? '#F7F5F3' : '#151515');
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Charte Wellness Sport Club — relevée sur wellness-sportclub.fr.
     Sombre par défaut : c'est l'identité de l'app, et une salle est rarement en
     plein jour. Le thème clair rejoue les mêmes rôles, il n'invente rien. */
  --iron:#151515; --plate:#1E1E1E; --edge:#2E2E2E;
  --chalk:#F4F4F4; --dust:#9A9A9A;
  /* --brand : aplats uniquement (blanc dessus = 7,4:1).
     --brand-ink : version éclaircie, seule lisible en texte sur fond sombre (4,8:1).
     Le rouge officiel #A61E1F ne plafonne qu'à 2,4:1 sur le fond : jamais en texte. */
  --brand:#A61E1F; --brand-ink:#E05253; --on-brand:#FFFFFF;
  /* Surfaces dérivées : creusée (champs, vignettes), enfoncée (appui), soulevée (glissé) */
  --sunk:#2A2A2A; --press:#383838; --lift:#1F1F1F;
  --veil:rgba(0,0,0,.72); --nav-bg:rgba(20,23,28,.94); --relief:none;
  /* Sémantique, distincte de l'accent de marque */
  --warn-ink:#E0A94F; --warn-bg:rgba(224,169,79,.16);
  --ok-ink:#6FBF8E;   --ok-bg:rgba(111,191,142,.15);
  --bad-ink:#FF7A7A;  --bad-bg:rgba(211,47,47,.16);
  --p25:#D32F2F; --p20:#1E6FD9; --p15:#F5B700; --p10:#3F9E4D; --p5:#E8EAEE; --p2:#9AA3B0;
  --r:14px;
  color-scheme:dark;
}

/* Thème clair. Deux portes vers les mêmes jetons : le choix explicite, et
   « comme le téléphone » — auquel le script d'amorçage pose .sys-clair. */
:root[data-theme="clair"], :root.sys-clair{
  --iron:#F7F5F3; --plate:#FFFFFF; --edge:#E4DFDA;
  --chalk:#191716; --dust:#6B6560;
  --brand-ink:#A61E1F;      /* sur fond clair, c'est le rouge officiel qui redevient lisible : 7,4:1 */
  --sunk:#EEEAE6; --press:#DFD9D3; --lift:#F1EDE9;
  --veil:rgba(24,20,18,.42); --nav-bg:rgba(255,255,255,.94);
  --relief:0 1px 2px rgba(28,20,18,.07);
  --warn-ink:#8A5300; --warn-bg:rgba(224,169,79,.22);
  --ok-ink:#1F7A4D;   --ok-bg:rgba(111,191,142,.26);
  --bad-ink:#B3261E;  --bad-bg:rgba(211,47,47,.12);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--iron); color:var(--chalk);
  font-family:'Jost',system-ui,sans-serif; font-size:16px;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overscroll-behavior-y:contain;
}
h1,h2,h3,.num{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;letter-spacing:.01em;margin:0}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 96px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dust);font-weight:600}
button{font-family:inherit;font-size:16px;border:0;cursor:pointer;color:inherit;background:none}
.hidden{display:none!important}

/* Connexion */
#login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:28px;padding:32px;text-align:center}
#login h1{font-size:clamp(52px,17vw,84px);line-height:.88;text-transform:uppercase}
#marque{width:min(112px,26vw);height:auto}
#login h1 span{display:block;color:var(--brand-ink)}
#login p{color:var(--dust);max-width:32ch;margin:0;line-height:1.5}
/* Le bouton de connexion est le nôtre depuis le passage à Firebase Auth :
   Google Identity Services dessinait le sien, le SDK Firebase n'en fournit pas. */
.bgoogle{min-height:48px;padding:0 22px;border-radius:999px;background:var(--brand);
  color:var(--on-brand);font-weight:600;font-size:16px;border:1px solid var(--brand)}

/* En-tête */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px;flex-wrap:wrap}
header h2{flex:1}
/* Catégories de modèles : de grandes cibles, une par ligne */
.cats{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.cat{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;
  background:var(--plate);border:1px solid var(--edge);border-radius:var(--r)}
.cat .nom{flex:1;font-size:17px;font-weight:600}
.cat .compte{font-family:'Bebas Neue',Impact,sans-serif;font-size:22px;color:var(--brand-ink)}

/* Sections pliées par difficulté */
.pli{border-bottom:1px solid var(--edge);margin-bottom:2px}
.pli summary{display:flex;align-items:center;gap:10px;padding:14px 2px;cursor:pointer;
  list-style:none}
.pli summary::-webkit-details-marker{display:none}
.pli summary::after{content:'▾';color:var(--dust);font-size:13px;transition:transform .2s}
.pli[open] summary::after{transform:rotate(180deg)}
.pli summary .eyebrow{flex:1}
.pli summary .compte{font-size:13px;color:var(--dust);font-variant-numeric:tabular-nums}
.pli summary:focus-visible{outline:2px solid var(--brand-ink);outline-offset:2px;border-radius:6px}
.pli .ligne{cursor:pointer}
.pli > .ligne:last-child{margin-bottom:14px}

.titre-bloc{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.titre-bloc h2{flex:none}
.signe{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dust);font-weight:600}
header h2{font-size:30px;text-transform:uppercase;line-height:1}
.streak{font-size:13px;color:var(--dust);font-variant-numeric:tabular-nums}
#reseau{position:fixed;left:0;right:0;bottom:calc(53px + env(safe-area-inset-bottom));
  background:var(--sunk);border-top:1px solid var(--edge);color:var(--chalk);font-size:12.5px;
  padding:10px 16px;display:flex;align-items:center;gap:9px;z-index:15;cursor:pointer}
#reseau .pastille{width:7px;height:7px;border-radius:50%;background:var(--brand-ink);
  flex:0 0 auto;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.quitter{font-size:11.5px;font-weight:600;color:var(--dust);border:1px solid var(--edge);
  border-radius:999px;padding:7px 11px;background:var(--plate);white-space:nowrap;flex:0 0 auto}

/* Calendrier */
.mois{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.mois h3{font-size:24px;text-transform:uppercase}
.mois button{width:40px;height:40px;border-radius:10px;background:var(--plate);
  border:1px solid var(--edge);font-size:18px;color:var(--dust)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .jc{font-size:10px;letter-spacing:.1em;color:var(--dust);text-align:center;padding-bottom:4px;font-weight:600}
.cal .c{aspect-ratio:1;border-radius:9px;background:var(--plate);border:1px solid var(--edge);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:13px;font-variant-numeric:tabular-nums;color:var(--dust);padding:0}
.cal .c.vide{background:none;border-color:transparent}
.cal .c.today{border-color:var(--dust)}
.cal .c.faite{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:700}
.card.clos .nom{color:var(--dust)}
.card.clos{display:flex;align-items:center;gap:12px}
.card.clos .body{opacity:.72;flex:1;min-width:0;cursor:pointer}
.reprendre{font-size:17px;line-height:1;flex:0 0 auto}
.cal .c[aria-pressed="true"]{outline:2px solid var(--brand-ink);outline-offset:1px}
.cal .c .pts{display:flex;gap:3px}
.cal .c .pt{width:4px;height:4px;border-radius:50%;background:var(--on-brand)}
.cal .c .pt.libre{background:var(--brand-ink)}
.cal .c.libre{border-color:var(--brand);color:var(--chalk)}
.cal .c.libre .pt.libre{background:var(--brand-ink)}
.card.libre{border-left:3px solid var(--brand-ink)}
.chip.libre{background:rgba(224,82,83,.15);color:var(--brand-ink)}
.legende{font-size:12px;color:var(--dust);margin:12px 0 4px;display:flex;gap:14px;flex-wrap:wrap}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
/* Un bâton par semaine : séances du programme et activités libres empilées */
.histo{display:flex;align-items:flex-end;gap:3px;height:56px;margin:12px 0 8px}
.sem{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:1px}
.sem i{display:block;width:100%;border-radius:2px 2px 0 0;min-height:0}
.sem .s{background:var(--brand)}
.sem .a{background:var(--brand-ink);opacity:.45;border-radius:0 0 2px 2px}
.histo + .legende{display:flex;gap:16px;font-size:11.5px;flex-wrap:wrap;margin-top:0}
.legende i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.legende .pt-s{background:var(--brand)}
.legende .pt-a{background:var(--brand-ink);opacity:.45}
.num.vif{color:var(--brand-ink)}
.stat b{font-family:'Bebas Neue',Impact,sans-serif;font-size:26px;font-weight:400;display:block;line-height:1}
.stat span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dust)}

/* Sous-navigation coach */
.sous{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;scrollbar-width:none}
.sous button{flex:0 0 auto;padding:9px 15px;border-radius:999px;background:var(--plate);
  border:1px solid var(--edge);font-size:14px;font-weight:600;color:var(--dust)}
.sous button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

/* Formulaires d'édition */
.f{width:100%;background:var(--sunk);border:1px solid var(--edge);border-radius:9px;color:var(--chalk);
  font-family:inherit;font-size:15px;padding:11px 12px;min-height:44px}
.f:focus{outline:2px solid var(--brand-ink);outline-offset:1px}
.champ{margin-bottom:10px}
.champ label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dust);font-weight:600;margin-bottom:5px}
.duo{display:flex;gap:10px}
.duo>*{flex:1}
.btn{min-height:46px;padding:0 16px;border-radius:10px;background:var(--plate);border:1px solid var(--edge);
  font-weight:600;font-size:15px;color:var(--chalk)}
.btn.plein{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.danger{color:var(--brand-ink)}
.barre{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.ligne{display:flex;align-items:center;gap:10px;background:var(--plate);border:1px solid var(--edge);
  border-radius:10px;padding:11px 12px;margin-bottom:8px}
.ligne .g{flex:1;min-width:0}
.ligne .g .nom{font-size:15px;font-weight:600}
.ligne .g .meta{font-size:12.5px;color:var(--dust);margin-top:2px}
.ligne .poignee{color:var(--dust);font-size:18px;padding:8px 6px}
.ligne.cliquable{cursor:pointer}
/* La prise doit être une cible franche, et ne pas déclencher le défilement */
.prise{touch-action:none;cursor:grab;user-select:none;letter-spacing:-2px;
  font-size:17px;color:var(--dust);flex:0 0 auto;padding:8px 6px;line-height:1}
.prise:active{cursor:grabbing;color:var(--brand-ink)}
.deplace{opacity:.55;outline:2px dashed var(--brand-ink);outline-offset:2px;border-radius:10px}
.bloc.deplace{background:var(--lift)}
.ligne.cliquable:active{background:var(--press)}
.entete{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.entete .eyebrow{flex:1}

/* Fenêtre modale */
.modal{position:fixed;inset:0;background:var(--veil);z-index:40;display:flex;
  align-items:flex-end;justify-content:center}
.modal .feuille{background:var(--iron);border-top-left-radius:18px;border-top-right-radius:18px;
  width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;padding:18px 18px 28px;
  border-top:1px solid var(--edge)}
.modal h3{margin-bottom:14px}
.recherche{position:sticky;top:0;background:var(--iron);padding-bottom:10px;z-index:1}

/* Bloc : plusieurs exercices enchaînés, un seul repos à la fin du tour */
.bloc{border-left:3px solid var(--brand);padding-left:12px;margin-bottom:14px}
.bloc-tete{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.bloc-info{font-size:12px;color:var(--dust);font-variant-numeric:tabular-nums;white-space:nowrap}
.bloc .card{margin-bottom:8px}
.bloc .card:last-child{margin-bottom:0}
.pause{font-size:12px;color:var(--dust);padding:1px 0 9px 3px;font-variant-numeric:tabular-nums}
.cadence{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.09em;padding:3px 7px;
  border-radius:5px;background:var(--sunk);color:var(--dust);font-variant-numeric:tabular-nums}
.cadbloc{display:flex;align-items:center;gap:10px;margin-top:8px}
.cad{display:block;overflow:visible}
.cad.grand{margin-top:10px;max-width:100%;height:auto}
.prog{display:block;width:100%;height:auto;max-width:340px;margin:10px 0 4px}
.vignette{width:52px;height:52px;object-fit:cover;border-radius:9px;background:var(--sunk);flex:0 0 auto}
.vo{font-size:12.5px;font-weight:400;color:var(--dust)}
/* La note du coach : sa voix, distincte de la consigne générique du catalogue */
.note-coach{border-left:3px solid var(--brand);padding:6px 0 6px 11px;margin-top:9px;
  font-size:13.5px;line-height:1.5;color:var(--chalk);white-space:pre-wrap}
.note-coach.grande{font-size:15px;margin:4px 0 14px;padding:10px 0 10px 13px}
.note-coach .eyebrow{display:block;margin-bottom:4px}
.fil{display:flex;flex-direction:column;gap:10px;margin:6px 0 14px;max-height:46vh;overflow-y:auto}
.bulle{padding:11px 13px;border-radius:12px;font-size:14.5px;line-height:1.5;white-space:pre-wrap}
.bulle.coach{background:var(--brand);color:var(--on-brand);border-bottom-left-radius:4px;align-self:flex-start;max-width:88%}
.bulle.moi{background:var(--sunk);color:var(--chalk);border-bottom-right-radius:4px;align-self:flex-end;max-width:88%}
.bulle .qui{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.75;display:block;margin-bottom:3px}
.pastille-cm{background:var(--brand);color:var(--on-brand);border-radius:999px;
  font-size:11px;font-weight:700;padding:2px 7px;white-space:nowrap}
.video{position:relative;width:100%;aspect-ratio:16/9;margin:14px 0 4px;
  border-radius:10px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.lien{text-decoration:none;color:var(--brand-ink);display:inline-block}
.lien:focus-visible{outline:2px solid var(--brand-ink);outline-offset:2px;border-radius:5px}
.apercu{width:100%;max-width:280px;border-radius:10px;background:var(--sunk);margin-bottom:10px}
.illu{width:100%;max-width:300px;border-radius:12px;background:var(--sunk);margin:2px 0 12px;display:block}
.perso{font-size:13px;color:var(--brand-ink);font-weight:600;background:none;border:0;
  padding:8px 2px;text-align:left;text-decoration:underline;text-underline-offset:3px}
/* Accueil coach : une carte par athlète, statut et avancement lisibles d'un coup */
.ath-tete{display:flex;align-items:center;gap:10px;margin-bottom:5px}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:0 0 auto;
  background:var(--sunk);display:grid;place-items:center;font-size:13px;font-weight:700;
  color:var(--dust);letter-spacing:.02em}
.avatar.grand{width:64px;height:64px;font-size:20px}
.avatar.vide{border:1px solid var(--edge)}
.ath-tete strong{font-size:17px;flex:1;min-width:0}
.chip{font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 9px;border-radius:999px;
  white-space:nowrap;text-transform:uppercase}
.chip.nouveau{background:var(--warn-bg);color:var(--warn-ink)}
.chip.actif{background:var(--ok-bg);color:var(--ok-ink)}
.chip.inactif{background:var(--sunk);color:var(--dust)}
.chip.archive{background:none;border:1px dashed var(--edge);color:var(--dust)}
/* Accueil : deux grandes cartes, tout le reste en dessous */
.card.grande{align-items:center}
.nom.gros{font-size:19px}
.fleche-carte{font-size:26px;color:var(--dust);flex:0 0 auto;line-height:1}
.curseur{width:100%;accent-color:var(--brand);height:34px}
.jauge{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin:9px 0 7px}
.jauge i{display:block;height:100%;background:var(--brand);border-radius:3px;
  transition:width .4s ease-out}
.meta.bas{font-size:12.5px}
.impaye{color:var(--warn-ink);font-weight:600}
.alerte{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:11px 14px;
  font-size:13.5px;font-weight:600;margin-bottom:14px}
.contacts{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.contact{flex:1;min-width:96px;text-align:center;line-height:44px;padding:0;
  text-decoration:none;color:var(--chalk)}
.contact.inerte{opacity:.4;pointer-events:none}
.paye{display:inline-flex;align-items:center;gap:8px;margin-top:9px;font-size:13.5px;
  color:var(--dust);cursor:pointer}
.paye input{width:20px;height:20px;accent-color:var(--brand)}
.card .quoi{color:var(--dust);font-size:15px;line-height:1.5}

.origine{display:flex;flex-direction:column;gap:2px;margin-top:12px;min-height:24px}
.origine .dit{font-size:12.5px;color:var(--dust)}

/* Sélecteur de jour */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;margin-bottom:6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;padding:11px 18px;border-radius:999px;background:var(--plate);border:1px solid var(--edge);
  font-weight:600;font-size:14px;white-space:nowrap;min-height:44px}
.day[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}

/* Carte exercice */
.card{background:var(--plate);border:1px solid var(--edge);border-radius:var(--r);padding:16px;margin-bottom:12px;
  box-shadow:var(--relief);
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:76px}
.card:active{transform:scale(.99)}
.card .body{flex:1;min-width:0}
.card .nom{font-size:17px;font-weight:600;line-height:1.25}
.card .meta{font-size:13px;color:var(--dust);margin-top:3px}
.card .done{width:34px;height:34px;border-radius:50%;border:2px solid var(--edge);display:grid;place-items:center;
  font-size:13px;font-weight:700;flex:0 0 auto;font-variant-numeric:tabular-nums}
.card .done.full{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

/* Disques — élément signature */
/* La barre entière : bague, disques, fût, disques, bague. Symétrique, et
   chargée du plus lourd contre le fût vers le plus léger à l'extérieur. */
.bar{display:flex;align-items:center;gap:1.5px;margin-top:8px;height:22px}
.bar .d{display:block;width:7px;border-radius:2px;border:1px solid rgba(0,0,0,.35)}
.bar .fut{width:26px;height:4px;background:var(--p2);border-radius:2px;border:0;margin:0 1.5px}
.bar .bague{width:3.5px;height:12px;background:var(--dust);border-radius:1px;border:0}

/* Panneau de saisie */
#logger{position:fixed;inset:0;background:var(--iron);z-index:20;display:flex;flex-direction:column;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#logger{animation:none}}
#logger .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#logger h3{font-size:26px;text-transform:uppercase;line-height:1.05;margin:10px 0 2px}
.consigne{color:var(--dust);font-size:14px;line-height:1.45}
.steppers{display:flex;gap:14px;margin:auto 0}
.stepper{flex:1;background:var(--plate);border:1px solid var(--edge);border-radius:var(--r);padding:14px 10px;text-align:center}
.stepper .val{font-size:52px;line-height:1;margin:10px 0}
.stepper .row{display:flex;gap:8px}
.stepper .row button{flex:1;height:52px;border-radius:10px;background:var(--sunk);font-size:20px;font-weight:600}
.stepper .row button:active{background:var(--press)}
.chrono .val.court{color:var(--brand-ink)}
.chrono .row button{height:46px;font-size:15px}
.tempo{font-size:12.5px;color:var(--dust);line-height:1.5;margin:6px 0 0;font-variant-numeric:tabular-nums}
.valider{width:100%;min-height:60px;border-radius:var(--r);background:var(--brand);color:var(--on-brand);
  font-size:18px;font-weight:700;letter-spacing:.02em;margin-top:16px}
.valider:disabled{opacity:.45}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;min-height:34px}
.set{background:var(--plate);border:1px solid var(--edge);border-radius:8px;padding:7px 11px;font-size:14px;
  font-variant-numeric:tabular-nums}
.close{font-size:15px;color:var(--dust);padding:10px 4px}

/* Minuteur de repos */
#repos{position:fixed;left:0;right:0;bottom:0;background:var(--brand);color:var(--on-brand);padding:14px 18px;
  display:flex;justify-content:space-between;align-items:center;z-index:30;
  padding-bottom:calc(14px + env(safe-area-inset-bottom))}
#repos .t{font-size:30px;font-family:'Bebas Neue';font-variant-numeric:tabular-nums}
#repos button{font-weight:700;font-size:14px;text-decoration:underline}

/* Coach */
.athlete{display:block;text-align:left;width:100%;padding:15px 16px;
  background:var(--plate);border:1px solid var(--edge);border-radius:var(--r);margin-bottom:10px;
  box-shadow:var(--relief)}
.tag{font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;background:var(--sunk);color:var(--dust);white-space:nowrap}
.tag.warn{background:var(--bad-bg);color:var(--bad-ink)}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav-bg);backdrop-filter:blur(8px);
  border-top:1px solid var(--edge);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;padding:15px 0;font-size:13px;font-weight:600;color:var(--dust)}
.nav button[aria-pressed="true"]{color:var(--brand-ink)}
.empty{color:var(--dust);text-align:center;padding:48px 20px;line-height:1.6}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--plate);border:1px solid var(--edge);
  padding:11px 16px;border-radius:10px;font-size:14px;z-index:50}
/* Historique : une ligne par exercice, les chiffres passent dessous si ça serre */
.hist{margin-top:12px;border-top:1px solid var(--edge)}
.hist-ex{display:flex;flex-wrap:wrap;gap:2px 12px;justify-content:space-between;
  align-items:baseline;padding:7px 0;border-bottom:1px solid var(--edge);font-size:14px}
.hist-ex:last-child{border-bottom:0}
.hist-ex .qui{font-weight:600;min-width:0}
.hist-ex .chiffres{color:var(--dust);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Choix d'apparence : trois cibles pleine largeur, la retenue est encadrée */
.choix{display:flex;flex-direction:column;gap:9px;margin-bottom:6px}
.opt{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;width:100%;
  padding:14px 15px;background:var(--plate);border:1px solid var(--edge);border-radius:var(--r)}
.opt[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.opt-nom{font-size:16px;font-weight:600}
.opt[aria-pressed="true"] .opt-nom::after{content:' ✓';color:var(--brand-ink)}
.opt-quoi{font-size:12.5px;color:var(--dust);line-height:1.4}
#btheme{padding:0;width:34px;height:34px;display:grid;place-items:center}
#btheme svg{width:15px;height:15px;display:block}

:focus-visible{outline:2px solid var(--brand-ink);outline-offset:2px}

  <div id="gbtn"></div>

<main id="app" class="wrap hidden"></main>

<nav id="nav" class="nav hidden"></nav>

<div id="logger" class="hidden"></div>
<div id="repos" class="hidden"></div>

<!--
  Pont vers le SDK Firebase. Le script principal reste un script classique : le
  convertir en module l'aurait passé en mode strict d'un bloc, sur 3100 lignes
  écrites sans lui. On importe donc ici, et on expose sur `window.FB` ce dont il
  a besoin. Les modules s'exécutent avant `window.onload`, qui démarre l'app :
  `FB` est donc toujours prêt quand le script principal s'en sert.

  Les identifiants ci-dessous sont publics par nature — la sécurité tient aux
  Security Rules, pas à leur secret, comme l'était déjà le CLIENT_ID Google.
-->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
  from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
         doc, getDoc, getDocs, collection, collectionGroup, query, where, orderBy, limit,
         onSnapshot, setDoc, addDoc, updateDoc, deleteDoc, writeBatch, runTransaction,
         serverTimestamp, increment, arrayUnion, arrayRemove }
  from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: 'AIzaSyDzKOeKwPDJ7CxD1uoPvLNzeGPzJX8knCE',
  authDomain: 'coaching-musculation-f0c1c.firebaseapp.com',
  projectId: 'coaching-musculation-f0c1c',
  storageBucket: 'coaching-musculation-f0c1c.firebasestorage.app',
  messagingSenderId: '987770049003',
  appId: '1:987770049003:web:9539975011af967ef7c9ae'
});

// Le cache persistant remplace le cache de lecture et la file d'écriture qu'on
// tenait à la main : lectures servies hors ligne, écritures rejouées au retour
// du réseau, sans identifiant provisoire puisque Firestore génère l'id côté client.
const db = initializeFirestore(app, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});

window.FB = {
  auth: getAuth(app), db, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut,
  doc, getDoc, getDocs, collection, collectionGroup, query, where, orderBy, limit,
  onSnapshot, setDoc, addDoc, updateDoc, deleteDoc, writeBatch, runTransaction,
  serverTimestamp, increment, arrayUnion, arrayRemove
};
</script>
<script>
// ── Configuration ────────────────────────────────────────────
// Constantes autrefois servies par Apps Script (CONFIG/SPORTS dans Code.js) :
// elles ne dépendaient d'aucune donnée, elles vivent maintenant côté client.
const COACH_NOM = 'Jérémy';
const BAR_KG = 20;              // poids de la barre olympique, pour l'affichage des disques

/** Sports proposés à la saisie libre, groupés par famille. */
const SPORTS = [
  ['Salle', ['Musculation', 'Séance libre', 'Cross-training', 'Cardio', 'Circuit training',
             'Poids de corps', 'Kettlebell', 'Rameur', 'Vélo d\'intérieur', 'Elliptique', 'Stepper']],
  ['Course', ['Course à pied', 'Trail', 'Tapis de course', 'Marche', 'Marche nordique', 'Randonnée']],
  ['Vélo', ['Vélo de route', 'VTT', 'Spinning', 'Gravel']],
  ['Eau', ['Natation', 'Eau libre', 'Aviron', 'Kayak', 'Surf', 'Paddle']],
  ['Collectif', ['Football', 'Basketball', 'Handball', 'Rugby', 'Volleyball']],
  ['Raquette', ['Tennis', 'Padel', 'Badminton', 'Squash', 'Tennis de table']],
  ['Combat', ['Boxe', 'Arts martiaux', 'Grappling', 'Escrime']],
  ['Souplesse', ['Yoga', 'Pilates', 'Étirements', 'Mobilité', 'Méditation']],
  ['Glisse', ['Ski', 'Snowboard', 'Patinage', 'Escalade', 'Équitation']],
  ['Autre', ['Danse', 'Golf', 'Jardinage', 'Autre']]
];

/**
 * Tri des jours par ordre de la semaine, le libellé pouvant être « Lundi — Haut ».
 * S'appuie sur SEMAINE, déclaré plus bas avec les jours capitalisés : la
 * comparaison se fait en minuscules des deux côtés.
 */
function triJours(a, b) {
  const rang = j => {
    const t = String(j).toLowerCase();
    for (let i = 0; i < SEMAINE.length; i++) if (t.indexOf(SEMAINE[i].toLowerCase()) !== -1) return i;
    return 99;
  };
  const d = rang(a) - rang(b);
  return d !== 0 ? d : String(a).localeCompare(String(b));
}

// ── État ─────────────────────────────────────────────────────
const S = { token:null, moi:null, jour:null, exos:[], blocs:[], seanceId:null, debut:null,
            faits:{}, finis:[], vue:'seance', timer:null };
const $ = s => document.querySelector(s);

// ── Appels API ───────────────────────────────────────────────
// PORTAGE EN COURS — Apps Script n'est plus joignable : il vérifiait un jeton
// Google émis pour son propre CLIENT_ID, que Firebase Auth ne produit pas.
// Chaque action encore appelée ici reste donc à porter vers Firestore ; on échoue
// franchement, sans appel réseau, pour que la liste des restes soit lisible en
// console plutôt que noyée dans des erreurs de jeton.
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

// ── Hors ligne ───────────────────────────────────────────────
// Plus de file d'écriture ni de cache de lecture maison : chaque écran lit et
// écrit Firestore directement, et `persistentLocalCache` (voir le module de
// bootstrap plus haut) sert les lectures et rejoue les écritures lui-même au
// retour du réseau. Il ne reste ici qu'un bandeau, purement indicatif : rien
// n'en dépend pour fonctionner hors ligne.
const enLigne = () => navigator.onLine !== false;

/** Bandeau discret signalant une coupure réseau, confirmée par le navigateur. */
function majBandeau() {
  let b = $('#reseau');
  if (!b) {
    b = document.createElement('div');
    b.id = 'reseau';
    document.body.appendChild(b);
  }
  if (enLigne()) { b.classList.add('hidden'); return; }
  b.classList.remove('hidden');
  b.className = 'attente';
  b.innerHTML = `<span class="pastille"></span>Hors ligne`;
}

window.addEventListener('online', majBandeau);
window.addEventListener('offline', majBandeau);

// ── Connexion Firebase et profil ─────────────────────────────
// Firebase Auth persiste lui-même la session (IndexedDB) : plus de jeton ni de
// profil à ranger dans localStorage, plus d'expiration à surveiller. Le SDK
// renouvelle le jeton tout seul, `onAuthStateChanged` fait foi.

/**
 * Le profil que le reste de l'app attend — l'ancien `bootstrap` d'Apps Script.
 * Une lecture du document de profil, plus les jours du programme en vigueur.
 * Hors ligne, le cache persistant de Firestore répond sans réseau.
 */
async function chargerProfil(email) {
  const { db, doc, getDoc } = FB;
  const snap = await getDoc(doc(db, 'pratiquants', email));
  if (!snap.exists()) throw new Error('NON_INSCRIT');
  const p = snap.data();
  return {
    email,
    nom: p.nom || '',
    objectif: p.objectif || '',
    estCoach: p.role === 'coach',
    admin: p.admin === true,
    coach: COACH_NOM,
    sports: SPORTS,
    jours: await joursDuProgramme(email),
    barKg: BAR_KG
  };
}

/**
 * Attribution « En cours » d'un pratiquant, avec ses lignes de programme —
 * ou `null` s'il n'en a pas. S'il y en avait plusieurs — l'invariant peut se
 * casser sur un double envoi, voir `attribuer` — on prend la plus récente,
 * comme le faisait `attributionActive_` côté Apps Script.
 */
async function attributionActive(email) {
  const { db, collection, query, where, orderBy, limit, getDocs } = FB;
  const snap = await getDocs(query(collection(db, 'attributions'),
    where('email', '==', email), where('statut', '==', 'En cours'),
    orderBy('date_debut', 'desc'), limit(1)));
  if (snap.empty) return null;
  const att = { id: snap.docs[0].id, ...snap.docs[0].data() };
  const lignes = await getDocs(collection(db, 'attributions', att.id, 'programme'));
  att.lignes = lignes.docs.map(d => d.data());
  return att;
}

/** Lignes du jour groupées en blocs, triées — sans charges ni historique : de
 *  quoi estimer une durée, pas encore de quoi afficher un logger. */
function blocsBruts(att, jour) {
  if (!att) return [];
  const lignes = att.lignes.filter(l => String(l.jour) === String(jour))
    .sort((a, b) => { const d = numBloc(a) - numBloc(b); return d !== 0 ? d : Number(a.ordre) - Number(b.ordre); });
  const blocs = []; const parNum = {};
  lignes.forEach(l => {
    const num = numBloc(l);
    if (!parNum[num]) {
      parNum[num] = { bloc: num, series: Number(l.series) || 3, repos_s: Number(l.repos_s) || 90, exercices: [] };
      blocs.push(parNum[num]);
    }
    parNum[num].exercices.push(l);
  });
  return blocs;
}

/**
 * Le pratiquant fixe sa propre charge sur un exercice, prioritaire sur celle
 * du coach — c'est lui qui est sous la barre. Une charge nulle efface
 * l'ajustement et rend la main au programme. Le doc ID est l'exercice
 * lui-même (voir le modèle de données) : pas de recherche préalable à faire,
 * contrairement à l'ancienne table plate indexée par un id généré.
 */
async function ajusterCharge(exerciceId, charge) {
  const { db, doc, setDoc, deleteDoc, serverTimestamp } = FB;
  const att = await attributionActive(S.email);
  if (!att) throw new Error('AUCUNE_ATTRIBUTION');
  const ref = doc(db, 'attributions', att.id, 'ajustements', exerciceId);
  const val = Number(charge) || 0;
  if (!val) { await deleteDoc(ref); return { charge: 0, efface: true }; }
  await setDoc(ref, { charge: val, maj_le: serverTimestamp() });
  return { charge: val };
}

/** Jours du programme en vigueur : ceux de l'attribution « En cours ». */
async function joursDuProgramme(email) {
  const att = await attributionActive(email);
  if (!att) return [];
  const jours = [];
  att.lignes.forEach(l => { if (l.jour && !jours.includes(l.jour)) jours.push(l.jour); });
  return jours.sort(triJours);
}

// ── Données : lectures Firestore ─────────────────────────────

/** Une date Firestore peut être un Timestamp ou une chaîne : on rend toujours une chaîne. */
function versDate(v) {
  if (!v) return null;
  if (typeof v.toDate === 'function') return v.toDate().toISOString();
  return String(v);
}

/** Même conversion que `versDate`, mais en objet `Date` pour les comparaisons. */
function dateDe(v) {
  if (!v) return new Date(0);
  return typeof v.toDate === 'function' ? v.toDate() : new Date(v);
}

/**
 * Commentaires en attente. Le coach voit ce que les pratiquants ont écrit,
 * le pratiquant ce que le coach lui a répondu.
 *
 * Le total du coach compte ici les seuls messages de pratiquants non lus.
 * L'ancienne version comptait tous les commentaires non lus, y compris les
 * siens restés non lus par le pratiquant — un compteur qui ne voulait rien dire.
 */
async function dataNonLus() {
  const { db, collection, query, where, getDocs } = FB;
  if (S.moi && S.moi.estCoach) {
    const snap = await getDocs(query(collection(db, 'commentaires'),
      where('auteur', '==', 'pratiquant'), where('lu', '==', false)));
    const parEmail = {};
    snap.forEach(d => {
      const e = String(d.data().email || '').toLowerCase();
      parEmail[e] = (parEmail[e] || 0) + 1;
    });
    return { total: snap.size, parEmail };
  }
  const snap = await getDocs(query(collection(db, 'commentaires'),
    where('email', '==', S.email), where('auteur', '==', 'coach'), where('lu', '==', false)));
  const exercices = {};
  snap.forEach(d => {
    const x = d.data().exercice_id;
    exercices[x] = (exercices[x] || 0) + 1;
  });
  return { total: snap.size, exercices };
}

/** Avancement d'un programme, à l'identique de l'ancien `progression_`. */
function progression(att, resume) {
  if (!att) return null;
  const parSemaine = Number(att.nb_jours) || 0;
  const debut = att.date_debut ? new Date(att.date_debut) : null;
  const fin = att.date_fin ? new Date(att.date_fin) : new Date();
  const joursEcoules = debut ? Math.max(0, Math.floor((fin - debut) / 86400000)) : 0;
  const semaineCourante = debut ? Math.floor(joursEcoules / 7) + 1 : 0;

  const duree = Number(att.duree_semaines) || 0;
  const faites = Number((resume || {}).seancesDepuisAttribution) || 0;
  const semainesRef = duree || Math.max(1, semaineCourante);
  const attendues = parSemaine * semainesRef;

  return {
    parSemaine, semaine: semaineCourante, duree_semaines: duree,
    faites, attendues, part: attendues ? Math.min(1, faites / attendues) : 0
  };
}

/**
 * Liste d'accueil du coach. Trois requêtes, quel que soit le nombre d'athlètes :
 * les profils, les attributions en cours, les commentaires en attente.
 *
 * L'ancienne version lisait l'historique de séances de tout le monde pour
 * compter les séances faites. Ça passait avec un serveur qui avait déjà le
 * classeur en main ; depuis le navigateur ce serait des milliers de documents à
 * chaque ouverture de l'écran. Les compteurs vivent donc sur le profil
 * (`resume`), écrits au fil des séances — voir PRODUCTION.md, dénormalisation.
 */
async function dataCoachAthletes() {
  const { db, collection, query, where, getDocs } = FB;
  const [prats, atts, attente] = await Promise.all([
    getDocs(collection(db, 'pratiquants')),
    getDocs(query(collection(db, 'attributions'), where('statut', '==', 'En cours'))),
    dataNonLus()
  ]);

  const active = {};
  atts.forEach(a => {
    const d = a.data();
    const e = String(d.email || '').toLowerCase();
    const debut = versDate(d.date_debut);
    // L'invariant « une seule en cours » peut se casser sur un double envoi :
    // on garde la plus récente, comme le faisait `attributionActive_`.
    if (!active[e] || new Date(debut) > new Date(active[e].date_debut)) {
      active[e] = { id: a.id, ...d, date_debut: debut, date_fin: versDate(d.date_fin) };
    }
  });

  const list = [];
  prats.forEach(doc => {
    const p = doc.data();
    if (p.role === 'coach') return;          // le coach ne se suit pas lui-même
    const email = doc.id;
    const att = active[email] || null;
    const derniere = versDate((p.resume || {}).derniereSeanceLe);

    list.push({
      email, nom: p.nom || email.split('@')[0],
      commentaires: (attente.parEmail || {})[email] || 0,
      // Sans statut explicite : Nouveau tant qu'il n'a pas de programme, Actif dès qu'il en a un.
      statut: String(p.statut || (att ? 'Actif' : 'Nouveau')),
      telephone: p.telephone || '', objectif: p.objectif || '',
      nbSeances: Number((p.resume || {}).nbSeances) || 0,
      derniere,
      joursDepuis: derniere ? Math.floor((Date.now() - new Date(derniere)) / 86400000) : null,
      programme: att ? {
        id: att.id, nom: att.nom, paye: att.paye === true,
        date_debut: att.date_debut, modele_id: att.modele_id || ''
      } : null,
      progression: progression(att, p.resume)
    });
  });

  const rang = { Nouveau: 0, Actif: 1, Inactif: 2, 'Archivé': 3 };
  return list.sort((a, b) => {
    const d = (rang[a.statut] || 1) - (rang[b.statut] || 1);
    if (d !== 0) return d;
    return (b.joursDepuis === null ? 9999 : b.joursDepuis) - (a.joursDepuis === null ? 9999 : a.joursDepuis);
  });
}

// ── Blocs et durées ──────────────────────────────────────────
// Le regroupement en jours se faisait côté serveur (`grouperEnJours_`), mais il
// ne touchait jamais au classeur : il traverse le changement de base tel quel.
// L'estimation de durée, elle, existait déjà ici pour l'éditeur — on s'appuie
// sur `dureeBloc`, plus bas, plutôt que d'en écrire une seconde version.

const repsTexte = v => (v === undefined || v === null ? '' : String(v));
const numBloc = l => Number(l.bloc || l.ordre) || 1;

/** Durée d'un jour entier : ses blocs, les changements de poste, l'échauffement. */
function estimerDuree(blocs) {
  if (!blocs || !blocs.length) return 0;
  const secondes = blocs.reduce((t, b) => t + dureeBloc(b), 0)
    + Math.max(0, blocs.length - 1) * TRANSITION_MIN * 60
    + ECHAUFFEMENT_MIN * 60;
  return Math.round(secondes / 60);
}

/** Lignes plates → jours, chacun découpé en blocs (supersets et circuits). */
function grouperEnJours(lignes, noms) {
  const jours = [];
  const parJour = {};
  lignes.slice().sort((a, b) => {
    const j = triJours(a.jour, b.jour);
    if (j !== 0) return j;
    const d = numBloc(a) - numBloc(b);
    return d !== 0 ? d : Number(a.ordre) - Number(b.ordre);
  }).forEach(l => {
    const j = String(l.jour);
    if (!parJour[j]) { parJour[j] = { jour: j, blocs: [], _n: {} }; jours.push(parJour[j]); }
    const num = numBloc(l);
    if (!parJour[j]._n[num]) {
      parJour[j]._n[num] = {
        bloc: num, series: Number(l.series) || 3, repos_s: Number(l.repos_s) || 90, exercices: []
      };
      parJour[j].blocs.push(parJour[j]._n[num]);
    }
    parJour[j]._n[num].exercices.push({
      exercice_id: l.exercice_id,
      nom: noms[l.exercice_id] || l.exercice_id,
      reps_cible: repsTexte(l.reps_cible),
      duree_s: l.duree_s === '' || l.duree_s === undefined ? '' : l.duree_s,
      charge_cible: Number(l.charge_cible) || 0,
      pct_rm: Number(String(l.pct_rm).replace('%', '')) || 0,
      cadence: l.cadence || '',
      pause_s: Number(l.pause_s) || 0,
      note: l.note || ''
    });
  });
  jours.forEach(j => { delete j._n; j.duree_estimee = estimerDuree(j.blocs); });
  return jours;
}

/** Catalogue complet, trié par groupe puis par nom. Lisible par tous. */

/** Contenu d'une attribution, groupé en jours. Sans `attributionId`, celle en cours. */

      date_debut: versDate(att.date_debut), date_fin: versDate(att.date_fin) || '', statut: att.statut

/**
 * Donne un programme à un pratiquant. Avec un modèle, son contenu est copié —
 * le personnaliser ensuite ne touche pas le modèle, et il peut être redonné
 * plus tard sans conflit. Sans modèle, l'attribution démarre vide, pour du
 * sur-mesure. L'attribution « En cours » précédente passe à « Terminé ».
 * Pas de vraie transaction, pour la même raison qu'à `demarrerSeance` (le SDK
 * client ne lit pas de requête depuis une transaction) : c'est justement le
 * risque déjà documenté au plan (Risque 3), absorbé en lecture en prenant
 * toujours l'attribution la plus récente si l'invariant se casse.
 */
async function creerAttribution(email, p) {
  const { db, doc, getDoc, collection, getDocs, addDoc, updateDoc, writeBatch, serverTimestamp } = FB;
  let nom = String(p.nom || '').trim();
  let lignesModele = [], dureeSemaines = 0;
  if (p.modele_id) {
    const [snap, lignes] = await Promise.all([
      getDoc(doc(db, 'modeles', p.modele_id)),
      getDocs(collection(db, 'modeles', p.modele_id, 'lignes'))
    ]);
    if (!snap.exists()) throw new Error('MODELE_INTROUVABLE');
    if (!nom) nom = snap.data().nom;
    dureeSemaines = Number(snap.data().duree_semaines) || 0;
    lignesModele = lignes.docs.map(d => d.data());
  }
  if (!nom) nom = 'Programme sur mesure';

  const active = await attributionActive(email);
  if (active) {
    await updateDoc(doc(db, 'attributions', active.id), { statut: 'Terminé', date_fin: serverTimestamp() });
  }

  // `duree_semaines` copiée depuis le modèle plutôt que relue au moment de
  // l'accueil : le pratiquant n'a pas le droit de lire `modeles` (réservé au
  // coach), seulement sa copie ici. Même logique que nb_jours/nb_exercices.
  const ref = await addDoc(collection(db, 'attributions'), {
    email, modele_id: p.modele_id || '', nom,
    date_debut: p.date_debut ? new Date(p.date_debut) : serverTimestamp(),
    date_fin: '', statut: 'En cours', paye: false, notes: String(p.notes || ''),
    nb_jours: new Set(lignesModele.map(l => l.jour)).size,
    nb_exercices: lignesModele.length,
    duree_semaines: dureeSemaines,
    cree_le: serverTimestamp()
  });

  if (lignesModele.length) {
    const b = writeBatch(db);
    lignesModele.forEach(l => b.set(doc(collection(db, 'attributions', ref.id, 'programme')), {
      jour: l.jour, bloc: l.bloc, ordre: l.ordre, exercice_id: l.exercice_id,
      series: l.series, reps_cible: l.reps_cible, duree_s: l.duree_s,
      charge_cible: l.charge_cible, pct_rm: l.pct_rm, cadence: l.cadence,
      pause_s: l.pause_s, repos_s: l.repos_s, note: l.note || ''
    }));
    await b.commit();
  }
  return { id: ref.id, nom, lignes: lignesModele.length };
}

/** Modifie un sous-ensemble de champs d'une attribution (clôture, paiement, notes...). */
async function majAttribution(id, patch) {
  const { db, doc, updateDoc, serverTimestamp } = FB;
  const data = {};
  if (patch.statut !== undefined) data.statut = patch.statut;
  if (patch.paye !== undefined) data.paye = patch.paye === true;
  if (patch.notes !== undefined) data.notes = patch.notes;
  if (patch.date_fin !== undefined) data.date_fin = patch.date_fin ? serverTimestamp() : '';
  await updateDoc(doc(db, 'attributions', id), data);
}

/** Les 25 derniers faits d'un pratiquant : séances détaillées et activités libres. */
async function dataCoachDetail(email) {
  const { db, collection, query, where, orderBy, limit, getDocs } = FB;
  const [snap, noms, libres] = await Promise.all([
    getDocs(query(collection(db, 'seances'), where('email', '==', email),
      orderBy('date', 'desc'), limit(25))),
    nomsExercices(),
    dataActivites(email, {})
  ]);

  const seances = await Promise.all(snap.docs.map(async d => {
    const s = d.data();
    const series = (await getDocs(collection(db, 'seances', d.id, 'series'))).docs
      .map(x => x.data())
      .sort((a, b) => Number(a.serie_num) - Number(b.serie_num));

    let volume = 0;
    const ordre = [], parEx = {};
    series.forEach(x => {
      const reps = Number(x.reps) || 0, charge = Number(x.charge) || 0;
      volume += reps * charge;
      const k = String(x.exercice_id);
      if (!parEx[k]) { parEx[k] = { exercice: noms[k] || k, series: [] }; ordre.push(k); }
      parEx[k].series.push({ reps, charge });
    });

    return {
      type: 'seance', date: versDate(s.date), jour: s.jour,
      duree_min: Number(s.duree_min) || 0,
      ressenti: s.ressenti || '', notes: s.notes || '',
      nbSeries: series.length, volume: Math.round(volume),
      exercices: ordre.map(k => parEx[k])
    };
  }));

  const activites = libres.map(a => ({
    type: 'activite', date: a.date, sport: a.sport || 'Activité',
    duree_min: a.duree_min, distance_km: a.distance_km, effort: a.effort, notes: a.notes
  }));

  return seances.concat(activites)
    .sort((a, b) => new Date(b.date) - new Date(a.date))
    .slice(0, 25);
}

/**
 * Assiduité et régularité sur une fenêtre glissante de N semaines (12 par
 * défaut). Deux mesures distinctes : l'assiduité compte les séances, la
 * régularité mesure la dispersion des écarts entre deux séances — assidu sur
 * le papier et irrégulier dans les faits, ce n'est pas rare.
 */
async function dataStatistiques(email, semaines) {
  const { db, collection, query, where, orderBy, getDocs } = FB;
  const n = Number(semaines) || 12;
  const depuis = new Date(Date.now() - n * 7 * 86400000);

  const [seancesSnap, activitesSnap] = await Promise.all([
    getDocs(query(collection(db, 'seances'), where('email', '==', email),
      where('date', '>=', depuis), orderBy('date', 'desc'))),
    getDocs(collection(db, 'pratiquants', email, 'activites'))
  ]);

  const seances = seancesSnap.docs.map(d => ({ ...d.data(), date: versDate(d.data().date) })).reverse();
  const activites = activitesSnap.docs.map(d => ({ ...d.data(), date: versDate(d.data().date) }))
    .filter(a => new Date(a.date) >= depuis);

  const parSemaine = [];
  for (let i = n - 1; i >= 0; i--) {
    const fin = new Date(Date.now() - i * 7 * 86400000);
    const deb = new Date(fin.getTime() - 7 * 86400000);
    parSemaine.push({
      seances: seances.filter(s => { const d = new Date(s.date); return d > deb && d <= fin; }).length,
      activites: activites.filter(a => { const d = new Date(a.date); return d > deb && d <= fin; }).length
    });
  }

  const ecarts = [];
  for (let i = 1; i < seances.length; i++) {
    ecarts.push((new Date(seances[i].date) - new Date(seances[i - 1].date)) / 86400000);
  }
  const moyenne = t => t.length ? t.reduce((a, b) => a + b, 0) / t.length : 0;
  const ecartMoyen = moyenne(ecarts);

  // Régularité : plus les écarts se ressemblent, plus le rythme est tenu.
  let regularite = null;
  if (ecarts.length >= 3 && ecartMoyen > 0) {
    const variance = moyenne(ecarts.map(e => (e - ecartMoyen) * (e - ecartMoyen)));
    const dispersion = Math.sqrt(variance) / ecartMoyen;
    regularite = Math.round(Math.max(0, Math.min(1, 1 - dispersion)) * 100);
  }

  const closes = seances.filter(s => Number(s.duree_min) > 0 && Number(s.duree_prevue) > 0);
  const reel = moyenne(closes.map(s => Number(s.duree_min)));
  const prevu = moyenne(closes.map(s => Number(s.duree_prevue)));
  const derniere = seances.length ? seances[seances.length - 1].date : null;

  return {
    semaines: n, parSemaine, total: seances.length, totalActivites: activites.length,
    parSemaineMoyen: Math.round(seances.length / n * 10) / 10,
    ecartMoyen: Math.round(ecartMoyen * 10) / 10,
    ecartMax: ecarts.length ? Math.round(Math.max(...ecarts)) : 0,
    regularite,
    dureeReelle: Math.round(reel), dureePrevue: Math.round(prevu),
    ecartDuree: prevu ? Math.round((reel - prevu) / prevu * 100) : null,
    nbComparees: closes.length,
    joursDepuis: derniere ? Math.floor((Date.now() - new Date(derniere)) / 86400000) : null
  };
}

/** Avancement d'un pratiquant dans son programme, depuis ses propres séances
 *  — plus précis que l'approximation de `dataCoachAthletes` (qui évite une
 *  lecture par athlète), utilisable ici parce qu'on ne regarde qu'un compte. */
function progressionAttribution(att, seances) {
  if (!att) return null;
  const parSemaine = Number(att.nb_jours) || new Set((att.lignes || []).map(l => l.jour)).size;
  const debut = att.date_debut ? dateDe(att.date_debut) : null;
  const fin = att.date_fin ? dateDe(att.date_fin) : new Date();
  const joursEcoules = debut ? Math.max(0, Math.floor((fin - debut) / 86400000)) : 0;
  const semaineCourante = debut ? Math.floor(joursEcoules / 7) + 1 : 0;
  const duree = Number(att.duree_semaines) || 0;
  const faites = seances.filter(s => !debut || dateDe(s.date) >= debut).length;
  const semainesRef = duree || Math.max(1, semaineCourante);
  const attendues = parSemaine * semainesRef;
  return { parSemaine, semaine: semaineCourante, duree_semaines: duree, faites, attendues,
           part: attendues ? Math.min(1, faites / attendues) : 0 };
}

/** Une séance de ce jour a-t-elle déjà été close aujourd'hui ? */
function seanceTermineeAujourdhui(seances, jour) {
  const minuit = new Date(); minuit.setHours(0, 0, 0, 0);
  return seances.some(s => String(s.jour) === String(jour) && dateDe(s.date) >= minuit &&
    s.duree_min !== '' && s.duree_min != null);
}

/** A-t-on déjà clos ce jour de programme à cette date précise ? */
function seanceFaiteCeJourLa(seances, jour, date) {
  const fin = new Date(date.getTime() + 86400000);
  return seances.some(s => String(s.jour) === String(jour) && dateDe(s.date) >= date && dateDe(s.date) < fin &&
    s.duree_min !== '' && s.duree_min != null);
}

/**
 * Les sept jours de la semaine en cours, lundi à dimanche — pour le bandeau
 * d'accueil : quel jour de programme tombe où et s'il est déjà fait, plus le
 * planning récurrent (arts martiaux, club...) qui tombe ce jour-là. Évite
 * d'aller au calendrier juste pour voir où on en est cette semaine.
 */
function semaineCourante(jours, seances, recurrences) {
  const lundi = new Date();
  lundi.setDate(lundi.getDate() - ((lundi.getDay() + 6) % 7));
  lundi.setHours(0, 0, 0, 0);
  const dimanche = new Date(lundi.getTime() + 6 * 86400000);
  const rang = j => {
    const t = String(j).toLowerCase();
    for (let i = 0; i < SEMAINE.length; i++) if (t.indexOf(SEMAINE[i].toLowerCase()) !== -1) return i;
    return -1;
  };
  const parRang = {};
  jours.forEach(j => { const r = rang(j); if (r !== -1 && !(r in parRang)) parRang[r] = j; });

  // Récurrent hebdomadaire : dans la fenêtre date_debut/date_fin si posée.
  // Le mensuel ne prétend pas savoir quelle semaine du mois on est — il n'a
  // pas sa place dans un bandeau qui ne montre qu'une semaine, seulement
  // dans la liste de gestion et sur la fiche du coach.
  // Ponctuel : sa date tombe cette semaine-ci.
  const recParRang = {};
  (recurrences || []).forEach(r => {
    if (r.recurrent) {
      if (r.frequence !== 'semaine') return;
      if (r.date_debut && dimanche < new Date(r.date_debut)) return;
      if (r.date_fin && lundi > new Date(r.date_fin)) return;
      const ri = rang(r.jour);
      if (ri !== -1) (recParRang[ri] = recParRang[ri] || []).push(r);
    } else if (r.date) {
      const d = new Date(r.date);
      if (d < lundi || d > dimanche) return;
      const ri = Math.round((d - lundi) / 86400000);
      (recParRang[ri] = recParRang[ri] || []).push(r);
    }
  });

  return [0, 1, 2, 3, 4, 5, 6].map(i => {
    const date = new Date(lundi.getTime() + i * 86400000);
    const jour = parRang[i] || null;
    return { jour, aujourdhui: date.toDateString() === new Date().toDateString(),
             fait: jour ? seanceFaiteCeJourLa(seances, jour, date) : false,
             recurrences: recParRang[i] || [] };
  });
}

/**
 * Ce que le pratiquant voit en arrivant : sa prochaine séance et son
 * programme en cours, sans le détail des exercices — le détail est à un clic.
 */
async function dataAccueil() {
  const { db, collection, query, where, getDocs } = FB;
  const email = S.email;
  const [att, seancesSnap, activites, recurrences] = await Promise.all([
    attributionActive(email),
    getDocs(query(collection(db, 'seances'), where('email', '==', email))),
    dataActivites(email, { depuis: new Date(Date.now() - 30 * 86400000).toISOString() }),
    dataRecurrences()
  ]);
  const seances = seancesSnap.docs.map(d => d.data());

  const jours = att ? [...new Set(att.lignes.map(l => l.jour).filter(Boolean))].sort(triJours) : [];

  const aujourdhui = new Date().getDay();
  const rangSemaine = j => {
    const t = String(j).toLowerCase();
    for (let i = 0; i < SEMAINE.length; i++) if (t.indexOf(SEMAINE[i].toLowerCase()) !== -1) return (i + 1) % 7;
    return -1;
  };
  let prochaine = null, ecart = 99;
  jours.forEach(j => {
    const r = rangSemaine(j);
    if (r === -1) return;
    let d = (r - aujourdhui + 7) % 7;
    // Une séance du jour déjà terminée renvoie à la semaine suivante.
    if (d === 0 && seanceTermineeAujourdhui(seances, j)) d = 7;
    if (d < ecart) { ecart = d; prochaine = { jour: j, dans: d }; }
  });

  // `duree_semaines` vient directement de l'attribution (copiée depuis le
  // modèle à la création) : le pratiquant n'a pas le droit de lire `modeles`,
  // réservé au coach par les règles — une relecture ici serait refusée.
  const dureeS = att ? Number(att.duree_semaines) || 0 : 0;
  const progression = att ? progressionAttribution({ ...att, duree_semaines: dureeS }, seances) : null;

  const triees = seances.slice().sort((a, b) => dateDe(a.date) - dateDe(b.date));

  return {
    jours,
    semaine: semaineCourante(jours, seances, recurrences),
    recurrences,
    prochaine: prochaine ? { jour: prochaine.jour, dans: prochaine.dans,
      duree_estimee: estimerDuree(blocsBruts(att, prochaine.jour)) } : null,
    programme: att ? { id: att.id, nom: att.nom, date_debut: versDate(att.date_debut), duree_semaines: dureeS } : null,
    progression,
    nbSeances: seances.length,
    derniere: triees.length ? versDate(triees[triees.length - 1].date) : null,
    activites: activites.slice(0, 5)
  };
}

/**
 * Séances (avec volume) et activités libres d'une période, fusionnées et
 * triées — pour le calendrier, coach ou pratiquant selon `email`.
 */
async function dataCalendrier(email, p) {
  const { db, collection, query, where, orderBy, getDocs } = FB;
  const fin = p && p.jusqua ? new Date(p.jusqua) : new Date();
  const debut = p && p.depuis ? new Date(p.depuis) : new Date(fin.getTime() - 120 * 86400000);

  const [seancesSnap, activites] = await Promise.all([
    getDocs(query(collection(db, 'seances'), where('email', '==', email),
      where('date', '>=', debut), where('date', '<=', fin), orderBy('date', 'desc'))),
    dataActivites(email, { depuis: debut.toISOString(), jusqua: fin.toISOString() })
  ]);

  const seances = await Promise.all(seancesSnap.docs.map(async docSeance => {
    const s = docSeance.data();
    const series = (await getDocs(collection(db, 'seances', docSeance.id, 'series'))).docs.map(x => x.data());
    let volume = 0;
    series.forEach(x => { volume += (Number(x.reps) || 0) * (Number(x.charge) || 0); });
    return {
      type: 'seance', id: docSeance.id, date: versDate(s.date), jour: s.jour,
      duree_min: Number(s.duree_min) || 0, ressenti: s.ressenti || '', notes: s.notes || '',
      nbSeries: series.length, volume: Math.round(volume)
    };
  }));

  const libres = activites.map(a => ({
    type: 'activite', id: a.id, date: a.date, jour: a.sport, sport: a.sport,
    duree_min: a.duree_min, distance_km: a.distance_km, effort: a.effort,
    notes: a.notes, nbSeries: 0, volume: 0
  }));

  return seances.concat(libres).sort((a, b) => new Date(a.date) - new Date(b.date));
}

/**
 * Planning du pratiquant courant — un engagement extérieur (cours, club...),
 * distinct des séances du coach et des activités déjà faites : c'est une
 * intention affichée, pas un fait enregistré. La consigner comme faite reste
 * un geste à part, via « Consigner une activité », le jour où elle a
 * vraiment eu lieu. Deux formes : récurrent (jour de la semaine, fréquence,
 * fenêtre date_debut/date_fin), ou ponctuel (une date unique) — jamais les
 * deux à la fois, `recurrent` distingue laquelle des deux séries de champs
 * fait foi.
 */
async function dataRecurrences(email) {
  const { db, collection, getDocs } = FB;
  const snap = await getDocs(collection(db, 'pratiquants', email || S.email, 'recurrences'));
  const rang = j => {
    const t = String(j).toLowerCase();
    for (let i = 0; i < SEMAINE.length; i++) if (t.indexOf(SEMAINE[i].toLowerCase()) !== -1) return i;
    return 99;
  };
  const list = [];
  snap.forEach(d => {
    const r = d.data();
    list.push({
      id: d.id, sport: r.sport, recurrent: r.recurrent !== false,
      jour: r.jour || '', frequence: r.frequence || 'semaine',
      date_debut: r.date_debut || '', date_fin: r.date_fin || '',
      date: r.date || '',
      heure: r.heure || '', duree_min: Number(r.duree_min) || 0, notes: r.notes || ''
    });
  });
  return list.sort((a, b) =>
    (a.recurrent ? rang(a.jour) : 7) - (b.recurrent ? rang(b.jour) : 7) || a.heure.localeCompare(b.heure));
}

/** Ajoute ou modifie une entrée du planning. Sans id, une création. */
async function sauverRecurrence(p) {
  const { db, doc, collection, addDoc, updateDoc } = FB;
  const sport = String(p.sport || '').trim();
  if (!sport) throw new Error('SPORT_REQUIS');
  const recurrent = !!p.recurrent;
  const champs = {
    sport, recurrent, heure: String(p.heure || ''), duree_min: Number(p.duree_min) || 0,
    notes: String(p.notes || '')
  };
  if (recurrent) {
    const jour = String(p.jour || '').trim();
    if (!jour) throw new Error('JOUR_REQUIS');
    champs.jour = jour;
    champs.frequence = p.frequence === 'mois' ? 'mois' : 'semaine';
    champs.date_debut = String(p.date_debut || '');
    champs.date_fin = String(p.date_fin || '');
    champs.date = '';
  } else {
    const date = String(p.date || '').trim();
    if (!date) throw new Error('DATE_REQUISE');
    champs.date = date;
    champs.jour = ''; champs.frequence = ''; champs.date_debut = ''; champs.date_fin = '';
  }
  if (p.id) {
    await updateDoc(doc(db, 'pratiquants', S.email, 'recurrences', p.id), champs);
    return { id: p.id };
  }
  const ref = await addDoc(collection(db, 'pratiquants', S.email, 'recurrences'), champs);
  return { id: ref.id };
}

/**

 * exercice côté client : ajouter `exercice_id` à la requête demanderait un
 * index composite à quatre champs que `dataNonLus` n'a pas besoin d'avoir.

async function marquerCommentairesLus(exerciceId, emailCible) {
  const { db, collection, query, where, getDocs, writeBatch } = FB;
  const estCoach = !!(S.moi && S.moi.estCoach);
  const email = estCoach && emailCible ? String(emailCible).toLowerCase() : S.email;
  const autre = estCoach ? 'pratiquant' : 'coach';

    att = s.exists() ? { id: s.id, ...s.data() } : null;

  const nbJours = new Set(lignes.map(l => l.jour).filter(Boolean)).size;

    '', `Tu le retrouves dans l'app :`, location.origin + location.pathname, '',
    `Dis-moi si quelque chose n'est pas clair.`, COACH_NOM

/**
 * Crée ou met à jour un exercice. Sans id, c'est une création : le numéro
 * vient du compteur partagé `compteurs/exercices`, en transaction — remplace
 * le scan du plus grand id existant.
 */
async function sauverExercice(p) {
  const { db, doc, updateDoc, runTransaction } = FB;
  const nom = String(p.nom || '').trim();
  if (!nom) throw new Error('NOM_REQUIS');
  const champs = {
    nom, nom_en: String(p.nom_en || '').trim(), groupe: String(p.groupe || '').trim(),
    equipement: String(p.equipement || '').trim(), consigne: String(p.consigne || '').trim(),
    photo: String(p.photo || '').trim(), video: String(p.video || '').trim()
  };
  if (p.id) {
    await updateDoc(doc(db, 'exercices', p.id), champs);
    return { id: p.id, cree: false };
  }
  const id = await runTransaction(db, async tx => {
    const ref = doc(db, 'compteurs', 'exercices');
    const snap = await tx.get(ref);
    const suivant = ((snap.exists() ? Number(snap.data().dernier) : 0) || 0) + 1;
    const eid = 'EX' + String(suivant).padStart(3, '0');
    tx.set(ref, { dernier: suivant }, { merge: true });
    tx.set(doc(db, 'exercices', eid), champs);
    return eid;
  });
  return { id, cree: true };
}

/**
 * Supprime un exercice. Vérifié seulement contre les modèles (peu nombreux,
 * lecture bon marché) — pas contre l'historique des attributions, qui
 * demanderait de parcourir toutes les attributions jamais faites pour une
 * action rare : mieux vaut laisser une référence orpheline s'afficher par
 * son id (déjà le comportement de repli partout ailleurs) que payer cette
 * lecture à chaque suppression.
 */
async function supprimerExercice(id) {
  const { db, doc, deleteDoc, collection, getDocs } = FB;
  const modeles = await dataModeles();
  const comptes = await Promise.all(modeles.map(m =>
    getDocs(collection(db, 'modeles', m.id, 'lignes'))
      .then(s => s.docs.filter(d => d.data().exercice_id === id).length)
  ));
  const total = comptes.reduce((a, b) => a + b, 0);
  if (total) throw new Error('EXERCICE_UTILISE_' + total);
  await deleteDoc(doc(db, 'exercices', id));
}

/** 1RM par exercice pour un pratiquant, mesurés par le coach — vue Maxis. */
async function dataMaxis(email) {
  const { db, collection, getDocs } = FB;
  const [exercices, maxisSnap, att] = await Promise.all([
    dataCatalogue(),
    getDocs(collection(db, 'pratiquants', email, 'maxis')),
    attributionActive(email)
  ]);
  const maxis = {};
  maxisSnap.docs.forEach(d => { maxis[d.id] = d.data(); });
  const auProgramme = new Set((att ? att.lignes : []).map(l => l.exercice_id));

  return exercices.map(e => {
    const m = maxis[e.id];
    return {
      exercice_id: e.id, nom: e.nom, groupe: e.groupe || '',
      rm_kg: m ? Number(m.kg) || 0 : 0, source: m ? m.source || '' : '',
      date: m ? versDate(m.date) : '',
      auProgramme: auProgramme.has(e.id)
    };
  }).sort((a, b) => {
    if (a.auProgramme !== b.auProgramme) return a.auProgramme ? -1 : 1;
    return a.nom.localeCompare(b.nom, 'fr');
  });
}

window.onload = () => {
  // Une session déjà ouverte revient par ce même canal, sans rien à restaurer.
  FB.onAuthStateChanged(FB.auth, async user => {
    if (!user) { ecranConnexion(); return; }
    S.email = (user.email || '').toLowerCase();
    try {
      ouvrirApp(await chargerProfil(S.email));
    } catch (e) {
      // Un document de profil absent est refusé par les règles, pas signalé
      // « introuvable » : les deux cas veulent dire la même chose ici.
      if (/NON_INSCRIT|permission-denied/.test(e.message || e.code || '')) {
        await FB.signOut(FB.auth);
        ecranConnexion('Ce compte n\'est pas encore inscrit. Demandez à votre coach de vous ajouter.');
      } else {
        toast('Chargement impossible : ' + (e.message || e.code));
        ecranConnexion();
      }
    }
  });
};

/** Connexion par le bouton Google. */
async function connexionGoogle() {
  try {
    await FB.signInWithPopup(FB.auth, new FB.GoogleAuthProvider());

  } catch (e) {
    if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
    $('#loginErr').textContent = 'Connexion impossible : ' + (e.message || e.code);
    $('#loginErr').classList.remove('hidden');

}

/**
 * Le coach ne suit pas de programme dans l'app : sa navigation est celle d'un
 * poste de travail, pas celle d'un pratiquant. On la construit selon le rôle.
 */
function construireNav(estCoach) {
  const onglets = estCoach
    ? [['athletes','Athlètes'], ['modeles','Modèles'], ['biblio','Bibliothèque'], ['reglages','Réglages']]
    : [['accueil','Accueil'], ['calendrier','Calendrier'], ['progres','Progrès']];
  if (!onglets.some(o => o[0] === S.vue)) S.vue = onglets[0][0];
  $('#nav').innerHTML = onglets.map(([v, t]) =>
    `<button data-vue="${v}" aria-pressed="${v === S.vue}">${t}</button>`).join('');
}

function ouvrirApp(moi) {
  S.moi = moi;
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#nav').classList.remove('hidden');
  construireNav(moi.estCoach);
  S.jour = S.jour || moi.jours[0] || null;
  majBandeau();
  majPastilles();
  rendre();
}

function ecranConnexion(message) {
  S.email = null; S.moi = null;
  $('#logger').classList.add('hidden');
  $('#app').classList.add('hidden'); $('#nav').classList.add('hidden');
  $('#login').classList.remove('hidden');

  if (message) {
    $('#loginErr').textContent = message;
    $('#loginErr').classList.remove('hidden');
  }
}

// ── Apparence ────────────────────────────────────────────────
const CLE_THEME = 'muscu.theme';
const THEMES = [
  ['sombre', 'Sombre',              'Le réglage d\'origine.'],
  ['clair',  'Claire',              'Pour une salle en plein jour.'],
  ['auto',   'Comme le téléphone',  'Suit le réglage du système, et change avec lui.']
];

function themeChoisi() {
  try { const v = localStorage.getItem(CLE_THEME); if (v === 'clair' || v === 'auto') return v; }
  catch (e) {}
  return 'sombre';
}

function appliquerTheme(t) {
  const r = document.documentElement;
  r.setAttribute('data-theme', t);
  const clair = t === 'clair' ||
    (t === 'auto' && matchMedia('(prefers-color-scheme: light)').matches);
  r.classList.toggle('sys-clair', t === 'auto' && clair);
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', clair ? '#F7F5F3' : '#151515');
}

// « Comme le téléphone » doit suivre le téléphone, y compris app ouverte.
matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
  if (themeChoisi() === 'auto') appliquerTheme('auto');
});

/** Le choix vit sur l'appareil, pas dans le classeur : le même compte peut vouloir
 *  du clair sur l'ordinateur du bureau et du sombre sur le téléphone en salle. */
function modalTheme() {
  const w = modal('Apparence', `
    <div class="choix">${THEMES.map(([v, nom, quoi]) => `
      <button class="opt" data-t="${v}" aria-pressed="${v === themeChoisi()}">
        <span class="opt-nom">${nom}</span><span class="opt-quoi">${quoi}</span>
      </button>`).join('')}</div>
    <p class="consigne">Ce réglage ne vaut que sur cet appareil.</p>
    <div class="barre"><button class="btn plein" id="tOk" style="flex:1">Fermer</button></div>`);

  w.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    try { localStorage.setItem(CLE_THEME, b.dataset.t); } catch (e) {}
    appliquerTheme(b.dataset.t);
    w.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed', x === b));
  });
  w.querySelector('#tOk').onclick = w.fermer;
}

const VUES_COACH = ['athletes', 'modeles', 'biblio', 'reglages'];

async function rendre() {
  clearInterval(S.pendule);
  $('#logger').classList.add('hidden');   // l'overlay ne doit pas survivre à un changement de vue
  if (VUES_COACH.indexOf(S.vue) !== -1) {
    S.coach = S.coach || { onglet:'athletes', email:null, nom:'', sous:'fiche', modele:null, categorie:null };
    // Changer d'onglet principal quitte la fiche ou le modèle en cours.
    if (S.coach.onglet !== S.vue) {
      S.coach.onglet = S.vue; S.coach.email = null; S.coach.modele = null; S.coach.categorie = null;
      S.attSel = null; S.ed = null; S.cal = null;
    }
    return vueCoach();
  }
  if (S.vue === 'accueil') return vueAccueil();
  if (S.vue === 'seance') return vueSeance();
  if (S.vue === 'programmes') return vueMesProgrammes();
  if (S.vue === 'calendrier') return vueCalendrier();
  if (S.vue === 'progres') return vueProgres();
}

      <div class="nom">${x.sport}</div>
      <div class="meta">${detail || 'sans détail'}</div>

      jours === 0 ? "aujourd'hui" : jours === 1 ? 'hier' : 'il y a ' + jours + ' j'}</span>

}

/**
 * Gère le planning récurrent : un engagement extérieur qui revient chaque
 * semaine (club, cours...). Affiché dans le bandeau de la semaine, mais ne
 * devient jamais une séance enregistrée tout seul — « Consigner une
 * activité » reste le geste qui compte pour l'assiduité, le jour où on y va.
 */
/** Résumé lisible d'une entrée de planning, récurrente ou ponctuelle. */
function texteRecurrence(r) {
  if (r.recurrent) {
    const freq = r.frequence === 'mois' ? 'chaque mois' : 'chaque semaine';
    const fenetre = [
      r.date_debut ? 'du ' + new Date(r.date_debut).toLocaleDateString('fr-FR') : '',
      r.date_fin ? 'au ' + new Date(r.date_fin).toLocaleDateString('fr-FR') : ''
    ].filter(Boolean).join(' ');
    return [r.jour, freq, r.heure, fenetre].filter(Boolean).join(' · ');
  }
  return [r.date ? new Date(r.date).toLocaleDateString('fr-FR') : '', r.heure].filter(Boolean).join(' · ');
}

}

function modalEditerRecurrence(r, liste, rafraichirParent) {
  const x = r || { id:'', sport:'', recurrent:true, jour:SEMAINE[0], frequence:'semaine',
                   date_debut:'', date_fin:'', date:'', heure:'', duree_min:'', notes:'' };
  const w = modal(r ? 'Modifier' : 'Ajouter au planning', `

      <select class="f" id="rSport">
        <option value="">— Choisir —</option>

          ${lst.map(s => `<option ${s === x.sport ? 'selected' : ''}>${s}</option>`).join('')}
        </optgroup>`).join('')}

    <label class="paye"><input type="checkbox" id="rRecurrent" ${x.recurrent ? 'checked' : ''}><span>Récurrent</span></label>

    <div id="rBlocRecurrent">
      <div class="duo">
        <div class="champ"><label>Jour</label>
          <select class="f" id="rJour">${SEMAINE.map(j => `<option ${j === x.jour ? 'selected' : ''}>${j}</option>`).join('')}</select></div>
        <div class="champ"><label>Fréquence</label>
          <select class="f" id="rFrequence">
            <option value="semaine" ${x.frequence !== 'mois' ? 'selected' : ''}>Chaque semaine</option>
            <option value="mois" ${x.frequence === 'mois' ? 'selected' : ''}>Chaque mois</option>
          </select></div>
      </div>
      <div class="duo">
        <div class="champ"><label>Date de début</label><input class="f" id="rDebut" type="date" value="${x.date_debut}"></div>
        <div class="champ"><label>Date de fin</label><input class="f" id="rFin" type="date" value="${x.date_fin}"></div>
      </div>
    </div>
    <div id="rBlocPonctuel" class="hidden">
      <div class="champ"><label>Date</label><input class="f" id="rDate" type="date" value="${x.date}"></div>
    </div>

    <div class="duo">
      <div class="champ"><label>Heure</label><input class="f" id="rHeure" type="time" value="${x.heure}"></div>
      <div class="champ"><label>Durée (min)</label><input class="f" id="rDuree" type="number" min="0" step="5" value="${x.duree_min || ''}"></div>
    </div>
    <div class="champ"><label>Notes</label><input class="f" id="rNotes" value="${x.notes}" placeholder="Club, adresse…"></div>
    <div class="barre" style="margin-top:14px"><button class="btn" id="rAnn">Annuler</button>

    ${r ? '<div class="barre"><button class="btn danger" id="rDel">Supprimer</button></div>' : ''}`);

  const recCase = w.querySelector('#rRecurrent');
  const majBlocs = () => {
    w.querySelector('#rBlocRecurrent').classList.toggle('hidden', !recCase.checked);

  };
  recCase.onchange = majBlocs;
  majBlocs();

  w.querySelector('#rAnn').onclick = w.fermer;
  w.querySelector('#rOk').onclick = async function () {
    const sport = w.querySelector('#rSport').value;
    if (!sport) return toast('Choisissez une activité');
    this.disabled = true;
    const recurrent = recCase.checked;
    const champs = {
      sport, recurrent,
      jour: w.querySelector('#rJour').value, frequence: w.querySelector('#rFrequence').value,
      date_debut: w.querySelector('#rDebut').value, date_fin: w.querySelector('#rFin').value,
      date: w.querySelector('#rDate').value,
      heure: w.querySelector('#rHeure').value, duree_min: w.querySelector('#rDuree').value,

      toast('Planning enregistré');

      toast(err.message === 'JOUR_REQUIS' ? 'Choisissez un jour'

    this.disabled = true;
