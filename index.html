<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151515">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Muscu">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="favicon.ico" sizes="any">
<title>Muscu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Charte Wellness Sport Club — relevée sur wellness-sportclub.fr */
  --iron:#151515; --plate:#1E1E1E; --edge:#2E2E2E;
  --chalk:#F4F4F4; --dust:#9A9A9A;
  /* --brand : aplats uniquement (blanc dessus = 7,4:1).
     --brand-ink : version éclaircie, seule lisible en texte sur fond sombre (4,8:1).
     Le rouge officiel #A61E1F ne plafonne qu'à 2,4:1 sur le fond : jamais en texte. */
  --brand:#A61E1F; --brand-ink:#E05253; --on-brand:#FFFFFF;
  --p25:#D32F2F; --p20:#1E6FD9; --p15:#F5B700; --p10:#3F9E4D; --p5:#E8EAEE; --p2:#9AA3B0;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--iron); color:var(--chalk);
  font-family:'Jost',system-ui,sans-serif; font-size:16px;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overscroll-behavior-y:contain;
}
h1,h2,h3,.num{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;letter-spacing:.01em;margin:0}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 96px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dust);font-weight:600}
button{font-family:inherit;font-size:16px;border:0;cursor:pointer;color:inherit;background:none}
.hidden{display:none!important}

/* Connexion */
#login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:28px;padding:32px;text-align:center}
#login h1{font-size:clamp(52px,17vw,84px);line-height:.88;text-transform:uppercase}
#marque{width:min(210px,52vw);height:auto}
#login h1 span{display:block;color:var(--brand-ink)}
#login p{color:var(--dust);max-width:32ch;margin:0;line-height:1.5}

/* En-tête */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px;flex-wrap:wrap}
header h2{flex:1}
header h2{font-size:30px;text-transform:uppercase;line-height:1}
.streak{font-size:13px;color:var(--dust);font-variant-numeric:tabular-nums}
.quitter{font-size:12px;font-weight:600;color:var(--dust);border:1px solid var(--edge);
  border-radius:999px;padding:7px 12px;background:var(--plate);white-space:nowrap}

/* Calendrier */
.mois{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.mois h3{font-size:24px;text-transform:uppercase}
.mois button{width:40px;height:40px;border-radius:10px;background:var(--plate);
  border:1px solid var(--edge);font-size:18px;color:var(--dust)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .jc{font-size:10px;letter-spacing:.1em;color:var(--dust);text-align:center;padding-bottom:4px;font-weight:600}
.cal .c{aspect-ratio:1;border-radius:9px;background:var(--plate);border:1px solid var(--edge);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:13px;font-variant-numeric:tabular-nums;color:var(--dust);padding:0}
.cal .c.vide{background:none;border-color:transparent}
.cal .c.today{border-color:var(--dust)}
.cal .c.faite{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:700}
.cal .c[aria-pressed="true"]{outline:2px solid var(--brand-ink);outline-offset:1px}
.cal .c .pt{width:4px;height:4px;border-radius:50%;background:var(--on-brand)}
.legende{font-size:12px;color:var(--dust);margin:12px 0 4px;display:flex;gap:14px;flex-wrap:wrap}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
.stat b{font-family:'Bebas Neue',Impact,sans-serif;font-size:26px;font-weight:400;display:block;line-height:1}
.stat span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dust)}

/* Sous-navigation coach */
.sous{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;scrollbar-width:none}
.sous button{flex:0 0 auto;padding:9px 15px;border-radius:999px;background:var(--plate);
  border:1px solid var(--edge);font-size:14px;font-weight:600;color:var(--dust)}
.sous button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

/* Formulaires d'édition */
.f{width:100%;background:#2A2A2A;border:1px solid var(--edge);border-radius:9px;color:var(--chalk);
  font-family:inherit;font-size:15px;padding:11px 12px;min-height:44px}
.f:focus{outline:2px solid var(--brand-ink);outline-offset:1px}
.champ{margin-bottom:10px}
.champ label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dust);font-weight:600;margin-bottom:5px}
.duo{display:flex;gap:10px}
.duo>*{flex:1}
.btn{min-height:46px;padding:0 16px;border-radius:10px;background:var(--plate);border:1px solid var(--edge);
  font-weight:600;font-size:15px;color:var(--chalk)}
.btn.plein{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.danger{color:var(--brand-ink)}
.barre{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.ligne{display:flex;align-items:center;gap:10px;background:var(--plate);border:1px solid var(--edge);
  border-radius:10px;padding:11px 12px;margin-bottom:8px}
.ligne .g{flex:1;min-width:0}
.ligne .g .nom{font-size:15px;font-weight:600}
.ligne .g .meta{font-size:12.5px;color:var(--dust);margin-top:2px}
.ligne .poignee{color:var(--dust);font-size:18px;padding:4px 2px}
.entete{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.entete .eyebrow{flex:1}

/* Fenêtre modale */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:flex;
  align-items:flex-end;justify-content:center}
.modal .feuille{background:var(--iron);border-top-left-radius:18px;border-top-right-radius:18px;
  width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;padding:18px 18px 28px;
  border-top:1px solid var(--edge)}
.modal h3{margin-bottom:14px}
.recherche{position:sticky;top:0;background:var(--iron);padding-bottom:10px;z-index:1}

/* Bloc : plusieurs exercices enchaînés, un seul repos à la fin du tour */
.bloc{border-left:3px solid var(--brand);padding-left:12px;margin-bottom:14px}
.bloc-tete{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.bloc-info{font-size:12px;color:var(--dust);font-variant-numeric:tabular-nums;white-space:nowrap}
.bloc .card{margin-bottom:8px}
.bloc .card:last-child{margin-bottom:0}
.pause{font-size:12px;color:var(--dust);padding:1px 0 9px 3px;font-variant-numeric:tabular-nums}
.cadence{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.09em;padding:3px 7px;
  border-radius:5px;background:#2A2A2A;color:var(--dust);font-variant-numeric:tabular-nums}
.cadbloc{display:flex;align-items:center;gap:10px;margin-top:8px}
.cad{display:block;overflow:visible}
.cad.grand{margin-top:10px;max-width:100%;height:auto}

/* Sélecteur de jour */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;margin-bottom:6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;padding:11px 18px;border-radius:999px;background:var(--plate);border:1px solid var(--edge);
  font-weight:600;font-size:14px;white-space:nowrap;min-height:44px}
.day[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}

/* Carte exercice */
.card{background:var(--plate);border:1px solid var(--edge);border-radius:var(--r);padding:16px;margin-bottom:12px;
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:76px}
.card:active{transform:scale(.99)}
.card .body{flex:1;min-width:0}
.card .nom{font-size:17px;font-weight:600;line-height:1.25}
.card .meta{font-size:13px;color:var(--dust);margin-top:3px}
.card .done{width:34px;height:34px;border-radius:50%;border:2px solid var(--edge);display:grid;place-items:center;
  font-size:13px;font-weight:700;flex:0 0 auto;font-variant-numeric:tabular-nums}
.card .done.full{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

/* Disques — élément signature */
.bar{display:flex;align-items:center;gap:2px;margin-top:7px;height:16px}
.bar i{display:block;width:7px;border-radius:2px;border:1px solid rgba(0,0,0,.35)}
.bar .rod{width:14px;height:3px;background:var(--p2);border-radius:2px;border:0}

/* Panneau de saisie */
#logger{position:fixed;inset:0;background:var(--iron);z-index:20;display:flex;flex-direction:column;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#logger{animation:none}}
#logger .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#logger h3{font-size:26px;text-transform:uppercase;line-height:1.05;margin:10px 0 2px}
.consigne{color:var(--dust);font-size:14px;line-height:1.45}
.steppers{display:flex;gap:14px;margin:auto 0}
.stepper{flex:1;background:var(--plate);border:1px solid var(--edge);border-radius:var(--r);padding:14px 10px;text-align:center}
.stepper .val{font-size:52px;line-height:1;margin:10px 0}
.stepper .row{display:flex;gap:8px}
.stepper .row button{flex:1;height:52px;border-radius:10px;background:#2A2A2A;font-size:20px;font-weight:600}
.stepper .row button:active{background:#383838}
.chrono .val.court{color:var(--brand-ink)}
.chrono .row button{height:46px;font-size:15px}
.tempo{font-size:12.5px;color:var(--dust);line-height:1.5;margin:6px 0 0;font-variant-numeric:tabular-nums}
.valider{width:100%;min-height:60px;border-radius:var(--r);background:var(--brand);color:var(--on-brand);
  font-size:18px;font-weight:700;letter-spacing:.02em;margin-top:16px}
.valider:disabled{opacity:.45}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;min-height:34px}
.set{background:var(--plate);border:1px solid var(--edge);border-radius:8px;padding:7px 11px;font-size:14px;
  font-variant-numeric:tabular-nums}
.close{font-size:15px;color:var(--dust);padding:10px 4px}

/* Minuteur de repos */
#repos{position:fixed;left:0;right:0;bottom:0;background:var(--brand);color:var(--on-brand);padding:14px 18px;
  display:flex;justify-content:space-between;align-items:center;z-index:30;
  padding-bottom:calc(14px + env(safe-area-inset-bottom))}
#repos .t{font-size:30px;font-family:'Bebas Neue';font-variant-numeric:tabular-nums}
#repos button{font-weight:700;font-size:14px;text-decoration:underline}

/* Coach */
.athlete{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 16px;
  background:var(--plate);border:1px solid var(--edge);border-radius:var(--r);margin-bottom:10px;width:100%;text-align:left}
.tag{font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;background:#2A2A2A;color:var(--dust);white-space:nowrap}
.tag.warn{background:rgba(211,47,47,.16);color:#FF7A7A}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(20,23,28,.94);backdrop-filter:blur(8px);
  border-top:1px solid var(--edge);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;padding:15px 0;font-size:13px;font-weight:600;color:var(--dust)}
.nav button[aria-pressed="true"]{color:var(--brand-ink)}
.empty{color:var(--dust);text-align:center;padding:48px 20px;line-height:1.6}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--plate);border:1px solid var(--edge);
  padding:11px 16px;border-radius:10px;font-size:14px;z-index:50}
:focus-visible{outline:2px solid var(--brand-ink);outline-offset:2px}
</style>
</head>
<body>

<section id="login">
  <img id="marque" src="assets/logo-wellness-dark.png" alt="Wellness Sport Club" width="300" height="86">
  <h1>Salle<span>de force</span></h1>
  <p>Connectez-vous avec le compte Google que votre coach a inscrit.</p>
  <div id="gbtn"></div>
  <p id="loginErr" class="hidden" style="color:#FF7A7A"></p>
</section>

<main id="app" class="wrap hidden"></main>

<nav id="nav" class="nav hidden">
  <button data-vue="seance" aria-pressed="true">Séance</button>
  <button data-vue="calendrier">Calendrier</button>
  <button data-vue="progres">Progrès</button>
  <button data-vue="coach" class="hidden">Coach</button>
</nav>

<div id="logger" class="hidden"></div>
<div id="repos" class="hidden"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// ── Configuration ────────────────────────────────────────────
const API = 'https://script.google.com/macros/s/AKfycbw8wC_TmFuLzP8yTrOmX5wH5k3Yoc-AbauN3Hj9oF57Lc1NSA-MrclnkuTnKr8DtBpEiQ/exec';                  // URL /exec du déploiement Apps Script
const CLIENT_ID = '765877661024-r5p4dhadda0i9eb9996ctb8298f7m6h8.apps.googleusercontent.com';

// ── État ─────────────────────────────────────────────────────
const S = { token:null, moi:null, jour:null, exos:[], blocs:[], seanceId:null, faits:{}, vue:'seance', timer:null };
const $ = s => document.querySelector(s);

// ── Appels API ───────────────────────────────────────────────
async function api(action, payload = {}) {
  const r = await fetch(API, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},   // évite le préflight CORS
    body:JSON.stringify({ token:S.token, action, payload })
  });
  const j = await r.json();
  if (!j.ok) {
    if (/TOKEN/.test(j.error)) return reconnexion();
    throw new Error(j.error);
  }
  return j.data;
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

// ── Connexion Google et session ──────────────────────────────
const CLE_SESSION = 'muscu.session';

/** `exp` du jeton Google, en secondes epoch. 0 si illisible. */
function expiration(jwt) {
  try {
    const c = jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(escape(atob(c)))).exp || 0;
  } catch (e) { return 0; }
}

/**
 * La session tient dans localStorage : le jeton Google et le profil.
 * Le jeton expire de lui-même au bout d'une heure environ ; on ne le garde
 * que tant qu'il est valide, et la clé est effacée à la déconnexion.
 */
function sauverSession() {
  try {
    localStorage.setItem(CLE_SESSION, JSON.stringify({
      token: S.token, exp: S.exp, moi: S.moi
    }));
  } catch (e) {}
}

function lireSession() {
  try {
    const o = JSON.parse(localStorage.getItem(CLE_SESSION) || 'null');
    // 60 s de marge : inutile de restaurer un jeton sur le point d'expirer.
    return o && o.token && o.exp > Date.now() / 1000 + 60 ? o : null;
  } catch (e) { return null; }
}

function oublierSession() {
  try { localStorage.removeItem(CLE_SESSION); } catch (e) {}
}

window.onload = () => {
  const reprise = lireSession();
  google.accounts.id.initialize({ client_id:CLIENT_ID, callback:onGoogle, auto_select:true });

  if (reprise) {
    S.token = reprise.token; S.exp = reprise.exp;
    ouvrirApp(reprise.moi);
    // On rafraîchit le profil en arrière-plan : si le jeton a été révoqué, on retombe
    // proprement sur l'écran de connexion plutôt que d'afficher un état périmé.
    // Un jeton révoqué renvoie à la connexion — reconnexion() s'en charge. Une simple
    // coupure réseau, elle, ne doit pas déconnecter : en salle, le wifi est capricieux.
    api('bootstrap')
      .then(m => { S.moi = m; sauverSession(); rendre(); })
      .catch(e => {
        if (/NON_INSCRIT/.test(e.message || '')) { oublierSession(); ecranConnexion(); }
        else toast('Hors ligne : affichage de la dernière version connue');
      });
    return;
  }

  google.accounts.id.renderButton($('#gbtn'), { theme:'filled_black', size:'large', shape:'pill', text:'signin_with', locale:'fr' });
  google.accounts.id.prompt();
};

async function onGoogle(res) {
  S.token = res.credential;
  S.exp = expiration(res.credential);
  try {
    S.moi = await api('bootstrap');
  } catch (e) {
    $('#loginErr').textContent = e.message === 'NON_INSCRIT'
      ? 'Ce compte n\'est pas encore inscrit. Demandez à votre coach de vous ajouter.'
      : 'Connexion impossible : ' + e.message;
    $('#loginErr').classList.remove('hidden');
    return;
  }
  sauverSession();
  ouvrirApp(S.moi);
}

function ouvrirApp(moi) {
  S.moi = moi;
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#nav').classList.remove('hidden');
  if (moi.estCoach) document.querySelector('[data-vue="coach"]').classList.remove('hidden');
  S.jour = S.jour || moi.jours[0] || null;
  rendre();
}

function ecranConnexion() {
  S.token = null; S.moi = null; S.exp = 0;
  $('#logger').classList.add('hidden');
  $('#app').classList.add('hidden'); $('#nav').classList.add('hidden');
  $('#login').classList.remove('hidden');
  $('#gbtn').innerHTML = '';
  google.accounts.id.renderButton($('#gbtn'), { theme:'filled_black', size:'large', shape:'pill', text:'signin_with', locale:'fr' });
}

/** Déconnexion : on oublie la session et on coupe la reconnexion automatique. */
function deconnexion() {
  oublierSession();
  try { google.accounts.id.disableAutoSelect(); } catch (e) {}
  Object.assign(S, { token:null, moi:null, exp:0, jour:null, exos:[], blocs:[],
                     seanceId:null, faits:{}, vue:'seance', cal:null, coach:null, ed:null });
  ecranConnexion();
}

function reconnexion() {
  oublierSession();
  ecranConnexion();
  google.accounts.id.prompt();
  throw new Error('SESSION_EXPIREE');
}

// Le bouton Quitter est réécrit à chaque rendu : on délègue plutôt que de le relier.
document.addEventListener('click', e => {
  if (e.target.closest('#quitter')) deconnexion();
});

// ── Navigation ───────────────────────────────────────────────
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.vue = b.dataset.vue;
  document.querySelectorAll('#nav button').forEach(x => x.setAttribute('aria-pressed', x === b));
  rendre();
});

async function rendre() {
  $('#logger').classList.add('hidden');   // l'overlay ne doit pas survivre à un changement de vue
  if (S.vue === 'seance') return vueSeance();
  if (S.vue === 'calendrier') return vueCalendrier();
  if (S.vue === 'progres') return vueProgres();
  if (S.vue === 'coach') return vueCoach();
}

// ── Vue séance ───────────────────────────────────────────────
async function vueSeance() {
  const app = $('#app');
  if (!S.moi.jours.length) {
    app.innerHTML = `<div class="empty">Aucun programme pour l'instant.<br>Votre coach doit vous en assigner un.</div>`;
    return;
  }
  app.innerHTML = `
    <header>
      <h2>${S.moi.nom.split(' ')[0] || 'Salut'}</h2>
      <span class="streak num">${S.moi.nbSeances} séance${S.moi.nbSeances > 1 ? 's' : ''}</span>
      <button class="quitter" id="quitter" title="Se déconnecter">Quitter</button>
    </header>
    <div class="eyebrow">Programme</div>
    <div class="days">${S.moi.jours.map(j =>
      `<button class="day" data-jour="${j}" aria-pressed="${j === S.jour}">${j}</button>`).join('')}</div>
    <div id="liste"><div class="empty">Chargement…</div></div>`;

  app.querySelectorAll('.day').forEach(b => b.onclick = () => {
    S.jour = b.dataset.jour; vueSeance();
  });

  const blocs = await chargerSeance(S.jour);
  $('#liste').innerHTML = blocs.map(b => {
    const cartes = b.exercices.map((e, k) => carte(e) +
      (k < b.exercices.length - 1 && e.pause_s ? `<div class="pause">↓ ${e.pause_s} s de pause</div>` : '')
    ).join('');
    if (b.exercices.length < 2) return cartes;
    // Superset : on enchaîne les exercices, le repos vient après le tour complet.
    return `<div class="bloc">
      <div class="bloc-tete">
        <span class="eyebrow">Bloc ${b.bloc} · superset</span>
        <span class="bloc-info">${b.series} tours · ${b.repos_s} s</span>
      </div>${cartes}</div>`;
  }).join('');
  $('#liste').querySelectorAll('.card').forEach(c => c.onclick = () => ouvrirLogger(Number(c.dataset.i)));
}

/** Charge la séance en blocs et remet à plat S.exos, index utilisé par le logger. */
async function chargerSeance(jour) {
  const r = await api('seance', { jour });
  // Le serveur renvoie la séance du jour si elle est ouverte, avec les séries déjà
  // saisies : un rechargement de page ne perd plus les compteurs.
  const blocs = r.blocs || [];
  S.seanceId = r.seance_id || null;
  S.faits = r.faits || {};
  S.exos = []; S.blocs = blocs;
  blocs.forEach((b, bi) => b.exercices.forEach((e, ei) => {
    e._b = bi; e._e = ei; e._i = S.exos.length;   // bloc, rang dans le bloc, index plat
    S.exos.push(e);
  }));
  return blocs;
}

/** « 45 s », « max », « 1:30 ». */
function duree(sec) {
  if (sec === 'max' || sec === 'MAX') return 'max';
  const n = Number(sec) || 0;
  return n >= 60 ? `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}` : `${n} s`;
}

/** Carte d'un exercice. series et repos_s sont hérités de son bloc. */
function carte(e) {
  const n = (S.faits[e.exercice_id] || []).length;
  const cible = e.duree_s ? duree(e.duree_s) : e.reps_cible;
  return `<button class="card" data-i="${e._i}">
    <div class="body">
      <div class="nom">${e.nom}</div>
      <div class="meta">${e.series} × ${cible}${e.charge_cible ? ' · ' + e.charge_cible + ' kg' : ''}${
        e.dernier && e.charge_cible ? ' · dernière fois ' + e.dernier.charge + ' kg' : ''}</div>
      ${e.cadence ? `<div class="cadbloc"><span class="cadence">${e.cadence}</span>${courbeCadence(e.cadence, false)}</div>` : ''}
      ${e.charge_cible ? disques(e.charge_cible) : ''}
    </div>
    <div class="done ${n >= e.series ? 'full' : ''}">${n}/${e.series}</div>
  </button>`;
}

/** Décompose une charge en disques olympiques colorés (barre de 20 kg). */
function disques(kg) {
  const parSide = (Number(kg) - (S.moi.barKg || 20)) / 2;
  if (!(parSide > 0)) return '';
  const dispo = [[25,'var(--p25)',15],[20,'var(--p20)',14],[15,'var(--p15)',13],
                 [10,'var(--p10)',11],[5,'var(--p5)',9],[2.5,'var(--p2)',7],[1.25,'var(--p2)',5]];
  let reste = parSide, html = '<span class="bar"><i class="rod"></i>';
  dispo.forEach(([p, c, h]) => {
    while (reste >= p - 0.01) { html += `<i style="background:${c};height:${h}px"></i>`; reste -= p; }
  });
  return html + '<i class="rod"></i></span>';
}

// ── Saisie des séries ────────────────────────────────────────
async function ouvrirLogger(i) {
  const e = S.exos[i];
  const b = S.blocs[e._b];
  if (!S.seanceId) S.seanceId = (await api('demarrer', { jour:S.jour })).seance_id;

  // Exercice au temps : duree_s renseigné. Un nombre = durée à tenir (décompte),
  // 'max' = jusqu'à l'échec (le chrono monte).
  const auTemps = !!e.duree_s;
  const cible = auTemps && String(e.duree_s).toLowerCase() !== 'max' ? Number(e.duree_s) : 0;
  const N = b.exercices.length;

  let reps = Number(String(e.reps_cible).split('-')[0]) || 10;
  let charge = e.dernier ? e.dernier.charge : (e.charge_cible || (auTemps ? 0 : 20));
  let ecoule = 0, chrono = null, tourne = false;

  const L = $('#logger');
  L.classList.remove('hidden');
  L.innerHTML = `
    <div class="top"><button class="close">← Retour</button>
      <span class="eyebrow">${e.groupe}</span></div>
    <h3>${e.nom}</h3>
    ${N > 1 ? `<span class="eyebrow">Bloc ${b.bloc} · exercice ${e._e + 1} sur ${N}</span>` : ''}
    <p class="consigne">${e.consigne || ''}</p>
    ${e.cadence ? `<div class="tempo"><strong>Cadence ${e.cadence}</strong><br>${tempo(e.cadence)}
      ${courbeCadence(e.cadence, true)}</div>` : ''}
    <div class="sets" id="sets"></div>
    <div class="steppers">
      ${auTemps ? `
      <div class="stepper chrono"><div class="eyebrow">${cible ? 'À tenir' : 'Durée'}</div>
        <div class="val num" id="vChrono">${duree(cible || 0)}</div>
        <div class="row"><button id="go">Démarrer</button></div></div>` : `
      <div class="stepper"><div class="eyebrow">Répétitions</div>
        <div class="val num" id="vReps">${reps}</div>
        <div class="row"><button data-r="-1">−</button><button data-r="1">+</button></div></div>`}
      <div class="stepper"><div class="eyebrow">Charge (kg)</div>
        <div class="val num" id="vCharge">${charge}</div>
        <div class="row"><button data-c="-2.5">−</button><button data-c="2.5">+</button></div></div>
    </div>
    <button class="valider">Valider la série ${(S.faits[e.exercice_id] || []).length + 1}</button>`;

  const maj = () => {
    // Le logger a pu être fermé ou remplacé pendant que le chrono tournait :
    // on arrête plutôt que d'écrire dans un DOM qui n'existe plus.
    const champ = auTemps ? $('#vChrono') : $('#vReps');
    if (!champ || L.classList.contains('hidden')) { clearInterval(chrono); chrono = null; return; }
    if (auTemps) {
      const reste = cible ? Math.max(0, cible - ecoule) : ecoule;
      champ.textContent = duree(reste);
      champ.classList.toggle('court', cible > 0 && tourne && reste <= 5);
    } else {
      champ.textContent = reps;
    }
    $('#vCharge').textContent = charge;
    const btn = L.querySelector('.valider');
    btn.textContent = `Valider la série ${(S.faits[e.exercice_id] || []).length + 1}`;
    btn.disabled = auTemps && ecoule === 0;
    $('#sets').innerHTML = (S.faits[e.exercice_id] || []).map((x, n) =>
      `<span class="set">${n + 1} · ${x.duree_s ? duree(x.duree_s) : x.reps + ' × ' + x.charge + ' kg'}</span>`).join('');
  };
  maj();

  if (auTemps) {
    const go = L.querySelector('#go');
    const stop = (libelle) => { clearInterval(chrono); chrono = null; tourne = false; go.textContent = libelle; maj(); };
    go.onclick = () => {
      if (tourne) return stop('Reprendre');
      tourne = true; go.textContent = 'Arrêter'; maj();
      chrono = setInterval(() => {
        ecoule++;
        if (cible && ecoule >= cible) { ecoule = cible; bip(); stop('Terminé'); return; }
        maj();
      }, 1000);
    };
  } else {
    L.querySelectorAll('[data-r]').forEach(x => x.onclick = () => { reps = Math.max(1, reps + Number(x.dataset.r)); maj(); });
  }
  L.querySelectorAll('[data-c]').forEach(x => x.onclick = () => { charge = Math.max(0, charge + Number(x.dataset.c)); maj(); });
  L.querySelector('.close').onclick = () => { clearInterval(chrono); L.classList.add('hidden'); vueSeance(); };

  /**
   * Après une série validée, deux minuteurs distincts :
   *  - il reste des exercices dans le bloc → PAUSE (pause_s), puis on enchaîne ;
   *  - le tour est bouclé → REPOS (repos_s), puis retour au premier du bloc.
   */
  const suite = () => {
    const faits = (S.faits[e.exercice_id] || []).length;
    if (N > 1 && e._e < N - 1) {
      return lancerMinuteur(e.pause_s, 'Pause', () => ouvrirLogger(b.exercices[e._e + 1]._i));
    }
    if (faits < b.series) {
      return lancerMinuteur(b.repos_s, 'Repos', () => { if (N > 1) ouvrirLogger(b.exercices[0]._i); });
    }
    clearInterval(chrono);
    L.classList.add('hidden');
    vueSeance();
  };

  L.querySelector('.valider').onclick = async function () {
    this.disabled = true;
    clearInterval(chrono); chrono = null; tourne = false;
    try {
      const num = (S.faits[e.exercice_id] || []).length + 1;
      const p = { seance_id:S.seanceId, exercice_id:e.exercice_id, serie_num:num, charge };
      if (auTemps) p.duree_s = ecoule; else p.reps = reps;
      await api('serie', p);
      (S.faits[e.exercice_id] = S.faits[e.exercice_id] || [])
        .push(auTemps ? { duree_s:ecoule, charge } : { reps, charge });
      if (auTemps) { ecoule = 0; const g = L.querySelector('#go'); if (g) g.textContent = 'Démarrer'; }
      maj();
      suite();
    } catch (err) {
      toast('Non enregistré : ' + err.message);
      this.disabled = false;
    }
  };
}

const PHASES = ['montée', 'position haute', 'descente', 'position basse'];

/** « 1-0-3-1 » → « 1 s montée · 0 s position haute · 3 s descente · 1 s position basse ». */
function tempo(c) {
  const p = cadence4(c);
  return p ? PHASES.map((l, i) => `${p[i]} s ${l}`).join(' · ') : '';
}

function cadence4(c) {
  const p = String(c).split('-').map(x => Number(x.trim()));
  return p.length === 4 && p.every(n => !isNaN(n) && n >= 0) ? p : null;
}

/**
 * Courbe du tempo : le temps en abscisse, la position de la charge en ordonnée.
 * Quatre phases dans l'ordre montée · position haute · descente · position basse.
 * La pente dit la vitesse, le plat dit l'arrêt.
 */
function courbeCadence(c, grand) {
  const p = cadence4(c);
  if (!p) return '';
  const total = p[0] + p[1] + p[2] + p[3];
  if (!total) return '';

  const W = grand ? 300 : 108, H = grand ? 62 : 28, m = grand ? 6 : 3;
  const x = t => m + (W - 2 * m) * (t / total);
  const haut = m, bas = H - m;

  let t = 0;
  const pts = [[x(0), bas]];
  t += p[0]; pts.push([x(t), haut]);   // montée
  t += p[1]; pts.push([x(t), haut]);   // maintien en haut
  t += p[2]; pts.push([x(t), bas]);    // descente
  t += p[3]; pts.push([x(t), bas]);    // maintien en bas

  return `<svg class="cad${grand ? ' grand' : ''}" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
      aria-label="Cadence ${c} : ${tempo(c)}">
    <line x1="${m}" y1="${haut}" x2="${W - m}" y2="${haut}" stroke="var(--edge)" stroke-width="1"/>
    <line x1="${m}" y1="${bas}" x2="${W - m}" y2="${bas}" stroke="var(--edge)" stroke-width="1"/>
    <polyline points="${pts.map(q => q.join(',')).join(' ')}" fill="none" stroke="var(--brand-ink)"
      stroke-width="${grand ? 2.5 : 2}" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

// ── Minuteurs : pause dans le bloc, repos de fin de tour ──────
function lancerMinuteur(secondes, libelle, apres) {
  clearInterval(S.timer);
  const box = $('#repos');
  let t = Number(secondes) || 0;
  const fin = () => { clearInterval(S.timer); box.classList.add('hidden'); if (apres) apres(); };
  if (t <= 0) return fin();   // pas de temps mort : on enchaîne directement

  box.classList.remove('hidden');
  const peindre = () => {
    box.innerHTML =
      `<span><span class="eyebrow" style="color:rgba(255,255,255,.72)">${libelle}</span><br>
       <span class="t">${String(Math.floor(t / 60))}:${String(t % 60).padStart(2, '0')}</span></span>
       <button id="skip">Passer</button>`;
    box.querySelector('#skip').onclick = fin;
  };
  peindre();
  S.timer = setInterval(() => {
    t--; peindre();
    if (t <= 0) { bip(); fin(); }
  }, 1000);
}

function bip() {
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)();
    const o = c.createOscillator(), g = c.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(.25, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .4);
    o.start(); o.stop(c.currentTime + .4);
    if (navigator.vibrate) navigator.vibrate(200);
  } catch (e) {}
}

// ── Vue progrès ──────────────────────────────────────────────
async function vueProgres() {
  const app = $('#app');
  app.innerHTML = `<header><h2>Progrès</h2>
    <button class="quitter" id="quitter" title="Se déconnecter">Quitter</button></header>
    <div id="liste"><div class="empty">Chargement…</div></div>`;
  if (!S.exos.length && S.jour) await chargerSeance(S.jour);
  if (!S.exos.length) { $('#liste').innerHTML = `<div class="empty">Enregistrez une première séance pour voir vos courbes.</div>`; return; }

  const blocs = await Promise.all(S.exos.map(async e => {
    const h = await api('historique', { exercice_id:e.exercice_id });
    if (!h.length) return '';
    const max = Math.max(...h.map(x => x.charge));
    return `<div class="card" style="display:block">
      <div class="nom">${e.nom}</div>
      <div class="meta">Record ${max} kg · ${h.length} séries enregistrées</div>
      ${disques(max)}
      <div class="sets">${h.slice(0, 6).map(x =>
        `<span class="set">${x.reps} × ${x.charge} kg</span>`).join('')}</div>
    </div>`;
  }));
  $('#liste').innerHTML = blocs.join('') || `<div class="empty">Rien à afficher pour l'instant.</div>`;
}

// ── Vue calendrier ───────────────────────────────────────────
const MOIS = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin',
              'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
const JOURSC = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];

const cleJour = d => d.getFullYear() + '-' +
  String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

async function vueCalendrier(email) {
  const cible = email || null;
  if (!S.cal || S.cal.email !== cible) {
    const d = new Date();
    S.cal = { email: cible, annee: d.getFullYear(), mois: d.getMonth(), seances: null, sel: null };
  }
  $('#app').innerHTML = `<header><h2>Calendrier</h2>
    <button class="quitter" id="quitter" title="Se déconnecter">Quitter</button></header><div id="calzone"></div>`;
  await peindreCalendrier();
}

/** Rend le calendrier dans #calzone. Les séances sont chargées une fois, sur un an. */
async function peindreCalendrier() {
  const z = $('#calzone');
  const c = S.cal;
  if (!c.seances) {
    z.innerHTML = `<div class="empty">Chargement…</div>`;
    const p = { depuis: new Date(Date.now() - 365 * 86400000).toISOString() };
    if (c.email) p.email = c.email;
    c.seances = await api('calendrier', p);
  }

  const parJour = {};
  c.seances.forEach(s => {
    const k = cleJour(new Date(s.date));
    (parJour[k] = parJour[k] || []).push(s);
  });

  const premier = new Date(c.annee, c.mois, 1);
  const decal = (premier.getDay() + 6) % 7;            // semaine commençant lundi
  const nb = new Date(c.annee, c.mois + 1, 0).getDate();
  const ajd = new Date().toDateString();

  let cases = JOURSC.map(j => `<div class="jc">${j}</div>`).join('');
  for (let i = 0; i < decal; i++) cases += `<div class="c vide"></div>`;
  for (let d = 1; d <= nb; d++) {
    const date = new Date(c.annee, c.mois, d);
    const k = cleJour(date);
    const faite = (parJour[k] || []).length;
    cases += `<button class="c ${faite ? 'faite' : ''} ${date.toDateString() === ajd ? 'today' : ''}"
      data-j="${k}" aria-pressed="${c.sel === k}">${d}${faite ? '<i class="pt"></i>' : ''}</button>`;
  }

  // Bilan du mois affiché
  const duMois = c.seances.filter(s => {
    const d = new Date(s.date);
    return d.getFullYear() === c.annee && d.getMonth() === c.mois;
  });
  const volume = duMois.reduce((t, s) => t + s.volume, 0);
  const minutes = duMois.reduce((t, s) => t + s.duree_min, 0);

  z.innerHTML = `
    <div class="mois">
      <button id="prec" aria-label="Mois précédent">‹</button>
      <h3>${MOIS[c.mois]} ${c.annee}</h3>
      <button id="suiv" aria-label="Mois suivant">›</button>
    </div>
    <div class="cal">${cases}</div>
    <div class="stat">
      <div><b class="num">${duMois.length}</b><span>séance${duMois.length > 1 ? 's' : ''}</span></div>
      <div><b class="num">${volume >= 1000 ? (volume / 1000).toFixed(1) + ' t' : volume + ' kg'}</b><span>volume</span></div>
      <div><b class="num">${minutes}</b><span>minutes</span></div>
    </div>
    <div id="detail"></div>`;

  $('#prec').onclick = () => { if (--c.mois < 0) { c.mois = 11; c.annee--; } c.sel = null; peindreCalendrier(); };
  $('#suiv').onclick = () => { if (++c.mois > 11) { c.mois = 0; c.annee++; } c.sel = null; peindreCalendrier(); };

  z.querySelectorAll('.c[data-j]').forEach(b => b.onclick = () => {
    c.sel = c.sel === b.dataset.j ? null : b.dataset.j;
    peindreCalendrier();
  });

  if (c.sel) {
    const ss = parJour[c.sel] || [];
    $('#detail').innerHTML = ss.length
      ? ss.map(s => `<div class="card" style="display:block;margin-top:14px">
          <div class="nom">${s.jour || 'Séance'}</div>
          <div class="meta">${new Date(s.date).toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' })}</div>
          <div class="sets">
            <span class="set">${s.nbSeries} série${s.nbSeries > 1 ? 's' : ''}</span>
            ${s.volume ? `<span class="set">${s.volume} kg soulevés</span>` : ''}
            ${s.duree_min ? `<span class="set">${s.duree_min} min</span>` : ''}
            ${s.ressenti ? `<span class="set">${s.ressenti}</span>` : ''}
          </div>
          ${s.notes ? `<p class="consigne" style="margin-top:10px">${s.notes}</p>` : ''}
        </div>`).join('')
      : `<div class="empty" style="padding:24px 0">Aucune séance ce jour-là.</div>`;
  }
}

// ── Vue coach ────────────────────────────────────────────────
async function vueCoach() {
  S.coach = S.coach || { onglet: 'athletes', email: null, nom: '', sous: 'programme' };
  const c = S.coach;
  const app = $('#app');

  if (c.modele) {
    app.innerHTML = `
      <header><h2>Modèle</h2><button class="close" id="retour">← Modèles</button></header>
      <div id="zone"><div class="empty">Chargement…</div></div>`;
    $('#retour').onclick = () => { c.modele = null; S.ed = null; vueCoach(); };
    return vueModele();
  }

  if (!c.email) {
    app.innerHTML = `
      <header><h2>Coach</h2>
        <button class="quitter" id="quitter" title="Se déconnecter">Quitter</button></header>
      <div class="sous">
        <button data-o="athletes" aria-pressed="${c.onglet === 'athletes'}">Athlètes</button>
        <button data-o="modeles" aria-pressed="${c.onglet === 'modeles'}">Modèles</button>
        <button data-o="biblio" aria-pressed="${c.onglet === 'biblio'}">Bibliothèque</button>
      </div>
      <div id="zone"><div class="empty">Chargement…</div></div>`;
    app.querySelectorAll('.sous button').forEach(b => b.onclick = () => {
      c.onglet = b.dataset.o; vueCoach();
    });
    if (c.onglet === 'biblio') return vueBibliotheque();
    if (c.onglet === 'modeles') return vueModeles();
    return listeAthletes();
  }

  app.innerHTML = `
    <header><h2>${c.nom}</h2><button class="close" id="retour">← Athlètes</button></header>
    <div class="sous">
      <button data-s="programme" aria-pressed="${c.sous === 'programme'}">Programme</button>
      <button data-s="calendrier" aria-pressed="${c.sous === 'calendrier'}">Calendrier</button>
      <button data-s="historique" aria-pressed="${c.sous === 'historique'}">Historique</button>
    </div>
    <div id="zone"><div class="empty">Chargement…</div></div>`;

  $('#retour').onclick = () => { c.email = null; S.cal = null; S.attSel = null; S.ed = null; vueCoach(); };
  app.querySelectorAll('.sous button').forEach(b => b.onclick = () => {
    c.sous = b.dataset.s; vueCoach();
  });

  if (c.sous === 'programme') return vueProgramme();
  if (c.sous === 'calendrier') {
    $('#zone').innerHTML = `<div id="calzone"></div>`;
    if (!S.cal || S.cal.email !== c.email) {
      const d = new Date();
      S.cal = { email: c.email, annee: d.getFullYear(), mois: d.getMonth(), seances: null, sel: null };
    }
    return peindreCalendrier();
  }
  return vueHistoriqueAthlete();
}

async function listeAthletes() {
  const list = await api('coachAthletes');
  $('#zone').innerHTML = list.map(a => `
    <button class="athlete" data-email="${a.email}" data-nom="${a.nom}">
      <span><strong>${a.nom}</strong><br><span class="meta" style="color:var(--dust);font-size:13px">${a.nbSeances} séances</span></span>
      <span class="tag ${a.joursDepuis === null || a.joursDepuis >= 10 ? 'warn' : ''}">
        ${a.joursDepuis === null ? 'jamais venu' : 'il y a ' + a.joursDepuis + ' j'}</span>
    </button>`).join('') ||
    `<div class="empty">Aucun pratiquant inscrit.<br>Ajoutez-les dans l'onglet Pratiquants du Sheet.</div>`;

  $('#zone').querySelectorAll('.athlete').forEach(b => b.onclick = () => {
    S.coach.email = b.dataset.email;
    S.coach.nom = b.dataset.nom;
    S.coach.sous = 'programme';
    S.cal = null; S.attSel = null; S.ed = null;

  });
}

async function vueHistoriqueAthlete() {
  const d = await api('coachDetail', { email: S.coach.email });
  $('#zone').innerHTML = d.map(s => `<div class="card" style="display:block">
      <div class="nom">${new Date(s.date).toLocaleDateString('fr-FR')} · ${s.jour}</div>
      <div class="sets">${s.series.map(x => `<span class="set">${x.exercice} ${x.reps}×${x.charge}kg</span>`).join('')}</div>
    </div>`).join('') || `<div class="empty">Aucune séance enregistrée.</div>`;
}

// ── Fenêtre modale ───────────────────────────────────────────
function modal(titre, corps) {
  const d = document.createElement('div');
  d.className = 'modal';
  d.innerHTML = `<div class="feuille"><h3>${titre}</h3>${corps}</div>`;
  document.body.appendChild(d);
  d.onclick = ev => { if (ev.target === d) d.remove(); };
  d.fermer = () => d.remove();
  return d;
}

// ── Bibliothèque d'exercices ─────────────────────────────────
async function vueBibliotheque() {
  S.cat = await api('catalogue');
  peindreBibliotheque();
}

function peindreBibliotheque(filtre) {
  const q = (filtre || '').toLowerCase();
  const vus = S.cat.filter(e =>
    !q || (e.nom + ' ' + e.groupe + ' ' + e.equipement).toLowerCase().includes(q));

  const groupes = {};
  vus.forEach(e => (groupes[e.groupe || 'Sans groupe'] = groupes[e.groupe || 'Sans groupe'] || []).push(e));

  $('#zone').innerHTML = `
    <div class="champ"><input class="f" id="q" placeholder="Rechercher un exercice" value="${filtre || ''}"></div>
    <div class="barre" style="margin-top:0"><button class="btn plein" id="neuf" style="flex:1">＋ Nouvel exercice</button></div>
    <div style="margin-top:18px">
      ${Object.keys(groupes).sort((a, b) => a.localeCompare(b, 'fr')).map(g => `
        <div class="eyebrow" style="margin:16px 0 8px">${g} · ${groupes[g].length}</div>
        ${groupes[g].map(e => `<div class="ligne">
          <div class="g">
            <div class="nom">${e.nom}</div>
            <div class="meta">${[e.equipement, e.id].filter(Boolean).join(' · ')}</div>
          </div>
          ${e.video ? '<span class="poignee" title="Vidéo">▶</span>' : ''}
          <button class="poignee" data-ex="${e.id}">✎</button>
        </div>`).join('')}
      `).join('') || `<div class="empty">Aucun exercice.</div>`}
    </div>`;

  const champ = $('#q');
  champ.oninput = () => { const v = champ.value; peindreBibliotheque(v); const n = $('#q'); n.focus(); n.setSelectionRange(v.length, v.length); };
  $('#neuf').onclick = () => modalExercice(null);
  $('#zone').querySelectorAll('[data-ex]').forEach(b =>
    b.onclick = () => modalExercice(S.cat.find(x => String(x.id) === b.dataset.ex)));
}

function modalExercice(ex) {

      <div class="champ"><label>Équipement</label><input class="f" id="mEqp" value="${e.equipement}" list="lEqp">
        <datalist id="lEqp">${['Barre', 'Haltère', 'Poulie', 'Machine', 'Kettlebell', 'Élastique', 'Poids de corps'].map(g => `<option>${g}</option>`).join('')}</datalist></div>
    </div>
    <div class="champ"><label>Consigne d'exécution</label><textarea class="f" id="mCon" rows="4">${e.consigne}</textarea></div>
    <div class="champ"><label>Lien vidéo</label><input class="f" id="mVid" value="${e.video}" placeholder="https://youtu.be/…"></div>

function peindreEditeur() {

  z.innerHTML = `
    <div class="eyebrow" style="margin:4px 0 12px">${ed.jour}${ed.neuf ? ' · nouveau' : ''}</div>
    ${ed.blocs.map((b, i) => `
      <div class="bloc">
        <div class="entete">
          <span class="eyebrow">Bloc ${i + 1}</span>
          <input class="f" style="width:58px;text-align:center;padding:8px 4px;min-height:38px"
            type="number" min="1" data-b="${i}" data-k="series" value="${b.series}">
          <span style="font-size:12px;color:var(--dust)">tours</span>
          <input class="f" style="width:66px;text-align:center;padding:8px 4px;min-height:38px"

          <button class="poignee" data-delbloc="${i}" aria-label="Supprimer le bloc">✕</button>
        </div>
        ${b.exercices.map((e, j) => `
          <div class="ligne">
            <div class="g">
              <div class="nom">${e.nom}</div>
              <div class="meta">${(e.duree_s ? duree(e.duree_s) : e.reps_cible) || '—'}${
                e.charge_cible ? ' · ' + e.charge_cible + ' kg' : ''}${
                e.cadence ? ' · ' + e.cadence : ''}${
                j < b.exercices.length - 1 && e.pause_s ? ' · pause ' + e.pause_s + ' s' : ''}</div>
            </div>
            <button class="poignee" data-mv="${i}.${j}.-1" aria-label="Monter">↑</button>
            <button class="poignee" data-ed="${i}.${j}" aria-label="Modifier">✎</button>
            <button class="poignee" data-delexo="${i}.${j}" aria-label="Retirer">✕</button>
          </div>`).join('') || `<div class="empty" style="padding:14px 0;font-size:14px">Bloc vide</div>`}
        <button class="btn" data-addexo="${i}" style="width:100%">＋ exercice</button>
      </div>`).join('')}
    <div class="barre">
      <button class="btn" id="addBloc">＋ bloc</button>
      <button class="btn plein" id="save" style="flex:1">Enregistrer</button>
    </div>
    ${ed.neuf ? '' : '<div class="barre"><button class="btn danger" id="delJour">Supprimer ce jour</button></div>'}`;

  z.querySelectorAll('input[data-b]').forEach(inp => inp.onchange = () => {
    ed.blocs[Number(inp.dataset.b)][inp.dataset.k] = Number(inp.value) || 0;
  });
  z.querySelectorAll('[data-delbloc]').forEach(b => b.onclick = () => {
    ed.blocs.splice(Number(b.dataset.delbloc), 1); peindreEditeur();
  });
  z.querySelectorAll('[data-delexo]').forEach(b => b.onclick = () => {
    const [i, j] = b.dataset.delexo.split('.').map(Number);
    ed.blocs[i].exercices.splice(j, 1); peindreEditeur();
  });
  z.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => {
    const [i, j] = b.dataset.mv.split('.').map(Number);
    if (j === 0) return;
    const x = ed.blocs[i].exercices;
    [x[j - 1], x[j]] = [x[j], x[j - 1]];
    peindreEditeur();
  });
  z.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => {
    const [i, j] = b.dataset.ed.split('.').map(Number);
    modalLigne(i, j);
  });
  z.querySelectorAll('[data-addexo]').forEach(b => b.onclick = () => choisirExercice(Number(b.dataset.addexo)));
  $('#addBloc').onclick = () => { ed.blocs.push({ series: 3, repos_s: 90, exercices: [] }); peindreEditeur(); };

  const dj = $('#delJour');
  if (dj) dj.onclick = function () { supprimerJour(this); };
}

function choisirExercice(bi) {
  const m = modal('Ajouter un exercice', `
    <div class="recherche"><input class="f" id="cq" placeholder="Rechercher"></div>
    <div id="clist"></div>`);
  const peindre = (q) => {
    const f = (q || '').toLowerCase();
    const vus = S.cat.filter(e => !f || (e.nom + ' ' + e.groupe + ' ' + e.equipement).toLowerCase().includes(f));
    m.querySelector('#clist').innerHTML = vus.map(e => `<div class="ligne" data-pick="${e.id}">
        <div class="g"><div class="nom">${e.nom}</div>
          <div class="meta">${[e.groupe, e.equipement].filter(Boolean).join(' · ')}</div></div>
        <span class="poignee">＋</span></div>`).join('') || `<div class="empty">Rien ne correspond.</div>`;
    m.querySelectorAll('[data-pick]').forEach(l => l.onclick = () => {
      const e = S.cat.find(x => String(x.id) === l.dataset.pick);

function modalLigne(bi, ei) {
  const e = S.ed.blocs[bi].exercices[ei];
  const dernier = ei === S.ed.blocs[bi].exercices.length - 1;
  const m = modal(e.nom, `
    <div class="duo">
      <div class="champ"><label>Répétitions</label><input class="f" id="lReps" value="${e.reps_cible || ''}" placeholder="8-10"></div>

  const cad = m.querySelector('#lCad');
  const rafraichir = () => {
    m.querySelector('#apercu').innerHTML = cad.value.trim()
      ? tempo(cad.value.trim()) + courbeCadence(cad.value.trim(), true) : '';
  };
  cad.oninput = rafraichir; rafraichir();

  m.querySelector('#lAnn').onclick = m.fermer;
  m.querySelector('#lOk').onclick = () => {
    e.reps_cible = m.querySelector('#lReps').value.trim();
    e.duree_s = m.querySelector('#lDur').value.trim();

    e.cadence = cad.value.trim();
    if (!dernier) e.pause_s = Number(m.querySelector('#lPau').value) || 0;
    m.fermer(); peindreEditeur();
  };
}

async function vueModele() {

    <div class="card" style="display:block;margin-bottom:16px">

// ── Programme d'un pratiquant ────────────────────────────────
async function vueProgramme() {
  const atts = await api('attributions', { email: S.coach.email });
  S.atts = atts;
  if (!S.attSel || !atts.some(a => a.id === S.attSel)) {
    const active = atts.find(a => a.statut === 'En cours');
    S.attSel = (active || atts[0] || {}).id || null;
  }
  if (!S.cat) S.cat = await api('catalogue');

  if (!S.attSel) {
    $('#zone').innerHTML = `
      <div class="empty">Aucun programme attribué.<br>Donnez-lui un modèle, ou partez d'une page blanche.</div>
      <div class="barre"><button class="btn plein" id="donner" style="flex:1">Donner un programme</button></div>`;
    $('#donner').onclick = modalAttribuer;
    return;
  }

  const prog = await api('programme', { email: S.coach.email, attribution_id: S.attSel });
  S.prog = prog;
  const att = S.atts.find(a => a.id === S.attSel);
  const jours = prog.jours.map(j => j.jour);

  if (!S.ed || S.ed.cible !== 'programme' || S.ed.attribution_id !== S.attSel ||
      (!S.ed.neuf && jours.indexOf(S.ed.jour) === -1)) {
    S.ed = null;
    if (jours.length) chargerJour(jours[0]);
  }

  const debut = att.date_debut ? new Date(att.date_debut).toLocaleDateString('fr-FR') : '';
  $('#zone').innerHTML = `
    <div class="champ">
      <label>Programme attribué</label>
      <select class="f" id="selAtt">${S.atts.map(a => `<option value="${a.id}" ${a.id === S.attSel ? 'selected' : ''}>
        ${a.nom} · ${a.statut}${a.date_debut ? ' · depuis le ' + new Date(a.date_debut).toLocaleDateString('fr-FR') : ''}</option>`).join('')}</select>
    </div>
    <div class="meta" style="color:var(--dust);font-size:12.5px;margin:-2px 0 12px">
      ${att.nbJours} jour${att.nbJours > 1 ? 's' : ''} · ${att.nbExercices} exercices${debut ? ' · démarré le ' + debut : ''}${
      att.modele_id ? ' · issu d\'un modèle' : ' · sur mesure'}</div>
    <div class="barre" style="margin-top:0">
      <button class="btn plein" id="donner">Donner un programme</button>
      ${att.statut === 'En cours' ? '<button class="btn" id="clore">Clore</button>' : ''}
      <button class="btn danger" id="supprAtt">Supprimer</button>
    </div>
    <div class="days" id="jours" style="margin-top:16px">
      ${jours.map(j => `<button class="day" data-j="${j}" aria-pressed="${S.ed && S.ed.jour === j}">${j}</button>`).join('')}
      <button class="day" id="addJour">＋ jour</button>
    </div>
    <div id="edit"></div>`;

  $('#selAtt').onchange = e => { S.attSel = e.target.value; S.ed = null; vueProgramme(); };
  $('#donner').onclick = modalAttribuer;
  $('#addJour').onclick = modalNouveauJour;
  $('#zone').querySelectorAll('.day[data-j]').forEach(b =>
    b.onclick = () => { chargerJour(b.dataset.j); vueProgramme(); });

  const cl = $('#clore');
  if (cl) cl.onclick = async function () {
    this.disabled = true;
    try {
      await api('attributionMaj', { id: S.attSel, statut: 'Terminé', date_fin: new Date().toISOString() });
      toast('Programme clos'); vueProgramme();
    } catch (err) { toast(err.message); this.disabled = false; }
  };
  $('#supprAtt').onclick = async function () {
    this.disabled = true;
    try {
      await api('attributionSuppr', { id: S.attSel });
      toast('Attribution supprimée'); S.attSel = null; S.ed = null; vueProgramme();
    } catch (err) { toast(err.message); this.disabled = false; }
  };

  peindreEditeur();
}

      <select class="f" id="aMod">
        <option value="">— Sur mesure, page blanche —</option>
        ${mods.map(m => `<option value="${m.id}">${m.nom}${m.categorie ? ' · ' + m.categorie : ''}${
          m.difficulte ? ' · ' + m.difficulte : ''}</option>`).join('')}
      </select></div>
    <div class="champ"><label>Nom donné au pratiquant</label>
      <input class="f" id="aNom" placeholder="Laisser vide pour reprendre le nom du modèle"></div>
    <div class="champ"><label>Date de début</label>
      <input class="f" id="aDeb" type="date" value="${new Date().toISOString().slice(0, 10)}"></div>
    <p class="consigne">Le contenu du modèle est <strong>copié</strong> : le personnaliser ensuite
      ne touche pas le modèle, et le programme en cours est clos automatiquement.</p>
    <div class="barre"><button class="btn" id="aAnn">Annuler</button>
      <button class="btn plein" id="aOk" style="flex:1">Attribuer</button></div>`);

  w.querySelector('#aAnn').onclick = w.fermer;
  w.querySelector('#aOk').onclick = async function () {
    this.disabled = true;
    try {
      const r = await api('attribuer', {
        email: S.coach.email,
        modele_id: w.querySelector('#aMod').value || undefined,
        nom: w.querySelector('#aNom').value,
        date_debut: w.querySelector('#aDeb').value
      });
      w.fermer();
      toast(r.lignes ? `${r.nom} attribué, ${r.lignes} lignes copiées` : `${r.nom} attribué`);
      S.attSel = r.id; S.ed = null; vueProgramme();
    } catch (err) { toast(err.message); this.disabled = false; }
  };
}

// ── Éditeur de jour, commun aux modèles et aux programmes ─────
function chargerJour(jour) {
  const modele = !!S.coach.modele;
  const src = modele ? S.modele : S.prog;
  const j = ((src && src.jours) || []).find(x => x.jour === jour);
  S.ed = {
    cible: modele ? 'modele' : 'programme',
    modele_id: modele ? S.coach.modele : null,
    email: modele ? null : S.coach.email,
    attribution_id: modele ? null : S.attSel,
    jour: jour,
    neuf: !j,
    blocs: j ? JSON.parse(JSON.stringify(j.blocs)) : []
  };
}

function modalNouveauJour() {
  const w = modal('Nouveau jour', `
    <div class="champ"><label>Intitulé</label>
      <input class="f" id="nj" placeholder="Lundi — Haut du corps" list="lj">
      <datalist id="lj">${SEMAINE.map(j => `<option>${j} — </option>`).join('')}</datalist></div>
    <p class="consigne">Le jour de la semaine doit apparaître dans l'intitulé : c'est lui qui donne l'ordre d'affichage.</p>
    <div class="barre"><button class="btn" id="njAnn">Annuler</button>
      <button class="btn plein" id="njOk" style="flex:1">Créer</button></div>`);
  w.querySelector('#njAnn').onclick = w.fermer;
  w.querySelector('#njOk').onclick = () => {
    const v = w.querySelector('#nj').value.trim();
    if (!v) return toast('Donnez un intitulé');
    chargerJour(v);
    S.ed.neuf = true; S.ed.blocs = [];
    w.fermer();
    document.querySelectorAll('.day[data-j]').forEach(b => b.setAttribute('aria-pressed', 'false'));
    peindreEditeur();
  };
}

async function enregistrerJour() {
  const ed = S.ed;
  const btn = $('#save');
  if (!ed.blocs.length || ed.blocs.every(b => !b.exercices.length))
    return toast('Ajoutez au moins un exercice');
  btn.disabled = true;
  const blocs = ed.blocs.filter(b => b.exercices.length);
  try {
    if (ed.cible === 'modele') {
      await api('modeleJourSave', { modele_id: ed.modele_id, jour: ed.jour, blocs });
      toast('Jour enregistré'); S.ed = null; vueModele();
    } else {
      await api('programmeSave', { email: ed.email, attribution_id: ed.attribution_id, jour: ed.jour, blocs });
      toast('Jour enregistré'); S.ed = null; vueProgramme();
    }
  } catch (err) { toast(err.message); btn.disabled = false; }
}

async function supprimerJour(btn) {
  const ed = S.ed;
  btn.disabled = true;
  try {
    if (ed.cible === 'modele') {
      await api('modeleJour', { modele_id: ed.modele_id, jour: ed.jour });
      toast('Jour supprimé'); S.ed = null; vueModele();
    } else {
      await api('programmeJour', { attribution_id: ed.attribution_id, jour: ed.jour });
      toast('Jour supprimé'); S.ed = null; vueProgramme();
    }
  } catch (err) { toast(err.message); btn.disabled = false; }
}

// ── Service worker (mode hors ligne) ─────────────────────────
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
